<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>并行策略实验 · RL Infra</title>
<style>
:root{--bg:#f7f8f6;--paper:#fff;--ink:#203039;--sub:#65777b;--line:#dce4e1;--blue:#426c99;--mint:#378675;--orange:#b97746;--violet:#7a68a8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC",sans-serif;line-height:1.6}a{color:var(--blue)}.shell{max-width:1120px;margin:auto;padding:24px 20px 70px}.crumb{font-size:13px;color:var(--sub)}h1{font-size:clamp(25px,4vw,42px);letter-spacing:-.035em;line-height:1.2;margin:22px 0 10px}.intro{max-width:760px;color:var(--sub);margin:0 0 24px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.tabs button{border:1px solid var(--line);border-radius:10px;padding:10px 17px;background:#fff;white-space:nowrap;color:var(--sub);cursor:pointer}.tabs button[aria-selected=true]{background:#233d49;color:white;border-color:#233d49}.layout{display:grid;grid-template-columns:minmax(235px,320px) minmax(0,1fr);gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 8px 24px #152a3510}.card h2{font-size:18px;margin:0 0 8px}.muted{color:var(--sub);font-size:13px}.controls{display:grid;gap:18px}.controls label{display:block;font-size:13px;font-weight:650}.controls select,.controls input{width:100%;margin-top:7px}.controls select{padding:10px;border:1px solid #ccd8d6;border-radius:9px;background:white}.controls input{accent-color:#426c99}.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:17px 0}.stat{background:#f4f7f7;border-radius:10px;padding:12px}.stat strong{display:block;font-size:clamp(16px,2.5vw,23px);font-variant-numeric:tabular-nums}.stat span{font-size:11px;color:var(--sub)}.viz{min-height:245px;border:1px solid #e3e9e7;background:#fbfcfc;border-radius:12px;padding:15px;overflow-x:auto}.grid{display:grid;gap:8px}.gpu{min-height:58px;border-radius:9px;border:1px solid #b6d1df;background:#e9f2f9;padding:10px;text-align:center;font-size:12px}.gpu b{display:block;font-size:14px}.row{display:flex;align-items:center;gap:9px;margin:7px 0}.track{flex:1;height:17px;background:#e7eceb;border-radius:5px;overflow:hidden;display:flex}.seg{height:100%;min-width:1px}.legend{font-size:12px;color:var(--sub);margin:12px 0 0}.note{border-left:3px solid var(--orange);padding:10px 14px;background:#fff8f2;border-radius:0 8px 8px 0;font-size:13px;margin-top:18px}.formula{font-family:ui-monospace,monospace;background:#f0f4f5;padding:12px;border-radius:8px;font-size:12px;overflow:auto}.mini{font-size:12px;color:var(--sub)}.barlabel{min-width:64px;font-size:12px}.heat{border:1px solid #dce4e1;border-radius:6px;min-height:34px;text-align:center;padding:5px;font-size:11px}.help{margin-top:16px}.help summary{cursor:pointer;font-weight:650}.help p{font-size:13px;color:var(--sub)}@media(max-width:760px){.layout{grid-template-columns:1fr}.card{padding:17px}.statrow{gap:6px}.stat{padding:8px}.stat strong{font-size:17px}.shell{padding:16px 12px 45px}}
</style><link rel="stylesheet" href="workbench.css"></head><body><header class="lab-nav"><div class="lab-nav-inner"><a class="lab-brand" href="../"><span class="lab-mark">RL</span> RL Infra / Learning Lab</a><nav class="lab-links" aria-label="实验导航"><a href="parallel.html" aria-current="page">并行机制</a><a href="parallel-performance.html">性能推演</a><a href="rl-memory.html">显存预算</a></nav></div></header><main class="shell"><div class="crumb"><a href="../">RL Infra 知识库</a> / <a href="./">机制实验</a> / 并行策略</div><p class="lab-eyebrow">PARALLEL MECHANICS</p><h1>多加一张 GPU，为什么不一定更快？</h1><p class="intro">改变并行度，观察每卡工作量、通信和关键路径的变化。所有时间均为教学模型的假设值，不代表真实 GPU 测量。</p><a class="lab-next" href="parallel-performance.html"><span>继续实验：TP 的计算与通信成本</span><span aria-hidden="true">→</span></a><div class="tabs" role="tablist" aria-label="选择并行策略"><button role="tab" aria-selected="true" data-tab="tp">TP · 矩阵切分</button><button role="tab" aria-selected="false" data-tab="pp">PP · 流水线</button><button role="tab" aria-selected="false" data-tab="ep">EP · Expert 路由</button><button role="tab" aria-selected="false" data-tab="topo">拓扑 · 通信组</button></div>
<div class="layout"><section class="card"><h2 id="qtitle"></h2><p class="muted" id="qdesc"></p><div class="controls" id="controls"></div><div class="note" id="caveat"></div></section><section class="card"><h2 id="vtitle"></h2><p class="muted" id="vdesc"></p><div class="statrow" id="stats"></div><div class="viz" id="viz" role="img" aria-label="并行策略示意"></div><p class="legend" id="caption"></p><details class="help"><summary>模型假设、公式与验证方法</summary><div id="math"></div></details></section></div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let tab='tp';const state={tp:4,work:'large',comm:3,pp:4,micro:8,skew:1,ep:4,topoTP:2,topoPP:2};
const C=['#426c99','#378675','#b97746','#7a68a8','#c66e72','#5a9f9c','#a79c53','#667e9a'];const fmt=(v,d=1)=>Number(v).toFixed(d);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function select(id,label,options,value){return '<label for="'+id+'">'+label+'<select id="'+id+'">'+options.map(([v,t])=>'<option value="'+v+'"'+(String(v)===String(value)?' selected':'')+'>'+t+'</option>').join('')+'</select></label>';}
function range(id,label,min,max,step,value){return '<label for="'+id+'">'+label+' <output id="'+id+'-out">'+value+'</output><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+value+'"></label>';}
function setStats(a){$('stats').innerHTML=a.map(([n,v])=>'<div class="stat"><strong>'+esc(v)+'</strong><span>'+esc(n)+'</span></div>').join('');}
function bar(label,val,max,color){return '<div class="row"><span class="barlabel">'+esc(label)+'</span><div class="track"><div class="seg" style="width:'+Math.max(0,Math.min(100,100*val/max))+'%;background:'+color+'"></div></div><span class="mini">'+fmt(val)+' ms</span></div>';}
function renderTP(){let p=+state.tp,base=state.work==='large'?20:2;let compute=base/p;let overhead=p===1?0:(+state.comm)*(p-1)/3;let total=compute+overhead;let max=Math.max(base,total)*1.08;
$('qtitle').textContent='把一层矩阵分给几张卡？';$('qdesc').textContent='同一个请求，固定总计算量；观察 TP 增大后每卡 GEMM 和通信的竞争。';
$('controls').innerHTML=select('tp','TP Degree',[[1,'1 张 GPU'],[2,'2 张 GPU'],[4,'4 张 GPU'],[8,'8 张 GPU']],p)+select('work','负载形态',[['large','大 GEMM（单卡 20 ms）'],['small','小 Batch Decode（单卡 2 ms）']],state.work)+range('comm','TP4 额外通信 / 同步假设（ms）',0,8,.5,state.comm);
$('caveat').textContent='固定单请求延迟的 Strong Scaling；并非固定 8 GPU 的整集群吞吐。TP1 只有在模型能放进单卡时才是可行基线。';
$('vtitle').textContent='切分之后，关键路径真的缩短了吗？';$('vdesc').textContent='W1=[4096,8192] BF16，共 64 MiB；按输出列均分。通信开销为可调的示意函数。';
setStats([['每卡 W1 权重',fmt(64/p)+' MiB'],['估算延迟',fmt(total,2)+' ms'],['相对单卡',fmt(base/total,2)+'×']]);
let cells=Array.from({length:p},(_,i)=>'<div class="gpu" style="background:'+C[i%8]+'1c;border-color:'+C[i%8]+'66"><b>GPU '+i+'</b>W1 ['+4096+','+8192/p+']<br>'+fmt(64/p)+' MiB</div>').join('');
$('viz').innerHTML='<div class="grid" style="grid-template-columns:repeat('+Math.min(p,4)+',minmax(115px,1fr))">'+cells+'</div><div style="margin-top:18px">'+bar('单卡',base,max,'#aab8b9')+bar('TP 计算',compute,max,C[0])+bar('通信',overhead,max,C[2])+bar('TP 总计',total,max,C[1])+'</div>';
$('caption').textContent='蓝色计算项按 1/TP 理想均摊；橙色是人为可调的通信与同步开销。真实 Kernel 效率还可能随 Shape 下降。';
$('math').innerHTML='<p class="formula">T(TP) ≈ T_compute(1) / TP + T_collective(TP) + T_sync(TP)</p><p>此处故意采用乐观的理想计算分摊。实际还要测 GEMM Shape 效率、NCCL 启动延迟、跨节点链路。固定 8 GPU 比较 TP1×DP8 和 TP8×DP1 的吞吐时，需要独立的并发/调度模型。</p>';}
function renderPP(){let p=+state.pp,m=+state.micro,skew=+state.skew;let bubble=(p-1)/(m+p-1);let balanced=(m+p-1);let slow=balanced+(skew-1)*m;
$('qtitle').textContent='为什么流水线还有空闲？';$('qdesc').textContent='Stage 与 Micro-batch 决定填充和排空；最慢 Stage 可能拖住整条流水线。';
$('controls').innerHTML=select('pp','Pipeline Stages',[[2,'2 Stages'],[4,'4 Stages'],[8,'8 Stages']],p)+select('micro','Micro-batches',[[2,'2'],[4,'4'],[8,'8'],[16,'16']],m)+range('skew','最慢 Stage 相对耗时',1,2,.25,skew);
$('caveat').textContent='这里的 Bubble=(p−1)/(m+p−1) 是理想化流水线的近似，不等同于 Megatron 1F1B 或 Interleaved 的实测 GPU 空闲比例。';
$('vtitle').textContent='填充、稳定运行与排空';$('vdesc').textContent='一个时间格代表一次理想化 Stage 计算。热区代表 Stage 在处理 Micro-batch。';
setStats([['理想 Bubble',fmt(100*bubble)+'%'],['理想总格数',balanced],['不均衡示意格数',fmt(slow,1)]]);
let grid='<div class="grid" style="grid-template-columns:70px repeat('+(m+p-1)+',minmax(25px,1fr));gap:3px;min-width:'+(75+(m+p-1)*27)+'px">';
for(let i=0;i<p;i++){grid+='<span class="mini">Stage '+i+'</span>';for(let t=0;t<m+p-1;t++){let k=t-i;grid+='<div class="heat" style="background:'+(k>=0&&k<m?C[i%8]+'35':'#f0f3f2')+'">'+(k>=0&&k<m?'μ'+(k+1):'·')+'</div>';}}grid+='</div>';
$('viz').innerHTML=grid+'<div class="mini" style="margin-top:13px">展示的是前向流水线填充/排空示意；不展示真实训练反向 1F1B 排程。</div>';
$('caption').textContent='增大 Micro-batch 可以降低理想 Bubble，但会改变调度、激活峰值与算子效率。最慢 Stage 耗时是额外的吞吐约束。';
$('math').innerHTML='<p class="formula">Bubble ≈ (p − 1) / (m + p − 1)</p><p>该公式用于等时 Stage 的理想化模型。Stage 不均衡时，真实耗时不能只按公式推算；需记录每个 Stage 的 Forward/Backward 时长、P2P 与空闲区。</p>';}
function renderEP(){let ep=+state.ep,hot=+state.skew>1;let n=32,loads=Array(ep*2).fill(0);for(let i=0;i<n;i++){let idx=hot?(i<Math.round(n*.65)?0:i%(ep*2)):i%(ep*2);loads[idx]++;}
let gpu=Array.from({length:ep},(_,i)=>loads[2*i]+loads[2*i+1]);let peak=Math.max(...gpu),mean=n/ep;
$('qtitle').textContent='Expert 均分了，Token 也均分了吗？';$('qdesc').textContent='16 Token × Top-2 = 32 次 Expert Assignment，改变 Router 偏斜。';
$('controls').innerHTML=select('ep','EP Degree',[[1,'1 GPU / 2 Experts'],[2,'2 GPU / 4 Experts'],[4,'4 GPU / 8 Experts']],ep)+select('skew','路由分布',[[1,'均衡'],[2,'热点 Expert']],state.skew);
$('caveat').textContent='Token 计数是确定性的 Toy Router；并非真实 MoE 的 Top-k 分布。All-to-All 时间还取决于本地命中、拓扑和数据打包。';
$('vtitle').textContent='Router → Expert → GPU';$('vdesc').textContent='每张 GPU 承载两个 Expert；显示 32 次 Assignment 的分布。';
setStats([['Assignment',n],['最忙 GPU',peak+' 次'],['负载峰均比',fmt(peak/mean,2)+'×']]);
$('viz').innerHTML='<div class="grid" style="grid-template-columns:repeat('+ep+',minmax(110px,1fr))">'+gpu.map((v,i)=>'<div class="gpu" style="background:'+C[i]+'18;border-color:'+C[i]+'77"><b>GPU '+i+'</b><div>Expert '+(2*i)+' / '+(2*i+1)+'</div><strong>'+v+' assignments</strong><div class="track"><div class="seg" style="width:'+100*v/peak+'%;background:'+C[i]+'"></div></div></div>').join('')+'</div><div style="margin-top:20px">'+loads.map((v,i)=>'<div class="row"><span class="barlabel">Expert '+i+'</span><div class="track"><div class="seg" style="width:'+100*v/Math.max(...loads)+'%;background:'+C[Math.floor(i/2)]+'"></div></div><span class="mini">'+v+' tokens</span></div>').join('')+'</div>';
$('caption').textContent='热点 Expert 会让部分 Rank 等待最慢 GPU。增加 EP 主要分摊 Expert 权重，不会自动均衡 Token。';
$('math').innerHTML='<p class="formula">assignments = tokens × top_k = 16 × 2 = 32</p><p>检查 dispatch / combine 的 Token ID、Expert ID、Router 权重；性能需要同时测 per-expert Token 直方图、All-to-All 和 Grouped GEMM。</p>';}
function renderTopo(){let tp=+state.topoTP,pp=+state.topoPP,dp=16/(tp*pp);
$('qtitle').textContent='16 张 GPU，谁和谁通信？';$('qdesc').textContent='固定 2 节点 × 8 GPU；Dense 层采用 TP×PP×DP=16。';
$('controls').innerHTML=select('topoTP','TP',[[1,'1'],[2,'2'],[4,'4'],[8,'8']],tp)+select('topoPP','PP',[[1,'1'],[2,'2'],[4,'4'],[8,'8']],pp);
$('caveat').textContent='Rank 顺序采用教学映射 rank=((pp×DP)+dp)×TP+tp；不是 Megatron 运行时的默认 Rank Order。真实通信组必须按初始化代码核对。';
$('vtitle').textContent='节点内的 TP Group';$('vdesc').textContent='颜色代表同一个 TP Group；每节点 8 张卡。';
setStats([['总 GPU',16],['DP Degree',dp],['TP Groups',16/tp]]);
let nodes='';for(let n=0;n<2;n++){nodes+='<h3 class="mini">Node '+n+' · GPU '+n*8+'–'+(n*8+7)+'</h3><div class="grid" style="grid-template-columns:repeat(4,minmax(60px,1fr))">';for(let j=0;j<8;j++){let rank=n*8+j,g=Math.floor(rank/tp);nodes+='<div class="gpu" style="background:'+C[g%8]+'25;border-color:'+C[g%8]+'88"><b>GPU '+rank+'</b><small>TP Group '+g+'</small></div>';}nodes+='</div>';}
$('viz').innerHTML=nodes;$('caption').textContent='TP Group 在此映射下是连续 Rank；PP/DP Group 交叉连接这些颜色块。TP×PP×DP 的乘积只适用于这里定义的 Dense 维度。';
$('math').innerHTML='<p class="formula">DP = 16 / (TP × PP)</p><p>EP、CP 在真实框架中有额外组划分、整除和布局约束，不应在此基础上随意相乘。若 TP Group 跨节点，Collective 通常需要额外考虑网络延迟。</p>';}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));if(tab==='tp')renderTP();else if(tab==='pp')renderPP();else if(tab==='ep')renderEP();else renderTopo();$('controls').querySelectorAll('select,input').forEach(e=>e.addEventListener('input',()=>{state[e.id]=e.type==='range'?Number(e.value):(['work'].includes(e.id)?e.value:Number(e.value));if(tab==='topo'&&state.topoTP*state.topoPP>16){if(e.id==='topoTP')state.topoPP=16/state.topoTP;else state.topoTP=16/state.topoPP;}render();}));}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render();}));render();
})();
</script></body></html>

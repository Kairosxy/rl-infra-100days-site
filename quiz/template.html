<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="RL Infra · 用短问题快速回想原理，必要时查看详细解释。">
<title>复习题 · RL Infra</title>
<style>{{QUIZ_STYLE}}</style>
</head>
<body>
<a class="skip" href="#question-title">跳到问题</a>
<header class="top">
  <a class="brand" href="../">RL Infra<span>.</span></a>
  <nav><a href="../">知识库</a><a aria-current="page" href="./">复习</a><a href="../legacy.html">历史课程</a></nav>
</header>
<div class="layout">
  <aside class="sidebar">
    <h2>查找问题</h2>
    <label for="search">搜索</label>
    <input id="search" type="search" placeholder="Q047 / FP8 / PPO" autocomplete="off">
    <div class="filters">
      <label for="domain">领域</label>
      <select id="domain"><option value="">所有领域</option></select>
      <label for="chapter">章节</label>
      <select id="chapter"><option value="">所有章节</option></select>
      <label for="level">难度</label>
      <select id="level"><option value="">不限</option><option value="基础">基础</option><option value="进阶">进阶</option></select>
      <label for="status">本地记录</label>
      <select id="status"><option value="">不限</option><option value="new">未练</option><option value="weak">还不熟悉</option><option value="due">可回顾</option><option value="good">基本掌握</option><option value="star">收藏</option></select>
    </div>
    <div class="filter-note"><span id="filtered">224</span> 题匹配 <button id="clear" type="button">清除筛选</button></div>
    <details class="record-panel">
      <summary>本地记录与备份</summary>
      <div class="metrics">
        <span>曾回顾 <strong id="attempted">0</strong></span>
        <span>已掌握 <strong id="learned">0</strong></span>
        <span>到期 <strong id="due-count">0</strong></span>
        <span>收藏 <strong id="starred-count">0</strong></span>
      </div>
      <div class="progress"><span id="progress-fill"></span></div>
      <p>记录只存在当前浏览器。换设备前可导出。</p>
      <div class="save-actions">
        <button type="button" id="export">导出记录</button>
        <button type="button" id="import">导入记录</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
    </details>
  </aside>
  <main>
    <div class="topline">
      <h1>复习题</h1>
      <p>不必写答案。先在脑中回答，想不起来就看解释。</p>
    </div>
    <div class="toolbar">
      <div class="modes" role="group" aria-label="选择问题顺序">
        <button type="button" data-mode="all" aria-pressed="true">顺序</button>
        <button type="button" data-mode="random" aria-pressed="false">随机十题</button>
        <button type="button" data-mode="due" aria-pressed="false">待回顾</button>
        <button type="button" data-mode="weak" aria-pressed="false">不熟悉</button>
      </div>
      <span id="mode-description">自由浏览</span>
    </div>
    <article class="question">
      <div class="question-meta">
        <span id="qid">Q001</span>
        <span id="chapter-tag"></span>
        <span id="level-tag"></span>
        <button type="button" id="star" aria-pressed="false">☆ 收藏</button>
      </div>
      <h2 id="question-title" tabindex="-1">加载中……</h2>
      <p id="alternative-title" class="alternative" hidden></p>
      <div class="answer-actions">
        <button type="button" id="show" aria-expanded="false">看解释</button>
        <button type="button" id="copy">复制题目</button>
        <a id="course-link" href="../" hidden>相关主题</a>
      </div>
      <section id="reference" hidden>
        <div class="reference-tabs" role="group" aria-label="答案长度">
          <button type="button" data-source="brief" aria-selected="true">简要解释</button>
          <button type="button" data-source="deep" aria-selected="false">详细解析</button>
        </div>
        <div id="reference-text" class="reference-text"></div>
        <div class="followup"><strong>继续想一想</strong><p id="followup"></p></div>
        <details class="rating-panel">
          <summary>标记掌握情况（可选）</summary>
          <div class="ratings">
            <button type="button" data-rating="again">再看一次</button>
            <button type="button" data-rating="hard">不太熟</button>
            <button type="button" data-rating="good">基本清楚</button>
            <button type="button" data-rating="easy">已经熟悉</button>
          </div>
        </details>
      </section>
      <details class="draft-panel">
        <summary>记一点自己的想法（可选）</summary>
        <label for="answer">回答</label>
        <textarea id="answer" rows="3" placeholder="可以只写几个关键词。"></textarea>
        <label for="notes">容易混淆的地方</label>
        <textarea id="notes" rows="2" placeholder="有需要再记。"></textarea>
        <div class="draft-info"><span id="saved" role="status">仅保存在当前浏览器</span><span id="count">0 字</span></div>
      </details>
      <div class="pager">
        <button type="button" id="prev">← 上一题</button>
        <span id="position">1 / 224</span>
        <button type="button" id="next">下一题 →</button>
      </div>
    </article>
    <footer>题目与参考解释来自原始资料，未逐条技术校勘。<a href="../">返回知识库</a></footer>
  </main>
</div>
<script type="application/json" id="quiz-data">{{QUIZ_DATA}}</script>
<script>{{QUIZ_SCRIPT}}</script>
</body>
</html>

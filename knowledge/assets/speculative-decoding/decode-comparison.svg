<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-label="普通解码的串行依赖与投机解码的并行打分"><title>普通解码的串行依赖与投机解码的并行打分</title><rect width="1440" height="660" fill="#f8f7f2"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, WenQuanYi Zen Hei, sans-serif"><text x="36" y="57" fill="#203b32" font-size="32" font-weight="700" text-anchor="start">普通解码</text><text x="258" y="57" fill="#65756a" font-size="26" font-weight="400" text-anchor="start">Target 等上一个输出确定，再算下一个位置</text><rect x="36" y="90" width="428" height="108" rx="0" fill="#e2eee6" stroke="none" stroke-width="1.5"/><text x="54" y="124" fill="#65756a" font-size="21" font-weight="400" text-anchor="start">给定 h</text><text x="54" y="171" fill="#276152" font-size="31" font-weight="700" text-anchor="start">Target 生成 B</text><text x="484" y="153" fill="#65756a" font-size="30" font-weight="500" text-anchor="middle">→</text><rect x="505" y="90" width="428" height="108" rx="0" fill="#e2eee6" stroke="none" stroke-width="1.5"/><text x="523" y="124" fill="#65756a" font-size="21" font-weight="400" text-anchor="start">给定 h B</text><text x="523" y="171" fill="#276152" font-size="31" font-weight="700" text-anchor="start">Target 生成 C</text><text x="953" y="153" fill="#65756a" font-size="30" font-weight="500" text-anchor="middle">→</text><rect x="974" y="90" width="428" height="108" rx="0" fill="#e2eee6" stroke="none" stroke-width="1.5"/><text x="992" y="124" fill="#65756a" font-size="21" font-weight="400" text-anchor="start">给定 h B C</text><text x="992" y="171" fill="#276152" font-size="31" font-weight="700" text-anchor="start">Target 生成 A</text><path d="M36 235 H1400" fill="none" stroke="#d6dad0" stroke-width="2"/><text x="36" y="297" fill="#203b32" font-size="32" font-weight="700" text-anchor="start">投机解码</text><text x="258" y="297" fill="#65756a" font-size="26" font-weight="400" text-anchor="start">Draft 先给出候选，Target 一次为这条路径打分</text><rect x="36" y="326" width="1366" height="64" rx="0" fill="#f0e3cc" stroke="none" stroke-width="1.5"/><text x="58" y="367" fill="#7a6044" font-size="26" font-weight="700" text-anchor="start">Draft 从 h 依次提出</text><text x="708" y="367" fill="#7a6044" font-size="31" font-weight="700" text-anchor="middle">B   →   C   →   A</text><text x="1380" y="367" fill="#65756a" font-size="22" font-weight="400" text-anchor="end">候选尚未写入输出</text><rect x="36" y="417" width="1366" height="174" rx="0" fill="#e2eee6" stroke="#276152" stroke-width="1.5"/><text x="58" y="456" fill="#276152" font-size="27" font-weight="700" text-anchor="start">同一次 Target 验证</text><text x="58" y="500" fill="#65756a" font-size="23" font-weight="400" text-anchor="start">前缀 h</text><text x="58" y="547" fill="#203b32" font-size="28" font-weight="700" text-anchor="start">读 B 的概率</text><text x="514" y="500" fill="#65756a" font-size="23" font-weight="400" text-anchor="start">前缀 h B</text><text x="514" y="547" fill="#203b32" font-size="28" font-weight="700" text-anchor="start">读 C 的概率</text><path d="M494 480 V565" fill="none" stroke="#b1c6b9" stroke-width="2"/><text x="970" y="500" fill="#65756a" font-size="23" font-weight="400" text-anchor="start">前缀 h B C</text><text x="970" y="547" fill="#203b32" font-size="28" font-weight="700" text-anchor="start">读 A 的概率</text><path d="M950 480 V565" fill="none" stroke="#b1c6b9" stroke-width="2"/><text x="36" y="634" fill="#276152" font-size="26" font-weight="700" text-anchor="start">验证器从左向右决定保留几个候选。</text></g></svg>

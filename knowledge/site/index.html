<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="RL Infra: 算法、训练引擎、推理引擎与异步系统。">
  <title>RL Infra</title>
  <style>{{KNOWLEDGE_STYLE}}</style>
  <script>
    window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]'],['$$','$$']]},
      options:{skipHtmlTags:['script','style','textarea','pre','code','noscript']}};
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
</head>
<body>
  <a class="skip" href="#content">跳到正文</a>
  <header class="header">
    <a class="brand" href="#">RL Infra<span class="brand-dot">.</span></a>
    <nav class="primary-nav" aria-label="主导航">
      <a href="#" data-nav="map">知识库</a>
      <a href="#view=questions" data-nav="questions">问题</a>
      <a href="#view=library" data-nav="library">检索</a>
    </nav>
    <button id="menu-toggle" type="button" aria-haspopup="dialog" aria-controls="mobile-directory">目录</button>
  </header>
  <dialog id="mobile-directory">
    <div class="dialog-head"><strong>知识目录</strong><button id="close-menu" type="button">关闭</button></div>
    <nav id="mobile-tree" aria-label="手机目录"></nav>
  </dialog>
  <div class="shell">
    <aside class="sidebar">
      <p class="caption">RL / ENGINEERING NOTES</p>
      <nav id="chapter-list" aria-label="知识目录"></nav>
      <div class="sidebar-footer"><a href="#view=questions&review=due">待复习</a><a href="quiz/">原题库与草稿</a></div>
    </aside>
    <main id="content" tabindex="-1">
      <form id="search-form" class="searchbar" role="search">
        <label for="search">搜索</label>
        <input id="search" type="search" placeholder="TP、Q081、训推不一致…" autocomplete="off">
        <button type="submit">查找</button>
      </form>
      <div id="notice" class="status" role="status" aria-live="polite"></div>
      <section id="home" class="view"></section>
      <section id="chapter" class="view" hidden></section>
      <section id="questions" class="view" hidden></section>
      <section id="library" class="view" hidden></section>
      <section id="detail" class="view" hidden>
        <nav id="breadcrumbs" class="breadcrumbs" aria-label="当前位置"></nav>
        <div class="reading-layout">
          <div class="reading">
            <p id="detail-type" class="caption"></p>
            <h1 id="detail-title" tabindex="-1"></h1>
            <p id="detail-summary" class="lead"></p>
            <section id="prerequisites" class="prerequisites" hidden></section>
            <details class="mobile-toc"><summary>本文目录</summary><nav id="mobile-toc"></nav></details>
            <article id="article" class="article"></article>
            <section id="question-review" class="review" hidden></section>
            <section id="related" class="related"></section>
          </div>
          <aside class="toc"><p class="caption">本文目录</p><nav id="toc"></nav></aside>
        </div>
      </section>
      <noscript><p>需要 JavaScript 进行搜索与交互。可从仓库阅读 Markdown 原文。</p></noscript>
      <footer class="footer"><a href="https://github.com/Kairosxy/rl-infra-100days-site" target="_blank" rel="noopener noreferrer">原文与变更记录</a><span id="build-version"></span></footer>
    </main>
  </div>
  <script type="application/json" id="knowledge-data">{{KNOWLEDGE_DATA}}</script>
  <script>{{KNOWLEDGE_JS}}</script>
  <script type="module">
    // Diagrams degrade to an accessible source view when the optional renderer is unavailable.
    try {
      const module=await import('https://cdn.jsdelivr.net/npm/mermaid@11.16.1/dist/mermaid.esm.min.mjs');
      window.mermaid=module.default;
      window.mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',themeVariables:{primaryColor:'#eef2e9',primaryTextColor:'#29342d',lineColor:'#567461',fontFamily:'system-ui'}});
      window.dispatchEvent(new Event('diagram-ready'));
    } catch (_) { document.documentElement.dataset.diagramFallback='true'; }
  </script>
</body>
</html>

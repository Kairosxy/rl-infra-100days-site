name: Publish course website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-course-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Install HTML builder dependencies
        run: python -m pip install -r site/requirements.txt
      - name: Build website
        run: python scripts/build_site.py --output dist/index.html
      - name: Validate course content and privacy boundary
        run: python -m unittest discover -s scripts -p 'test_site_builder.py' -v
      - name: Save offline HTML
        uses: actions/upload-artifact@v4
        with:
          name: rl-infra-100days-public-html
          path: dist/index.html
          retention-days: 30
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload generated website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

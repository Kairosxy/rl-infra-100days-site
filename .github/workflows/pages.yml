name: Publish RL Infra knowledge site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-course-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install HTML builder dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build website
        run: python scripts/build_knowledge.py --output dist/index.html
      - name: Build interview question bank
        run: python scripts/build_quiz.py --output dist/quiz/index.html
      - name: Validate knowledge graph, question bank and public boundary
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Mechanism and review regression checks
        run: node scripts/test_mechanisms.js
      - name: Check every published inline and external script
        run: python scripts/check_scripts.py dist
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser regression and responsive screenshots
        run: python scripts/browser_smoke.py --dist dist --output test-artifacts
      - name: Save browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rl-infra-browser-acceptance
          path: test-artifacts
          retention-days: 14
          if-no-files-found: warn
      - name: Check browser JavaScript syntax
        run: |
          node --check quiz/app.js
          node --check labs/app.js
          node --check knowledge/site/app.js
      - name: Save offline HTML
        uses: actions/upload-artifact@v4
        with:
          name: rl-infra-100days-public-html
          path: dist
          retention-days: 30
      - name: Archive tracked source for reproducible validation
        run: git archive --format=zip --output "$RUNNER_TEMP/rl-infra-source.zip" HEAD
      - name: Save source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: rl-infra-source-snapshot
          path: ${{ runner.temp }}/rl-infra-source.zip
          retention-days: 7
          if-no-files-found: error
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload generated website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live release identity
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_deployment.py --url "$PAGE_URL" --sha "$GITHUB_SHA"

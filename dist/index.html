  <script type="application/json" id="knowledge-data">{"schema":"rl-infra-knowledge-v1","chapters":[{"id":"rl","title":"RL 优化","description":"从采样分布到一次可信的参数更新"},{"id":"learner","title":"Learner 与数值","description":"Loss、梯度、低精度和训推一致性"},{"id":"parallel","title":"并行训练","description":"如何分配显存、计算与跨卡通信"},{"id":"serving","title":"Serving 与 KV","description":"请求调度、缓存和长尾"},{"id":"agent","title":"Agent 轨迹","description":"行为、观察、工具与奖励边界"},{"id":"async","title":"异步训练","description":"数据供给、版本和恢复语义"},{"id":"distill","title":"蒸馏与混合优化","description":"Teacher/Student、KL 与 RL 信号"},{"id":"diagnosis","title":"性能与排障","description":"先找证据，再动配置"},{"id":"research","title":"研究与设计","description":"论文、工程方案和可复现实验"}],"topics":[{"id":"policy-gradient","title":"一次 Reward 怎么更新 Policy？","chapter":"rl","summary":"区分一次采样的梯度和策略目标的期望梯度。","recall":{"question":"Reward 不可微，还能更新模型参数吗？","answer":"可以。对采样动作的 Logprob 求导，Reward 充当系数；要区分单样本估计与期望。","spoken":"评分不提供导数，导数来自已采样动作的对数概率。"},"keywords":["policy","gradient","reinforce","reward","expectation"],"cases":[],"implementations":[],"html":"\u003cp\u003e模型采到一个动作、Verifier 给出一个分数。训练到底修改了什么？\u003c/p\u003e\n\u003cp\u003e假设只有 A/B 两个动作，A 得 1 分、B 得 0 分。模型给 A 的概率是 \u003cspan class=\"arithmatex\"\u003e\\(p=\\sigma(z)\\)\u003c/span\u003e，初始 \u003cspan class=\"arithmatex\"\u003e\\(z=0\\)\u003c/span\u003e，所以 \u003cspan class=\"arithmatex\"\u003e\\(p=0.5\\)\u003c/span\u003e。总体目标是提高期望回报 \u003cspan class=\"arithmatex\"\u003e\\(J(z)=p\\)\u003c/span\u003e，解析梯度为 \u003cspan class=\"arithmatex\"\u003e\\(p(1-p)=0.25\\)\u003c/span\u003e。\u003c/p\u003e\n\u003cp\u003e但 Trainer 通常拿不到完整分布下的所有 Reward。它拿到的是本次采样的动作。假如采到 A，使用最基础的 REINFORCE Loss：\u003c/p\u003e\n\u003cdiv class=\"arithmatex\"\u003e\\[\nL=-R(A)\\log\\pi_z(A)=-\\log p,\\quad\n\\frac{\\partial L}{\\partial z}=-(1-p)=-0.5.\n\\]\u003c/div\u003e\n\u003cp\u003e学习率为 0.4 的 SGD 将 \u003cspan class=\"arithmatex\"\u003e\\(z\\)\u003c/span\u003e 更新到 \u003cspan class=\"arithmatex\"\u003e\\(0.2\\)\u003c/span\u003e，新的 \u003cspan class=\"arithmatex\"\u003e\\(p=\\sigma(0.2)\\approx0.549834\\)\u003c/span\u003e。这一轮采样梯度与解析期望梯度数值不一样，并不矛盾：如果采到 B，\u003cspan class=\"arithmatex\"\u003e\\(R(B)=0\\)\u003c/span\u003e，最简单的估计器梯度为 0；两种结果等概率出现，更新方向的期望仍为 \u003cspan class=\"arithmatex\"\u003e\\(0.25\\)\u003c/span\u003e。\u003c/p\u003e\n\u003ch2 id=\"推导成立的条件\"\u003e推导成立的条件\u003c/h2\u003e\n\u003cdiv class=\"arithmatex\"\u003e\\[\n\\nabla_\\theta\\mathbb E_{a\\sim\\pi_\\theta}[R(a)]\n=\\mathbb E_{a\\sim\\pi_\\theta}\n[R(a)\\nabla_\\theta\\log\\pi_\\theta(a)].\n\\]\u003c/div\u003e\n\u003cp\u003e它需要样本来自被求导的分布；环境 Reward 不直接依赖这些参数。对旧 Policy 的样本无修正地套用当前 Score Function，一般不满足同一个期望恒等式。基线 \u003cspan class=\"arithmatex\"\u003e\\(b(s)\\)\u003c/span\u003e 可以在不依赖当前 Action 的条件下减小方差，却不是“随便减一个分数都无偏”。\u003c/p\u003e\n\u003ch2 id=\"代码里要确认什么\"\u003e代码里要确认什么\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eReward 是否确实对应本次采样的 Action；\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCurrent Logprob\u003c/strong\u003e 是否在可微的模型前向中计算，而非从服务侧拿到一个已 Detach 的数字；\u003c/li\u003e\n\u003cli\u003eAction Mask 是否只包含模型生成的位置；\u003c/li\u003e\n\u003cli\u003eLoss 前面的负号是否正确，Optimizer 是否只 Step 一次。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e最小验证是固定 A、\u003cspan class=\"arithmatex\"\u003e\\(z=0\\)\u003c/span\u003e，确认更新后 \u003cspan class=\"arithmatex\"\u003e\\(p\u0026gt;0.5\\)\u003c/span\u003e。把 Loss 的负号故意写反，应得到 \u003cspan class=\"arithmatex\"\u003e\\(p\\approx0.450166\\)\u003c/span\u003e。能跑 Backward 但方向不对，是一种最基础的训练正确性故障。\u003c/p\u003e\n\u003cp\u003e可读材料：\u003ca href=\"https://spinningup.openai.com/en/latest/spinningup/rl_intro3.html\"\u003eSpinning Up 的 Policy Gradient 推导\u003c/a\u003e；\u003ca href=\"https://arxiv.org/abs/1707.06347\"\u003ePPO 原论文\u003c/a\u003e。\u003c/p\u003e"},{"id":"ppo-grpo","title":"PPO / GRPO 的优化目标","chapter":"rl","summary":"从 Ratio、Clip 到 Group Advantage，辨别更新目标与估计器。","recall":{"question":"PPO Clip 能限制全策略的 KL 吗？","answer":"不能。它截断特定样本的 Surrogate 梯度，不是全分布硬约束。","spoken":"Clip 管的是样本层面的更新方向，KL 仍需要按明确口径监控。"},"keywords":["ppo","grpo","dapo","gspo","ratio","advantage"],"cases":["ppo-clip-kl"],"implementations":["verl-hybridflow"],"html":"\u003cp\u003e先固定一条已经采样的动作。Old Policy 当时给它 0.2 的概率，Current Policy 现在给它 0.3，则 Ratio 为\u003c/p\u003e\n\u003cdiv class=\"arithmatex\"\u003e\\[\nr=\\frac{\\pi_{\\theta}(a|s)}{\\pi_{\\mathrm{old}}(a|s)}=1.5.\n\\]\u003c/div\u003e\n\u003cp\u003ePPO 的 Clipped Surrogate 不是简单把所有 \u003cspan class=\"arithmatex\"\u003e\\(r\\)\u003c/span\u003e 限制在区间内，而是根据 Advantage 的方向取较小目标：\u003c/p\u003e\n\u003cdiv class=\"arithmatex\"\u003e\\[\nJ_{\\mathrm{clip}}=\\min(rA,\\operatorname{clip}(r,1-\\epsilon,1+\\epsilon)A).\n\\]\u003c/div\u003e\n\u003cp\u003e取 \u003cspan class=\"arithmatex\"\u003e\\(\\epsilon=0.2\\)\u003c/span\u003e：\u003cspan class=\"arithmatex\"\u003e\\(A=+2\\)\u003c/span\u003e、\u003cspan class=\"arithmatex\"\u003e\\(r=1.5\\)\u003c/span\u003e 时，两个候选值是 3.0 与 2.4，最终为 2.4；这条样本继续提高概率时进入平坦区。对负 Advantage，平台在区间下界另一侧：\u003cspan class=\"arithmatex\"\u003e\\(A=-2,r=0.6\\)\u003c/span\u003e 时目标为 \u003cspan class=\"arithmatex\"\u003e\\(-1.6\\)\u003c/span\u003e。平台是\u003cstrong\u003e单条样本的局部目标\u003c/strong\u003e，并非 KL 硬约束。\u003c/p\u003e\n\u003ch2 id=\"grpo-换掉的是什么\"\u003eGRPO 换掉的是什么\u003c/h2\u003e\n\u003cp\u003e一个 Prompt 生成四条回答，Reward 为 \u003cspan class=\"arithmatex\"\u003e\\([1,0,1,0]\\)\u003c/span\u003e。按总体标准差的常见组内标准化定义，均值为 0.5、标准差为 0.5，Advantage 为 \u003cspan class=\"arithmatex\"\u003e\\([1,-1,1,-1]\\)\u003c/span\u003e。如果四条全对或全错，组内没有相对差异，单靠这个 Advantage 的 PG 项无法区分回答。\u003c/p\u003e\n\u003cp\u003e这里有两个容易忽略的事实。第一，\u003cstrong\u003e组内均值包含当前样本自身\u003c/strong\u003e，不等于经典的 Action-independent Baseline；有限 \u003cspan class=\"arithmatex\"\u003e\\(G\\)\u003c/span\u003e 会带来估计器差异。第二，Group Advantage 的计算对象必须明确：预期 \u003cspan class=\"arithmatex\"\u003e\\(G=4\\)\u003c/span\u003e 时拿三条 \u003cspan class=\"arithmatex\"\u003e\\([1,0,1]\\)\u003c/span\u003e 直接标准化，得到的 \u003cspan class=\"arithmatex\"\u003e\\([0.707,-1.414,0.707]\\)\u003c/span\u003e 不是四条完整组的提前结果。\u003c/p\u003e\n\u003ch2 id=\"真正影响训练的选择\"\u003e真正影响训练的选择\u003c/h2\u003e\n\u003cp\u003e很多所谓“GRPO 实现差异”在代码里只是几个 Reduction 和概率字段：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio 是逐 Token 还是逐 Sequence 计算；\u003c/li\u003e\n\u003cli\u003eLoss 在有效 Token 维度求均值，还是先做 Sequence Reduction；\u003c/li\u003e\n\u003cli\u003eOld Logprob 是否与真实生成分布、权重版本对应；\u003c/li\u003e\n\u003cli\u003e被过滤的全同奖励组改变了哪些 Prompt 的采样权重。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e例如两条 Response 分别有 1 和 9 个 Action Token，使用 Token Mean 和 Sequence Mean 时，长回答的总权重可以从 \u003cspan class=\"arithmatex\"\u003e\\(9/10\\)\u003c/span\u003e 变到 \u003cspan class=\"arithmatex\"\u003e\\(1/2\\)\u003c/span\u003e。不能把这种差异当作无关紧要的性能优化。\u003c/p\u003e\n\u003ch2 id=\"如何读后续工作\"\u003e如何读后续工作\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://arxiv.org/abs/2402.03300\"\u003eDeepSeekMath\u003c/a\u003e 是 GRPO 的重要来源；\u003ca href=\"https://arxiv.org/abs/2503.14476\"\u003eDAPO\u003c/a\u003e 讨论采样、Clip 与 Token Loss 的困难；\u003ca href=\"https://arxiv.org/abs/2507.18071\"\u003eGSPO\u003c/a\u003e 研究 Sequence 层面的策略优化。这些工作并非只改了某个“默认超参数”，需要先确定估计对象、Loss Reduction 和概率分布。\u003c/p\u003e\n\u003cp\u003e工程上，可以对同一批固定 Token、Reward 和 Old/Current Logprob 实现两个 Reduction，对比每个 Token 的梯度；比“跑一次大模型看 Reward 是否上涨”更直接。\u003c/p\u003e"},{"id":"logprob-contract","title":"Token Logprob 与训练目标","chapter":"learner","summary":"Shift、Action Mask、Reduction 与 Policy Version 必须对齐。","recall":{"question":"Loss 正常下降就代表 Token 对齐正确吗？","answer":"不代表。预测位置错一格或 Mask 包含 Observation，Shape 仍可能合法。","spoken":"先核对 Token、概率分布和 Mask，再解释 Loss 变化。"},"keywords":["logprob","token","shift","mask","reduction","sequence"],"cases":["ppo-clip-kl","fp8-logprob-drift","moe-router-mismatch"],"implementations":["nemo-router-replay"],"html":"\u003cp\u003e有一类训练错误不产生 NaN：Token 和 Reward 对齐错了，或者比较的压根不是同一份概率分布。Loss 可能仍在下降。\u003c/p\u003e\n\u003cp\u003e在 Causal LM 中，输入 \u003ccode\u003einput_ids [B,L]\u003c/code\u003e 得到 \u003ccode\u003elogits [B,L,V]\u003c/code\u003e；位置 \u003cspan class=\"arithmatex\"\u003e\\(t\\)\u003c/span\u003e 的 Logits 预测位置 \u003cspan class=\"arithmatex\"\u003e\\(t+1\\)\u003c/span\u003e 的目标 Token。Prompt 长度为 \u003cspan class=\"arithmatex\"\u003e\\(P\\)\u003c/span\u003e、Response 长度为 \u003cspan class=\"arithmatex\"\u003e\\(T\\)\u003c/span\u003e 时：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-python\"\u003eaction_ids = input_ids[:, P:P+T]\naction_logits = logits[:, P-1:P+T-1, :]\naction_log_probs = action_logits.log_softmax(-1).gather(\n    -1, action_ids.unsqueeze(-1)\n).squeeze(-1)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cspan class=\"arithmatex\"\u003e\\(B=2,L=7\\)\u003c/span\u003e，Prompt Length 为 \u003cspan class=\"arithmatex\"\u003e\\([2,3]\\)\u003c/span\u003e、Valid Length 为 \u003cspan class=\"arithmatex\"\u003e\\([5,6]\\)\u003c/span\u003e，那么在目标位置 \u003cspan class=\"arithmatex\"\u003e\\(1..6\\)\u003c/span\u003e 上，Action Mask 分别是 \u003cspan class=\"arithmatex\"\u003e\\([0,1,1,1,0,0]\\)\u003c/span\u003e 和 \u003cspan class=\"arithmatex\"\u003e\\([0,0,1,1,1,0]\\)\u003c/span\u003e，共有 6 个可训练位置。这里默认单段 Prompt+Response；工具 Observation 和多模态 Token 需要额外标记。\u003c/p\u003e\n\u003ch2 id=\"四种容易混淆的概率\"\u003e四种容易混淆的概率\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eBehavior\u003c/strong\u003e 表示实际把 Token 采出来的分布，可能经过 Temperature、Top-p、Stop 等采样变换；\u003cstrong\u003eOld\u003c/strong\u003e 是优化阶段固定的比较基准；\u003cstrong\u003eCurrent\u003c/strong\u003e 是正在反向传播的模型；\u003cstrong\u003eReference\u003c/strong\u003e 是 KL 等约束的对照模型。它们可能某次恰好相同，但不能因为字段都叫 \u003ccode\u003elog_probs\u003c/code\u003e 就直接互换。\u003c/p\u003e\n\u003cp\u003e尤其在 FP8/BF16 交叉运行时，先检查 Token ID、Mask、采样变换和权重版本，再比较相同条件下的 Logprob。否则看到“0.3 nats Gap”也无法判断是数值漂移、路由分歧还是比较对象不一致。\u003c/p\u003e\n\u003ch2 id=\"快速反例\"\u003e快速反例\u003c/h2\u003e\n\u003cp\u003ePrompt 两个 Token，Response 两个 Token。正确应使用 \u003ccode\u003elogits[1], logits[2]\u003c/code\u003e 预测 \u003ccode\u003etoken_ids[2], token_ids[3]\u003c/code\u003e。故意使用 \u003ccode\u003elogits[2], logits[3]\u003c/code\u003e，Shape 仍然匹配，Loss 也能 Backward，概率语义已经改变。\u003c/p\u003e\n\u003cp\u003e可运行的 CPU 例子仍在 \u003ca href=\"https://github.com/Kairosxy/rl-infra-100days-site/blob/main/examples/day_04/sequence_logprob_lab.py\"\u003esequence_logprob_lab.py\u003c/a\u003e；该路径沿用了旧课表命名，文件内容可作为本主题的实验依据。\u003c/p\u003e"},{"id":"fp8-numerics","title":"FP8 的收益与数值边界","chapter":"learner","summary":"从量化 Scale 到 BF16/FP8 的 Logprob 差异与模型质量。","recall":{"question":"FP8 GEMM 更快，RL Step 就一定更快吗？","answer":"不一定。还取决于瓶颈是否在 GEMM，以及精度和采样分布变化。","spoken":"先看瓶颈，再看量化误差怎样传到采样和梯度。"},"keywords":["fp8","transformerengine","mxfp8","scaling","precision"],"cases":["fp8-logprob-drift"],"implementations":["te-megatron-fp8"],"html":"\u003cp\u003eFP8 不是“把整个训练程序的 Tensor 都换成 8 bit”。实际实现往往只让特定 GEMM 使用低精度输入与对应累加策略，同时保留一些状态或计算在较高精度。\u003c/p\u003e\n\u003cp\u003e最基本的量化过程可以写成：\u003c/p\u003e\n\u003cdiv class=\"arithmatex\"\u003e\\[\nq=\\operatorname{clip}\\bigl(\\operatorname{round}(x/s), q_{\\min},q_{\\max}\\bigr),\n\\qquad \\hat x=sq.\n\\]\u003c/div\u003e\n\u003cp\u003eScale \u003cspan class=\"arithmatex\"\u003e\\(s\\)\u003c/span\u003e 控制动态范围与量化间距。不同 recipe 使用 per-tensor、blockwise 等不同尺度粒度，选择也受硬件与内核支持影响。只比较“FP8 vs BF16”不足以描述真正的数值契约。\u003c/p\u003e\n\u003ch2 id=\"为什么长输入短输出不一定得到同样收益\"\u003e为什么长输入短输出不一定得到同样收益\u003c/h2\u003e\n\u003cp\u003ePrefill 通常包含较大的矩阵计算，低精度 GEMM 在适当形状下有机会提高计算吞吐；Decode 还受每 Token 读取权重/KV、Launch 和 Batch Shape 影响。是否真正提高端到端 RL 吞吐，要结合 Rollout/Learner 的阶段耗时和 Kernel Trace。\u003c/p\u003e\n\u003cp\u003e举一个明确的上限：同步 Step 中 Rollout 用时 42s、Learner 用时 18s。即便 Learner 提速 2 倍，端到端从 60s 变为 51s，加速只有 \u003cspan class=\"arithmatex\"\u003e\\(60/51≈1.176\\)\u003c/span\u003e，而不是 2 倍。\u003c/p\u003e\n\u003ch2 id=\"fp8-改变了什么概率\"\u003eFP8 改变了什么概率\u003c/h2\u003e\n\u003cp\u003e微小 Logits 扰动经 Softmax、Sampling、多个 Token 条件概率的累积，有可能改变生成长度和样本分布；但“FP8 输出变短”并不自动证明量化有问题。先固定同一权重、Token 序列和采样语义，对比 BF16/FP8 的逐 Token Logits 与 Logprob；再看 EOS 概率、Temperature、Stop 与模型路由。\u003c/p\u003e\n\u003cp\u003e对于 MoE，如果两套 Engine 选中了不同 Expert，还需要单独分析 Routing。R3 修复的是离散 Expert Assignment 的不一致，不是全部精度问题。\u003c/p\u003e\n\u003ch2 id=\"实现参考\"\u003e实现参考\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://nvidia.github.io/TransformerEngine/examples/fp8_primer.html\"\u003eTransformerEngine FP8 Recipe\u003c/a\u003e 讨论 Delayed Scaling、Current Scaling、Block Scaling 等策略；\u003ca href=\"https://docs.nvidia.com/megatron-core/developer-guide/nightly/user-guide/features/low_precision_training.html\"\u003eMegatron Core 低精度训练\u003c/a\u003e 记录训练侧的格式和 Recipe 选项。支持矩阵随版本变化，不能在一个具体 GPU 上不检查就启用所有 Recipe。\u003c/p\u003e"},{"id":"moe-router","title":"MoE Routing 与 R3","chapter":"learner","summary":"相同 Token 在两套引擎中选了不同 Expert，后果是什么？","recall":{"question":"Router Replay 修复了所有训推差异吗？","answer":"没有。R3对齐 Expert 选择；采样变换、数值误差、版本差异仍需单独检查。","spoken":"R3 固定离散路由选择，不等于使两边所有概率完全相同。"},"keywords":["moe","r3","router","replay","drift"],"cases":["fp8-logprob-drift","moe-router-mismatch"],"implementations":["nemo-router-replay"],"html":"\u003cp\u003eMoE Router 在选 Top-k Expert 时，很多时候接近一个离散决策边界。如果两个 Expert 的 Router Score 非常接近，那么两套 Engine 即使权重相同，也可能因为 Kernel、精度或归约顺序差异选中不同 Expert。\u003c/p\u003e\n\u003cp\u003e这会使 Rollout 实际使用的条件分布与训练侧重算的 Logprob 不一致。误差在多个 MoE Layer 中累积时，可能比单层 Logit 的浮点扰动更明显。\u003c/p\u003e\n\u003ch2 id=\"r3-修复的是具体的离散决策\"\u003eR3 修复的是具体的离散决策\u003c/h2\u003e\n\u003cp\u003eRollout Routing Replay（R3）记录生成时的 Expert 选择，在训练前向中重放这些索引，使训练侧使用对应 Expert 的路径重新计算概率。NeMo RL 文档明确说明只重放离散选择，Router 的权重与梯度计算仍发生在当前训练侧；不是冻结整个 Router。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://proceedings.mlr.press/v306/ma26aw.html\"\u003eR3 论文\u003c/a\u003e 报告通过路由对齐降低训推偏差；\u003ca href=\"https://docs.nvidia.com/nemo/rl/nightly/guides/router-replay.html\"\u003eNeMo RL Router Replay Guide\u003c/a\u003e 说明了具体支持的训练与生成 Backend、异常 fallback 及验证指标。这里引用的是公开实现文档而非我们自己的训练结果。\u003c/p\u003e\n\u003ch2 id=\"为什么不能只开一个开关\"\u003e为什么不能只开一个开关\u003c/h2\u003e\n\u003cp\u003e路由信息必须跟随正确的 Token 穿过 Packing、TransferQueue、Context Parallel 切分和恢复流程。缺失路由需要明确的 Fallback，而不能默默把整批标记成已对齐。R3 对齐 Expert 选择，也不会自动对齐 Weight Version、Temperature 或其他概率变换。\u003c/p\u003e\n\u003cp\u003e另外，路由重放并非没有取舍。\u003ca href=\"https://arxiv.org/abs/2610.21682\"\u003eRouter Drift Control 预印本（2026-10）\u003c/a\u003e 提出回放旧路由可能引入另一种梯度偏差，并探索基于路由分歧的样本筛选。它是有价值的研究反例，但不等于已被证明在所有配置下优于 R3。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e最小对照\u003c/strong\u003e：固定权重与 Token，记录 Rollout/Training 的 Top-k Expert ID、同位置 Logprob、与 Policy Version；分别开启与关闭 Replay，比较路由一致率和选中 Token Logprob 差异。\u003c/p\u003e"},{"id":"parallel-topology","title":"DP / TP / PP / EP 怎么组合","chapter":"parallel","summary":"用计算、通信和峰值显存，而不是靠经验选择并行度。","recall":{"question":"TP 增加一倍，为何训练可能更慢？","answer":"单卡计算减少的同时 Collective 更多或更慢；是否划算取决于形状和拓扑。","spoken":"先算通信发生在哪层，再谈并行规模。"},"keywords":["megatron","fsdp2","deepspeed","tensor","pipeline","expert"],"cases":[],"implementations":["verl-hybridflow","te-megatron-fp8","fsdp2-sharding"],"html":"\u003cp\u003e一个并行策略至少改变三件事：每张卡保存多少状态、每次算多少矩阵、哪些边界必须通信。并行度增加不等于吞吐必然增长。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDP\u003c/strong\u003e 将不同样本分给不同副本，同步梯度；\u003cstrong\u003eTP\u003c/strong\u003e 将模型内部矩阵拆分，需要在层内通信；\u003cstrong\u003ePP\u003c/strong\u003e 将层分到不同 Stage，产生 Pipeline Bubble 与跨 Stage Activation 传输；\u003cstrong\u003eEP\u003c/strong\u003e 将不同 Expert 分散在设备之间，引入 Token Routing 和 All-to-All。Context Parallel 则切分长序列 Attention 所需的计算/存储。\u003c/p\u003e\n\u003ch2 id=\"一个最小成本判断\"\u003e一个最小成本判断\u003c/h2\u003e\n\u003cp\u003e假设某个 Parallelism 配置将单卡计算从 20 ms 降到 12 ms，却增加 11 ms 的不可重叠通信。新阶段理论时间约 23 ms，反而比原来慢。若通信能与计算重叠，真实关键路径还会变化，不能简单把每个计时指标相加。\u003c/p\u003e\n\u003cp\u003eFSDP2 属于另一种分片维度：它用 DTensor 对参数做分片，前向时 All-gather，反向后 Reduce-scatter Gradient。分片省去的是常驻状态，All-gather 仍会形成瞬时峰值。不能把 FSDP2 与 TP 看成只能二选一的标签。\u003c/p\u003e\n\u003ch2 id=\"工程选择的输入\"\u003e工程选择的输入\u003c/h2\u003e\n\u003cp\u003e给出参数数目、Attention/MoE 结构、序列长度、Batch、GPU 显存与互联拓扑之后，先算各 Strategy 的参数/Activation 峰值和 Collective，再谈吞吐优化。Megatron Core 的多维并行与 PyTorch FSDP2 的分片生命周期是重要对照，但实际选型仍需实验验证。\u003c/p\u003e\n\u003cp\u003e参考：\u003ca href=\"https://docs.nvidia.com/megatron-core/developer-guide/latest/index.html\"\u003eMegatron Core 官方文档\u003c/a\u003e；\u003ca href=\"https://docs.pytorch.org/docs/stable/distributed.fsdp.fully_shard.html\"\u003eFSDP2 fully_shard\u003c/a\u003e。\u003c/p\u003e"},{"id":"kv-scheduling","title":"KV Cache 与请求调度","chapter":"serving","summary":"Paged KV、Prefix Cache、Continuous Batching 的成本取舍。","recall":{"question":"吞吐提升是否一定会改善 P99？","answer":"不一定。Admission 和 Prefill/Decode 竞争可能推高长尾。","spoken":"区分容量、吞吐、TTFT 和 TPOT，不能只盯一个数字。"},"keywords":["sglang","vllm","kv","cache","radix","attention"],"cases":["kv-oom"],"implementations":["sglang-scheduler","vllm-kv"],"html":"\u003cp\u003eServing 同时面对两个不同的阶段：Prefill 为输入序列计算表示并建立 KV；Decode 为每个请求逐步生成新的 Token，反复读取已有 KV。它们对算术强度、Batch Shape、带宽和延迟的敏感性不同。\u003c/p\u003e\n\u003cp\u003e最基础的 KV 容量模型：\u003c/p\u003e\n\u003cdiv class=\"arithmatex\"\u003e\\[\nM_{\\mathrm{KV}}=2\\times L_{\\mathrm{layers}}\\times N_{\\mathrm{kvheads}}\\times D_{\\mathrm{head}}\n\\times T_{\\mathrm{cached}}\\times b.\n\\]\u003c/div\u003e\n\u003cp\u003e其中 2 表示 Key 和 Value，\u003cspan class=\"arithmatex\"\u003e\\(b\\)\u003c/span\u003e 是每个元素的 Byte 数。公式描述一组连续存储的 KV 字节数，不包含页表、内存池碎片或分层缓存开销。\u003c/p\u003e\n\u003cp\u003e举例：32 层、8 个 KV Head、HeadDim 128、BF16，每缓存 1 个 Token 约需 \u003cspan class=\"arithmatex\"\u003e\\(2×32×8×128×2=131072\\)\u003c/span\u003e Byte，即 128 KiB；8K Token 约为 1 GiB。具体模型仍需按照真实 GQA/MQA、Layer 类型及缓存 dtype 重新计算。\u003c/p\u003e\n\u003cp\u003ePagedAttention 通过分页管理 KV，减少分配粒度和碎片造成的浪费；Prefix Cache 复用相同前缀，降低重复 Prefill；Continuous Batching 改变请求交错执行方式。它们解决的是不同约束，不是三种同义的加速按钮。\u003c/p\u003e\n\u003cp\u003eSGLang 的 RadixAttention/HiCache 与 vLLM 的 PagedAttention 能作为代码级对照。需要同时记录吞吐、TTFT、TPOT 和 P99，并固定请求长度与到达分布。\u003c/p\u003e\n\u003cp\u003e资料：\u003ca href=\"https://arxiv.org/abs/2309.06180\"\u003evLLM / PagedAttention\u003c/a\u003e；\u003ca href=\"https://docs.sglang.ai/advanced_features/hicache_design.html\"\u003eSGLang HiCache 设计\u003c/a\u003e。\u003c/p\u003e"},{"id":"agent-action","title":"Agent 的 Action 到底是什么","chapter":"agent","summary":"区分模型动作、工具 Observation、环境奖励和状态边界。","recall":{"question":"工具返回的文字应该直接计算 Policy Loss 吗？","answer":"通常不应把环境 Observation 当作模型采样 Action；需要准确的 Action Mask。","spoken":"真正可训练的是模型选择的动作，不是对话记录里的每段文字。"},"keywords":["agent","harness","environment","reward","observation"],"cases":["async-group-drain"],"implementations":["slime-data-buffer"],"html":"\u003cp\u003e一次工具调用至少包括：模型生成 Tool Call、工具执行、环境返回 Observation、模型继续决定动作。将整段 Transcript 全部当作 Response Token 训练，会让模型在并未采样的环境文字上产生 Policy Gradient。\u003c/p\u003e\n\u003cp\u003e必须区分：\u003cstrong\u003eAction\u003c/strong\u003e 由模型的策略分布采出，\u003cstrong\u003eObservation\u003c/strong\u003e 来自环境，\u003cstrong\u003eReward\u003c/strong\u003e 评价行为或轨迹，\u003cstrong\u003eState\u003c/strong\u003e 是环境的可恢复状态。Message Role 和 Token Mask 要能把这几个对象映射回原始序列。\u003c/p\u003e\n\u003cp\u003e例如模型输出一个 JSON Tool Call，工具返回 4K Token 的搜索结果，然后模型输出 20 Token 的结论。若直接对全部 4020 个 Token 求均值，环境 Observation 可能远远超过真正 Action 的权重。即使 Loss 没有 NaN，这个优化目标也是错的。\u003c/p\u003e\n\u003cp\u003e一个有效的最小 Agent Loop 要能验证工具结果与正确 Trial/Trajectory 的 ID 关联、异常是否影响 Reward、工具重试是否幂等、环境是否在不同采样之间污染。不要因为 Harness 能执行工具就默认满足 RL 所需的数据契约。\u003c/p\u003e\n\u003cp\u003e当 Agent Harness 与 RL Trainer 分离时，训练侧真正依赖的是可追溯的 Action / Observation / Reward 序列，而不是某个 ReAct 框架内部类名。\u003c/p\u003e\n\u003cp\u003e参考：\u003ca href=\"https://github.com/microsoft/agent-lightning\"\u003eAgent Lightning\u003c/a\u003e；\u003ca href=\"https://verl.readthedocs.io/en/latest/advance/agent_loop.html\"\u003everl Agentic RL 文档\u003c/a\u003e。\u003c/p\u003e"},{"id":"async-rollout","title":"异步 Rollout 与 Policy Staleness","chapter":"async","summary":"分清必要的数据依赖、外层批等待、版本差异和资源排空。","recall":{"question":"达到训练数据目标，意味着所有在途请求都结束吗？","answer":"不意味着。停止投新任务和清空 Inflight 是两个时间点。","spoken":"异步减少的可以是额外等待，也可能增加旧样本和排空成本。"},"keywords":["async","partial","rollout","staleness","transferqueue","sampler"],"cases":["rl-step-longtail","async-group-drain"],"implementations":["verl-hybridflow","slime-data-buffer","areal-service","sglang-scheduler"],"html":"\u003cp\u003e同步训练里存在不可省略的依赖：同一 Prompt 的 Group Advantage 需要有效组完整、Learner 需要当前更新定义下的 Batch、同一 GPU 不能无限同时承担互斥工作。但等外层整个 Batch 的所有请求都完成后才开始筛选，有时只是实现造成的额外屏障。\u003c/p\u003e\n\u003cp\u003e异步供给允许 Group 或请求完成后立即进入筛选池，并根据已接受样本、Inflight 数量和历史接受率决定补投。这里\u003cstrong\u003e停止投新请求、达到目标有效样本数、所有在途请求排空\u003c/strong\u003e，是三个不同时间点。没有 Abort 时，达到目标不等于 GPU 已空闲。\u003c/p\u003e\n\u003ch2 id=\"多出来的算法问题\"\u003e多出来的算法问题\u003c/h2\u003e\n\u003cp\u003eRollout 开始时使用 v10 权重，Trainer 可能已更新到 v11。记录在轨迹上的 Behavior Version 不能在消费时覆盖成 v11，否则 Ratio、Staleness 和恢复逻辑都失去事实依据。Partial Rollout 如果跨 Weight Update，更需要定义每个 Token 的生成版本与恢复状态。\u003c/p\u003e\n\u003cp\u003e同样重要的是 DataSampler 的选择偏差：如果慢请求更容易被丢弃、或者全同 Reward Group 更容易被过滤，最终训练样本的分布可能改变。增加吞吐还不够，需要在相近模型质量和相同负载下比较成本。\u003c/p\u003e\n\u003ch2 id=\"框架怎么取舍\"\u003e框架怎么取舍\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://verl.readthedocs.io/en/latest/hybrid_flow.html\"\u003everl HybridFlow\u003c/a\u003e 把 RL 数据流与不同执行 Engine 组合；\u003ca href=\"https://github.com/THUDM/slime\"\u003eslime\u003c/a\u003e 强调 Megatron/SGLang 与 Data Buffer 的集成；\u003ca href=\"https://areal-ai.io/AReaL/en/algorithms/async.html\"\u003eAReaL Async RL\u003c/a\u003e 明确用生成/训练重叠和 Off-policyness Budget 控制异步。不能据此声称谁在所有工作负载下更快。\u003c/p\u003e\n\u003ch2 id=\"可验证的调度实验\"\u003e可验证的调度实验\u003c/h2\u003e\n\u003cp\u003e构造两个 Group 的完成时间：A 在 3s 完整，B 在 10s 完整。同步外层筛选必须等到 10s；异步供给可以在 3s 对 A 做组内统计，但\u003cstrong\u003e能否立刻执行训练更新\u003c/strong\u003e还取决于 Mini-batch、版本和资源。统计“可更早处理”不等于测得“端到端必定加速”。\u003c/p\u003e\n\u003cp\u003e建议至少记录 Accepted Groups、Inflight、Rejected、Policy Version Gap、Drain Time 和 GPU Busy Time。没有这几项，只有 Step Time 的对照很难解释结果。\u003c/p\u003e"},{"id":"opd-kl","title":"OPD、Teacher 分布与 KL","chapter":"distill","summary":"Teacher 的全词表信号如何与 RL Advantage 共存。","recall":{"question":"Reverse KL 与 Forward KL 能混用吗？","answer":"不能直接等价；它们的期望分布、覆盖倾向和梯度不同。","spoken":"先固定被比较的两份分布和 KL 方向，再讨论蒸馏。"},"keywords":["opd","online","distillation","kl","teacher","student"],"cases":[],"implementations":[],"html":"\u003cp\u003e强化学习通常利用采样动作的 Reward 构造 Policy Gradient；Online Policy Distillation（OPD）则让 Teacher 提供一份更密集的概率监督。两种信号可以互补，但不能在不明确 Reduction、Tokenizer 和方向的情况下简单相加。\u003c/p\u003e\n\u003cp\u003e以两个 Action 为例，Teacher 分布为 \u003cspan class=\"arithmatex\"\u003e\\(q=[0.9,0.1]\\)\u003c/span\u003e，Student 为 \u003cspan class=\"arithmatex\"\u003e\\(p=[0.5,0.5]\\)\u003c/span\u003e。若选择 Forward KL \u003cspan class=\"arithmatex\"\u003e\\(D_{\\mathrm{KL}}(q\\|p)\\)\u003c/span\u003e：\u003c/p\u003e\n\u003cdiv class=\"arithmatex\"\u003e\\[\nD_{\\mathrm{KL}}(q\\|p)=0.9\\log\\frac{0.9}{0.5}+0.1\\log\\frac{0.1}{0.5}\\approx0.3681.\n\\]\u003c/div\u003e\n\u003cp\u003e如果反过来计算 \u003cspan class=\"arithmatex\"\u003e\\(D_{\\mathrm{KL}}(p\\|q)\\)\u003c/span\u003e，得到约 0.5108，数值和梯度都不同。对于多峰分布，Forward/Reverse KL 的偏好也不同。必须先写清 Teacher/Student 谁是期望分布、Loss 怎样在 Vocab/Token/Batch 维度归约。\u003c/p\u003e\n\u003cp\u003e工程上，Full-Vocab Logits 的 Tensor Shape 是 §[B,T,V]§，Teacher 可以独立服务或在训练 GPU 上 Offload；前者增加 RPC 和带宽代价，后者带来显存/资源争用。以 \u003cspan class=\"arithmatex\"\u003e\\(B=4,T=1024,V=128000\\)\u003c/span\u003e、BF16 为例，单份 Logits 约 1 GiB，绝不能把 Teacher Logits 视为零成本数据。\u003c/p\u003e\n\u003cp\u003e与 GRPO 联合训练时，建议分别监控 PG Loss、Distillation Loss 和它们各自的 Gradient Norm/有效 Token Mask，辨认是否出现不同目标之间的尺度冲突。\u003c/p\u003e\n\u003cp\u003e参考：\u003ca href=\"https://arxiv.org/abs/1707.06347\"\u003ePPO\u003c/a\u003e 的策略更新背景；\u003ca href=\"https://github.com/NVIDIA-NeMo/RL\"\u003eNeMo RL 官方代码\u003c/a\u003e 中的 RL/OPD 功能文档需随实际版本核对。\u003c/p\u003e"},{"id":"rl-throughput","title":"RL Step 真的慢在哪里","chapter":"diagnosis","summary":"把吞吐数字拆到 Rollout、Train、通信、等待与排空。","recall":{"question":"Learner 加速两倍，RL Step 会加速两倍吗？","answer":"不一定。若 Rollout 更久且阶段串行，整体加速受未优化部分限制。","spoken":"先量化 Step 的关键路径，避免局部优化冒充端到端收益。"},"keywords":["throughput","gpu","hours","profiling","async","capacity"],"cases":["rl-step-longtail","async-group-drain","kv-oom"],"implementations":["areal-service","fsdp2-sharding"],"html":"\u003cp\u003e“训练效率提升”至少有三个不同口径：Learner Tokens/s、Rollout Tokens/s、被接受的训练 Token / GPU-hour。它们可以同时变化，也可以互相冲突。\u003c/p\u003e\n\u003cp\u003e考虑串行同步 Step：Rollout=42s，Learner=18s，总计 60s。如果优化 Learner 使其快 2 倍，新的 Step Time=42+9=51s，端到端加速为 \u003cspan class=\"arithmatex\"\u003e\\(60/51≈1.176\\)\u003c/span\u003e。这不是算法没用，而是 Amdahl 规律告诉你瓶颈还有 42s 没改。\u003c/p\u003e\n\u003cp\u003e如果系统允许重叠，关键路径又会改变。不能简单把 Worker 的独立计时累加为真实 Wall Time。更不能用“请求提前完成”推出“所有 Inflight 都结束”，后者还涉及资源排空。\u003c/p\u003e\n\u003ch2 id=\"最小可观察性\"\u003e最小可观察性\u003c/h2\u003e\n\u003cp\u003e同一个 Step 需要能追踪：生成/工具/Verifier/筛选各阶段延迟、GPU Busy Time、Learner Forward/Backward/Optimizer 时间、通信同步、Weight Sync、接受率和 Policy Version Gap。\u003c/p\u003e\n\u003cp\u003e比较两种配置时固定模型、长度分布、Batch/Group 定义、设备和目标质量；否则提升的可能只是更短的 Response 或过滤掉了困难样本。\u003c/p\u003e\n\u003cp\u003e一个常见反例：吞吐看似提升 30%，但 Accepted Groups 数量不变而 Inflight 末尾堆积更多。它可能将排空成本推迟到了结束阶段，不是免费的收益。\u003c/p\u003e\n\u003cp\u003e实用资料：\u003ca href=\"https://verl.readthedocs.io/en/latest/perf/perf_tuning.html\"\u003everl Performance Tuning Guide\u003c/a\u003e；\u003ca href=\"https://docs.pytorch.org/docs/stable/profiler.html\"\u003ePyTorch Profiler\u003c/a\u003e。\u003c/p\u003e"},{"id":"evidence-standards","title":"怎样判断一种新方案有效","chapter":"research","summary":"论文主张、源码实现、实测结果必须分开。","recall":{"question":"论文报告 2× 吞吐，就能当作本地方案的预期值吗？","answer":"不能。必须对齐模型、硬件、负载、质量与计时口径。","spoken":"先确认对照条件，再谈收益和可复现性。"},"keywords":["papers","benchmark","reproducibility","analysis"],"cases":[],"implementations":[],"html":"\u003cp\u003e先问吞吐的分母是什么：请求数、生成 Token、被接受训练 Token，还是 RL Step；然后问用了哪些硬件、模型、序列长度、精度策略、并行拓扑。不同口径之间不能直接比较。\u003c/p\u003e\n\u003cp\u003e研究结论最好同时记录四个层次：\u003cstrong\u003e论文声称\u003c/strong\u003e（作者实验的结果）、\u003cstrong\u003e源码事实\u003c/strong\u003e（某个 Commit 的实现）、\u003cstrong\u003e推导结论\u003c/strong\u003e（在指定假设下得到的计算结果）和\u003cstrong\u003e本地测量\u003c/strong\u003e（实际复现配置与数据）。将它们混在同一段话，会导致后续技术选型越来越不可靠。\u003c/p\u003e\n\u003cp\u003e假设论文比较了 Async 与 Sync，报告有效吞吐 2×。你需要检查是否相同的 Accepted Group Size、Staleness Budget、模型质量以及最终 Drain Time；如果只报告某一阶段忙碌度，那不是同一个端到端指标。\u003c/p\u003e\n\u003cp\u003e遇到“新算法解决某类失效”的宣称，最有价值的实验通常不是再实现一个更大的 Demo，而是在最小复现中\u003cstrong\u003e刻意制造该失效\u003c/strong\u003e。例如关闭 R3 对比 Router Assignment 和 Logprob Gap，或将不等长 Micro-batch 的 Reduction 改错一行，看 Gradient 是否变化。\u003c/p\u003e\n\u003cp\u003e技术结论应保留源链接、发布/复现日期和源码版本。官网 Nightly 文档能用于解释当前设计，但不应自动等价于用户正在使用的 Release 行为。\u003c/p\u003e"}],"cases":[{"id":"ppo-clip-kl","title":"PPO Clip 看似生效，KL 仍然增大","summary":"为什么被 Clip 的样本不能保证完整策略稳定","topics":["ppo-grpo","logprob-contract"],"implementations":[],"html":"\u003cp\u003e某个训练 Batch 的 Clip Fraction 很高，直觉会认为 PPO 正在阻止 Policy 偏离 Old。但实际日志里的 KL 可能继续增长。这不矛盾：\u003cstrong\u003eClip 限制的是当前样本的特定 Surrogate 分支，而不是把整个模型的参数变化限制在某个区域\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e取 \u003cspan class=\"arithmatex\"\u003e\\(\\epsilon=0.2\\)\u003c/span\u003e、Advantage \u003cspan class=\"arithmatex\"\u003e\\(A=+2\\)\u003c/span\u003e、动作 Ratio \u003cspan class=\"arithmatex\"\u003e\\(r=1.5\\)\u003c/span\u003e：\u003c/p\u003e\n\u003cdiv class=\"arithmatex\"\u003e\\[\nJ_{\\rm clip}=\\min(1.5\\times2,\\ 1.2\\times2)=2.4.\n\\]\u003c/div\u003e\n\u003cp\u003e同一条样本继续提高 Ratio 时，局部 Surrogate 不再增加。可是其他样本、KL/Entropy 项、共享参数依然能移动这个动作的概率。\u003c/p\u003e\n\u003ch2 id=\"一个不靠训练跑分的反例\"\u003e一个不靠训练跑分的反例\u003c/h2\u003e\n\u003cp\u003eOld 分布 \u003cspan class=\"arithmatex\"\u003e\\([0.5,0.5]\\)\u003c/span\u003e、Current 分布 \u003cspan class=\"arithmatex\"\u003e\\([0.9,0.1]\\)\u003c/span\u003e。动作 A 的 Ratio 为 1.8，正 Advantage 时被 Clip；完整分布的\u003c/p\u003e\n\u003cdiv class=\"arithmatex\"\u003e\\[\nD_{\\mathrm{KL}}(\\pi_{\\rm old}\\|\\pi_{\\rm current})\n=\\tfrac12\\log\\frac{0.5}{0.9}+\\tfrac12\\log\\frac{0.5}{0.1}\n\\approx0.5108\\ {\\rm nats}.\n\\]\u003c/div\u003e\n\u003cp\u003e它并没有被 \u003cspan class=\"arithmatex\"\u003e\\(\\epsilon=0.2\\)\u003c/span\u003e 上限束缚。注意这是一个\u003cstrong\u003e数学反例\u003c/strong\u003e，不是某个具体训练器产生的实验轨迹。\u003c/p\u003e\n\u003ch2 id=\"排查顺序\"\u003e排查顺序\u003c/h2\u003e\n\u003cp\u003e先确认被监控的 KL 是哪个方向：Old→Current、Current→Reference 还是采样 Token 的近似值。再对齐 Behavior、Old、Current 的权重版本与 Token ID，最后检查 Ratio 分布、Clip Fraction 和 Policy Loss 是否采用预期的 Token/Sequence Reduction。\u003c/p\u003e\n\u003cp\u003e一个可靠的单元测试应固定正负 Advantage 与 Ratio，检查两个方向的分段梯度；另外构造上面的两动作分布，验证单样本 Clip 不蕴含全分布 KL 上界。\u003c/p\u003e\n\u003ch2 id=\"框架入口\"\u003e框架入口\u003c/h2\u003e\n\u003cp\u003everl、NeMo RL、OpenRLHF 都有实现 PPO/GRPO 相关目标的路径，但具体 Loss Type、Reduction、KL 统计口径随版本和配置不同。比较前应先固定 Commit 和参数，而不是只对比训练曲线的标签。\u003c/p\u003e\n\u003cp\u003e阅读：\u003ca href=\"https://arxiv.org/abs/1707.06347\"\u003ePPO\u003c/a\u003e · \u003ca href=\"https://arxiv.org/abs/2402.03300\"\u003eDeepSeekMath/GRPO\u003c/a\u003e · \u003ca href=\"https://arxiv.org/abs/2503.14476\"\u003eDAPO\u003c/a\u003e。\u003c/p\u003e"},{"id":"fp8-logprob-drift","title":"开启 FP8 后，Logprob 与生成长度都变了","summary":"先排除分布定义、版本和 Token，再定位精度误差","topics":["fp8-numerics","logprob-contract","moe-router"],"implementations":["te-megatron-fp8"],"html":"\u003cp\u003e观察到 FP8 Rollout 生成的 Response 比 BF16 短，同时 Learner 重算的 Logprob 与 Rollout 记录不一致。它可能来自量化误差，也可能是\u003cstrong\u003e两个引擎比较的根本不是同一个随机变量\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e一个建议的排障顺序是从最便宜的反证开始。\u003c/p\u003e\n\u003ch2 id=\"先把比较对象固定住\"\u003e先把比较对象固定住\u003c/h2\u003e\n\u003cp\u003e使用同一份权重版本、同一组 Token ID、同一段上下文、相同的 Stop/Temperature/Top-p 定义。然后分开测：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eTeacher-forced 固定 Token 时 BF16/FP8 的 Logits、Logprob 差异：验证数值路径。\u003c/li\u003e\n\u003cli\u003e使用完全相同的 Sampling 参数时，EOS/Stop 概率与 Response Length 分布：验证采样行为。\u003c/li\u003e\n\u003cli\u003e如果是 MoE，检查两边各层 Top-k Expert ID 的一致率：验证离散路由。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e第 1 步可能已经发现差异，即使没有实际重新生成任何 Response；第 2 步含有采样随机性，必须用足够样本和重复 Seed/重复实验描述分布，而不是比较一对字符串就下结论。\u003c/p\u003e\n\u003ch2 id=\"三种常见原因不能混为一谈\"\u003e三种常见原因不能混为一谈\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e概率定义\u003c/strong\u003e：服务侧记录的是经过 Temperature/Top-p 后的 Logprob，训练侧计算原始 Softmax，或者 Prompt/Response Shift 不一致。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e低精度误差\u003c/strong\u003e：不同 FP8 Recipe、Scale 更新策略、LayerNorm/Attention 精度可能造成同 Token 的概率变化。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e路由分歧\u003c/strong\u003e：同一个 Token 的 Expert Assignment 不同，导致 MoE 计算路径变化；R3 的目标是对齐这条离散选择。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"解决方案应该匹配原因\"\u003e解决方案应该匹配原因\u003c/h2\u003e\n\u003cp\u003e如果是 Token Shift，修 Mask/索引；如果是概率变换，先明确 Behavior Distribution；如果是 FP8 精度差异，则比较 Scale、Recipe 和关键层 BF16 回退；如果是 Router Disagreement，再考虑 R3 或基于路由差异的处理。\u003c/p\u003e\n\u003cp\u003eR3 不是消除所有 Logprob Gap 的按钮。FP8 也不一定提高完整 RL Step 吞吐：在 Rollout 占绝大多数耗时的场景，Learner GEMM 加速可能只改善局部指标。\u003c/p\u003e\n\u003ch2 id=\"最小实验产物\"\u003e最小实验产物\u003c/h2\u003e\n\u003cp\u003e一份表记录 \u003ccode\u003etoken_id\u003c/code\u003e、\u003ccode\u003eposition\u003c/code\u003e、\u003ccode\u003epolicy_version\u003c/code\u003e、\u003ccode\u003erollout_logprob\u003c/code\u003e、\u003ccode\u003elearner_bf16_logprob\u003c/code\u003e、\u003ccode\u003elearner_fp8_logprob\u003c/code\u003e、\u003ccode\u003eexpert_ids\u003c/code\u003e，并将 Mean/P95/P99 Gap 与 EOS 分布单独统计。没有这个分层证据，不应该直接推断哪种方案有效。\u003c/p\u003e\n\u003cp\u003e资料：\u003ca href=\"https://nvidia.github.io/TransformerEngine/examples/fp8_primer.html\"\u003eTransformerEngine FP8 Primer\u003c/a\u003e · \u003ca href=\"https://proceedings.mlr.press/v306/ma26aw.html\"\u003eR3 论文\u003c/a\u003e。\u003c/p\u003e"},{"id":"moe-router-mismatch","title":"MoE Rollout 与训练选中了不同 Expert","summary":"R3 能修复哪部分分歧，又增加什么边界","topics":["moe-router","logprob-contract"],"implementations":["nemo-router-replay"],"html":"\u003cp\u003e对于路由分数非常接近的两个 Expert，较小的精度扰动即可改变 Top-k 排序。一个简单例子：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRollout Router Score：E3=0.5001、E5=0.5000 → 选 E3。\u003c/li\u003e\n\u003cli\u003eTraining Router Score：E3=0.4999、E5=0.5000 → 选 E5。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e这只是展示离散边界的\u003cstrong\u003e构造例子\u003c/strong\u003e，不是任何特定模型的 Router 实测值。\u003c/p\u003e\n\u003ch2 id=\"需要先确认\"\u003e需要先确认\u003c/h2\u003e\n\u003cp\u003e核对同 Token 的路由是否处于同一层、同一位置、同一个权重版本与相同的 Expert ID 编码；再统计不同 Layer 的 Top-k 重合率和 Logprob Gap 的相关性。\u003c/p\u003e\n\u003cp\u003e如果采样 Temperature 不同或 Tokenizer 对不齐，即使路由完全相同，概率也可能不同。Router 不是所有 Drift 的解释。\u003c/p\u003e\n\u003ch2 id=\"解决思路\"\u003e解决思路\u003c/h2\u003e\n\u003cp\u003eR3（Rollout Routing Replay）将生成时选中的 Expert Index 传给训练侧并重放，从而对齐离散计算路径。但它增加了路由元信息、打包/拆包、与序列位置对齐以及恢复时正确继承路由状态的复杂度。\u003c/p\u003e\n\u003cp\u003e路由重放还可能改变 Router 的优化条件，因此要监控 Router Grad、Expert Load Balance，以及不同版本下的质量。另一条研究思路是根据路由分歧程度决定是否接受样本，但这也可能造成数据选择偏差。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e结论不应是“R3 更好”或“过滤更好”\u003c/strong\u003e，而是比较两者各自修复了哪类差异、丢掉了哪些数据和训练信号。\u003c/p\u003e\n\u003cp\u003e资料：\u003ca href=\"https://proceedings.mlr.press/v306/ma26aw.html\"\u003eR3\u003c/a\u003e · \u003ca href=\"https://docs.nvidia.com/nemo/rl/nightly/guides/router-replay.html\"\u003eNeMo RL Router Replay 指南\u003c/a\u003e。\u003c/p\u003e"},{"id":"rl-step-longtail","title":"Learner 快了，但 RL Step 几乎没变","summary":"用关键路径和 Amdahl 规律定优化优先级","topics":["rl-throughput","async-rollout"],"implementations":["areal-service","fsdp2-sharding"],"html":"\u003cp\u003e假设一个完全串行的训练 Step 耗时 60 秒，其中 Rollout/Reward 数据供给占 42 秒，Learner 训练占 18 秒。\u003c/p\u003e\n\u003cp\u003e将 Learner 加速两倍：\u003c/p\u003e\n\u003cdiv class=\"arithmatex\"\u003e\\[\nT_{\\mathrm{step,new}}=42+\\frac{18}{2}=51\\ {\\rm s},\\quad\nS=\\frac{60}{51}\\approx1.176.\n\\]\u003c/div\u003e\n\u003cp\u003e如果宣传“训练速度翻倍”，很可能只指 Learner 部分；整轮 RL 的改善只有约 17.6%。这属于 Amdahl 规律下的推导，不是现场 Benchmark。\u003c/p\u003e\n\u003ch2 id=\"如何定位\"\u003e如何定位\u003c/h2\u003e\n\u003cp\u003e按照实际关键路径逐阶段记录：Rollout Prefill、Decode、Tool、Verifier、筛选、Weight Sync、Train Forward/Backward、Collective、Optimizer，尤其注意批式最慢请求的 Tail Latency 与异步模式 Inflight Drain。\u003c/p\u003e\n\u003cp\u003e还需要记录有效数据产出，而不只是生成完成数。一个数据采样配置可能让 Completed Requests 增多，但被 GRPO Group 筛选后真正进入 Learner 的 Accepted Groups 没有增加。\u003c/p\u003e\n\u003ch2 id=\"方案如何选择\"\u003e方案如何选择\u003c/h2\u003e\n\u003cp\u003e如果瓶颈在推理长尾，改善 Learner FP8 可能收益有限；适合关注 Continuous Batching、Group 补投、资源分池/共享、Partial Rollout。若瓶颈在 Learner 的 GEMM/通信，才优先考虑 FP8 Recipe、TP/EP 策略、FlashAttention/Kernel Fusion。\u003c/p\u003e\n\u003cp\u003e改动前定义固定负载、固定目标质量与 GPU-hours，改动后既比较 Step/Token 吞吐，也检查 Reward、KL、Staleness 与排空成本，避免把质量变化误认为性能提升。\u003c/p\u003e\n\u003cp\u003e参考：\u003ca href=\"https://verl.readthedocs.io/en/latest/perf/perf_tuning.html\"\u003everl 性能调优\u003c/a\u003e · \u003ca href=\"https://docs.pytorch.org/docs/stable/profiler.html\"\u003ePyTorch Profiler\u003c/a\u003e。\u003c/p\u003e"},{"id":"async-group-drain","title":"Group 达标了，为什么 GPU 还在忙","summary":"Group 完整、Batch 等待与 Inflight Drain 的不同","topics":["async-rollout","rl-throughput","agent-action"],"implementations":["verl-hybridflow","slime-data-buffer"],"html":"\u003cp\u003e同一个 Prompt 的四条回答完成时间分别为 2、3、4、9 秒。Group 的 Reward/Advantage 在 9 秒之后才能按完整四样本计算。另一组可能更早收齐，为什么它一定要等这组完成？\u003c/p\u003e\n\u003cp\u003e这是\u003cstrong\u003e组内算法依赖\u003c/strong\u003e与\u003cstrong\u003e外层批等待\u003c/strong\u003e的区别。如果系统等全部 Batch 完成才统一筛选，就会人为增加等待；异步 DataSampler 可以在某个 Group 完整后立即筛选与接收。\u003c/p\u003e\n\u003ch2 id=\"三个时间点不要混\"\u003e三个时间点不要混\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e停止投新请求\u003c/strong\u003e：认为可用数据与在途预计贡献足够。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e达到目标 Accepted Groups\u003c/strong\u003e：训练数据数量已达到预设要求。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e所有 Inflight Requests 排空\u003c/strong\u003e：生成/工具调用真正都结束。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e当前设计如果没有 Abort，达到训练目标时仍可能有大量在途请求，它们必须自然完成。此时 GPU Busy Time、尾部成本不会凭空消失。\u003c/p\u003e\n\u003ch2 id=\"并发不是免费午餐\"\u003e并发不是免费午餐\u003c/h2\u003e\n\u003cp\u003e按照历史接受率补投能减少有用样本短缺的等待，也会误估接受率、增加额外请求；按先完成的 Group 筛选还可能使长尾或困难 Prompt 在最终训练数据中占比下降。\u003c/p\u003e\n\u003cp\u003e如果训练与 Rollout 同时进行，要记录真实 Behavior Policy Version；一条 Trajectory 跨 Weight Update 继续生成，可能不再对应单一版本。Partial Rollout 的恢复状态也不只是 Token Cursor，还可能包括 KV、Sampler RNG、Tool Session。\u003c/p\u003e\n\u003ch2 id=\"验证方式\"\u003e验证方式\u003c/h2\u003e\n\u003cp\u003e模拟两个 Group 的完成时间，分别记录 \u003ccode\u003eadmitted/completed/accepted/inflight/drained\u003c/code\u003e 与权重版本。核对 “Accepted 达标” 和 “Drain 完成” 是否被错误合并，再测同等质量下 GPU-hour 的实际收益。不要用一条构造时间线声称异步方案在所有负载下更快。\u003c/p\u003e\n\u003cp\u003e实现对照：\u003ca href=\"https://verl.readthedocs.io/en/latest/hybrid_flow.html\"\u003everl HybridFlow\u003c/a\u003e · \u003ca href=\"https://areal-ai.io/AReaL/en/algorithms/async.html\"\u003eAReaL 异步训练\u003c/a\u003e。\u003c/p\u003e"},{"id":"kv-oom","title":"请求增多后，KV Cache 为什么先 OOM","summary":"容量计算、前缀复用和调度策略","topics":["kv-scheduling","rl-throughput"],"implementations":["sglang-scheduler","vllm-kv"],"html":"\u003cp\u003e模型参数占用没有增加，并发一高却 OOM，通常需要单独核算\u003cstrong\u003e增长的 KV Cache\u003c/strong\u003e，而不是只看模型权重。\u003c/p\u003e\n\u003cp\u003e在常见 Attention KV 缓存定义下：\u003c/p\u003e\n\u003cdiv class=\"arithmatex\"\u003e\\[\nM_{\\mathrm{KV}}=2L_{\\mathrm{layers}}N_{\\mathrm{kvheads}}D_{\\mathrm{head}}T_{\\mathrm{cached}}b.\n\\]\u003c/div\u003e\n\u003cp\u003e例如 32 层、8 个 KV Head、HeadDim 128、BF16，每 Token 需要 128 KiB。一个 8192 Token 请求约占 1 GiB；16 个这样的请求已经需要约 16 GiB KV（忽略分配碎片、额外池和架构差异）。\u003c/p\u003e\n\u003ch2 id=\"三类问题不要混\"\u003e三类问题不要混\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e容量耗尽\u003c/strong\u003e：总活跃 Token 数确实超过了静态 KV Pool 可支持的预算。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e内存管理浪费\u003c/strong\u003e：由于分配粒度、碎片、预留策略导致可用容量低于理论上限。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e调度放大\u003c/strong\u003e：请求 Admission 太激进，Prefill/Decode 混排与缓存驱逐造成瞬时峰值。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePaged KV 的作用是改进块级管理，不创造不存在的 GPU HBM。Prefix Cache 能复用公共前缀，但命中条件、缓存生命周期和驱逐策略决定真实收益。PD 解耦又增加 KV 传输的成本。\u003c/p\u003e\n\u003ch2 id=\"必须验证\"\u003e必须验证\u003c/h2\u003e\n\u003cp\u003e至少记录请求长度分布、同时活跃 KV Token、KV Pool 使用率、缓存命中率、Eviction、TTFT/TPOT/P99。比较 SGLang 与 vLLM 时固定模型、Attention 结构、输入输出长度、Sampling 参数、硬件和缓存预算。\u003c/p\u003e\n\u003cp\u003e参考：\u003ca href=\"https://arxiv.org/abs/2309.06180\"\u003ePagedAttention\u003c/a\u003e · \u003ca href=\"https://docs.sglang.ai/advanced_features/hicache_design.html\"\u003eSGLang HiCache\u003c/a\u003e。\u003c/p\u003e"}],"implementations":[{"id":"verl-hybridflow","title":"verl / HybridFlow","framework":"verl","summary":"统一训练数据流与异构 Engine 接入的边界","topics":["ppo-grpo","async-rollout","parallel-topology"],"cases":["async-group-drain"],"html":"\u003cp\u003everl 的 HybridFlow 将 RL 的数据流/控制流与具体 Worker、不同并行策略的执行引擎组合。这个架构的价值不在于“有多少 Actor”，而是能让不同阶段使用适合自己的训练、推理和并行部署，并允许相关资源通过明确边界协作。\u003c/p\u003e\n\u003ch2 id=\"关心的数据与状态\"\u003e关心的数据与状态\u003c/h2\u003e\n\u003cp\u003e一个完整的训练周期至少涉及 Prompt、Response、Reward、Advantage、Old/Current Logprob、Policy Version、更新后的模型权重。最容易出问题的不是字段存在与否，而是\u003cstrong\u003e谁生成它、什么时候有效、是否能够跨版本重用\u003c/strong\u003e。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRollout 端负责生成，Teacher Forcing 的训练侧要对固定 Token 重算可微 Logprob。\u003c/li\u003e\n\u003cli\u003eGroup 内需要收齐有效回答才能按预定估计器计算相对优势；不同 Group 的额外等待是可优化的。\u003c/li\u003e\n\u003cli\u003eWeight Sync 与参数版本不只是性能成本，还是 Off-policy 语义的边界。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"适合与不适合\"\u003e适合与不适合\u003c/h2\u003e\n\u003cp\u003e当需要组合 Megatron/FSDP 训练、SGLang/vLLM 生成、不同 Reward/算法或试验新的 DataSampler 时，可组合的 Worker/数据流能够减少侵入业务层的改动。但这会增加数据契约、同步/异步恢复和跨 Engine Probability 对齐的复杂度。\u003c/p\u003e\n\u003cp\u003e深入代码应从本地正在使用的 verl Commit 开始：确定 Trainer 入口、Rollout Worker、DataProto/队列，以及 Weight Update 调用链。\u003cstrong\u003e不同 fork 的类名和开关可能不同，不能把上游最新 README 当成本地代码事实\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e参考：\u003ca href=\"https://github.com/verl-project/verl\"\u003everl GitHub\u003c/a\u003e · \u003ca href=\"https://arxiv.org/abs/2409.19256\"\u003eHybridFlow 论文\u003c/a\u003e。\u003c/p\u003e"},{"id":"slime-data-buffer","title":"slime 的 Data Buffer 与训推集成","framework":"slime","summary":"数据缓冲和 Megatron + SGLang 集成的架构取舍","topics":["async-rollout","agent-action"],"cases":["async-group-drain"],"html":"\u003cp\u003eslime 是面向 RL 训练的框架，公开实现强调 Megatron-LM 与 SGLang 的集成，让训练与高吞吐 Rollout 各自使用擅长的系统。Data Buffer 在这个思路中承接生成数据与 Trainer 消费之间的差异。\u003c/p\u003e\n\u003ch2 id=\"重要的不是队列-api\"\u003e重要的不是队列 API\u003c/h2\u003e\n\u003cp\u003e先问数据何时被视为可训练：请求完成并不等于 Group 完整；生成的数据也不保证一定会被过滤器接受。Data Buffer 的生命周期、版本与背压定义，会影响 GPU 是否因为无效样本空等，或因为过度补投形成大量在途余量。\u003c/p\u003e\n\u003cp\u003e对于 MoE，Megatron 与 SGLang 是不同计算路径，TP/EP、FP8 Recipe、Router Assignment 和 Logprob 语义不能仅凭模型权重名称认定一致。\u003c/p\u003e\n\u003ch2 id=\"研究框架特色的正确方式\"\u003e研究框架特色的正确方式\u003c/h2\u003e\n\u003cp\u003e把 slime 与 verl/AReaL 放在同一实验条件下对照：Rollout 与 Train 是否 Colocate、数据进入 Buffer 的条件是什么、允许的 Staleness 如何实现、何时切换权重、如何恢复中断。先比较\u003cstrong\u003e语义与资源成本\u003c/strong\u003e，再跑等质量的性能实验。\u003c/p\u003e\n\u003cp\u003e参考：\u003ca href=\"https://github.com/THUDM/slime\"\u003eTHUDM/slime\u003c/a\u003e。本页没有锁定某个版本的源码调用链，配置与 API 应以具体 Commit 为准。\u003c/p\u003e"},{"id":"areal-service","title":"AReaL 的异步服务化","framework":"AReaL","summary":"分离生成/训练/权重更新，并控制版本滞后","topics":["async-rollout","rl-throughput"],"cases":["rl-step-longtail"],"html":"\u003cp\u003eAReaL 讨论生成与训练同时推进时，训练不必停下来等待同一批 Rollout 全部完成。它采用相对独立的训练与生成服务，并通过版本与 Off-policyness 约束控制异步代价。\u003c/p\u003e\n\u003ch2 id=\"机制上最重要的边界\"\u003e机制上最重要的边界\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e生成时版本\u003c/strong\u003e：每条轨迹必须能够追溯实际采样的 Policy。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e消费时版本\u003c/strong\u003e：Trainer 可能已经做了若干次更新，因此旧数据不再严格 On-policy。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e异步预算\u003c/strong\u003e：限制能接受多旧的数据；过紧则降低供给，过松可能增加偏差。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e权重同步\u003c/strong\u003e：同步时机影响多长时间内请求仍由旧版本生成。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e这是算法与系统联合设计：提前消费完成数据提高资源利用率，但引入数据选择与 Policy Staleness 的新约束。\u003c/p\u003e\n\u003ch2 id=\"什么时候值得参考\"\u003e什么时候值得参考\u003c/h2\u003e\n\u003cp\u003e当 Rollout/Tool/Verifier 长尾严重、Learner 因同步 Batch Barrier 大量等待时，可研究独立资源池和流水线。如果 GPU 数很少、网络转移成本高，分池/异步不一定优于 Colocate。\u003c/p\u003e\n\u003cp\u003e建议用相同的有效 Group 数、质量、Token 分布与 GPU-hours 对照同步和异步；尤其要计入未完成请求的 Drain Cost。\u003c/p\u003e\n\u003cp\u003e参考：\u003ca href=\"https://github.com/inclusionAI/AReaL\"\u003eAReaL 项目\u003c/a\u003e · \u003ca href=\"https://areal-ai.io/AReaL/en/algorithms/async.html\"\u003e异步算法文档\u003c/a\u003e。\u003c/p\u003e"},{"id":"te-megatron-fp8","title":"TransformerEngine / Megatron FP8","framework":"TransformerEngine · Megatron Core","summary":"不同 FP8 Recipe、Scale 及训练精度的实现入口","topics":["fp8-numerics","parallel-topology"],"cases":["fp8-logprob-drift"],"html":"\u003cp\u003eFP8 加速的前提是模型包含适合低精度 Kernel 的计算，并且损失在训练目标上可以接受。TransformerEngine 提供 FP8 Recipe 与缩放管理，Megatron Core 在 Transformer Block 与并行训练中集成了相应算子。\u003c/p\u003e\n\u003ch2 id=\"与性能同等重要的数值控制\"\u003e与性能同等重要的数值控制\u003c/h2\u003e\n\u003cp\u003e传统 FP8 E4M3/E5M2、Delayed Scaling、Current Scaling、Block Scaling 的量化动态范围与 Scale 更新方式不同。它们也并非所有 GPU 架构都支持相同优化路径。\u003c/p\u003e\n\u003cp\u003e尤其在 RL 中，Policy Gradient 依赖采样动作的 Logprob。就算 GEMM 层的误差很小，在 EOS、Top-k Expert 选择、长序列 Logprob 累加等位置可能产生可见差异。这是“训推是否使用同一 FP8 格式”之外还必须验证的因素。\u003c/p\u003e\n\u003ch2 id=\"实际工程审查\"\u003e实际工程审查\u003c/h2\u003e\n\u003cp\u003e固定模型权重、Seed、Token ID、输入长度与训练精度配置，收集 BF16/FP8 的 Logits/Logprob 差异；分别监控 NaN、梯度范数、Router Assignment 和验证质量。\u003c/p\u003e\n\u003cp\u003e不同 TP/EP 组合改变 Scale、Kernel 的 shape 与通信调度，也可能改变性能。报告吞吐必须给出硬件、模型、上下文、Batch 和实现版本。不要引用浮点理论 TFLOPs 直接声称 End-to-end RL 提速。\u003c/p\u003e\n\u003cp\u003e资料：\u003ca href=\"https://nvidia.github.io/TransformerEngine/examples/fp8_primer.html\"\u003eTransformerEngine FP8 Primer\u003c/a\u003e · \u003ca href=\"https://docs.nvidia.com/megatron-core/developer-guide/nightly/user-guide/features/low_precision_training.html\"\u003eMegatron Core Low Precision Training\u003c/a\u003e。\u003c/p\u003e"},{"id":"nemo-router-replay","title":"NeMo RL Router Replay（R3）","framework":"NeMo RL","summary":"记录并重放 Expert Index 的集成边界与验证指标","topics":["moe-router","logprob-contract"],"cases":["moe-router-mismatch"],"html":"\u003cp\u003eR3 的核心是把 MoE Rollout 使用过的离散 Expert Assignment 记录下来，并在训练侧重放，以减少两套执行引擎在同 Token 上走不同 Expert 的概率分布偏差。\u003c/p\u003e\n\u003ch2 id=\"设计要点\"\u003e设计要点\u003c/h2\u003e\n\u003cp\u003eRouter Replay 改变的是\u003cstrong\u003e路由选择一致性\u003c/strong\u003e，不应把它描述成冻结 Router 的全部梯度或强制两边 Logprob 完全相等。Router Meta 必须与 Token Position、Layer、Expert ID 编码正确对应，尤其要处理 Packed Sequence、并行切片、版本改变和旧轨迹恢复。\u003c/p\u003e\n\u003cp\u003e如果信息缺失，要明确 Fallback：跳过这条轨迹、使用当前路由，或拒绝整个组，都会改变算法与数据分布。不能把路由对齐率的提高直接当成 Reward 提高。\u003c/p\u003e\n\u003ch2 id=\"适用条件与代价\"\u003e适用条件与代价\u003c/h2\u003e\n\u003cp\u003e跨 Engine、跨精度且 Top-k Router 选择高度敏感时，重放离散路由有机会显著缩小误差。但它需要携带和存储额外路由元信息，可能改变训练侧 Router 的优化方式，并增加 Replay 的实现复杂度。\u003c/p\u003e\n\u003cp\u003e建议检查 Layer-wise Routing Agreement、Per-token Logprob Gap、Router Grad 与模型质量，而不是只看总 KL。\u003c/p\u003e\n\u003cp\u003e资料：\u003ca href=\"https://proceedings.mlr.press/v306/ma26aw.html\"\u003eR3 论文\u003c/a\u003e · \u003ca href=\"https://docs.nvidia.com/nemo/rl/nightly/guides/router-replay.html\"\u003eNeMo RL Router Replay Guide\u003c/a\u003e。\u003c/p\u003e"},{"id":"sglang-scheduler","title":"SGLang 的 RadixAttention 与调度","framework":"SGLang","summary":"Prefix Cache、请求调度及 KV 生命周期","topics":["kv-scheduling","async-rollout"],"cases":["kv-oom"],"html":"\u003cp\u003eSGLang 的重要设计包括前缀缓存 RadixAttention、请求调度和高吞吐生成。它们解决不同的问题：Prefix Cache 复用共有前缀的 KV；Scheduler 决定请求何时执行 Prefill/Decode；KV 内存管理决定可用容量和驱逐行为。\u003c/p\u003e\n\u003ch2 id=\"什么时候-prefix-cache-有用\"\u003e什么时候 Prefix Cache 有用\u003c/h2\u003e\n\u003cp\u003e一批请求具有很长的相同 System Prompt 或 Agent History 时，共享前缀有机会减少重复 Prefill。但只要 Token 前缀不同，缓存命中可能下降；缓存空间和 KV 的占用、驱逐策略也会反过来影响实际并发。\u003c/p\u003e\n\u003cp\u003e训练场景里，如果 Sampling Temperature/Top-p、MoE Router、FP8 Recipe 与 Learner 不一致，服务侧的较好吞吐不能自动等价于合法 RL 数据供给。\u003c/p\u003e\n\u003ch2 id=\"如何比较实现\"\u003e如何比较实现\u003c/h2\u003e\n\u003cp\u003e与 vLLM/TensorRT-LLM 对照时，应固定 Model/Tokenizer、输入输出长度分布、请求到达率、TP/EP、KV Budget 与 Sampling 参数。至少同时报告 TTFT、TPOT、Throughput 和 P99，关注 Queueing 与 Prefix Cache Hit Rate 的变化。\u003c/p\u003e\n\u003cp\u003e资料：\u003ca href=\"https://github.com/sgl-project/sglang\"\u003eSGLang GitHub\u003c/a\u003e · \u003ca href=\"https://docs.sglang.ai/\"\u003eSGLang Documentation\u003c/a\u003e · \u003ca href=\"https://arxiv.org/abs/2312.07104\"\u003eRadixAttention 论文背景\u003c/a\u003e。\u003c/p\u003e"},{"id":"fsdp2-sharding","title":"FSDP2 的参数生命周期","framework":"PyTorch FSDP2","summary":"DTensor 分片、All-gather、Reduce-scatter 与显存峰值","topics":["parallel-topology","rl-throughput"],"cases":["rl-step-longtail"],"html":"\u003cp\u003eFSDP2 通过 DTensor 对参数沿指定 Mesh 分片，在需要计算的时间点执行 All-gather，反向后可 Reduce-scatter Gradient。这种方案降低了常驻参数和优化器状态成本，但计算期间仍需要完整计算视图和中间 Activation。\u003c/p\u003e\n\u003ch2 id=\"典型误解\"\u003e典型误解\u003c/h2\u003e\n\u003cp\u003e“参数只占 1/N 显存”不等于“峰值显存也只剩 1/N”。Activation、临时 All-gather Buffer、Comm Bucket、Allocator 碎片都可能成为 OOM 的真正原因。\u003c/p\u003e\n\u003cp\u003e与 Megatron Tensor Parallel 相比，FSDP2 主要关心分片参数的生命周期；TP 将算子本身的计算沿 Tensor 维度切开，通常还需相应的 Collective。两者可以组合，并非按框架名二选一。\u003c/p\u003e\n\u003ch2 id=\"一个有效实验\"\u003e一个有效实验\u003c/h2\u003e\n\u003cp\u003e固定相同模型、Micro-batch 与 Sequence Length，记录峰值 HBM 和 All-gather/Reduce-scatter Timeline，再切换不同 Shard Placement 与 Activation Checkpointing。比较前同时锁定 Optimizer State DType 与 Param/Grad DType，否则显存对照不公平。\u003c/p\u003e\n\u003cp\u003e参考：\u003ca href=\"https://docs.pytorch.org/docs/stable/distributed.fsdp.fully_shard.html\"\u003ePyTorch fully_shard\u003c/a\u003e。\u003c/p\u003e"},{"id":"vllm-kv","title":"vLLM 的 PagedAttention","framework":"vLLM","summary":"KV Block 管理与分批推理的边界","topics":["kv-scheduling"],"cases":["kv-oom"],"html":"\u003cp\u003evLLM 的 PagedAttention 将 KV Cache 分为固定大小的 Block，并通过映射管理逻辑 Token 序列与物理 KV Block 的关系。这样可以减少连续分配与预留带来的浪费，并支持灵活的复用/管理方式。\u003c/p\u003e\n\u003cp\u003e它改变的是\u003cstrong\u003e如何分配和引用 KV 内存\u003c/strong\u003e，并没有降低每个 Token 的 K/V 向量的数学大小。长上下文、多并发仍有容量上限。\u003c/p\u003e\n\u003cp\u003e例如 32 Layer、8 KV Heads、HeadDim=128、BF16，理论上每 Token KV 约为 128 KiB；如果缓存 8K Token，单请求就约需 1 GiB（忽略额外管理开销）。请求数、长度分布和 Prefix Cache 命中率决定实际压力。\u003c/p\u003e\n\u003cp\u003e与 SGLang 的 RadixAttention 对照时，先分清 Paged KV、Prefix Cache、Continuous Batching 不是同一类优化。需用固定负载比较 TTFT/TPOT/Throughput/P99，而不只是查看一个排行榜。\u003c/p\u003e\n\u003cp\u003e资料：\u003ca href=\"https://arxiv.org/abs/2309.06180\"\u003ePagedAttention\u003c/a\u003e · \u003ca href=\"https://docs.vllm.ai/\"\u003evLLM 文档\u003c/a\u003e 。\u003c/p\u003e"}],"releases":[{"date":"2026-10-27","kind":"topic","id":"ppo-grpo"},{"date":"2026-10-27","kind":"case","id":"fp8-logprob-drift"},{"date":"2026-10-27","kind":"implementation","id":"areal-service"}]}</script>
  <script>"use strict";
/* The public knowledge reader has no network writes and stores no user data.
 */
(function () {
  const raw = JSON.parse(document.getElementById("knowledge-data").textContent);
  if (raw.schema !== "rl-infra-knowledge-v1") throw new Error("Invalid knowledge catalog");
  const $ = id => document.getElementById(id);
  const types = {
    topic: {key:"topics",label:"基础知识",prefix:"topic"},
    case: {key:"cases",label:"工程问题",prefix:"case"},
    implementation: {key:"implementations",label:"框架实现",prefix:"implementation"}
  };
  const pages = [];
  const indexed = new Map();
  for (const [type, info] of Object.entries(types)) {
    for (const item of raw[info.key]) {
      const page = {...item,type};
      const lookupKey = type+":"+page.id;
      if (indexed.has(lookupKey)) throw new Error("Duplicate ID "+lookupKey);
      indexed.set(lookupKey,page);pages.push(page);
    }
  }
  const chapters = new Map(raw.chapters.map(c=>[c.id,c]));
  let filter = "all", chapter = "", search = "", savedLanding = "";
  const params = ()=>new URLSearchParams(location.hash.replace(/^#/,""));
  const href = (type,id)=>"#"+type+"="+encodeURIComponent(id);
  function el(tag, cls, txt) {
    const out = document.createElement(tag);
    if (cls) out.className=cls;
    if (txt != null) out.textContent=txt;
    return out;
  }
  function sectionName(page) {
    return page.type==="topic"
      ? (chapters.get(page.chapter)?.title || "基础知识")
      : (page.type==="case" ? "现象与排查" : page.framework);
  }
  function relatedItems(page) {
    const targets = [];
    if (page.type==="topic") {
      (page.cases || []).forEach(id=>targets.push({type:"case",id}));
      (page.implementations || []).forEach(id=>targets.push({type:"implementation",id}));
    } else if (page.type==="case") {
      (page.topics || []).forEach(id=>targets.push({type:"topic",id}));
      (page.implementations || []).forEach(id=>targets.push({type:"implementation",id}));
    } else {
      (page.topics || []).forEach(id=>targets.push({type:"topic",id}));
      (page.cases || []).forEach(id=>targets.push({type:"case",id}));
    }
    return targets.map(p=>indexed.get(p.type+":"+p.id)).filter(Boolean);
  }
  function renderChapters() {
    const nav = $("chapter-list");
    nav.replaceChildren();
    for (const c of raw.chapters) {
      const a = el("a","chapter-choice",c.title);
      a.href = "#chapter="+c.id;
      a.dataset.chapter = c.id;
      nav.appendChild(a);
    }
  }
  function updateCurrent() {
    $("chapter-list").querySelectorAll("a").forEach(a=>
      a.classList.toggle("active",chapter!==""&&a.dataset.chapter===chapter));
    document.querySelectorAll("[data-filter]").forEach(b=>
      b.setAttribute("aria-pressed",String(b.dataset.filter===filter)));
    document.querySelectorAll("[data-nav]").forEach(a=>
      a.setAttribute("aria-current",String(a.dataset.nav===filter)));
  }
  const plainCache=new Map();
  function plainText(html) {
    if (plainCache.has(html)) return plainCache.get(html);
    const box=document.createElement("div");
    box.innerHTML=html;
    const text=(box.textContent||"").replace(/\s+/g," ");
    plainCache.set(html,text);
    return text;
  }
  function match(page) {
    if (filter!=="all" && page.type!==filter) return false;
    if (chapter && (page.type!=="topic" || page.chapter!==chapter)) return false;
    const words=search.toLocaleLowerCase().normalize("NFKC").trim().split(/\s+/).filter(Boolean);
    if (!words.length) return true;
    const corpus=[page.title,page.summary,page.framework||"",
      (page.keywords||[]).join(" "),plainText(page.html||"")].join(" ")
      .normalize("NFKC").toLocaleLowerCase();
    return words.every(w=>corpus.includes(w));
  }
  function renderListing() {
    const matches=pages.filter(match);
    const list=$("item-list");list.replaceChildren();
    if (chapter) {
      const c=chapters.get(chapter);
      $("landing").querySelector("h1").textContent=c?.title||"知识目录";
      $("landing").querySelector(".intro").textContent=c?.description||"";
      $("landing").querySelector(".overline").textContent="CHAPTER / "+chapter.toUpperCase();
    } else if (search) {
      $("landing").querySelector("h1").textContent="搜索结果";
      $("landing").querySelector(".intro").textContent="输入关键词即可查找基础解释、案例和框架实现。";
      $("landing").querySelector(".overline").textContent="SEARCH";
    } else {
      $("landing").querySelector("h1").textContent="从原理到工程决策";
      $("landing").querySelector(".intro").textContent=
        "理解核心机制，找到实际问题的原因，再看主流框架如何实现。内容按知识关联组织，随时可以从任何一处进入。";
      $("landing").querySelector(".overline").textContent="RL / TRAINING SYSTEMS";
    }
    $("results-label").textContent=matches.length+" 篇";
    if (!matches.length) list.append(el("p","no-results","没有匹配内容。试试更短的关键词。"));
    for (const page of matches) {
      const a=el("a","item");a.href=href(page.type,page.id);
      a.append(el("div","item-meta",types[page.type].label+" / "+sectionName(page)));
      a.append(el("h2","item-title",page.title));
      a.append(el("p","item-description",page.summary));
      const n=relatedItems(page).length;
      if (n>0) a.append(el("div","item-related","关联 "+n+" 篇"));
      list.append(a);
    }
    updateCurrent();
  }
  function renderDetail(type, id) {
    const page=indexed.get(type+":"+id);
    if (!page) {navigateHome();return;}
    $("landing").hidden=true;$("detail").hidden=false;
    $("detail-context").textContent=types[type].label+" / "+sectionName(page);
    $("detail-title").textContent=page.title;
    $("detail-summary").textContent=page.summary;
    $("article").innerHTML=page.html || "<p>暂无正文，请查看关联内容。</p>";
    const recall=$("recall");recall.replaceChildren();
    recall.hidden=!(type==="topic" && page.recall?.question);
    if (!recall.hidden) {
      recall.append(el("p","recall-label","想一想 · 不用写答案"));
      recall.append(el("p","question",page.recall.question));
      const details=el("details");
      details.append(el("summary","","看解释"));
      details.append(el("p","answer",page.recall.answer));
      if (page.recall.spoken) details.append(el("p","spoken",page.recall.spoken));
      recall.append(details);
    }
    const related=relatedItems(page), box=$("related-list");box.replaceChildren();
    $("related").hidden=related.length===0;
    for (const target of related) {
      const a=el("a","related-link");a.href=href(target.type,target.id);
      a.append(el("span","related-type",types[target.type].label));
      a.append(el("span","",target.title));
      box.append(a);
    }
    document.title=page.title+" · RL Infra";
    if (window.MathJax?.typesetPromise) window.MathJax.typesetPromise([$("article"),recall]).catch(()=>{});
    updateCurrent();
  }
  function navigateHome() {
    window.location.hash=savedLanding||"";
    if (!location.hash) render();
  }
  function closeMenu() {
    $("side").classList.remove("show");
    $("menu-toggle").setAttribute("aria-expanded","false");
  }
  function render() {
    const p=params();
    closeMenu();
    let type=null,id=null;
    for (const candidate of Object.keys(types)) {
      if (p.has(candidate)) {type=candidate;id=p.get(candidate);break;}
    }
    if (type) {
      if (!indexed.has(type+":"+id)) {history.replaceState(null,"",location.pathname);return render();}
      renderDetail(type,id);
    } else {
      $("detail").hidden=true;$("landing").hidden=false;
      chapter=chapters.has(p.get("chapter"))?p.get("chapter"):"";
      filter=types[p.get("category")]?p.get("category"):"all";
      savedLanding=location.hash;
      renderListing();
      document.title="RL Infra · 技术知识库";
    }
    window.scrollTo({top:0,behavior:"instant"});
  }
  renderChapters();
  $("search").addEventListener("input",function(){
    search=this.value.trim();
    if (chapter) { chapter=""; history.replaceState(null,"",location.pathname); }
    if (!$("landing").hidden) renderListing();
    else {
      location.hash=search ? "#category=all" : (savedLanding||"");
      render();
    }
  });
  document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{
    filter=b.dataset.filter;
    chapter="";
    window.location.hash=filter==="all"?"":"#category="+filter;
    if (!location.hash) renderListing();
  }));
  $("back").addEventListener("click",navigateHome);
  $("home-link").addEventListener("click",()=>{
    search="";$("search").value="";filter="all";chapter="";
  });
  $("menu-toggle").addEventListener("click",()=>{
    const open=$("side").classList.toggle("show");
    $("menu-toggle").setAttribute("aria-expanded",String(open));
  });
  $("chapter-list").addEventListener("click",()=>{
    closeMenu();
    if (!$("detail").hidden) { filter="all"; }
  });
  document.addEventListener("keydown",e=>{
    if (e.key==="/" && !["INPUT","TEXTAREA"].includes(document.activeElement?.tagName)
       && !e.altKey && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();$("search").focus();
    }
    if (e.key==="Escape" && document.activeElement===$("search")) $("search").blur();
  });
  window.addEventListener("hashchange",render);
  render();
})();</script>

:"debug","level":"基础","course_day":87,"topic":"rl-throughput","brief":"局部action更像正确格式或更常命中工具，并不保证全局规划、停止时机和错误恢复改善。可能出现过度调用、缺少subgoal切换或前序错误累积。应检查成功轨迹长度、冗余tool比例、错误后恢复率和turn-level value，定位局部指标与终局目标的断裂。","deep":"工具调用准确率通常只衡量局部动作，例如格式或参数是否正确。任务成功还需要选择有用的动作、利用结果并及时结束。局部指标改善但任务退步，说明两者之间的连接需要检查。例如模型每次都能正确调用搜索接口，却对同一个关键词搜索 20 次，不整理证据也不提交答案。工具格式准确率很好，任务成功率却很差。应分别统计参数合法、工具执行成功、结果被后续使用和最终任务完成。它们是不同层次的指标。局部奖励若只鼓励“调用成功”，可能正是重复调用的原因，需要检查奖励落点而非仅改善解析器。","followup":"Agent评测必须同时覆盖局部动作质量与episode outcome，不能用一方替代另一方。"},{"id":103,"code":"Q103","question":"OOM 只发生在部分 step，如何区分碎片化与数据长尾？","doc_title":"OOM 只发生在部分 step，如何区分碎片化与数据长尾？","chapter":"故障与系统设计","domain":"debug","level":"基础","course_day":87,"topic":"rl-throughput","brief":"记录触发step的sequence length、token packing、expert load和各类buffer峰值，并结合CUDA memory snapshot查看reserved/allocated与大块空闲情况。若峰值随特定长样本或重采样轮次出现，优先是数据/生命周期；若allocated不高但无法找到连续块，才更像碎片化。还要排查Python对象持有CUDA tensor导致的跨step泄漏。","deep":"先把显存峰值与该步的长度、打包方式和临时缓冲关联起来。偶发 OOM 既可能是合法长样本超过容量，也可能是对象未释放或分配器空间难以复用，需要分别找证据。allocated 表示仍被 tensor 使用的显存，reserved 包含分配器保留的可复用空间。reserved 大于 allocated很常见，本身不能证明碎片化。设备上还可能有其他进程和非框架管理的内存。先比较每个 step 结束后、丢弃临时引用后的 allocated 是否持续增长。持续增长更像对象生命周期问题；只在长序列出现尖峰，更像工作量问题；再结合 memory snapshot 观察空闲块形状，才有依据判断碎片化。","followup":"expandable_segments只能缓解部分分配模式，不能代替定位真实生命周期。"},{"id":104,"code":"Q104","question":"如何回答一个没有做过的 RL 系统问题？","doc_title":"如何回答一个没有做过的 RL 系统问题？","chapter":"故障与系统设计","domain":"debug","level":"基础","course_day":87,"topic":"rl-throughput","brief":"先声明证据边界，再从已知不变量推导：数据由谁产生、哪个policy version、状态如何保存、失败如何恢复、指标怎样验证。提出一个最小实验区分主要假设，并说明哪些结论需要源码或trace确认。面试官通常接受有边界的推理，不接受把经验猜测说成生产事实。","deep":"先区分已经知道的必要条件与尚未确认的框架实现。可以用数据来源、概率定义和状态恢复规则推导可验证的设计要求，但不能把推导当作某个系统实际采用的方法。例如被问及某框架如何热更新权重，但没有读过源码，可以先说明未知的是具体实现，再给可验证的必要条件：所有分片加载完成后才能激活新版本，请求需明确归属，旧 KV 要处理。随后给验证方案：故意延迟一个分片加载，观察系统是否错误接受新版本请求。这样回答展示的是可检验推理，而不是把未见过的框架机制编成事实。","followup":"用“代码可以确认/从机制推测/需要实验验证”三层表达，能显著提高可信度。"},{"id":105,"code":"Q105","question":"discount factor γ 的统计含义是什么？","doc_title":"discount factor γ 的统计含义是什么？","chapter":"估计器进阶","domain":"policy","level":"进阶","course_day":5,"topic":"policy-gradient","brief":"γ既编码时间偏好，也决定return的有效时间尺度。无限时域中有效跨度约为1/(1-γ)，γ越大，远期噪声进入当前梯度越多。","deep":"折扣因子 γ 决定较远的奖励在当前值多少。它可以表达对更早获得收益的偏好，也能让某些无限时域总和有限。对于有限任务，是否折扣仍应由目标决定，而不是机械沿用默认值。若 γ=0.9，十步以后的 1 分现在只折算成约 0.349 分；γ=1 时仍为 1 分。因此 γ 直接决定模型是否更偏好较早得到奖励。无限重复的单位奖励之和为 1/(1−γ)，常被用来粗略描述关注未来的尺度；有限 episode 的实际跨度还受最大步数影响。如果业务只关心最后是否完成，贸然减小 γ 会引入额外的时间偏好。","followup":"比较不同γ时必须同时固定episode截断、reward尺度和bootstrap规则。 不要只回答‘未来奖励折扣’，还要说明它改变bias-variance与任务目标。"},{"id":106,"code":"Q106","question":"Monte Carlo return 与 TD target 怎么选？","doc_title":"Monte Carlo return 与 TD target 怎么选？","chapter":"估计器进阶","domain":"policy","level":"进阶","course_day":5,"topic":"policy-gradient","brief":"MC使用完整未来回报，偏差低但方差高；TD用r+γV(s') bootstrap，方差低但引入critic偏差。GAE是在两者之间连续插值。","deep":"Monte Carlo 用实际观察到的完整后续回报作标签，TD 用一步反馈加下一状态的预测值作标签。前者不需要预测尚未发生的部分，后者能够更早更新，但会继承价值模型的误差。Monte Carlo 指等这条轨迹真正结束后，用实际后续分数计算回报；TD 则走一步后就用下一状态的价值预测补足未来。假设当前无奖励，下一状态的 critic 预测为 0.6，TD 可以立即构造约 0.6 的目标；但这次最后可能失败，完整回报为 0。前者更及时、依赖预测，后者更贴近本次真实结果、受偶然性影响更大。不是任意环境都能拿到完整回报。","followup":"短episode、可靠终局reward可偏向MC；长时域且中间状态价值可学时更依赖TD/GAE。 必须区分环境terminal与人为timeout，否则bootstrap会写错。"},{"id":107,"code":"Q107","question":"为什么 advantage 只需要相对尺度，绝对值仍会影响训练？","doc_title":"为什么 advantage 只需要相对尺度，绝对值仍会影响训练？","chapter":"估计器进阶","domain":"policy","level":"进阶","course_day":5,"topic":"policy-gradient","brief":"理想policy gradient只关心advantage的符号和相对权重，但有限batch、clipping、optimizer与gradient clipping都会让整体尺度影响实际步长。","deep":"优势的正负决定通常应加强还是减弱某个选择，绝对大小决定这条样本的推动力度。只保持排序不保证训练相同，因为优化器、裁剪和其他损失会对不同数值尺度作出不同响应。“方差”描述重复抽样后估计值的波动，尺度则描述数值整体有多大。把同批所有 advantage 乘 10，在没有裁剪的普通梯度下降里，相当于把这部分梯度放大 10。但 Adam 会用历史梯度平方调整步长，梯度裁剪会限制总范数，KL 项又未必同乘 10，所以实际更新不一定简单放大。验证尺度变化应比较最终参数增量，而非只观察归一化后的均值和标准差。","followup":"记录raw advantage、normalized advantage、grad norm和clip fraction，不能只看归一化后的分布。 ‘归一化不改变方向’只在线性、无clip且全batch条件下近似成立。"},{"id":108,"code":"Q108","question":"policy gradient 的方差主要来自哪里？","doc_title":"policy gradient 的方差主要来自哪里？","chapter":"估计器进阶","domain":"policy","level":"进阶","course_day":5,"topic":"policy-gradient","brief":"主要来自动作采样、环境随机性、prompt难度、稀疏终局reward和长时域credit assignment。多样本baseline只能消掉部分prompt级难度。","deep":"策略梯度的波动可来自问题难度、动作随机采样、环境随机结果和奖励测量噪声。先识别主要来源，才能判断增加样本、改善参照值或改进反馈哪一种办法更有效。可以用重复实验把来源拆开：固定 prompt、固定模型，先在确定性环境中只改变采样随机种子，观察奖励波动；再固定同一动作序列，改变环境种子，观察外部随机性。若不同问题之间差异最大，题内 baseline 更有帮助；若同题的成功本来就极偶然，单纯减均值不会创造稳定信号。这里的诊断目的是知道增加采样、改善奖励还是学习价值预测，哪一项更可能有效。","followup":"按prompt、sequence length、reward source和时间步切片方差，定位是数据还是估计器问题。 不能把所有高方差都归因于batch小。"},{"id":109,"code":"Q109","question":"on-policy、off-policy 和 near-policy 如何严格区分？","doc_title":"on-policy、off-policy 和 near-policy 如何严格区分？","chapter":"估计器进阶","domain":"policy","level":"进阶","course_day":5,"topic":"policy-gradient","brief":"on-policy数据由被优化的同一策略产生；off-policy来自不同behavior policy；near-policy是工程术语，表示分布差异受控但并非严格同一。","deep":"on-policy 讨论数据是否来自正在优化的策略，off-policy 表示来源不同。实际 PPO 会在生成一批数据后更新多次，因此算法分类与某一次更新时的数据状态需要分开讨论。near-policy 只是差异较小的工程描述。在一次同步 PPO 采样刚完成时，数据与采样模型一致；第一次更新以后，同一批数据相对当前参数已经旧了，但整个算法仍常被归类为 on-policy 算法。这是算法分类与某次更新的数据状态之间的区别。near-policy 通常只是工程表述，表示差异受到限制，没有统一数学阈值。使用这个词时应补充限制方式，例如版本差不超过两次发布，且概率比高分位数不超过实验设定范围。","followup":"用policy_version、behavior_log_prob和current_log_prob定义可观测差异，而不是按系统名称判断。 异步系统即使只落后一步也已经不是严格on-policy。"},{"id":110,"code":"Q110","question":"importance sampling 为什么可能方差爆炸？","doc_title":"importance sampling 为什么可能方差爆炸？","chapter":"估计器进阶","domain":"policy","level":"进阶","course_day":5,"topic":"policy-gradient","brief":"trajectory ratio是多个action ratio的乘积，长度增加后重尾迅速放大；token级ratio也会被低概率token主导。","deep":"重新加权依赖目标概率与行为概率的比值。一个动作在行为策略下极少出现、在目标策略下却很重要时，一旦采到就获得巨大权重；是否偶然采到它，会使估计在不同批次间剧烈波动。若 100 条样本中 99 条权重接近 1，另一条为 1000，最终更新会主要由那一条决定。换一次采样是否碰到它，梯度就会差很多，这就是高方差的直观含义。直接把它裁成 2 可以减小波动，但此时不再按原来的分布校正。可同时记录裁剪前后的权重和被裁样本类别，检查是不是某类稀少但重要的任务被长期压低贡献。","followup":"在log-space统计ratio的p50/p95/p99、ESS和按长度切片的尾部。 clipping降低方差但引入偏差，不能再声称估计无偏。"},{"id":111,"code":"Q111","question":"effective sample size 在 RL 中怎么用？","doc_title":"effective sample size 在 RL 中怎么用？","chapter":"估计器进阶","domain":"policy","level":"进阶","course_day":5,"topic":"policy-gradient","brief":"ESS近似衡量importance weights集中度，常写为(Σw)^2/Σw²。ESS低说明少量样本主导更新。","deep":"有效样本量 ESS 在这里用于描述非负权重是否集中在少量样本上。名义上有很多样本，如果几乎所有权重都由一条承担，加权结果仍像只观察了一条。这个数只是一种权重诊断。ESS 常按 (权重之和)²/权重平方和估算。四个权重全为 1 时 ESS=4；若为 [100,1,1,1]，则 ESS 约为 1.06，说明加权平均几乎由一个样本决定。这个公式适用于非负的重要性权重，不能直接把有正负号的 advantage 填进去。它也不检查答案是否正确、样本是否重复，因此只能作为权重集中度诊断，不能取代质量评价。","followup":"按batch、prompt group和policy staleness分别统计，避免全局均值掩盖局部退化。 ESS只是权重诊断，不直接等价于样本质量。"},{"id":112,"code":"Q112","question":"为什么 reward scaling 会改变最优策略附近的训练行为？","doc_title":"为什么 reward scaling 会改变最优策略附近的训练行为？","chapter":"估计器进阶","domain":"policy","level":"进阶","course_day":5,"topic":"policy-gradient","brief":"纯期望最大化对正比例缩放不改最优解，但KL、entropy bonus、clipping与optimizer超参未同比缩放时，相对约束被改变。","deep":"奖励整体放大，会放大它相对于其他目标项的作用。纯粹将一个理想奖励目标乘以正常数不改变其最优策略，但加入固定 KL 系数、实际优化器和裁剪后，训练过程通常不会自动保持不变。若目标为任务奖励减 β 倍 KL，原奖励从 0 到 1 变成 0 到 100，而 β 不变，相当于相对削弱了 100 倍的 KL约束。原来不划算的偏移现在可能变得划算。即使同步调整 β 保持理论目标比例一致，学习率、优化器历史和梯度裁剪也会影响实际轨迹。换奖励版本后，应先固定一批回答，比较各分量的数值范围，再决定哪些超参需要重新标定。","followup":"更换RM或verifier版本后重新校准reward、β、学习率和梯度尺度。 不要说reward乘常数完全等价，工程目标通常包含多个项。"},{"id":113,"code":"Q113","question":"终止状态与截断状态的 value target 有什么区别？","doc_title":"终止状态与截断状态的 value target 有什么区别？","chapter":"估计器进阶","domain":"policy","level":"进阶","course_day":5,"topic":"policy-gradient","brief":"真正terminal后未来价值为0；因max_steps、超时或系统中断造成的truncation未必终止MDP，应根据可续状态bootstrap。","deep":"真正终止表示任务定义中已无后续收益；人为截断表示这次采集先停下来，但任务可能还可继续。后一种情况可以需要预测尚未收集的未来回报。是否补未来，必须依据任务含义而不是字段名称。terminated 表示任务本身结束，例如已完成或进入不可恢复失败；truncated 表示这次采集被外部截断。若仅因计算预算暂停，但环境还能继续，未来回报不应自动设为 0。反过来，如果任务定义本来就是“必须在 20 步内完成”，到 20 步可能是真正的有限时域终点。此时剩余预算也应进入状态。不能只看字段叫 timeout，就一律保留或清零价值预测。","followup":"数据中分开记录terminated、truncated和failure_reason。 把timeout一律当terminal会系统性低估长任务价值。"},{"id":114,"code":"Q114","question":"如何判断一个 baseline 是否发生 leakage？","doc_title":"如何判断一个 baseline 是否发生 leakage？","chapter":"估计器进阶","domain":"policy","level":"进阶","course_day":5,"topic":"policy-gradient","brief":"若baseline使用了当前action、未来不可用信息或由答案正确性直接构造，就可能泄漏目标并改变估计。","deep":"合法 baseline 可以用历史轨迹的未来回报作监督来训练 critic；这本身不算泄漏，因为推断 baseline 时critic 仍只读取当前可见状态。要防的是把本次已经发生的动作结果直接作为本次 baseline 的输入。例如当前选择 A 会得 1、B 会得 0，若 baseline 直接等于本次最终 reward，所有 advantage 都变成 0，学习信号被消掉。检查应区分 critic 的训练标签和策略更新时实际读取的特征。","followup":"做action置换、未来字段屏蔽和因果时间边界单测。 训练时可见不等于部署决策时可见。"},{"id":115,"code":"Q115","question":"PPO ratio 应该基于哪个 log-prob？","doc_title":"PPO ratio 应该基于哪个 log-prob？","chapter":"PPO 实现","domain":"policy","level":"进阶","course_day":6,"topic":"ppo-grpo","brief":"分母必须是实际产生该token的behavior log-prob，分子是当前actor对同一token、同一上下文的log-prob。","deep":"标准同步 PPO 的分母是生成这批数据的 old policy 概率。分子是当前 actor 对同一 token 和同一历史的概率，例如从 0.2 变到 0.24，ratio 就是 1.2。异步解耦实现可能另存 behavior、训练起点 old 和 reference 三种概率。此时一项负责采样校正，另一项负责近端裁剪，不能把所有分母都强改成 behavior。应逐项写出被估计的目标和使用的分布，核对每个 detach 的位置。","followup":"固定token序列离线重算两侧log-prob，核对mask、temperature和policy_version。 reference log-prob不能替代behavior log-prob。"},{"id":116,"code":"Q116","question":"为什么 PPO 多 epoch 会逐渐失去有效样本？","doc_title":"为什么 PPO 多 epoch 会逐渐失去有效样本？","chapter":"PPO 实现","domain":"policy","level":"进阶","course_day":6,"topic":"ppo-grpo","brief":"每个epoch后current policy远离behavior policy，更多token进入clip区，后续梯度由未越界子集主导。","deep":"随着当前模型多次更新，固定样本相对新模型越来越旧，更多位置可能进入裁剪平台或出现极端概率比。这表示额外一遍训练的有效信号可能减少，并不是文件中的样本条数真的减少。假设一开始 1000 个奖励 token 中只有 50 个进入 PPO 的有效裁剪平台，第三遍后变成 700 个。后两遍虽然仍消耗前向和反向时间，奖励项的新增更新机会却减少了。但不能只用区间外比例替代这个统计，第 36 题解释了正负 advantage 的区别。更实用的观察是各 epoch的实际梯度范数、KL 增量和独立验证改善，判断多训练一遍是否值得。","followup":"按epoch画KL、clip fraction、ESS与validation reward，而不是只调固定epoch数。 数据重用提高sample efficiency，不代表wall-clock或最终质量必然更好。"},{"id":117,"code":"Q117","question":"value clipping 解决什么问题？","doc_title":"value clipping 解决什么问题？","chapter":"PPO 实现","domain":"policy","level":"进阶","course_day":6,"topic":"ppo-grpo","brief":"value clipping限制critic相对旧预测的变化，避免单批高回报让value快速漂移；它不是actor的PPO clipping。","deep":"价值裁剪限制预测值相对旧预测在一次目标中的变化收益，希望避免价值模型突然跳动。它是稳定训练的启发式方法，不保证价值误差一定变小；应同时检查预测与真实回报是否接近。value clipping 裁剪的是 critic 的预测变化，不是 actor 的动作概率。若旧预测为 0.4，本轮限制变化不超过 0.1，用于比较的裁剪预测就被限制在 0.3 到 0.5 范围。常见目标同时比较原预测误差与裁剪预测误差，取较大的损失，抑制快速漂移。若真实目标已从 0.4 变到 0.9，过严限制也可能让 critic 长期追不上。应同时观察预测值与实际回报，而非只看 value loss 是否稳定。","followup":"同时看explained variance、value loss、prediction range和target scale。 critic欠拟合时过强value clip会阻碍学习。"},{"id":118,"code":"Q118","question":"entropy bonus 与 sampling temperature 是一回事吗？","doc_title":"entropy bonus 与 sampling temperature 是一回事吗？","chapter":"PPO 实现","domain":"policy","level":"进阶","course_day":6,"topic":"ppo-grpo","brief":"entropy bonus作用于训练目标，temperature作用于rollout采样分布。两者都影响多样性，但梯度路径与数据分布不同。","deep":"熵奖励是加入训练目标的项，鼓励模型保留更分散的选择；采样温度是在生成时变换概率。一个改变参数更新的动力，另一个改变当前如何抽样，两者不能互相替代。temperature 在采样前把 logits 除以温度，从而改变这次怎么抽 token；entropy bonus 则进入训练目标，鼓励模型参数保持一定选择多样性。例如把温度调高可以暂时多采到低概率回答，但下次恢复温度，原始模型分布可能完全未变。熵奖励改变的是原始参数，代价是过强时会阻碍模型集中到高质量答案。两者应分别设置和记录。","followup":"分别记录原始policy entropy、采样temperature和生成后的token多样性。 调高temperature不能替代entropy regularization。"},{"id":119,"code":"Q119","question":"PPO 中 minibatch shuffle 为什么重要？","doc_title":"PPO 中 minibatch shuffle 为什么重要？","chapter":"PPO 实现","domain":"policy","level":"进阶","course_day":6,"topic":"ppo-grpo","brief":"若按长度、prompt或worker顺序分batch，局部batch分布会偏置梯度与归一化统计；shuffle让每步更接近总体分布。","deep":"打乱小批次可以减少数据顺序与参数更新方向长期绑定。例如先连续训练简单题、再连续训练难题，模型可能在一个更新周期内经历明显分布变化。打乱策略仍需保留组统计和轨迹字段的对应关系。minibatch 是一次优化器更新所使用的一部分数据，shuffle 是打乱其顺序。若按原始任务顺序训练，前十个小批全是简单题，后十个全是难题，每次更新面对的分布就不均匀。GRPO 的题内统计应在正确组内计算好，再把带着固定 advantage 的回答分配给训练小批。若在打乱之后按相邻行重新组组，便会把不同问题的回答误认为同一道题。","followup":"检查packed sequence、group约束和DP rank上的实际样本组成。 GRPO组内统计要求同组样本先聚合，不能无脑打散。"},{"id":120,"code":"Q120","question":"梯度累积会改变 PPO 语义吗？","doc_title":"梯度累积会改变 PPO 语义吗？","chapter":"PPO 实现","domain":"policy","level":"进阶","course_day":6,"topic":"ppo-grpo","brief":"理想情况下只改变有效batch，但若advantage按microbatch归一化、clip统计局部化或optimizer state更新时机不同，就会改变权重。","deep":"梯度累积想用多个小批次模拟一次较大的更新。只有损失缩放、统计范围、更新次数等规则一致时，才可能得到相近结果。若每个小批次单独计算优势均值，就可能改变原来的大批次目标。梯度累积是多次 forward/backward 后才执行一次 optimizer.step。若 4 个 microbatch 的有效 token 数分别为 10、10、10、70，把四个平均 loss 再平均，会让前三个小批合计占 75% 权重，而它们只有 30%token。若目标是全局 token 平均，应先累计损失和与有效数量，或按每个小批的 token 数正确缩放。验证应比较同一逻辑 batch 在不同切分方式下的最终梯度，不能只确认累积步数相同。","followup":"确保归一化统计跨accumulation window一致，并对比一次大batch梯度。 loss除以accumulation steps不代表所有统计都等价。"},{"id":121,"code":"Q121","question":"为什么 approximate KL 的不同公式数值不一致？","doc_title":"为什么 approximate KL 的不同公式数值不一致？","chapter":"PPO 实现","domain":"policy","level":"进阶","course_day":6,"topic":"ppo-grpo","brief":"sampled log-ratio、ratio-1-log-ratio和全词表KL具有不同偏差与方差；它们估计的方向和采样分布也可能不同。","deep":"不同日志公式可能在采样方向、加权方式和有限样本波动上不同。对数概率差可逐样本为负；完整分布的 KL 非负；某些经过构造的单样本估计也可非负。只有写出公式及样本来自谁，才知道它们能否比较。第 8 题给出了同一 KL 的两种样本估计。实践里还会有 old 到 current、current 到 reference 等不同方向，它们的数值即使都叫 KL，也不是同一个问题。迁移 early-stop 阈值时，先固定一批 token，分别按两份实现的公式计算。如果一个指标是整条序列总和，另一个是每 token 均值，长度 1000 时两者就可能差约三个数量级；这不是训练突然不稳定。","followup":"日志必须标明公式、reduction轴和expectation来自谁。 阈值不能跨实现直接复用。"},{"id":122,"code":"Q122","question":"PPO 中什么时候应该 early stop？","doc_title":"PPO 中什么时候应该 early stop？","chapter":"PPO 实现","domain":"policy","level":"进阶","course_day":6,"topic":"ppo-grpo","brief":"当KL、ratio尾部或clip fraction表明当前batch已不再近策略，继续epoch收益有限且风险上升。","deep":"这里的提前停止通常指停止继续复用当前数据，而不是结束整个项目。当这批数据与当前模型的差异过大，额外训练收益可能低于重新采样，应结合概率变化与验证质量决定。这里的 early stop 通常是停止继续使用当前 rollout 批次做更多 PPO epoch，而不是永久终止整个训练。发现这批数据与当前模型差异过大后，可以重新采样。例如前两遍 KL 缓慢增加，第三遍出现明显跃升且验证无增益，后续可提前结束这批更新。阈值应来自实际稳定性实验，并注明使用哪个 KL 公式。单次采样噪声和持续异常应分别处理。","followup":"early stop门槛应由quality-vs-KL消融确定，并记录被停止的batch比例。 不要仅因一次噪声峰值全局停训。"},{"id":123,"code":"Q123","question":"actor 与 critic 学习率为什么通常不同？","doc_title":"actor 与 critic 学习率为什么通常不同？","chapter":"PPO 实现","domain":"policy","level":"进阶","course_day":6,"topic":"ppo-grpo","brief":"两者目标、尺度与非平稳程度不同；critic还面对actor持续改变带来的target drift。","deep":"生成模型在学习如何选择动作，价值模型在预测后续分数，它们不是同一个回归任务。目标尺度、更新速度和预测误差不同，所以常需要独立调整学习率，而不是套一个固定比例。actor 学习的是动作分布，critic 学习的是回报预测，两个输出尺度与误差来源不同。actor 更新后，critic面对的未来行为也变了，所以它的预测目标会随训练移动。若 critic 长期高估成功，advantage 可能被压成负值；若 critic 变化过快，又可能让策略每批面对完全不同的参照。可把预测值按区间分桶，与实际平均回报比较，再决定调整学习率或更新次数。","followup":"分别监控actor KL/grad norm与critic explained variance/value bias。 固定比例不是通用定律，应由稳定性曲线决定。"},{"id":124,"code":"Q124","question":"PPO 训练突然 NaN 的最小排查顺序是什么？","doc_title":"PPO 训练突然 NaN 的最小排查顺序是什么？","chapter":"PPO 实现","domain":"policy","level":"进阶","course_day":6,"topic":"ppo-grpo","brief":"先定位首个非有限tensor，再依次查reward/advantage、log-prob、ratio exp、loss reduction、grad norm和optimizer state。","deep":"先找第一个变成无穷或 NaN 的数，而不是从最终损失倒猜。输入奖励、概率差、指数变换、求平均和优化器状态都可能产生异常；按计算依赖顺序检查，才能区分源头与传播结果。NaN 表示数值结果已不再是合法实数。一个常见传播链是异常 log-prob 差导致 exp 溢出，ratio 变成无穷，再与零 advantage 相乘产生 NaN。日志最后看到的 loss 只是后果。在 reward、advantage、log-prob 差、ratio、loss 和梯度处顺序检查 isfinite，保存最早失败位置的输入。对已知无效位置，应先避免执行危险数值运算；事后乘 0 mask 无法消除 0×无穷所产生的 NaN。","followup":"保留首个异常step的原始batch，在单卡BF16确定性重放。 最终NaN rank通常不是最早出错rank。"},{"id":125,"code":"Q125","question":"GRPO 的 group 应按什么键聚合？","doc_title":"GRPO 的 group 应按什么键聚合？","chapter":"GRPO 工程","domain":"grpo","level":"进阶","course_day":7,"topic":"ppo-grpo","brief":"group必须对应同一prompt和同一任务条件，否则相对reward混入难度差异。多轮任务还需固定初始环境状态或seed语义。","deep":"同一文本问题在两个环境快照下可能有不同答案，例如读取文件时初始内容不同。因此 group key 需要标识任务输入和初始条件，不只是问题字符串。组内可以按设计使用不同环境随机种子，以估计随机环境中的表现；但要清楚奖励差异也包含环境运气。如果目标是比较相同起点的不同策略选择，则应控制环境条件，不能无意混入难度变化。具体聚合时，先按 group_id 找到预期的全部候选，再检查它们的问题内容、环境初始条件和奖励规则是否一致。候选未到齐时应等待、重试或按预先定义的缺组规则处理，不能把另一个问题的样本补进来。即便两个问题文字相同，它们对应的文件或工具权限不同，也可能是两个不同任务。","followup":"显式记录group_id、prompt_hash、env_seed与采样配置。 同一文本prompt不一定代表同一环境state。"},{"id":126,"code":"Q126","question":"group 内有重复答案会有什么影响？","doc_title":"group 内有重复答案会有什么影响？","chapter":"GRPO 工程","domain":"grpo","level":"进阶","course_day":7,"topic":"ppo-grpo","brief":"重复样本降低有效多样性，使均值/std看似稳定但有效信息量下降；在稀疏reward下还会放大全零或全一组。","deep":"输出相同不必然说明随机样本不独立。确定性很强的模型即使独立采样，也可能重复同一答案。应区分模型分布本来集中，与采样器错误复用同一个随机流或直接复制样本。前者可通过调整采样和数据难度观察，后者需检查请求 seed 和返回 ID。对重复回答直接去重还会改变采样分布，因此去重是数据选择策略，不是无影响的清理操作。例如公平抛硬币四次得到四个正面，结果重复不代表抽样不独立。模型四次独立采样都生成同一文本也类似；真正需要调查的是是否复制了同一个样本、重复使用了相同随机流，或被缓存直接返回了相同结果。重复输出率适合描述探索多样性，却不能单独证明统计独立性被破坏。","followup":"统计unique response、n-gram重复和按语义聚类后的有效group size。 采样条数不等于独立样本数。"},{"id":127,"code":"Q127","question":"为什么 group std 很小会造成大梯度？","doc_title":"组内奖励标准差很小时，优势归一化有什么风险？","chapter":"GRPO 工程","domain":"grpo","level":"进阶","course_day":7,"topic":"ppo-grpo","brief":"除以很小std会放大微小reward差异，epsilon只能限制数值爆炸，不能保证差异有意义。","deep":"标准差很小不意味着规范化后的 advantage 必然无限大。对固定有限组，若奖励差异整体缩小，分子也会同步缩小；当奖励完全相同时，差值就是 0。实际风险是微小差异可能只是评分噪声，却被缩放为有意义的相对差异。例如 [0.5000,0.5001] 的差很小，规范化后仍可接近 [−1,+1]。应检查评分分辨率、组大小和 epsilon，而不是把所有小 std 都解释为梯度爆炸。","followup":"记录raw std分布，并对低std组做clip、drop或改用不除std的变体消融。 epsilon是数值保护，不是统计正确性证明。"},{"id":128,"code":"Q128","question":"DAPO dynamic sampling 的吞吐收益来自哪里？","doc_title":"DAPO dynamic sampling 的吞吐收益来自哪里？","chapter":"GRPO 工程","domain":"grpo","level":"进阶","course_day":7,"topic":"ppo-grpo","brief":"它过滤无梯度group并补充新prompt，提高每个optimizer step的有效token比例。收益来自数据选择，不只是更快实现。","deep":"动态采样先检查同题候选是否有奖励差异，再为缺乏信号的组补采其他问题。它提升的是被训练数据中的有效信号比例，但补采本身需要计算；是否提高端到端吞吐取决于这两部分的平衡。假设生成 100 组，其中只有 20 组有正负差异。若一次训练需要 100 个有效组，动态采样可能要生成约500 组才能填满。优化器每步信号更密集，但生成成本没有消失。因此应同时计入被过滤的回答 token。只报告进入训练部分的有效率，会漏掉为了达到它而付出的采样成本。还要检查难题是否长期全错而被排除。","followup":"同时报告有效组率、补采成本、prompt覆盖和held-out原始分布质量。 不能只用训练reward证明算法更好。"},{"id":129,"code":"Q129","question":"Dr.GRPO 为什么强调 loss denominator？","doc_title":"Dr.GRPO 为什么强调 loss denominator？","chapter":"GRPO 工程","domain":"grpo","level":"进阶","course_day":7,"topic":"ppo-grpo","brief":"按每条response长度归一化与按全局token数归一化对应不同样本权重，可能形成长度偏好。修正必须落到实际masked reduction。","deep":"损失分母决定每个 token 或回答占多大权重。Dr.GRPO 对原始 GRPO 的修改包括使用固定长度尺度，避免每条回答除以自身长度；这与按当前批次的有效 token 总数平均仍不是同一个定义。denominator 就是最后求平均时的分母。它直接规定每个 token 或回答占多少权重，第 29 题给出了 2token 与 8 token 回答的计算例子。检查代码时可以为每个 token 设置同样的人工损失，只改变回答长度，然后观察每条回答贡献多少。若本来要验证固定 token 权重，却发现短回答每 token 权重更高，问题就在长度归约而非模型能力。相关原始资料：Dr.GRPO。","followup":"打印每条sequence对最终loss的权重，并用不同长度toy batch验算。 论文名相同不保证框架实现相同。"},{"id":130,"code":"Q130","question":"GSPO 在 MoE 上更稳定的可能机制是什么？","doc_title":"GSPO 在 MoE 上更稳定的可能机制是什么？","chapter":"GRPO 工程","domain":"grpo","level":"进阶","course_day":7,"topic":"ppo-grpo","brief":"sequence-level ratio减少少量极端token对独立clip决策的支配，使一次response的更新权重更一致。","deep":"GSPO 用一条回答的长度归一化概率比决定整条回答的权重和裁剪，减少少数 token 单独控制更新的机会。这为稳定性提供一种可能解释，但是否改善某个 MoE 设置仍需实验，不能当作普遍定理。同一回答共享裁剪权重，可以减少一个局部 token 的路由变化单独触发强烈更新的情况。router 指选择专家的网络；边界 token 指两个专家得分接近、容易切换的 token。但序列平均也可能把局部异常隐藏。例如一个位置概率比极大、其他位置略小，整段权重仍很正常。验证稳定性应同时检查局部概率与路由变化，不应因序列曲线平滑就停止诊断。","followup":"验证时同时画sequence ratio、token ratio尾部、router负载和质量曲线。 这是机制解释，不能脱离具体实现宣称普遍更优。"},{"id":131,"code":"Q131","question":"CISPO 的 stop-gradient 为什么关键？","doc_title":"CISPO 的 stop-gradient 为什么关键？","chapter":"GRPO 工程","domain":"grpo","level":"进阶","course_day":7,"topic":"ppo-grpo","brief":"裁剪后的IS weight只作为log-prob梯度系数，不让裁剪函数自身产生额外梯度；越界token仍可按边界权重更新。","deep":"停止梯度意味着把某个由模型计算出的数当作当前更新的固定系数。CISPO 将裁剪后的概率比作为这样的系数，再乘以所选 token 的对数概率；若保留系数自身的反传路径，就会多出一部分梯度。detach 的作用可以用乘法看清。若损失写作 −w(θ)log πθ，直接求导会同时出现“w 的变化”和“log π的变化”两项；把 w.detach() 当固定系数后，只保留后者。裁剪后的权重还依赖当前概率，但算法有意不沿这条依赖求导。实现时可用一个二分类模型，比较自动求导与手写目标梯度，确认没有多出那一项。是否裁剪和是否 detach 是两个独立检查点。","followup":"用单token toy case自动微分，对比PPO与CISPO梯度。 保留梯度不等于无偏。"},{"id":132,"code":"Q132","question":"REINFORCE++ 的 global normalization 有什么分布式要求？","doc_title":"REINFORCE++ 的 global normalization 有什么分布式要求？","chapter":"GRPO 工程","domain":"grpo","level":"进阶","course_day":7,"topic":"ppo-grpo","brief":"mean/std必须覆盖逻辑global batch；各DP rank局部归一化会让相同reward获得不同权重。","deep":"全局归一化中的“全局”需要覆盖该算法规定的完整训练批次，包括多个设备和可能的梯度累积片段。每卡各自归一化后再同步梯度，一般不等于先使用统一统计量再计算梯度。global batch 指参与同一次更新的所有有效样本。DP 多卡与梯度累积会把它拆开，局部 mean/std 不能直接当全局统计量。例如一张卡有 1 个分数 10，另一张卡有 9 个分数 0，两卡均值平均得 5，真实全局均值却是 1。聚合count、sum 和方差所需量，才能还原正确权重。最终要用同一批数据的单卡计算作对照。","followup":"all-reduce count、sum、sum-square，并用单卡大batch对齐梯度。 只同步均值而不处理有效mask数量仍可能错误。"},{"id":133,"code":"Q133","question":"不同算法应该按 token 还是 sequence 对齐预算？","doc_title":"不同算法应该按 token 还是 sequence 对齐预算？","chapter":"GRPO 工程","domain":"grpo","level":"进阶","course_day":7,"topic":"ppo-grpo","brief":"长短分布不同时，只对齐sequence数会产生不同token计算量；只对齐token数又可能改变unique prompt覆盖。","deep":"不同算法可能用不同数量的问题、回答和 token。只对齐其中一个预算，就可能让另一个计算成本或数据覆盖范围变化。比较时应同时报告生成量、训练量、问题覆盖与总资源消耗。同样 100 条回答，平均长度 100 与 1000 的生成量差 10 倍；同样 10 万 token，全部来自一题和来自一千题的覆盖又不同。因此没有一个预算数字能描述所有成本和信息量。结果表应至少写生成 token、训练 token、不同问题数和总 GPU-hours。比较某种算法更快达到目标时，保持评测问题和解码设置一致，并明确是时间收益还是资源收益。","followup":"至少同时报告GPU-hours、generated tokens、trained tokens和unique prompts。 单一step数没有跨算法可比性。"},{"id":134,"code":"Q134","question":"如何做 GRPO 到 DAPO/GSPO 的最小消融？","doc_title":"如何做 GRPO 到 DAPO/GSPO 的最小消融？","chapter":"GRPO 工程","domain":"grpo","level":"进阶","course_day":7,"topic":"ppo-grpo","brief":"一次只替换一个机制：clip、sampling、reduction或ratio粒度，并保持模型、seed、prompt池与token预算一致。","deep":"受控比较应每次只改变一个机制，例如概率比的粒度、裁剪边界或损失分母。整套配置一起更换后，即便得分提高，也无法知道收益来自哪个改变以及哪些代价被同时引入。消融实验指只改变一个机制来判断它的贡献。例如先保持原有采样不变，仅更换 loss denominator；确认变化后，再加入非对称裁剪；最后单独比较动态采样。若一次同时换模型、数据和四个超参，即使总分增加，也无法证明是哪项带来的。还应留一个组合实验，因为两个各自有效的改动可能互相抵消；单项收益不能直接相加。","followup":"先小模型多seed验证趋势，再在目标规模比较time-to-quality。 整套配置一次切换无法归因收益。"},{"id":135,"code":"Q135","question":"pairwise RM 的 tie 数据怎么处理？","doc_title":"pairwise RM 的 tie 数据怎么处理？","chapter":"偏好优化","domain":"reward","level":"进阶","course_day":76,"topic":"opd-kl","brief":"可丢弃、软标签或显式建模tie；选择会影响标注利用率和校准。","deep":"偏好数据中的同分表示没有足够依据认为某个回答更好。可以舍弃这类数据，也可以让目标表达两者接近。不同处理会改变训练信号和样本利用率，应按标注含义选择，避免强行制造胜负。tie 表示两份回答没有明确优劣。如果标注者认为相同，而训练强制选择左边获胜，会把位置偶然性写进模型。可以把偏好目标设为 0.5，使模型不要产生过强分差；也可以暂时丢弃不确定样本，或使用显式处理平局的概率模型。选择取决于平局比例与标注可靠性，需分别统计平局和明确偏好上的误差。若使用 Bradley–Terry 模型，预测 A 优于 B 的概率是 sigmoid(rA−rB)，其中 sigmoid 把任意实数压到 0 与 1之间。\n\n将同分样本标成 0.5，相当于希望两者评分差接近零。直接随机选一个作为赢家，单条数据便引入了没有依据的偏好；若必须这样做，应说明它只是某种采样近似，并检查噪声代价。","followup":"分别报告strict preference与tie子集的一致率。 强行把tie变成chosen/rejected会注入随机偏差。"},{"id":136,"code":"Q136","question":"RM calibration 为什么重要？","doc_title":"RM 的数值尺度与概率校准有什么区别？","chapter":"偏好优化","domain":"reward","level":"进阶","course_day":76,"topic":"opd-kl","brief":"排序准确率只评价相对次序，RL需要数值尺度参与KL权衡。未校准RM可能在OOD输出极端分数。","deep":"校准是检查“模型说有多大概率”与实际频率是否一致。例如把预测 A 胜过 B 的概率在 0.7 到 0.8 之间的样本放在一起，若实际只有一半 A 获胜，说明它过度自信。RM 原始标量没有天然的正确率含义，不能直接把 raw score=0.8 解释成 80% 正确。可校准的是偏好概率或专门定义的成功概率。在线 RL 还需要检查分数范围和异常高分，排序准确、概率校准和抗优化漏洞是三项不同能力。","followup":"做reliability、score分布、长度切片和OOD扰动测试。 高pairwise accuracy不保证在线优化稳定。"},{"id":137,"code":"Q137","question":"best-of-N 与在线 RL 的差别是什么？","doc_title":"best-of-N 与在线 RL 的差别是什么？","chapter":"偏好优化","domain":"reward","level":"进阶","course_day":76,"topic":"opd-kl","brief":"best-of-N只在固定proposal分布内重排，不能直接改变模型参数；在线RL会让policy主动迁移到reward高的区域。","deep":"best-of-N 在固定模型的 N 个回答中选一个较好的，不直接更新模型。在线 RL 则利用评分改变后续生成分布。前者把计算花在当前问题的搜索上，后者把计算花在让未来回答更好上。best-of-N 固定生成模型，一次生成 N 份回答，再由评分器挑一份。它改变最终返回的候选，不改变模型参数。在线 RL 则将反馈用于参数更新，希望以后少采样也能产生更好答案。前者可以快速验证评分器是否有用：N 增大时独立质量是否改善。后者还要承担训练成本，并可能走到更陌生的输出区域。比较时应计入全部 N 份回答和评分器调用，不能只计最终返回那一份。","followup":"比较时对齐生成token和RM调用成本。 best-of-N的质量上限受候选覆盖限制。"},{"id":138,"code":"Q138","question":"DPO 的 β 控制什么？","doc_title":"DPO 的 β 控制什么？","chapter":"偏好优化","domain":"reward","level":"进阶","course_day":76,"topic":"opd-kl","brief":"β决定policy-reference log-ratio与隐式reward的尺度，影响偏离reference的强度和梯度饱和。","deep":"DPO 的 β 把策略相对参考模型的对数概率变化映射成偏好评分差。它既与理论中的 KL 权衡有关，也影响固定训练样本上的梯度大小及饱和程度，因此不能简单说“β 越大每一步越保守”。在标准 DPO 形式中，β 乘在“chosen 相对 reference 的 log-ratio 减 rejected 相对 reference 的 log-ratio”上，再送入 sigmoid 损失。它既关联理论 KL 正则强度，也改变有限数据优化时的梯度和饱和区间。因此不能简单背成“β 越大一定改变越大”。理论固定奖励的最优策略、实际离线分类损失和有限步训练是不同语境。固定偏好对，扫描 β 后同时比较相对 reference 的 KL 与独立偏好结果，更能说明实际作用。","followup":"按β画win rate、KL、长度和OOD指标。 不同实现的loss定义可能把β放在不同位置。"},{"id":139,"code":"Q139","question":"IPO、KTO、ORPO 与 DPO 的面试定位是什么？","doc_title":"IPO、KTO、ORPO 与 DPO 的面试定位是什么？","chapter":"偏好优化","domain":"reward","level":"进阶","course_day":76,"topic":"opd-kl","brief":"它们都绕开显式在线RL，但使用的监督单元和偏好假设不同：pair、binary desirability或SFT/odds组合。","deep":"这几个名字可以先按监督数据解释。DPO 使用同题的一对好坏回答，并相对参考模型比较概率变化。IPO 也使用偏好对，但采用不同的目标形式，避免把每个观察偏好都推向极端确定；原方法使用平方形式的目标差约束。KTO 可以使用单条回答的“可取或不可取”标签，不要求每条都有同题配对。ORPO 把示范学习与基于好坏回答几率比的偏好项结合，目标中不依赖独立参考模型。几率是 p/(1−p)，与普通概率 p 不同。这只是定位，不意味着它们可以互换数据。选择前要写明手头标签是哪种、是否需要参考模型，以及如何处理噪声和长度。各目标的原始定义见文末论文，不能只把不同 loss 名称替换进同一配置。相关原始资料：IPO；KTO；ORPO。","followup":"先说数据需求，再说目标函数和reference依赖。 不要只背缩写，必须说明解决DPO的哪个边界。"},{"id":140,"code":"Q140","question":"preference data 的 position bias 怎么查？","doc_title":"preference data 的 position bias 怎么查？","chapter":"偏好优化","domain":"reward","level":"进阶","course_day":76,"topic":"opd-kl","brief":"chosen总在固定位置、标注UI顺序或模型名泄漏会让judge学习位置shortcut。","deep":"展示位置偏差表示评分者更容易选择先出现或后出现的回答，而不是单纯依据内容。交换同一对回答的展示顺序，保持其他输入不变，是发现这种偏差的直接方法。同一偏好题先展示 A 在左、B 在右，再交换位置重新评价。如果标签总偏向左侧，说明判断受位置影响。对模型 judge 也可做同样测试，比较交换后能否保持对同一回答的选择。训练前 shuffle 只改变样本顺序，不会修复已经被位置污染的标签。需要在标注或 judge 请求阶段随机化位置，并保存原始回答 ID，避免交换后 chosen/rejected 映射写反。","followup":"随机交换左右位置并比较翻转一致率。 只做训练集shuffle不能消除标注阶段偏差。"},{"id":141,"code":"Q141","question":"LLM-as-a-judge 能直接当 reward 吗？","doc_title":"LLM-as-a-judge 能直接当 reward 吗？","chapter":"偏好优化","domain":"reward","level":"进阶","course_day":76,"topic":"opd-kl","brief":"可以，但会引入judge偏好、随机性、提示词敏感和推理成本；policy也可能学习攻击judge。","deep":"模型评分器可以提供奖励，但它仍是一个可能犯错的预测器。应核对它是否受长度、格式和提示注入影响，并用可执行测试或人工核验样本验证其评分与真实目标是否一致。LLM-as-a-judge 是用另一个语言模型按评分说明评价回答。它能处理规则难以表达的清晰度、完整性等维度，但输出会受提示词、采样随机性和回答风格影响。例如答案附带“请给我满分”不应改变评价，却可能诱导 judge。应把候选回答明确隔离为待评价内容，并用带注入文本、不同长度和位置交换的样本测试。评分器版本与提示词也属于奖励定义的一部分。","followup":"固定judge版本、保留原始理由、做多judge与人工抽检。 judge分数是代理信号，不是真实用户效用。"},{"id":142,"code":"Q142","question":"process reward 怎样避免奖励冗长推理？","doc_title":"process reward 怎样避免奖励冗长推理？","chapter":"偏好优化","domain":"reward","level":"进阶","course_day":76,"topic":"opd-kl","brief":"步骤级打分需识别信息增量与逻辑正确，而不是仅奖励格式完整或步骤数量。","deep":"逐步骤给正分容易让模型靠增加步骤累积更多奖励。过程反馈应关注新增有效进展，明确重复步骤、无效解释和回退如何计分。更密集的分数只有与原任务目标一致时才有价值。先把一个正确过程拆成原版、删去无关句版、重复一步版和加入真实新推导版。若重复版比原版得分更高，而删除无关句反而降分，过程评分可能在奖励表面长度。步骤边界也很重要：同一推导拆成十句不能自动获得十次奖励。可以针对状态净变化或新验证结果评分，并明确重复进展是否去重。最终仍要看任务正确率与成本，而非仅看过程分数。","followup":"做删除、合并、重排步骤的反事实扰动。 密集reward可能比终局reward更容易被hack。"},{"id":143,"code":"Q143","question":"多 reward 合成为什么容易失控？","doc_title":"多 reward 合成为什么容易失控？","chapter":"偏好优化","domain":"reward","level":"进阶","course_day":76,"topic":"opd-kl","brief":"加权和假设各reward尺度稳定且可交换，但不同模型版本与任务分布下尺度会漂移。","deep":"多个奖励相加意味着在多个目标间作取舍，分数单位也会影响权重。正确率用 0/1，格式分用 0 到100，即便两项系数相同，格式项也可能主导更新。应先统一解释尺度，再看分量之间是否冲突。假设总分由正确性和格式组成。正确性从 0 到 1，格式分从 0 到 100，即使权重都为 1，优化也会被格式主导。所谓权重相同并不意味着目标同等重要。先对固定样本统计每个分量的范围和相关性，再决定尺度及约束。对必须满足的要求，可考虑硬性验收或分层目标，而不是所有要求都化成一个可被其他高分抵消的加权和。","followup":"记录每个分量、相关性、Pareto前沿和权重敏感性。 总reward上升不能说明每个目标都改善。"},{"id":144,"code":"Q144","question":"如何设计 reward model 的上线门槛？","doc_title":"如何设计 reward model 的上线门槛？","chapter":"偏好优化","domain":"reward","level":"进阶","course_day":76,"topic":"opd-kl","brief":"至少覆盖离线排序、校准、对抗扰动、best-of-N行为和小规模on-policy优化五层。","deep":"奖励模型上线前至少要通过离线排序、搜索压力和小规模在线优化三个层面的检验。它不仅需要在已有回答上排序合理，还需要经得起模型主动寻找高分输出时出现的新分布。一个可执行门槛应写明样本范围和失败处理，例如偏好排序达到预定准确率、对重复扩写不持续加分、在 best-of-N 搜索后隐藏质量不下降，再进入小规模在线试训。门槛数值需来自任务要求和基线，不能从别的 RM 直接照搬。若在线试训出现格式投机，回到具体高分样本修正数据或评分规则；不能仅提高整体准确率门槛而忽略错误类型。","followup":"预先定义回滚阈值：外部质量、长度、拒答、格式与安全指标。 held-out accuracy只是第一道门。"},{"id":145,"code":"Q145","question":"OPD 中 teacher 应看到 student 的哪些上下文？","doc_title":"OPD 中 teacher 应看到 student 的哪些上下文？","chapter":"OPD 实现","domain":"opd","level":"进阶","course_day":75,"topic":"opd-kl","brief":"teacher必须在与student相同的已访问state上评分，包含相同system、tool result和历史turn。","deep":"教师需要在与学生动作对应的上下文上评价下一步。这个上下文通常包含学生已生成的前缀、用户输入和已经获得的工具反馈。如果教师评价的是另一段历史，两边概率就不再描述同一个条件事件。“相同上下文”指双方在评价同一个决策问题。学生已经读到工具返回的库存为 0，教师却只看到原始商品问题，教师给出的购买建议就不对应学生此时可见的信息。通常应传入一致的历史角色、工具定义、结果和位置编码语义，并核对序列化后的 token。若教师有意使用额外答案或特权信息，应在方法定义中说明，否则读者会误以为比较的是相同条件分布。","followup":"对输入token ids、position ids、attention mask和template hash做逐项对齐。 只对齐可见文本仍可能漏掉特殊token差异。"},{"id":146,"code":"Q146","question":"teacher 更强是否一定适合 OPD？","doc_title":"teacher 更强是否一定适合 OPD？","chapter":"OPD 实现","domain":"opd","level":"进阶","course_day":75,"topic":"opd-kl","brief":"更强teacher可能提供更好局部方向，也可能与student能力、词表或行为分布差距过大，产生尖锐KL和不可学目标。","deep":"教师能力更强不等于所有反馈都适合学生。教师可能使用学生无法表达的解法，也可能在学生错误前缀上继续错误推理。应看它能否在学生实际访问的状态中提供可学习且可靠的改进信号。教师会做的事情不一定能通过小学生的容量和训练预算学会。若教师分布极尖，把某个学生几乎不可能输出的 token 视为唯一答案，可能产生较强训练信号却迟迟无法改善完整任务。先按任务难度比较蒸馏前后正确率，并查看教师与学生在哪些位置分歧最大。可考虑混合示范、逐步提高难度或调整蒸馏温度；这些都改变训练信号，需要独立验证而非默认教师越大越好。","followup":"按student能力分桶比较KL、梯度范数和实际任务收益。 teacher benchmark更高不是充分条件。"},{"id":147,"code":"Q147","question":"full-vocab KL 的显存成本怎么估算？","doc_title":"full-vocab KL 的显存成本怎么估算？","chapter":"OPD 实现","domain":"opd","level":"进阶","course_day":75,"topic":"opd-kl","brief":"logits近似占B×T×V×dtype_bytes，十万词表和长序列会迅速成为主导。","deep":"完整词表输出的大小由批量、位置数和词表大小共同决定。冻结教师可以省掉教师梯度与优化器状态，但不会自动省掉前向计算中的输出和临时缓冲。容量估算必须分项统计。取 B=4、T=8192、V=128000、每元素 2 字节，单份 logits 约为 8.39 GB，即 7.81 GiB。教师与学生各一份已经约 15.63 GiB，还未算反向传播、激活与通信临时区。GB 用十进制 字节，GiB 用 字节，报告时应注明单位。按时间块或词表块累计 KL 可以降低峰值，但若计算图仍保存所有块的中间值，实际峰值未必按预想降低，需检查对象生命周期。","followup":"区分物化logits、chunk计算、通信buffer和autograd保存量。 只算最终tensor不等于峰值显存。"},{"id":148,"code":"Q148","question":"vocab parallel 下如何计算精确 softmax/KL？","doc_title":"vocab parallel 下如何计算精确 softmax/KL？","chapter":"OPD 实现","domain":"opd","level":"进阶","course_day":75,"topic":"opd-kl","brief":"需跨词表分片计算global max与global sum-exp，再聚合局部KL贡献。","deep":"词表并行把候选 token 分到不同设备，但概率的分母仍需覆盖完整词表。每个设备只对本地候选做softmax，会得到多个分别归一化的小分布，无法替代原来的全词表分布。词表并行把候选 token 分到多卡。softmax 的分母必须覆盖整个词表，不能在各卡局部归一化后再拼接，否则每张卡概率之和都等于 1，拼起来会大于 1。稳定计算先跨卡取得所有 logits 的最大值，再计算各自的 exp(logit−最大值)，跨卡相加得到全局分母。每卡用同一个分母得到本地概率，最后把各片的 KL 贡献相加。教师与学生需要各自的全局归一化量，词表索引也必须对齐。","followup":"用小词表单卡结果对齐多rank实现。 各rank局部softmax后再求和是错误的。"},{"id":149,"code":"Q149","question":"sampled-token OPD 的偏差来自哪里？","doc_title":"sampled-token OPD 的偏差来自哪里？","chapter":"OPD 实现","domain":"opd","level":"进阶","course_day":75,"topic":"opd-kl","brief":"只在student采到的token上比较，忽略teacher分配给其他token的概率质量，通常更接近reverse-direction信号。","deep":"单 token 估计不必然有偏。固定前缀，在 a 从学生分布 p 采样且教师分布 q 在相关位置为正时，log p(a)−log q(a) 的期望就是 KL(p‖q)。只抽一个候选通常波动更大，但“有噪声”和“有偏”不同。偏差可能来自错误采样分布、top-k 丢掉支持、裁剪权重或错误求导。特别是把已采 token 固定后直接对这一个 log-ratio 求导，不等于对包含采样分布变化的完整 KL 期望求导。实现必须同时检查数值估计和梯度估计。","followup":"在小词表上同时算full-vocab与sampled估计，按entropy切片误差。 top-k近似也不是严格full-vocab KL。"},{"id":150,"code":"Q150","question":"teacher offload 什么时候得不偿失？","doc_title":"teacher offload 什么时候得不偿失？","chapter":"OPD 实现","domain":"opd","level":"进阶","course_day":75,"topic":"opd-kl","brief":"当权重搬运或PCIe同步无法与actor计算重叠，offload节省的显存会换成更大wall time和抖动。","deep":"移出教师权重节省显存，却增加再次使用时的数据搬运。如果每个很小的训练片段都要等待大模型搬入搬出，传输成本可能超过省显存带来的收益。是否划算应按真实调用频率测量。假设教师计算需 0.3 秒，但每次从 CPU 加载需 0.8 秒，且加载无法被其他工作覆盖，offload 后主要时间反而花在搬运上。异步发起 copy 不代表它真的与计算并行。应在时间线上查看拷贝开始、结束和消费者等待位置。如果加载只为了腾出足够显存让任务能运行，吞吐下降可能仍是可接受代价；若显存本来充足，就没有同样理由。选择要结合约束。","followup":"用timeline分解transfer、load、compute和等待。 GPU利用率高不代表传输被隐藏。"},{"id":151,"code":"Q151","question":"teacher logits 缓存的 key 应包含什么？","doc_title":"teacher logits 缓存的 key 应包含什么？","chapter":"OPD 实现","domain":"opd","level":"进阶","course_day":75,"topic":"opd-kl","brief":"至少包含teacher版本、完整输入token、position/mask语义、精度与输出范围。","deep":"缓存键必须包含决定教师输出的条件。除了输入文本，还应考虑教师权重版本、tokenizer、对话模板、位置编号和输出概率的变换方式。少一个条件，就可能把不同问题误认为同一次查询。缓存 key 要覆盖所有会改变教师输出的条件。相同问题文本，加上一条不同的工具返回，下一 token 分布就会变；仅使用 prompt 文本哈希会错误命中。通常需记录教师版本、实际输入 token、位置和 mask 语义、输出位置范围及精度配置。若系统使用特权教师提示，也要计入 key。命中后抽样重算是为了检查 key 是否遗漏了条件，而非仅验证缓存文件能读。","followup":"缓存命中后抽样重算并校验最大logit误差。 仅用prompt文本hash会在多轮状态下碰撞语义。"},{"id":152,"code":"Q152","question":"OPD 与 reward shaping 如何组合？","doc_title":"OPD 与 reward shaping 如何组合？","chapter":"OPD 实现","domain":"opd","level":"进阶","course_day":75,"topic":"opd-kl","brief":"teacher KL可作为局部dense信号，任务reward保证最终目标；权重不当会让student只模仿teacher而忽略环境。","deep":"先明确教师提供的是直接蒸馏损失，还是要累计成回报的奖励。直接 KL 与终局任务奖励可以在目标中共同出现，但它们的量纲、位置平均方式和梯度路径需要分别定义。例如最终任务成功奖励为 1，同时每个动作位置加入与教师分布差异相关的惩罚。若对 1000 个 token累加的教师惩罚远大于 1，模型可能只追求模仿教师而忽略是否真正完成任务。应明确教师项按 token 平均还是整段累计，并分别记录原始任务分数和教师项。若改变长度上限，还需重新检查两项相对尺度。不能仅因为总损失下降，就认为学生任务能力提高。","followup":"分别记录task reward、teacher term、KL和外部成功率。 合成后必须说明stop-gradient和return传播路径。"},{"id":153,"code":"Q153","question":"黑盒 teacher 的蒸馏信号有哪些层级？","doc_title":"黑盒 teacher 的蒸馏信号有哪些层级？","chapter":"OPD 实现","domain":"opd","level":"进阶","course_day":75,"topic":"opd-kl","brief":"从弱到强可用最终答案、偏好对、标量评分、自然语言critique和多候选修订。它们都不是精确logits监督。","deep":"黑盒教师可以返回最终示范、对比偏好、数值评分或纠错说明。它们提供的信息形态不同，不构成严格强弱顺序；一份冗长但错误的纠错说明可能不如可靠的单个测试结果。例如一次批改同时给出“失败在第 3 步”和修订动作，比只给 0 分更便于建立局部监督；但要解析和验证其真实性。应比较每次教师调用带来的有效训练样本和任务增益，而不是按返回字数衡量信息价值。“黑盒”也有不同访问能力。有的服务只给最终文本，有的还给已生成 token 的概率，但不给任意候选的概率。后者可以提供更多信息，却仍不等于能够查询完整教师分布。设计蒸馏前先列明接口实际返回什么，再选可实现的目标，避免把不存在的教师 logits 当成默认输入。","followup":"按teacher调用成本与student增益比较单位预算收益。 不要把黑盒评分称为full-vocab OPD。"},{"id":154,"code":"Q154","question":"怎样证明 OPD 实现方向没有写反？","doc_title":"怎样证明 OPD 实现方向没有写反？","chapter":"OPD 实现","domain":"opd","level":"进阶","course_day":75,"topic":"opd-kl","brief":"构造teacher明显偏好token A、student偏好B的toy分布，执行一步更新后A概率应按目标方向变化。","deep":"概率朝教师偏好方向移动，只能验证更新的大致方向，不能区分两种 KL。第 47 题的二分类例子中，forward KL 约 0.368，reverse KL 约 0.511，但二者都可能提高学生对第一项的概率。真正的方向测试应固定不对称分布，核对明确公式的数值和 logits 梯度，再检查一步优化器更新。之后单独测 mask 和词表分片，避免一次大测试无法区分到底是哪一层错误。","followup":"同时检查解析公式、autograd梯度符号和真实optimizer step。 loss下降本身不能证明KL方向正确。"},{"id":155,"code":"Q155","question":"异步 RL 的 staleness 应怎样定义？","doc_title":"异步 RL 的 staleness 应怎样定义？","chapter":"异步调度","domain":"async","level":"进阶","course_day":54,"topic":"async-rollout","brief":"至少区分生成开始版本、生成结束版本和消费时actor版本；差值可按optimizer step、权重版本或KL定义。","deep":"版本差、等待时间和实际概率差描述不同的陈旧性：落后几次发布是版本差，在队列里停留多久是时间差，同一历史上的概率改变多少是分布差。应保留三类信息，而不是用一个整数替代全部含义。生成开始、生成结束和训练消费可能对应三个版本。例如请求开始于 10，结束时系统最新为 12，消费时为 13；如果请求一直固定版本 10，则行为版本仍是 10，不是结束时最新的 12。因此版本字段应表达实际执行事实，而非记录墙钟时刻的全局最新版本。对中途换权重的请求，按片段记录；对固定旧引擎完成的请求，一个行为版本才足够。","followup":"每条trajectory携带behavior_version并在训练端重算分布距离。 时间差不是唯一有效的staleness度量。"},{"id":156,"code":"Q156","question":"one-step-off-policy 为什么仍可能很 stale？","doc_title":"one-step-off-policy 为什么仍可能很 stale？","chapter":"异步调度","domain":"async","level":"进阶","course_day":54,"topic":"async-rollout","brief":"一个optimizer step的参数变化可因学习率、batch和梯度异常而很大，版本差1不代表分布近。","deep":"一次版本发布代表的是一个事件，不代表固定大小的参数或概率变化。大批量、高学习率更新与小幅更新都可能只记作“一版”，因此版本差需要结合实际概率差来解释。一次 optimizer.step 可能累积了很大一批梯度，也可能使用了较高学习率。于是同样“落后一版”，某个 token 从 0.1 变到 0.11，另一次却从 0.1 变到 0.4，差异完全不同。可同时记录版本差和固定历史下的 log-prob 差。前者用于快速调度，后者用于判断真实分布变化。不能把一个项目的一步门槛直接移植到更新规模不同的项目。","followup":"同时看version gap与behavior-current KL/ratio尾部。 步数只是代理指标。"},{"id":157,"code":"Q157","question":"Partial Rollout 的核心语义是什么？","doc_title":"Partial Rollout 的核心语义是什么？","chapter":"异步调度","domain":"async","level":"进阶","course_day":54,"topic":"async-rollout","brief":"在生成未完整结束时保存可恢复状态，让后续policy继续生成或让已完成片段先被消费。关键是轨迹由哪些policy片段组成。","deep":"Partial Rollout 没有唯一通用含义：可以是生成中途暂停后恢复，也可以是把已完成片段先交给训练。实现前必须说明是否换权重、是否已经有奖励、是否允许未完成轨迹参与更新。暂停状态至少要保留已生成 token、结束原因和随机流；若包含工具交互，还要保存环境状态。保存 KV能减少重算，但换权重后通常不能直接复用。只记录“生成到第 1000 个 token”不足以保证可恢复。","followup":"记录segment边界、policy_version、KV/随机状态和finish_reason。 只保存token前缀不一定能确定性续推。"},{"id":158,"code":"Q158","question":"跨 policy 续推的 trajectory ratio 怎么处理？","doc_title":"跨 policy 续推的 trajectory ratio 怎么处理？","chapter":"异步调度","domain":"async","level":"进阶","course_day":54,"topic":"async-rollout","brief":"每个token应相对生成它的behavior policy计算ratio；把整条轨迹绑定单一old policy会错配后半段。","deep":"跨版本轨迹的每个片段都有自己的采样来源。完整行为概率需要按实际历史，把各位置所用版本的条件概率相乘。统一写一个最终版本号，会丢失前半段为何以这些概率产生的事实。前半段来自版本 10、后半段来自 12 时，完整行为概率是前半段在 10 下的条件概率乘以后半段在 12 下的条件概率。训练端每个位置应对照实际对应的行为记录。如果算法采用 token 级近似校正，也要保留这些记录，不能把所有旧概率重算成 12。更换模型后重算log-prob 可以计算另一个策略的概率，但无法改写已经发生的采样来源。","followup":"数据结构必须支持token或segment级behavior log-prob/version。 若框架只支持sequence级版本，应限制续推策略或明确近似。"},{"id":159,"code":"Q159","question":"partial sample 能否直接训练？","doc_title":"partial sample 能否直接训练？","chapter":"异步调度","domain":"async","level":"进阶","course_day":54,"topic":"async-rollout","brief":"取决于目标：若reward只在完整episode可得，未完成片段缺少return；若有合法bootstrap或局部reward，可构造截断target。","deep":"片段是否可训练，要看目标所需的反馈是否已经完整。系统已经返回部分 token，不代表最终奖励已经知道。算法若允许对未完成部分使用价值预测，也需要明确截断与补未来回报的规则。若只有最终成功与否的奖励，生成到一半时还不知道该给多少分，直接把它当失败会惩罚所有长回答。可以继续等待完成，或在算法明确支持时用 critic 预测尚未发生的未来回报。如果片段已经获得独立可验证的局部反馈，或目标只是固定前缀上的教师蒸馏，则可以有其他训练方式。它们需要各自的损失定义；“样本已返回”只是系统事件，并不自动意味着训练标签齐全。","followup":"区分等待完成、critic bootstrap和仅做蒸馏三条路径。 系统提前返回不等于环境terminal。"},{"id":160,"code":"Q160","question":"sliding admission queue 为什么降低长尾？","doc_title":"sliding admission queue 为什么降低长尾？","chapter":"异步调度","domain":"async","level":"进阶","course_day":54,"topic":"async-rollout","brief":"完成一个episode就补入新任务，避免固定batch等待最长轨迹；资源利用率提高但逻辑batch边界变弱。","deep":"滑动准入让一个任务结束后就补入新任务，减少等待同批最长任务造成的空闲。它改变请求调度，不自动规定训练如何分组、何时更新以及如何限制旧样本。假设四个 episode 分别耗时 1、1、1、10 秒。固定批次等待模式下，前三个槽位很早空闲，却要等最后一个结束才开始下一批。sliding admission 在任一槽位完成后立即加入新任务，填补这些空闲。它解决的是请求准入和长尾等待，不自动定义训练批次。训练端仍需决定收集多少完整组、是否按版本限制以及如何处理极长 episode。若只优先消费快任务，训练分布可能偏向简单任务。相关原始资料：异步 RL。","followup":"比较GPU空闲、环境并发、episode latency和policy版本跨度。 吞吐提升可能伴随staleness增加。"},{"id":161,"code":"Q161","question":"异步队列的 backpressure 放在哪里？","doc_title":"异步队列的 backpressure 放在哪里？","chapter":"异步调度","domain":"async","level":"进阶","course_day":54,"topic":"async-rollout","brief":"应在可控边界限制未消费trajectory、环境请求和权重版本跨度，防止rollout无限领先trainer。","deep":"反压就是下游处理不过来时，限制上游继续产生数据。异步 RL 中还要限制样本在队列中的年龄，避免队列内存充足却积累了大量过时数据。数量、体积和版本差是不同约束。队列限制通常应放在新任务准入、结果入队和训练取样三个位置。准入防止在途任务过多，入队防止结果挤占内存，消费检查防止等待过程中样本已过期。例如网络短暂阻塞，生成端已有大量未交付结果；只限制中心队列长度，会漏掉生产端本地缓存。容量统计需要包括这些在途数据，并按字节或 token 估计，不能只数中心队列的条目。","followup":"监控queue depth、age、drop rate与内存占用。 只限制条数不足以控制变长token体积。"},{"id":162,"code":"Q162","question":"过期样本应该 drop、reweight 还是 replay？","doc_title":"过期样本应该 drop、reweight 还是 replay？","chapter":"异步调度","domain":"async","level":"进阶","course_day":54,"topic":"async-rollout","brief":"默认先按分布距离设门槛：极端过期drop，中度用IS/clip，稳定高价值样本才考虑replay。","deep":"drop 是丢弃样本，reweight 是保留但改变权重，replay 是把旧样本再次使用。三者处理的不是同一个问题。replay 可以增加数据复用，却不会让旧数据变新。选择应由明确实验决定：比较不同版本差区间的概率比、有效梯度和任务收益。极端权重下裁剪可能仍不稳定，丢弃也可能系统性删掉长难题。不存在脱离数据和目标的通用版本阈值。若决定保留一条旧轨迹，应在采集时保存行为概率，不能等教师或生成器升级后再用新模型补算旧概率。若决定丢弃，则要记录被丢弃的任务类别和消耗的生成资源。这些记录允许回答两个实际问题：是否主要删掉了难题，以及提高有效样本质量是否值得额外采样成本。","followup":"用quality-vs-wall-time消融三种策略。 replay会进一步改变数据分布和组统计。"},{"id":163,"code":"Q163","question":"权重同步频率怎样选择？","doc_title":"权重同步频率怎样选择？","chapter":"异步调度","domain":"async","level":"进阶","course_day":54,"topic":"async-rollout","brief":"频繁同步降低staleness但增加广播、server暂停和cache失效；稀疏同步提高吞吐但扩大behavior-current差异。","deep":"同步频率决定新权重多久进入生成端。频繁发布使数据更接近当前模型，却带来加载与暂停；较慢发布减少切换开销，但数据更旧。应比较这两类成本对固定质量目标的影响。同步间隔短，推理端更快拿到新模型，但每次加载和缓存失效都有成本。间隔长，生成更连续，但训练可能持续消费旧分布。可扫描每 1、2、4 次更新发布一次权重，分别记录发布暂停时间、样本版本差和达到固定质量的耗时。这些数仅是实验设计示例。若中途回答长度变化明显，还要检查原结论是否依然成立。","followup":"画同步开销、版本差、KL和time-to-quality四条曲线。 只看tokens/s会偏向过低同步频率。"},{"id":164,"code":"Q164","question":"异步训练如何保证可复现排障？","doc_title":"异步训练如何保证可复现排障？","chapter":"异步调度","domain":"async","level":"进阶","course_day":54,"topic":"async-rollout","brief":"完全bitwise复现通常困难，但可以记录事件序、policy版本、seed、样本ID和队列决策，重建逻辑轨迹。","deep":"异步执行的完成顺序会受调度影响，完全重现每次事件并不容易。可复现排障至少应保留足够事实，让同一异常样本能在固定条件下重新计算，并解释它被何时、由哪个版本消费。可复现应区分完全相同的执行序列与能够解释同一异常。异步系统的调度顺序可能无法逐位复现，但若保存了采样 token、各片段版本、随机种子和消费批次，就能离线重算异常损失。若要重现自由生成，还需要独立请求随机流和可恢复环境。日志应使用全局可关联的任务 ID，而不是只写 worker 的本地计数；否则多个进程都出现“第 3 条样本”，无法知道是哪一条。","followup":"为单条异常trajectory提供冻结权重的deterministic replay。 系统异步不等于可以没有审计日志。"},{"id":165,"code":"Q165","question":"Agentic RL 的 action space 应怎样定义？","doc_title":"Agentic RL 的 action space 应怎样定义？","chapter":"Agent 环境","domain":"agent","level":"进阶","course_day":50,"topic":"agent-action","brief":"action可能是文本token、结构化tool call、GUI坐标或高层技能；训练mask必须只覆盖policy真正决定的字段。","deep":"动作空间就是模型允许选择的行为集合。语言模型用 token 表达行为，执行环境可能把它们理解为工具命令、网页操作或坐标点击。数据记录必须连接这两种表示。以网页检索为例，动作可以是“搜索这个词”“打开这个链接”“提交最终答案”。实现中，它们被编码成模型输出的 token；执行器再把这些 token 解析成工具名和参数。算法看到的是概率，环境看到的是命令，两者必须有可核对的对应关系。非法 JSON 也是模型实际产生的动作结果。应记录原始输出、解析失败及其后续处理，不能悄悄换成正确命令后仍用原输出的概率训练，否则奖励对应的动作与被更新的动作不一致。","followup":"保存解析前文本与解析后结构，并标记可学习action span。 tool observation不能误计入actor loss。"},{"id":166,"code":"Q166","question":"多轮轨迹为何不能简单拼成一段文本？","doc_title":"多轮轨迹为何不能简单拼成一段文本？","chapter":"Agent 环境","domain":"agent","level":"进阶","course_day":50,"topic":"agent-action","brief":"拼接保留了上下文，却可能丢失turn边界、环境状态、失败语义和每段policy版本。","deep":"文本拼接只解决模型输入的序列化，不自动保存环境事件的结构。角色、工具边界、每段版本和结束原因需要单独记录，否则后续计算可能无法区分模型动作与外部反馈。把多轮文本拼起来可以作为模型输入，但还需要保留每一段的身份。例如“删除文件”是用户请求、模型动作还是网页引用，含义完全不同。角色边界、工具调用边界、动作位置和终止状态不能在拼接中丢失。一个最小训练样本应能回答：模型在哪些位置作了选择，选择后环境返回什么，最后为什么结束。只有字符串而没有这些记录，通常无法正确做损失遮罩、分配奖励或分析失败。","followup":"使用segment元数据描述role、turn、action mask、observation和state id。 文本可序列化不代表数据模型充分。"},{"id":167,"code":"Q167","question":"环境 failure 与 agent failure 怎么区分？","doc_title":"环境 failure 与 agent failure 怎么区分？","chapter":"Agent 环境","domain":"agent","level":"进阶","course_day":50,"topic":"agent-action","brief":"环境超时、服务异常、工具不可用属于基础设施或环境失败；无效action、错误规划属于agent行为。混合会污染reward。","deep":"失败分类要服务于训练目标。模型能够通过更好动作避免的失败，与执行服务自身不可用造成的失败，应有不同记录。部署要求模型应对的可恢复环境故障，可以另外设计成明确的训练任务。模型提交了合法查询，搜索服务返回 503，属于服务失败；模型使用不存在的工具名，属于模型动作失败。先定义这两类，才能决定前者是否重试、后者是否进入任务失败统计。如果所有错误都记为零分，策略可能学会避开偶尔不可用但必要的工具。可以保留原始环境状态码，单独统计系统可用率，并在训练规则中明确重试和无效样本处理；不能只在报表里事后删掉失败。","followup":"定义failure taxonomy并保留重试前后的事件。 重试成功不能抹去原始失败原因。"},{"id":168,"code":"Q168","question":"tool call 的 reward 应落在哪个时间步？","doc_title":"tool call 的 reward 应落在哪个时间步？","chapter":"Agent 环境","domain":"agent","level":"进阶","course_day":50,"topic":"agent-action","brief":"若reward评价调用合法性可落在action turn；若评价工具结果与任务贡献，需等observation或终局后再分配。","deep":"奖励应对应它评价的那次选择，而不是机械放在日志到达的时刻。格式反馈可以在命令完成后得到，任务价值可能要等工具执行甚至整个任务结束后才知道，需要明确向哪些动作分配。时间步不一定等于一个 token。一次工具调用可能先生成 30 个 token，再等待 2 秒，最后得到一条反馈。应先规定回报按 token、决策轮次还是实际时间折扣，再把奖励放到对应的动作边界。例如每次工具调用扣 0.01，成功提交给 1 分，可以先在轮次层面定义奖励，再把轮次优势用于该轮模型输出。若把 0.01 误扣到每个 token，长参数调用会被额外惩罚，目标已经改变。","followup":"明确reward timestamp、credit target和是否向前传播。 调用成功不等于任务有贡献。"},{"id":169,"code":"Q169","question":"长时域 credit assignment 的主要方法有哪些？","doc_title":"长时域任务如何把最终结果归因到具体动作？","chapter":"Agent 环境","domain":"agent","level":"进阶","course_day":50,"topic":"agent-action","brief":"可用终局return、critic/GAE、process reward、hindsight relabel、counterfactual credit或层级value。","deep":"方法的区别在于额外利用了什么信息：终局回报只依赖最终结果，价值预测利用每个状态对未来的估计，过程奖励提供中间反馈，从同一状态尝试不同动作则提供更直接的比较。没有一种方法能免费得到精确归因。终局奖励只说最终成功，无法直接说明是哪一轮起了作用。可先训练价值函数，估计每一轮开始时的成功前景；某轮之后前景明显改善，就提供更细的学习信号，但其可靠性依赖价值估计质量。另一种办法是在同一个环境快照上比较不同动作的后续结果。它更接近“这一步造成了什么”，但需要多次执行，而且随机环境会增加比较噪声。过程评分成本较低，却可能把评分者偏好的步骤当成真正有效的步骤。","followup":"选择取决于环境可重放性、标注成本和状态可观测性。 密集奖励提高信号密度，也可能改变原任务。"},{"id":170,"code":"Q170","question":"STOP action 为什么需要单独建模？","doc_title":"STOP action 为什么需要单独建模？","chapter":"Agent 环境","domain":"agent","level":"进阶","course_day":50,"topic":"agent-action","brief":"停止决定成本与成功边界；过早停止损失完成度，过晚停止增加工具成本和犯错机会。","deep":"停止是一个决定是否继续投入资源的动作。它可以由普通输出 token 表达，但任务记录和奖励必须识别它的终止含义；不一定需要单独增加一个模型头。停止会同时决定答案内容、剩余成本和任务是否完成。过早停止可能遗漏验证，过晚停止可能反复搜索。因此停止动作必须能够得到与其他动作一致的概率、奖励和终止记录。达到系统最大轮数不等于模型主动停止。前者应记录为截断，后者记录为终止；如果还有未来收益却因预算被截断，是否用价值估计补尾部，要由算法规则决定，不能一律当作自然结束。","followup":"记录成功条件满足后的额外步数、premature stop与forced timeout。 把STOP当普通文本token会掩盖决策语义。"},{"id":171,"code":"Q171","question":"环境 snapshot 对训练有什么价值？","doc_title":"环境 snapshot 对训练有什么价值？","chapter":"Agent 环境","domain":"agent","level":"进阶","course_day":50,"topic":"agent-action","brief":"snapshot允许从关键状态重放、做反事实action比较和失败恢复，减少每次从头运行成本。","deep":"环境快照使训练能够从某个已知状态重新开始，便于失败恢复和比较不同后续动作。快照的价值取决于恢复完整性；如果关键外部资源没有保存，恢复出的就可能是另一个任务条件。环境快照是可恢复的任务状态。例如代码任务要保存文件内容、工作目录、测试依赖版本和已执行动作；只保存聊天记录，不保证重放时文件仍然一样。外部网页和远程服务未必可完整恢复。可在可控实验中保存工具响应，以复现模型看到的观察；但这只能复现记录中的交互，不能据此声称另一条动作路径会得到什么结果。","followup":"snapshot必须绑定环境版本、外部依赖和随机状态。 只保存对话历史无法恢复真实环境。"},{"id":172,"code":"Q172","question":"Agent 轨迹中的 observation 应参与 loss 吗？","doc_title":"Agent 轨迹中的 observation 应参与 loss 吗？","chapter":"Agent 环境","domain":"agent","level":"进阶","course_day":50,"topic":"agent-action","brief":"observation作为条件输入通常不应计算actor生成损失；只有模型需要预测环境时才有独立监督目标。","deep":"策略损失应评价模型自己作出的选择。工具观察通常只是后续选择的条件，因此不直接作为生成动作计算损失。若还要训练模型预测环境返回，可以另设监督目标，并与策略损失明确区分。假设输入是“用户问题｜模型调用工具｜工具返回｜模型答案”。通常仅模型调用和答案位置直接计算策略损失，用户问题与工具返回作为条件。用一条手工构造的样本打印每个 token 的 mask，最容易检查边界。mask 为零表示该位置不直接贡献这个损失，并不表示它不影响后续预测。后续答案的计算会利用工具返回的上下文，因此不能把“工具观察不算策略损失”误解成“模型无需处理工具观察”。","followup":"检查labels=-100或loss mask是否覆盖所有tool/environment token。 参与attention与参与loss是两件事。"},{"id":173,"code":"Q173","question":"多 Agent RL 的非平稳性来自哪里？","doc_title":"多 Agent RL 的非平稳性来自哪里？","chapter":"Agent 环境","domain":"agent","level":"进阶","course_day":50,"topic":"agent-action","brief":"其他agent策略也在更新，使单个agent看到的环境转移分布变化；通信协议和角色分工也会漂移。","deep":"多个模型同时学习时，每个模型遇到的其他模型行为都在改变。这使过去有效的协作或对抗策略未必继续有效，训练数据相对伙伴版本也会变旧，需要记录版本并设计稳定的对照评估。两个协作模型同时训练时，模型 A 面对的 B 会不断改变。A 昨天学会的约定，今天可能失效；从 A 的角度，环境响应规则在变化，这就是训练中的非平稳性。可固定一方训练另一方、降低对方更新频率，或从多个历史版本中采样伙伴。这样能降低变化速度或增加鲁棒性，但不保证找到全局最优合作。评估还应包含陌生伙伴，防止只在固定组合中有效。","followup":"记录每个agent版本并做固定opponent评估。 把所有agent共享一个checkpoint不能自动消除非平稳。"},{"id":174,"code":"Q174","question":"Agentic benchmark 成功率为什么不够？","doc_title":"Agentic benchmark 成功率为什么不够？","chapter":"Agent 环境","domain":"agent","level":"进阶","course_day":50,"topic":"agent-action","brief":"成功率不反映步骤成本、恢复能力、非法调用、延迟和方差；相同成功率可能对应完全不同的部署价值。","deep":"任务成功率没有说明用了多少资源，也没有说明失败后能否恢复。可靠的 Agent 评测需要同时检查成本、完成时间和行为有效性，让相同成功率下不同的执行质量可见。两个 agent 都有 80% 成功率，一个平均调用 3 次工具，另一个调用 30 次；在成本和时延上显然不同。成功率相同时，还应看费用、完成时间、无效动作率和失败后的恢复情况。指标必须按同一任务集合和预算比较。提高工具调用上限后成功率上升，可以说明额外预算有效，却不能直接证明策略更高效。可画成功率随成本预算变化的曲线，让取舍显式呈现。","followup":"至少报告success、steps、tool cost、recovery rate和p95 latency。 平均步数需在成功/失败样本上分开看。"},{"id":175,"code":"Q175","question":"MoE RL 中 router 为什么可能比 dense 更不稳定？","doc_title":"MoE 路由变化为什么会影响 RL 稳定性？","chapter":"分布式统计","domain":"distributed","level":"进阶","course_day":28,"topic":"parallel-topology","brief":"RL更新分布持续变化，少量高advantage token可集中路由到部分expert，放大负载与参数更新不均。","deep":"MoE 路由器不只是计算细节，它决定 token 被哪些专家处理，从而影响负载与输出。监测它的目的，是区分策略内容变化造成的合理负载转移，与数值或分片实现错误造成的异常。MoE 路由器决定一个 token 交给哪些专家网络。若大量 token 突然集中到少数专家，某些 GPU 很忙，另一些等待，整体耗时增加；即使总 token 数不变也会发生。RL 会改变模型输出内容和长度，进而改变专家负载。应按层记录专家接收 token 的分布、溢出或丢弃比例和通信等待，区分真实路由变化与实现错误。均衡辅助损失也属于训练目标，不能悄悄改变系数。","followup":"同时看router entropy、expert load、drop token和每expert grad norm。 总token均衡不能证明每类任务路由一致。"},{"id":176,"code":"Q176","question":"EP、TP、DP 分别改变哪些通信？","doc_title":"EP、TP、DP 分别改变哪些通信？","chapter":"分布式统计","domain":"distributed","level":"进阶","course_day":28,"topic":"parallel-topology","brief":"TP在层内聚合张量，EP在expert间dispatch/combine，DP同步梯度；三者叠加时通信拓扑与序列长度共同决定瓶颈。","deep":"不同并行方式切分的是不同对象：专家并行切专家，张量并行切层内计算，数据并行切样本。切分后要交换的数据也不同，因此组合方案需要同时考虑通信种类、数据量和发生时刻。张量并行把一个大矩阵乘法分给多张卡，需要交换部分计算结果；专家并行把不同专家放到不同卡，需要把 token 发往专家所在位置；数据并行让多个副本处理不同样本，需要汇总梯度。这三类通信可能竞争同一网络。例如专家路由的大量 all-to-all，与梯度同步同时发生，单项测试都很快，组合后却拥塞。因此应看真实训练时间线中的重叠和等待，不能只把各自带宽峰值相加。","followup":"用timeline区分all-reduce、all-to-all和等待。 不能把所有NCCL时间都归为DP。"},{"id":177,"code":"Q177","question":"sequence parallel 对 RL 有什么额外风险？","doc_title":"sequence parallel 对 RL 有什么额外风险？","chapter":"分布式统计","domain":"distributed","level":"进阶","course_day":28,"topic":"parallel-topology","brief":"序列切分会影响mask、position、token统计和跨rank reduction；变长response更易造成不均。","deep":"“序列并行”在不同框架中含义不同。Megatron 常见的 sequence parallel 是把 LayerNorm、Dropout 等操作的激活沿序列维切开，并配合张量并行通信；它不等于把整个注意力计算都按上下文切开。长上下文注意力的分片通常另称 context parallel。例如某层本来每张卡保留长度 4096 的激活，分片后每卡保留其中一段，可减少重复保存。风险在于进入下一算子时是否需要重新聚合、位置和 mask 是否匹配，以及反向通信是否正确。回答前应先确认讨论的是哪一种实现。相关原始资料：上下文并行。","followup":"用单序列小batch对齐未切分loss和grad。 张量shape正确不代表reduction语义正确。"},{"id":178,"code":"Q178","question":"context parallel 如何处理变长轨迹？","doc_title":"context parallel 如何处理变长轨迹？","chapter":"分布式统计","domain":"distributed","level":"进阶","course_day":28,"topic":"parallel-topology","brief":"CP按序列维切分长上下文，但padding、ring attention和segment边界决定实际负载。","deep":"长序列分到多张卡后，每张卡负责的 token 数和注意力工作量未必相同。变长打包又增加了样本边界，必须同时保证负载均衡与正确的跨卡上下文可见范围。上下文并行把长序列的注意力计算分散到多张卡。不同长度的序列会让分片工作量不同；因果注意力下，靠后位置还可能需要看到更多先前 token，因此简单按连续区间切分不一定均衡。把样本打包后，还需保留每个原始样本的边界，使样本 A 不能注意到样本 B。应分别验证位置编码、跨卡 K/V 交换和 attention mask；吞吐提升但这些边界出错，会造成训练目标污染。","followup":"记录每rank有效token、通信量和attention mask覆盖。 max length相同不代表有效计算均衡。"},{"id":179,"code":"Q179","question":"为什么 distributed advantage normalization 容易写错？","doc_title":"为什么 distributed advantage normalization 容易写错？","chapter":"分布式统计","domain":"distributed","level":"进阶","course_day":28,"topic":"parallel-topology","brief":"各rank样本数和有效token数不同，mean-of-means会产生偏差。应聚合count、sum和sum-square。","deep":"局部平均再平均，只有在各部分权重满足特定条件时才等于全局平均。变长样本和不完整候选组很容易破坏这些条件。实现应明确统计范围，并汇总正确的计数、和与平方和。组内优势归一化必须知道同一问题的完整候选组。若八个候选分到两张卡，各自减去本卡均值，结果一般不同于使用八个候选的统一均值，已经改变算法。组内归一化与全批次优势标准化也不同。前者比较同一个问题的回答，后者重新缩放整个批次。分布式实现应明确需要聚合的是每组的和、平方和及计数，还是全局统计，不能只复用一个“normalize”函数。","followup":"与收集到单卡后的reference结果逐元素比较。 all-reduce一个mean不够。"},{"id":180,"code":"Q180","question":"packed sequence 会改变 RL loss 吗？","doc_title":"packed sequence 会改变 RL loss 吗？","chapter":"分布式统计","domain":"distributed","level":"进阶","course_day":28,"topic":"parallel-topology","brief":"正确mask和position下不应改变语义，但跨样本attention泄漏、EOS边界和loss denominator错误会改变结果。","deep":"打包本身可以只改变存储和执行，但是否保持训练目标不变，取决于样本边界、注意力范围和损失归一化是否保留。形状相同或总 loss 接近，都不足以替代逐位置检查。打包是把多个短样本放进一个长缓冲区，以减少 padding。若 A 有 10 个有效输出 token，B 有 100 个，“所有 token 的平均损失”会给 B 十倍总权重；“先各样本平均再平均”则给两者相同权重。还要检查跨卡梯度缩放。每卡有效 token 数不同时，先取本地均值再对卡平均，不一定等于全局 token均值。正确实现应按目标累积损失分子和有效计数，而不是默认每张卡权重相同。","followup":"构造两条短序列，对比packed与unpacked logits/loss。 吞吐收益建立在严格隔离上。"},{"id":181,"code":"Q181","question":"FSDP 与 Megatron 做 RL actor 的选型标准是什么？","doc_title":"FSDP 与 Megatron 做 RL actor 的选型标准是什么？","chapter":"分布式统计","domain":"distributed","level":"进阶","course_day":28,"topic":"parallel-topology","brief":"FSDP集成灵活，Megatron在大规模TP/PP/EP与高MFU上更成熟；选择取决于模型规模、MoE、checkpoint和训推转换成本。","deep":"FSDP 的核心是把参数、梯度和优化器状态分片保存，在需要时聚合参数；Megatron 的常见方案进一步使用张量、流水线等模型内部并行。实际项目可以组合这些思想，不能把两者当成严格互斥的产品类别。选择要看模型能否放下、序列长度、网络条件和现有算子支持。若主要问题是优化器状态占显存，分片很有帮助；若单层计算本身必须跨卡，通常还需要层内并行。最后用目标规模上的实测决定。测试选型时至少使用接近目标的层数、隐藏维度和序列长度。小模型可以验证正确性，却可能无法暴露真实的参数聚合、流水线空闲或跨机通信瓶颈。还要确认训练权重能转换到目标推理引擎的分片格式；训练侧更快但发布权重极慢，可能拖累整个 RL 循环。","followup":"用目标模型做端到端rollout+update+sync基准。 只比较纯训练tokens/s不覆盖RL链路。"},{"id":182,"code":"Q182","question":"PP bubble 在 RL 中为什么更复杂？","doc_title":"PP bubble 在 RL 中为什么更复杂？","chapter":"分布式统计","domain":"distributed","level":"进阶","course_day":28,"topic":"parallel-topology","brief":"变长microbatch与actor/critic/reference多模型调度让pipeline stage耗时不齐，生成阶段又不是常规训练流水。","deep":"流水线并行需要多个微批次交错流过模型各阶段，才能减少设备空闲。RL 中样本长度和批量持续变化，会影响各阶段是否均衡，以及是否有足够任务把流水线填满。流水线并行把不同层放到不同设备，微批次依次流过这些阶段。开始和结束时有些阶段暂时无活可做，这部分空闲叫 bubble。微批次太少或各阶段耗时不均，空闲比例会变大。RL 的训练批次和回答长度会变化，同一个流水线配置未必一直高效。增加微批次数可能改善填充，却也会改变梯度累积和显存占用。应保持有效批量和更新规则可比，再比较调度效果。","followup":"按stage画forward/backward/idle并检查microbatch token分布。 增加microbatch数量可能提高显存和调度开销。"},{"id":183,"code":"Q183","question":"NCCL timeout 为什么常是后果而不是根因？","doc_title":"NCCL timeout 为什么常是后果而不是根因？","chapter":"分布式统计","domain":"distributed","level":"进阶","course_day":28,"topic":"parallel-topology","brief":"某rank更早OOM、异常退出或进入不同collective后，其他rank最终在NCCL等待超时。","deep":"超时通常是等待失败的表现，真正原因可能更早发生在另一个进程中。统一时间戳和通信编号可以把等待者与失去进度的参与者联系起来，避免只在网络层反复调整参数。NCCL 超时表示某次跨 GPU 通信没有在期限内完成，原因可能在通信之前：一个进程发生 OOM 退出，其他进程仍在等它；或者不同进程走了不同分支，发起的集合通信次序不一致。先按时间找最早异常，并核对各 rank 最后进入的算子。延长 timeout 只适合确认存在合法但很慢的阶段；它不能修复缺席进程或次序不一致，反而可能让故障更晚暴露。","followup":"按统一时间轴找首个异常，并核对collective序号。 最后打印timeout的rank通常不是肇因。"},{"id":184,"code":"Q184","question":"分布式 RL checkpoint 需要保存哪些状态？","doc_title":"分布式 RL checkpoint 需要保存哪些状态？","chapter":"分布式统计","domain":"distributed","level":"进阶","course_day":28,"topic":"parallel-topology","brief":"除模型/optimizer外，还需scheduler、RNG、policy version、数据/队列游标和必要的环境状态。","deep":"分布式存档要保存一个自洽的训练时刻。各设备参数、优化器历史和数据进度必须对应同一次已提交更新，否则恢复后可能出现参数一致但训练顺序错乱的情况。恢复训练需要的不只是模型参数。Adam 的一阶、二阶历史统计会影响下一次更新，学习率调度器决定下一步步长，随机数状态和数据游标决定下一批数据。异步 RL 还应处理待消费样本及其策略版本：可以一起保存，也可以声明恢复后清空并重新采样。关键是恢复规则自洽，不能加载新参数后把无版本记录的旧队列直接当新样本继续训练。","followup":"做中断恢复后首个step的sample id、loss与版本对齐检查。 权重可加载不等于训练语义可续。"},{"id":185,"code":"Q185","question":"训练与 rollout log-prob 为什么会不一致？","doc_title":"训练与 rollout log-prob 为什么会不一致？","chapter":"Rollout/Serving","domain":"inference","level":"进阶","course_day":33,"topic":"kv-scheduling","brief":"常见来源是权重版本、dtype/quantization、tokenizer/template、sampling变换、kernel和并行reduction差异。","deep":"用完全相同的 token 序列和前缀，分别让训练端与推理端计算 log-prob。若仍不同，再逐步检查tokenizer、模板、位置编码、精度、词表处理和模型权重，而不是先比较两个自由生成的回答。要比较的是同一数学对象。原始 softmax 概率、经过温度后的采样概率、top-p 截断后的概率都可能叫log-prob，但含义不同。日志必须标注返回哪一种，否则数值差异可能来自定义，而非实现错误。","followup":"固定同一token序列，从单卡BF16开始逐项恢复配置。 生成token一致不代表完整分布一致。"},{"id":186,"code":"Q186","question":"temperature 应怎样进入 behavior log-prob？","doc_title":"temperature 应怎样进入 behavior log-prob？","chapter":"Rollout/Serving","domain":"inference","level":"进阶","course_day":33,"topic":"kv-scheduling","brief":"若采样使用logits/T，behavior概率应对应温度变换后的分布；训练时必须明确ratio相对原始policy还是实际采样分布。","deep":"温度 T 把 logits 除以 T 后再做 softmax。以两个 logits 为 2 和 0 为例，T=1 时第一个动作概率约为 0.881，T=2 时约为 0.731，采样分布确实改变了。如果重要性采样分母声称记录真实行为分布，就应包含实际温度及其他采样变换。若某种实现有意用原始模型概率近似，则要明确这是一种算法约定，并验证偏差，而不能把两种概率混称为同一项。这个变换只影响概率计算，不会直接修改模型参数。提高温度后答案更多样，不表示模型已经学会更多方法；后续训练是否保留这些行为，仍取决于奖励和更新。排障时可先关闭候选截断，只扫描温度，核对推理记录的概率是否等于按同一温度手工计算的结果。","followup":"保存sampling参数并离线复算选中token概率。 只保存模型原始log-prob会错配behavior。"},{"id":187,"code":"Q187","question":"top-k/top-p 对 on-policy 性有什么影响？","doc_title":"top-k/top-p 对 on-policy 性有什么影响？","chapter":"Rollout/Serving","domain":"inference","level":"进阶","course_day":33,"topic":"kv-scheduling","brief":"截断采样把behavior变成重归一化后的分布，与原始softmax不同。若分母仍用原始policy，IS语义不严格。","deep":"top-k 只保留概率最高的 k 个候选，top-p 保留累计概率达到门槛的一组候选，然后重新归一化。被删掉的 token 采样概率为零，即便原始模型给它非零概率。这会影响严格的重要性采样：目标分布若给某动作非零概率，但行为分布永远不采到它，仅靠已有样本的重新加权无法补出这部分贡献。因此要区分实际截断采样分布和算法使用的模型分布，并说明近似范围。以原始概率 [0.6,0.3,0.1] 为例，若 top-k 保留两个候选，实际采样概率变为 [2/3,1/3,0]。第一个 token 的原始概率是 0.6，行为概率却是约 0.667。即使模型参数没有变化，混用这两个值也会让本应为 1 的同策略概率比偏离 1。\n\n这个三候选例子适合做采样器接口验收。","followup":"记录截断集合与归一化常数，或明确采用近似。 采样器是policy的一部分。"},{"id":188,"code":"Q188","question":"continuous batching 会改变模型分布吗？","doc_title":"continuous batching 会改变模型分布吗？","chapter":"Rollout/Serving","domain":"inference","level":"进阶","course_day":33,"topic":"kv-scheduling","brief":"理论上不应，但调度会改变batch形状、kernel路径和数值累加顺序，低精度下可能影响边界token。","deep":"continuous batching 会在旧请求生成时接纳新请求，主要改变调度。若每个请求使用独立随机流、相同权重和相同采样规则，数学上不应因邻居请求不同就更换自身采样分布。实际数值算子、动态形状、随机数消费顺序或权重切换可能随调度变化。应先做固定 token 的概率一致性测试，再测试独立请求种子能否重放。不能看到生成文本不同就直接断定概率分布被破坏。独立随机流可以理解成“每个请求有自己的随机数账本”。请求 A 插入或提前结束，不应改变请求 B下一次要使用哪一个随机数。若全服务共用同一条随机流，批处理次序会改变每个请求拿到的数，即使每次采样仍遵循正确分布，也无法仅靠 B 的请求种子逐次重放原回答。","followup":"对固定请求做独占与并发bit/概率差异测试。 结果大体一致不等于log-prob可直接复用。"},{"id":189,"code":"Q189","question":"overlap scheduler 为什么影响确定性？","doc_title":"overlap scheduler 为什么影响确定性？","chapter":"Rollout/Serving","domain":"inference","level":"进阶","course_day":33,"topic":"kv-scheduling","brief":"计算与通信重叠会改变执行顺序和kernel组合，浮点非结合性使logits出现微小差异，采样边界可能被放大。","deep":"计算通信重叠可能改变浮点加法的次序，而浮点加法并非严格满足结合律。细小差异若让两个接近的候选交换顺序，后续自由生成就可能明显不同。因此检查分两层：固定输入下看数值误差和梯度误差，自由生成下看统计质量和训练稳定性。逐 token完全一致是更强要求，需要固定算子、调度和随机流，不能默认所有高性能配置都满足。例如在有限精度下，把一个很小的数加到一个极大数上，可能因舍入而丢失；改变相加顺序，结果可能不同。并行梯度汇总也存在这个问题。因此“相同种子”不等于“相同所有浮点运算”。对于只要求统计复现的实验，应预先定义重复次数和质量波动范围，并把它与逐位一致的调试模式区分开。","followup":"先禁用overlap建立基线，再逐项开启。 确定性问题要区分logits误差与采样放大。"},{"id":190,"code":"Q190","question":"KV cache 精度会影响 rollout policy 吗？","doc_title":"KV cache 精度会影响 rollout policy 吗？","chapter":"Rollout/Serving","domain":"inference","level":"进阶","course_day":33,"topic":"kv-scheduling","brief":"量化或不同dtype的KV会改变后续attention输出，误差随长上下文累积，实际生成分布因此变化。","deep":"KV cache 保存先前 token 的 key 和 value，供后续注意力使用。降低缓存精度可节省显存，但它改变的是后续每一步读取的上下文表示，误差可能持续影响一整段生成。可先比较固定长前缀后的 logits，再扫描不同上下文长度和量化配置。短句看不出差异，并不代表长上下文同样可靠。还应记录缓存节省带来的并发收益，与概率误差共同判断价值。注意力用当前查询 q 与历史 key 计算相关程度，再按这些权重加权历史 value。key 误差可能改变“关注哪一段历史”，value 误差则改变“读到的内容”。两者都可能影响下一 token。这样区分有助于设计检查：除了整体生成质量，还可固定查询和历史，比较注意力分布与输出向量的差异。","followup":"按position测选中token log-prob误差和分叉率。 只测prefill首token不足以覆盖长生成。"},{"id":191,"code":"Q191","question":"MTP/speculative decoding 能直接用于 RL rollout 吗？","doc_title":"MTP/speculative decoding 能直接用于 RL rollout 吗？","chapter":"Rollout/Serving","domain":"inference","level":"进阶","course_day":33,"topic":"kv-scheduling","brief":"若最终接受分布严格等于target model，可保持采样正确；实现近似、log-prob记录或接受规则错误会改变behavior。","deep":"标准的精确推测解码让小模型提出候选，再由目标模型通过接受和拒绝规则校正；在满足算法条件且数值实现正确时，最终采样分布可以保持目标分布。并不是所有“多 token 预测”实现都具备这个性质。RL 需要记录最终被接受轨迹在所采用行为策略下的概率。不能把草稿模型的概率填进目标策略的behavior log-prob。若跳过校正来换速度，应明确它改变了采样机制，并重新评估训练目标的一致性。相关原始资料：推测解码。","followup":"核对accepted token的target log-prob与采样分布，并做无MTP对照。 吞吐等价不代表训练数据等价。"},{"id":192,"code":"Q192","question":"推理引擎返回的 logprobs 能直接训练吗？","doc_title":"推理引擎返回的 logprobs 能直接训练吗？","chapter":"Rollout/Serving","domain":"inference","level":"进阶","course_day":33,"topic":"kv-scheduling","brief":"只有在权重、模板、采样变换、精度和token定义一致时才可作为behavior log-prob；否则应重算或校准。","deep":"推理返回的 log-prob 是否能用于训练，取决于它对应的模型版本、前缀和采样变换。例如接口返回只含前五名的概率，若实际 token 不在其中，就不足以重建该动作的行为概率。最小验证是用已保存 token 在对应行为权重上重算，再逐位置比较。还要确认 token 的偏移：预测第 t个 token 的 logits 来自前一个位置，错一格也会产生形状正确但意义错误的损失。","followup":"抽样用trainer forward逐token对齐。 API字段名叫logprobs不是正确性证明。"},{"id":193,"code":"Q193","question":"weight update 后 KV cache 为什么必须失效？","doc_title":"权重更新后如何判断旧 KV cache 是否仍有效？","chapter":"Rollout/Serving","domain":"inference","level":"进阶","course_day":33,"topic":"kv-scheduling","brief":"KV由旧权重投影得到，模型权重变化后继续使用会形成混合策略状态。","deep":"换权重后，已缓存的 K/V 通常与新模型重新计算的结果不同，因此不能默认复用。判断依据是参数依赖：如果更新影响了生成这些 K/V 的层，就应重算或废弃相应缓存。也存在有限例外，例如只更新最终输出头、所有产生 K/V 的计算完全不变时，旧 K/V 可能仍有效。正确规则是依据实际依赖和实现验证缓存有效性，而不是把“任何参数变化”或“同形状”当作充分判断。一个直接验证办法是固定前缀，用新权重分别做“完全重算前缀”和“复用旧缓存后续算”，比较下一位置的 logits。若差异超过预期数值误差，就说明缓存复用没有保持同一个模型计算。生产实现还需为缓存附上版本或依赖标记，使调度器能自动拒绝不匹配的缓存，而不依赖人工记忆。","followup":"cache key绑定model version，更新后强制清理或隔离。 只更新后续层也可能使已有cache不兼容。"},{"id":194,"code":"Q194","question":"如何定义训推一致性的验收阈值？","doc_title":"如何定义训推一致性的验收阈值？","chapter":"Rollout/Serving","domain":"inference","level":"进阶","course_day":33,"topic":"kv-scheduling","brief":"先从任务容忍度反推：比较token log-prob误差、KL、生成分叉率与最终quality，而不是给全局固定绝对误差。","deep":"误差阈值应同时考虑绝对误差、相对误差和任务敏感性。log-prob 相差 0.01 对某些位置可能很小，但若跨很长序列累积，序列概率比可能明显变化。可报告位置误差的分位数、极端值、由此形成的 ratio 分布，以及一次更新的梯度差。先建立高精度参考，再通过短程训练验证允许范围。不存在适用于所有长度、精度和算法的单一阈值。阈值还应考虑被测量的概率方向。例如非常低概率 token 的相对误差可能很大，却很少被实际采样；高概率动作的较小误差却可能持续影响生成。可以同时报告按行为分布加权的平均误差和未加权极端值，避免只看其中一个漏掉常见位置或罕见异常位置。","followup":"用短/长上下文、常规/极端token和目标并行配置分层验收。 单个max error容易被无关低概率token主导。"},{"id":195,"code":"Q195","question":"FP8 rollout 为什么可能导致 off-policy？","doc_title":"FP8 rollout 为什么可能导致 off-policy？","chapter":"低精度/性能","domain":"precision","level":"进阶","course_day":16,"topic":"fp8-numerics","brief":"FP8权重/激活与BF16 actor产生不同分布；若behavior log-prob按BF16重算，分母不再是实际采样策略。","deep":"FP8 是低精度数值表示，本身不等于 off-policy。off-policy 讨论的是训练目标策略与数据生成策略是否不同；低精度可能使两个执行端的实际概率出现差异，进而加重这种不一致。如果生成和训练都使用同一套定义并且概率可正确记录，不能仅因使用 FP8 就判定训练错误。应测量权重版本差、执行数值差和采样变换差，分别定位来源，而不是用一个术语概括全部问题。排查可以做三组固定轨迹对照：两端都用较高精度，只有推理端改为 FP8，两端使用计划中的实际配置。第一组建立基线，第二组隔离推理量化，第三组检查组合效果。对照应使用相同 token 和权重，否则自由生成分叉或版本差会掩盖数值来源，无法判断问题究竟来自哪里。","followup":"同token比较FP8与BF16 log-prob、KL和生成分叉。 ‘同一checkpoint’不等于同一policy。"},{"id":196,"code":"Q196","question":"FP8 block scaling 的粒度影响什么？","doc_title":"FP8 block scaling 的粒度影响什么？","chapter":"低精度/性能","domain":"precision","level":"进阶","course_day":16,"topic":"fp8-numerics","brief":"scale粒度决定量化误差与metadata成本；更细粒度通常误差小但kernel和存储更复杂。","deep":"缩放粒度决定多少数值共享同一个量化尺度。粒度较细可以更贴近局部数值范围，但需要保存更多缩放信息，也可能增加算子开销。需要一起比较误差、存储和实际执行速度。FP8 可表示范围有限，通常需要缩放因子。整个张量共用一个 scale，开销小，但少量极大值可能挤压其他值的有效精度；按通道或小块使用 scale，适应性更好，元数据与算子复杂度也更高。例如一个张量大多数值约为 0.01，少数值为 100，共用 scale 时小值可能严重失真。应检查具体硬件和算子支持的格式、缩放更新规则及溢出统计，不能只报告“已经开 FP8”。","followup":"按层、token位置和outlier通道分析误差。 权重scale与激活scale粒度不能混为一谈。"},{"id":197,"code":"Q197","question":"为什么低精度误差在 RL 中会被放大？","doc_title":"为什么低精度误差在 RL 中会被放大？","chapter":"低精度/性能","domain":"precision","level":"进阶","course_day":16,"topic":"fp8-numerics","brief":"RL的sampling、ratio exp、clipping和稀疏reward形成非线性链路，小logit差异可改变token，继而改变整条trajectory。","deep":"RL 损失经常把对数概率差取指数，再依据结果裁剪或重新加权。数值误差可能因此改变样本权重和梯度是否被保留，所以应检查误差经过完整损失计算后产生了什么影响。若当前与旧策略的 log-prob 差为 0.1，概率比是 exp(0.1)，约为 1.105；若测量误差又加了 0.2，比例就变成约 1.350。指数变换会把 log 空间误差传给优化权重。此外，误差可能把样本推到 PPO 裁剪区间的另一侧，从而改变是否产生梯度。检查数值问题不应停在模型输出误差，还应观察 loss、clip fraction 和梯度方向这些实际训练结果。","followup":"同时评估局部数值误差与端到端分叉。 SFT loss对齐不能替代rollout质量验证。"},{"id":198,"code":"Q198","question":"长上下文 RL 的峰值显存主要在哪里？","doc_title":"长上下文 RL 的峰值显存主要在哪里？","chapter":"低精度/性能","domain":"precision","level":"进阶","course_day":16,"topic":"fp8-numerics","brief":"除模型状态外，还有attention/KV、activation、log-prob、old/reference输出、packed metadata和通信buffer。","deep":"长上下文训练的显存包括参数、优化器状态、激活和临时算子缓冲。激活通常随 token 数增长，某些注意力实现还会产生很大的中间矩阵；是否保存该矩阵取决于具体算子，不能一律按长度平方估计所有实现。推理则常受 KV cache 和并发请求影响。应在真实峰值时抓取内存记录，并标注所在阶段。平均显存不高仍然可能 OOM，因为某个反向算子或参数聚合会出现短时峰值。例如一条普通样本训练正常，混入一条四倍长度的样本后只有某一步峰值突增，首先应检查该步实际token 数和激活保存，而不是直接怀疑内存泄漏。泄漏通常表现为本应释放的对象在步间持续存活。把每步结束后的稳定占用与步内峰值分开记录，能快速区分这两种形态。","followup":"按阶段采样allocated/reserved并结合timeline定位峰值。 静态模型参数量不能解释运行峰值。"},{"id":199,"code":"Q199","question":"remove padding 为什么有时不提速？","doc_title":"remove padding 为什么有时不提速？","chapter":"低精度/性能","domain":"precision","level":"进阶","course_day":16,"topic":"fp8-numerics","brief":"虽然减少有效算子，但unpad/repad、索引、通信和不规则shape可能抵消收益；某些kernel仍按bucket计算。","deep":"去 padding 减少无效位置的计算，但不减少所有系统成本。如果原来主要等待通信或外部工具，省下的算子时间只占总时间一小部分；不规则形状也可能降低新算子的执行效率。去掉 padding 只减少无效 token 的工作。如果总时间主要花在通信、模型加载或工具等待上，这部分节省未必反映成明显的端到端加速。还有形状代价：原先规则的大矩阵改成许多不规则小块，算子利用率可能下降。应分别记录有效token、实际计算 token、算子时间和总时间，才能知道是节省被其他瓶颈遮住，还是新实现本身不够高效。","followup":"比较有效token、kernel time、重排开销和端到端wall time。 FLOPs减少不等于latency同比下降。"},{"id":200,"code":"Q200","question":"gradient checkpointing 在 RL 中的代价是什么？","doc_title":"激活重计算怎样用计算换显存？","chapter":"低精度/性能","domain":"precision","level":"进阶","course_day":16,"topic":"fp8-numerics","brief":"它用重算换显存，actor多epoch或多模型共置时可能显著增加计算，并改变overlap窗口。","deep":"activation checkpointing 是少保存一部分前向中间结果，在反向需要时重新计算，用额外计算换显存。它与把模型写到磁盘用于故障恢复的 checkpoint 是两件事。若节省显存后可以提高有效 batch 或减少 CPU 搬运，端到端训练可能反而更快；若原本显存充足，重计算通常增加开销。还需保证重计算与原前向一致，例如正确处理 Dropout 的随机状态。可以选择只重算最占显存的层，也可以重算整个模型块。范围越大，保存的激活通常越少，额外前向计算越多。实际测试应固定有效批量和序列长度，比较显存峰值与完整更新耗时；如果为了利用省下的显存又改变批量，应把“计算方法的差异”和“批量改变的差异”分别报告。","followup":"比较峰值显存、step time和可增加的batch/token数。 单看一次forward开销会低估完整PPO epoch成本。"},{"id":201,"code":"Q201","question":"OOM 应优先减 microbatch 还是 sequence length？","doc_title":"OOM 应优先减 microbatch 还是 sequence length？","chapter":"低精度/性能","domain":"precision","level":"进阶","course_day":16,"topic":"fp8-numerics","brief":"先定位峰值随哪个维度增长；减microbatch保留任务长度，截断sequence会改变数据和目标。","deep":"降低批量主要减少同时处理的数据，降低序列长度则改变每条样本的工作量和可见上下文。两者对目标和质量影响不同。应先定位显存峰值来自哪个阶段，再选择最少改变任务的办法。先看 OOM 随哪个维度出现：增加并发请求才触发，优先检查 KV 容量；单个极长样本就触发，优先检查序列相关激活和临时缓冲；第一次 optimizer.step 才触发，可能是优化器状态首次分配。降低 batch 是定位手段，但会改变有效批量和更新噪声。若采用梯度累积补回有效 batch，还要确认损失归一化保持原定义。不能只以“跑通”为标准忽略训练语义变化。","followup":"用显存模型和小范围扫参区分activation、KV或logits主导。 不要默认截断长轨迹是纯系统优化。"},{"id":202,"code":"Q202","question":"CPU offload 的瓶颈如何判断？","doc_title":"CPU offload 的瓶颈如何判断？","chapter":"低精度/性能","domain":"precision","level":"进阶","course_day":16,"topic":"fp8-numerics","brief":"比较PCIe/NVLink带宽、同步等待、CPU内存占用和计算重叠；若传输在critical path，显存收益会换成吞吐损失。","deep":"CPU offload 用更慢但容量更大的主存替代部分 GPU 显存。它能够让原来放不下的训练运行起来，但增加数据传输和可能的 CPU 计算，性能判断必须包括这些额外工作。CPU offload 是把部分参数或优化器状态放到主存，需要时在 CPU 与 GPU 间搬运。它增加可用容量，但搬运速度通常远低于 GPU 本地显存访问。如果每步都等待传输，GPU 会出现空闲。应检查传输是否可预取、是否与计算重叠，以及主存是否足够。比较方案时包含数据搬运和 CPU 计算成本，而不是只比较 GPU 峰值显存。","followup":"用timeline而不是GPU util单指标。 异步copy调用不保证真正重叠。"},{"id":203,"code":"Q203","question":"吞吐应该用 samples/s 还是 tokens/s？","doc_title":"吞吐应该用 samples/s 还是 tokens/s？","chapter":"低精度/性能","domain":"precision","level":"进阶","course_day":16,"topic":"fp8-numerics","brief":"变长RL中samples/s易被长度分布误导；tokens/s更接近计算量，但也需区分generated、trained和有效action tokens。","deep":"吞吐口径取决于想衡量什么。样本数适合观察任务完成能力，token 数适合观察生成或训练的计算效率；回答长度变化时，两者可能朝不同方向移动，应同时报告。tokens/s 必须说明分母时间和分子口径：生成 token、训练有效 token、包含 padding 的 token，数值不同。把 padding 也算进去，会让浪费更多计算的系统看起来更快。端到端还应报告达到固定评测质量需要的时间和资源。某优化让每秒生成更多 token，但样本更旧、丢弃更多，未必让训练更快达到目标。吞吐是过程指标，不能自动替代训练收益。","followup":"同时报告time-to-quality与各类token吞吐。 更高tokens/s可能来自生成更多无用长答案。"},{"id":204,"code":"Q204","question":"如何做性能优化而不改变算法语义？","doc_title":"如何做性能优化而不改变算法语义？","chapter":"低精度/性能","domain":"precision","level":"进阶","course_day":16,"topic":"fp8-numerics","brief":"先列不变量：样本集合、behavior policy、mask、reward、reduction与更新次数；优化后逐项对齐。","deep":"先把优化承诺保持的内容写成可以比较的量，例如有效 token 的概率、损失权重和更新次数。实现变化只要改变其中一项，就需要重新说明目标，而不能只以吞吐提升作为验收依据。先列出优化承诺保持的内容：相同输入、相同 mask、相同损失分母、相同优化器更新次数。例如把逐样本循环改成打包计算，最直接的不变量是两者的有效位置损失和梯度应在数值容差内一致。验证可由小到大：一条人工样本核对边界，一小批固定数据比较 loss 和梯度，再做短程训练比较趋势。每层解决不同风险，不必一开始就用昂贵的大规模长跑猜哪里出错。","followup":"先做小规模数值回归，再做目标规模吞吐测试。 只比较最终reward无法定位语义漂移。"},{"id":205,"code":"Q205","question":"RL dashboard 最少需要哪四层指标？","doc_title":"RL dashboard 最少需要哪四层指标？","chapter":"训练排障","domain":"debug","level":"进阶","course_day":88,"topic":"rl-throughput","brief":"质量层看外部成功率；分布层看KL/entropy/length；优化层看ratio/grad/loss；系统层看版本、队列和阶段耗时。","deep":"面板至少应连接四层信息：任务是否变好，样本是否有有效反馈，参数更新是否稳定，以及系统时间花在哪里。各层共享任务或运行标识，才能把一个质量异常追溯到数据与执行过程。训练面板至少要让人串起“样本怎么来、损失怎么算、参数怎么变、任务有没有进步”。例如 reward上升同时回答变长，应能立即查看长度、有效 token、KL、梯度范数和独立评测。系统层同时展示生成等待、队列年龄、训练耗时和权重发布时间。所有图应能按同一次运行、训练步和策略版本关联，否则一张图的异常很难对应到另一张图里的原因。","followup":"所有指标能下钻到prompt、trajectory和token。 只有均值无法排查长尾与局部collapse。"},{"id":206,"code":"Q206","question":"reward 突然跳变先查什么？","doc_title":"reward 突然跳变先查什么？","chapter":"训练排障","domain":"debug","level":"进阶","course_day":88,"topic":"rl-throughput","brief":"先查reward代码、verifier版本、数据分布和重复/泄漏，再查policy是否真实改善。","deep":"奖励跳变先核实分数在测量什么。保存原始样本，再用固定评分规则重评，可以区分评分器变化与回答变化；同时检查数据选择，避免把批次变简单误判成模型进步。奖励突然上升，先抽取跳变前后的原始样本和评分输入。可能是真实能力提升，也可能是长度偏好、解析规则变化、测试用例泄漏或奖励计算故障。例如评分器只查找字符串“正确”，模型学会重复这个词，训练奖励会升高而任务能力不变。用独立评测器和人工可核验样本复核，再决定是否继续训练；只看训练曲线无法区分两者。","followup":"固定一批原始trajectory跨版本重放reward。 不要第一时间调学习率。"},{"id":207,"code":"Q207","question":"训练变慢但 GPU util 很高说明什么？","doc_title":"训练变慢但 GPU util 很高说明什么？","chapter":"训练排障","domain":"debug","level":"进阶","course_day":88,"topic":"rl-throughput","brief":"可能是重算、低效kernel、通信spin或cache thrashing；GPU忙不代表做了有效工作。","deep":"GPU 利用率高只说明设备经常有任务，不代表这些任务有效。大量 padding、重复前向或低效通信相关kernel，都可能让利用率很高但每个有效样本耗时更长。先按完整迭代拆出生成、评分、训练、同步和等待，再看最慢阶段内部。若瓶颈是工具等待，继续优化训练矩阵乘法帮助有限；若是训练侧重复计算，应先消除重复再追求 kernel 峰值。比如一个阶段原来有 1000 个 token，其中 400 个是 padding，优化后处理 800 个 token 且只有 100 个无效。总 token 吞吐即便下降，有效工作也可能增加。应先统一分子口径，再查看运行时间线中的通信等待、重计算和算子耗时，避免被单一利用率数字误导。","followup":"比较kernel构成、tokens/s和saved/accepted tokens。 利用率是占用指标，不是效率指标。"},{"id":208,"code":"Q208","question":"如何定位 straggler？","doc_title":"如何定位 straggler？","chapter":"训练排障","domain":"debug","level":"进阶","course_day":88,"topic":"rl-throughput","brief":"按stage和rank比较p50/p95耗时，再关联sequence length、expert load、环境延迟和网络。","deep":"长尾任务拖慢整体速度时，先区分合法的难任务和异常设备。若只把最慢任务丢掉，吞吐可能变好，却使模型少见困难样本。调度优化需要同时检查时间收益和数据分布。straggler 指比同批其他任务明显慢的尾部任务。原因可能是长回答、慢工具、硬件异常或负载不均。应按任务长度和工具类型分组比较，避免把合法难题误判成坏 worker。措施包括长度分桶、动态准入、合理超时和负载迁移，但超时丢弃可能偏向删除难任务。优化后需检查训练数据的长度和难度分布，确认吞吐收益没有来自偷偷改变任务集合。","followup":"保存每个sample的gen_len与gen_time并关联worker。 只看整step最大值无法区分数据长尾与机器异常。"},{"id":209,"code":"Q209","question":"为什么日志必须保存 raw trajectory？","doc_title":"为什么日志必须保存 raw trajectory？","chapter":"训练排障","domain":"debug","level":"进阶","course_day":88,"topic":"rl-throughput","brief":"聚合曲线丢失reward被利用的具体方式，也无法重算mask、verifier或judge。","deep":"原始轨迹把最终分数与实际发生的动作连接起来。它不是越长越好，而是必须包含重算损失与定位错误所需的最小事实；只存聚合指标，出现异常后通常无法恢复这些信息。一条可调查的轨迹应包含任务 ID、原始消息、输出 token、工具参数与返回、分段模型版本、采样参数、行为 log-prob、奖励及结束原因。保存这些是为了能重新计算某次训练决策。只有最终回答和总奖励时，无法定位是工具失败、mask 错位还是概率记录错误。可对正常样本抽样保留较轻日志，对异常样本保留完整记录，并控制敏感数据和保存成本。","followup":"保存token、文本、action、observation、版本和各reward分量。 涉及隐私时需脱敏与分级留存，而不是完全不留证据。"},{"id":210,"code":"Q210","question":"如何检查数据泄漏？","doc_title":"如何检查数据泄漏？","chapter":"训练排障","domain":"debug","level":"进阶","course_day":88,"topic":"rl-throughput","brief":"查prompt/答案hash、模板近重复、benchmark污染和verifier可见字段；Agent任务还需查环境快照复用。","deep":"数据泄漏使评测部分变成了记忆或开发过程中的反复适应，夸大对新任务的泛化。训练文本、检索资料、评分提示和配置选择都可能带入测试信息，需要按实际信息流检查。泄漏不只包括把测试题直接放进训练集，还包括近重复题、参考答案进入检索库、评分提示暴露测试答案，以及按测试集反复挑选配置造成的过拟合。可按题目来源和时间划分数据，并对题干、答案与代码做去重或相似性检查。评测时冻结检索资料和工具权限。最终保留一份开发过程中不反复查看的测试集，才能更可靠地估计新任务表现。","followup":"建立train/eval双向近重复检索与人工抽样。 字符串完全匹配只能发现最简单泄漏。"},{"id":211,"code":"Q211","question":"KL 正常但质量下降可能是什么原因？","doc_title":"KL 正常但质量下降可能是什么原因？","chapter":"训练排障","domain":"debug","level":"进阶","course_day":88,"topic":"rl-throughput","brief":"reference约束只限制分布距离，不保证朝正确方向；reward偏差、数据选择或局部关键token变化都可能在小KL内发生。","deep":"平均 KL 正常，只说明选定分布上的平均偏离有限。关键任务子集可能变化很大，正负方向的性能变化也可能在总体指标中相互掩盖；KL 本身并不是质量指标。可按任务类型、长度和难度分组，看正确率与 KL 的联合变化，再查看失败样本。也要核对 KL 的定义和采样来源；换了一种估计方式后，数值相近并不意味着策略变化程度相同。还可能出现目标冲突：模型更符合奖励器偏好的格式，却在事实正确性上退步。这时即便相对参考模型的变化不大，也会造成质量下降。可固定原始回答分别计算任务正确性、格式、长度和奖励器分数，查看退化集中在哪一项，再决定是修改奖励还是限制更新。","followup":"查外部judge、任务切片和token级KL位置。 小KL不是质量证书。"},{"id":212,"code":"Q212","question":"如何发现 silent mask bug？","doc_title":"如何发现 silent mask bug？","chapter":"训练排障","domain":"debug","level":"进阶","course_day":88,"topic":"rl-throughput","brief":"loss可正常下降，但padding、prompt或observation token被错误训练。","deep":"mask 错误常常不会触发程序异常。例如把答案起始位置错后一位，张量形状仍然正确，loss 也会下降，但第一个动作 token 永远没有直接训练信号。构造包含用户、助手、工具和 padding 的极短样本，逐 token 列出角色、预测目标、mask 和奖励。再故意修改某个被遮罩的目标标签，确认该位置的直接损失不变；同时不要误判上下文变化对后续预测的影响。另一类错误发生在标签平移。模型在位置 t 的输出通常预测下一个 token，因此标签与输出需要对应地错开一位。若 mask 按未平移的位置构造，工具结束边界和答案开头最容易错位。验证时应把“输入token、预测标签、loss mask”放在同一张表里逐行看，而不只打印一个 mask 数组。","followup":"构造含明显哨兵token的toy batch，逐位置打印mask与grad。 总有效token数正确也可能位置错位。"},{"id":213,"code":"Q213","question":"异常 batch 应怎样最小化复现？","doc_title":"异常 batch 应怎样最小化复现？","chapter":"训练排障","domain":"debug","level":"进阶","course_day":88,"topic":"rl-throughput","brief":"冻结模型和配置，保留原始样本、seed、版本与并行元数据，先单卡BF16重放，再逐层恢复分布式和低精度。","deep":"最小复现应保留触发异常的条件，删除无关规模与依赖。它的价值是让同一错误能快速稳定重现，并能够逐个改变候选原因。缩减后异常消失，应追查删掉的条件而不是宣布已经复现。最小复现的目标是保留故障条件，同时删除无关规模。比如只在两个 rank 的有效 token 数不同时出现梯度偏差，就用两张卡和两条不同长度样本复现，无需运行完整 agent 环境。保留固定输入、权重或随机种子、期望结果和实际结果。每缩减一步都重新确认异常仍在；如果删去packing 后故障消失，这本身就是重要定位证据，而不是继续删到一个不会报错的脚本。","followup":"每次只增加一个变量并保存首个分叉点。 直接在原集群反复跑会混入调度噪声。"},{"id":214,"code":"Q214","question":"质量回归的 bisect 单位是什么？","doc_title":"质量回归的 bisect 单位是什么？","chapter":"训练排障","domain":"debug","level":"进阶","course_day":88,"topic":"rl-throughput","brief":"可按代码commit、模型权重版本、数据版本、verifier版本和配置变更分别二分。","deep":"二分定位要求有一个稳定的正常判据与异常判据。可以在代码提交、数据版本或配置版本之间二分，但一次只沿一条变更轴推进，避免多个变化混在一起无法确定原因。回归二分是在一个正常版本和一个异常版本之间，反复测试中间版本，缩小引入故障的提交范围。前提是测试结果足够稳定，而且模型、数据、环境和依赖版本受到控制。若异常只偶发，先找到更稳定的代理指标，例如固定批次的梯度差，而不是每次跑完整训练看最终得分。定位到提交后仍需理解机制并做针对验证，不能仅凭时间先后断言因果。","followup":"建立可重放小验证集，输出逐样本差异而非只看总分。 多个维度同时回滚会失去归因。"},{"id":215,"code":"Q215","question":"设计一个 RLHF 系统时先画什么？","doc_title":"设计一个 RLHF 系统时先画什么？","chapter":"项目表达/系统设计","domain":"infra","level":"进阶","course_day":91,"topic":"evidence-standards","brief":"先画数据所有权：rollout产生trajectory，reward/teacher补充信号，trainer消费并更新权重，sync发布新版本。","deep":"先明确任务如何变成训练样本、参数更新后如何返回采样端，再讨论组件部署。这样系统图中的每条连接都有明确的数据含义，避免画出许多服务却无法说明一次训练如何完成。先画清数据流：任务进入生成端，得到带版本的回答；评分端给出反馈；训练端计算损失并更新参数；发布器把可用权重交给生成端。每个交界都应明确输入、输出和失败处理。第一版可以用同步、小规模流程验证奖励与损失正确，再逐步引入异步和并行。容量规划围绕真实瓶颈：若评分是慢服务，应先解决评分吞吐；增加生成卡只会堆积更多等待样本。","followup":"接口必须携带policy_version、log-prob、mask、reward和失败语义。 先讲组件名而不讲数据不变量会显得空泛。"},{"id":216,"code":"Q216","question":"如何设计 trajectory schema？","doc_title":"如何设计 trajectory schema？","chapter":"项目表达/系统设计","domain":"infra","level":"进阶","course_day":91,"topic":"evidence-standards","brief":"至少包含prompt/turn/segment、token ids、action mask、behavior log-prob/version、reward分量、环境状态引用和finish reason。","deep":"轨迹结构应区分客观记录与派生量。原始 token、工具结果和行为版本描述已发生的事实；优势和某种归一化奖励可能随算法改变。保留原始事实，才能重新计算而不丢失数据来源。schema 是样本字段及其含义的约定。字段不只要“有”，还要明确单位和对齐方式：reward 是逐轮还是终局，log-prob 是每个输出 token 还是整个序列，version 是整条还是每个片段。建议至少保留身份、内容、概率、反馈和生命周期五类字段，并带 schema_version。改变 token 对齐方式时提升版本号并提供转换规则，否则旧消费者可能成功读取文件，却把字段按旧含义解释。","followup":"schema版本化，并提供离线validator。 纯conversation JSON不足以支持严格RL重放。"},{"id":217,"code":"Q217","question":"如何设计 rollout worker 的失败恢复？","doc_title":"如何设计 rollout worker 的失败恢复？","chapter":"项目表达/系统设计","domain":"infra","level":"进阶","course_day":91,"topic":"evidence-standards","brief":"区分请求可重试、环境可恢复和trajectory必须作废三类；重试需要幂等task id和明确seed策略。","deep":"worker 崩溃后，调度器需要知道任务是未执行、执行中还是已提交结果。工具可能已产生副作用而结果尚未回传，简单重跑有时会重复执行动作，因此任务 ID 和幂等规则很重要。训练消费也应避免同一结果在重试后被算两次。可先保证至少一次交付，再按稳定 ID 去重；若希望恢复正在生成的任务，还需保存模型版本、前缀及环境状态，而不仅是队列条目。幂等表示同一逻辑操作重复执行，不会造成额外结果。例如用相同任务 ID 提交一次结果，多次提交只登记一次。读取日志通常易于重试，扣费或修改远程资源则需要更强的事务与去重约定。对不能保证幂等的动作，恢复流程应先核实第一次执行是否生效，再决定是否重放。","followup":"记录attempt、snapshot和重复样本去重键。 盲目重试可能把困难样本系统性过滤掉。"},{"id":218,"code":"Q218","question":"如何回答‘吞吐提升了多少’？","doc_title":"如何回答‘吞吐提升了多少’？","chapter":"项目表达/系统设计","domain":"infra","level":"进阶","course_day":91,"topic":"evidence-standards","brief":"先给测量条件，再给baseline、指标和置信范围；同时说明是否保持模型、token预算与质量门槛。","deep":"先说明比较基线、资源数量和计时边界，再给加速数字。单个算子更快、每步更快和达到目标质量更快，是不同层次的结果，应各自有对应测量。设旧系统达到目标得分用了 10 小时，新系统用了 7 小时，加速比是 10/7，约 1.43 倍，耗时减少 30%。这两个百分比不能混写成“快了 43% 所以省时 43%”。比较需固定硬件资源、数据和目标评测口径，同时报告波动与启动成本。若新系统用了两倍 GPU，还应报告 GPU 小时，避免把扩容收益误当作单位资源效率提升。","followup":"报告warmup、重复次数、p50/p95和time-to-quality。 单次最好值不能作为稳定收益。"},{"id":219,"code":"Q219","question":"如何证明优化没有改变训练结果？","doc_title":"如何证明优化没有改变训练结果？","chapter":"项目表达/系统设计","domain":"infra","level":"进阶","course_day":91,"topic":"evidence-standards","brief":"分三层：toy公式/梯度对齐，小模型固定seed曲线对齐，目标规模质量不劣且吞吐提升。","deep":"先用固定数据比较优化前后的数学结果，再用训练实验比较统计表现。前者用于证明实现没有漏项或错位，后者用于确认在真实工作负载中仍然可用，两类证据互相补充。优化前后使用同一固定批次，比较逐位置 log-prob、mask、损失分子分母、梯度和一次更新后的参数。这样能发现“总 loss 很接近但梯度方向不同”的问题。之后做短程训练验证，观察 KL、梯度范数、奖励和独立评测是否在合理波动内。数值一致性支持实现等价，质量实验支持实际可用性；任一项都不能单独证明所有规模与任务都不会出问题。","followup":"预先设定数值容差和质量门槛。 bitwise不一致不等于语义错误，但必须解释误差来源。"},{"id":220,"code":"Q220","question":"面试中怎样讲一个 RL bug？","doc_title":"面试中怎样讲一个 RL bug？","chapter":"项目表达/系统设计","domain":"infra","level":"进阶","course_day":91,"topic":"evidence-standards","brief":"按现象、首个错误不变量、证据、最小复现、修复和回归测试展开。","deep":"一个有说服力的故障案例需要说明观察到什么、哪项实验排除了替代原因、修复改变了什么。只说“调了参数后恢复正常”，还不能证明找到了根因。可以按“现象、证据、原因、修复、验证”讲一个真实故障。例如多卡训练质量下降，证据是不同长度批次才出现梯度偏差；原因是各卡先取局部均值；修复为按全局有效 token 数归一化。这里的案例用于展示分析结构，不应冒充个人经历。实际面试应使用自己能说明日志、代码和实验结果的项目；不确定的根因要区分已验证事实与仍待排查的假设。","followup":"给出具体shape、rank、step或metric变化。 不要把排查过程写成按时间流水账。"},{"id":221,"code":"Q221","question":"怎样回答算法与系统的边界？","doc_title":"怎样回答算法与系统的边界？","chapter":"项目表达/系统设计","domain":"infra","level":"进阶","course_day":91,"topic":"evidence-standards","brief":"算法定义数据分布、目标、估计器和约束；系统决定这些量如何表示、移动与计算。系统优化一旦改变它们，就进入算法变更。","deep":"算法规定数据分布、目标和估计方法，系统负责把这些约定执行出来。两者的交界应是明确可验证的数据和计算规则。性能优化只要改变了目标权重，就同时成为算法变更。算法约定决定“优化什么”，系统实现决定“怎样执行”。例如 token 平均还是序列平均属于目标定义，all-reduce 放在哪一步属于实现；但实现选错归一化方式，就会改变算法。边界应写成可测试的契约：样本来源、概率含义、奖励时间位置、损失分母和更新次数。这样系统优化有明确的不变量，算法实验也知道哪些基础设施行为正在影响结果。","followup":"为每项优化列出不变量检查表。 ‘只是工程优化’不能替代证明。"},{"id":222,"code":"Q222","question":"如何做新算法的接入计划？","doc_title":"如何做新算法的接入计划？","chapter":"项目表达/系统设计","domain":"infra","level":"进阶","course_day":91,"topic":"evidence-standards","brief":"先实现reference公式与toy test，再接数据字段和分布式reduction，最后做稳定性与性能优化。","deep":"先把新算法相对基线的差异写清，再决定需要修改哪些数据字段与计算步骤。从手算样本到小规模实验逐步接入，能把公式错误、实现错误和真实算法效果分开判断。接入新算法前先列最小差异：需要哪些额外字段，优势如何计算，ratio 的粒度是什么，损失怎样归一化。若只新增一条 loss 公式却复用不匹配的数据定义，容易得到名称相同、行为不同的实现。先用人工小例子对照手算，再与基础版本做受控实验，最后放大规模。论文报告的提升应视为特定设置中的证据；自己的实现必须重新验证质量、稳定性和资源成本，不能只复述结论。","followup":"每阶段有可回滚开关和基线对照。 一开始就做大规模性能会掩盖正确性问题。"},{"id":223,"code":"Q223","question":"如何评估一个 Agentic RL 项目是否值得做？","doc_title":"如何评估一个 Agentic RL 项目是否值得做？","chapter":"项目表达/系统设计","domain":"infra","level":"进阶","course_day":91,"topic":"evidence-standards","brief":"看环境可验证性、轨迹成本、reward可靠性、可重放性和部署价值。","deep":"判断项目价值应从反馈质量、交互成本和基线差距出发。先确认可以可靠衡量进步，再用小规模实验判断 RL 是否比已有方案更有效，最后才扩展环境复杂度和训练规模。先确认任务能提供可重复、可区分好坏的反馈，并且允许足够多次交互。若每次真实执行都昂贵且无法回滚，训练成本可能远高于监督学习或离线改进。可建立 SFT、提示优化和简单搜索基线，再判断 RL 是否带来预算相同时的稳定增益。Agentic RL 的价值应体现在完成更难任务、更少无效步骤或更强恢复能力，而不是仅因为系统调用了工具。","followup":"先用SFT/best-of-N建立上限，再做小规模online RL验证增益。 环境复杂不等于RL必要。"},{"id":224,"code":"Q224","question":"面试最后如何总结自己的方向侧重点？","doc_title":"面试最后如何总结自己的方向侧重点？","chapter":"项目表达/系统设计","domain":"infra","level":"进阶","course_day":91,"topic":"evidence-standards","brief":"用一句主线串联：我关注rollout产生什么分布、trainer如何正确消费，以及分布式/低精度优化是否保持算法语义。","deep":"定位陈述应把能力与证据连起来。例如“侧重 RL 训练基础设施，能够从样本版本、概率记录、分布式归一化和执行性能定位问题”，随后选一个真实项目证明，而不是堆叠框架名称。准备时可逐项标记自己能做到哪一层：解释原理、读懂实现、独立修改、完成验证。对算法研究岗位应补充目标推导和实验设计，对 infra 岗位应补充运行链路与故障复现；这里是准备方法，不代表已有经历。还可以准备一段可展开的说明：先用一句话说明关注的训练问题，再用一个真实优化或故障说明如何验证，最后讲仍需补足的能力。例如能稳定复现训推概率差，但尚未独立设计新的优势估计器，就明确这两个层次。这样的定位便于面试官沿实际能力追问，也能避免因为范围说得过大而失去可信度。","followup":"再用一个性能案例和一个正确性bug作证据。 避免罗列框架名，重点讲你守住了什么不变量。"}],"topics":[{"id":"policy-gradient","title":"一次 Reward 怎么更新 Policy？"},{"id":"ppo-grpo","title":"PPO / GRPO 的优化目标"},{"id":"logprob-contract","title":"Token Logprob 与训练目标"},{"id":"fp8-numerics","title":"FP8 的收益与数值边界"},{"id":"moe-router","title":"MoE Routing 与 R3"},{"id":"parallel-topology","title":"DP / TP / PP / EP 怎么组合"},{"id":"kv-scheduling","title":"KV Cache 与请求调度"},{"id":"agent-action","title":"Agent 的 Action 到底是什么"},{"id":"async-rollout","title":"异步 Rollout 与 Policy Staleness"},{"id":"opd-kl","title":"OPD、Teacher 分布与 KL"},{"id":"rl-throughput","title":"RL Step 真的慢在哪里"},{"id":"evidence-standards","title":"怎样判断一种新方案有效"}]}</script>
<script>"use strict";

/* 224-question interview trainer. Progress is browser-local. No network writes. */
(() => {
  const payload = JSON.parse(document.getElementById("quiz-data").textContent);
  if (payload.schema !== "rl-infra-question-bank-v1") throw Error("Invalid question bank");
  const questions = payload.questions;
  const topicTitle = new Map((payload.topics || []).map(t => [t.id, t.title]));
  const lookup = new Map(questions.map(q => [q.id, q]));
  const KEY = "rl-infra-100days-questionbank-v1";
  const domainNames = {
    policy: "策略梯度 / PPO", reward: "奖励与偏好",
    grpo: "GRPO / DAPO", opd: "OPD 蒸馏",
    async: "异步与 Partial", agent: "Agentic RL",
    inference: "推理与一致性", distributed: "分布式与 MoE",
    infra: "系统设计", debug: "训练排障",
    precision: "低精度与性能"
  };
  const ratingNames = {
    again: "再练一次", hard: "还不熟练",
    good: "基本掌握", easy: "非常熟练"
  };
  const byId = id => document.getElementById(id);
  const two = n => String(n).padStart(2, "0");

  function blank() {
    return { answer: "", note: "", rating: "", attempts: 0,
      streak: 0, due: null, bookmarked: false, history: [] };
  }
  function loadProgress() {
    try {
      const obj = JSON.parse(localStorage.getItem(KEY));
      if (obj && obj.version === 1 && obj.records && typeof obj.records === "object") return obj;
    } catch (_) {}
    return { version: 1, records: {} };
  }
  let state = loadProgress();
  let mode = "all", queue = [], cursor = 0, current = null, visible = false;
  let source = "brief", timer = null;
  const read = id => state.records[id] || blank();
  const writable = id => state.records[id] || (state.records[id] = blank());
  const localDate = (days = 0) => {
    const d = new Date();
    d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() + days);
    return [d.getFullYear(), two(d.getMonth() + 1), two(d.getDate())].join("-");
  };
  const due = record => Boolean(record.due && record.due <= localDate());
  const weak = record => record.rating === "again" || record.rating === "hard";
  const learned = record => record.rating === "good" || record.rating === "easy";
  const normalize = s => String(s || "").normalize("NFKC")
    .replace(/[？?。，,.：:；;、\s]/g, "").toLowerCase();

  function saveState() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      byId("saved").textContent = "已保存在本地 · " +
        new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    } catch (_) {
      byId("saved").textContent = "本机保存失败，请导出备份";
    }
    updateStats();
  }
  function saveFields() {
    if (current === null) return;
    const record = writable(current);
    record.answer = byId("answer").value;
    record.note = byId("notes").value;
    saveState();
  }
  function flush() {
    if (timer !== null) clearTimeout(timer);
    timer = null;
    saveFields();
  }
  function autosave() {
    if (timer !== null) clearTimeout(timer);
    timer = setTimeout(() => { timer = null; saveFields(); }, 250);
    byId("count").textContent = byId("answer").value.trim().length + " 字";
  }
  function updateStats() {
    let attempted = 0, mastered = 0, dueCount = 0, stars = 0;
    for (const q of questions) {
      const r = read(q.id);
      if (r.attempts > 0) attempted++;
      if (learned(r)) mastered++;
      if (due(r)) dueCount++;
      if (r.bookmarked) stars++;
    }
    byId("attempted").textContent = attempted;
    byId("learned").textContent = mastered;
    byId("due-count").textContent = dueCount;
    byId("starred-count").textContent = stars;
    byId("progress-fill").style.width = 100 * attempted / questions.length + "%";
  }

  function selectors() {
    const domains = [...new Set(questions.map(q => q.domain))];
    for (const name of domains) {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = domainNames[name] || name;
      byId("domain").append(option);
    }
    const chapters = [...new Set(questions.map(q => q.chapter))];
    for (const name of chapters) {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      byId("chapter").append(option);
    }
  }
  function filtered() {
    const domain = byId("domain").value, chapter = byId("chapter").value,
      level = byId("level").value, status = byId("status").value,
      words = byId("search").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    return questions.filter(q => {
      const r = read(q.id);
      if (domain && q.domain !== domain) return false;
      if (chapter && q.chapter !== chapter) return false;

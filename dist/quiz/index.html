<script type="application/json" id="quiz-data">{"schema":"rl-infra-question-bank-v1","question_count":224,"sources":["RL_OPD_Agentic_RL_面试题库_完整版.md","RL_OPD_Agentic_RL_面试问题与参考答案.docx"],"content_note":"两个来源按 Q001–Q224 对应；速答和详细解析原文提取，未对数学公式和技术结论逐项校勘。","questions":[{"id":1,"code":"Q001","question":"为什么 policy gradient 可以直接对采样到的 action 求梯度？","doc_title":"为什么 policy gradient 可以直接对采样到的 action 求梯度？","chapter":"策略梯度/PPO","domain":"policy","level":"基础","course_day":4,"topic":"policy-gradient","brief":"核心不是对离散 action 求导，而是对产生 action 的概率求导。利用 log-derivative trick，∇θπθ(a\\|s)=πθ(a\\|s)∇θlogπθ(a\\|s)，期望回报的梯度可以写成 E\\[∇θlogπθ(a\\|s)·G\\]。样本中的回报 G 因而成为 log-prob 梯度的权重：正回报提高该 action 的概率，负回报降低它。这个估计通常无偏，但方差很大，所以实际算法会引入 baseline、advantage、value function 和 clipping。","deep":"策略梯度更新的是模型选择某个动作的概率，而不是对已经选出来的整数 token ID 求导。这里的 policy（策略）就是模型在给定上下文后，对下一 token 给出的概率分布；action（动作）就是这次实际采中的 token。把问题先缩小到一次选择。设模型有 A、B 两个动作，选择概率为 p 和 1−p，奖励分别为 1 和 0，那么平均奖励就是 p。提高平均奖励，只需调整模型参数使 p 增大。复杂模型无法枚举所有完整回答，就用采样得到的回答估计这个方向。常见单样本损失为 。s 是当前上下文，a 是采中的动作，G 是这次动作之后获得的累计奖励；G 在更新策略时作为固定系数。\n\n正的 G 使优化器倾向于提高该动作概率。log-derivative trick（对数求导恒等式）把“对概率求导”改写成“概率乘以对数概率的梯度”，从而允许用采样平均估计原本需要枚举的期望。实现时，token ID 作为索引从 log_softmax 输出中取出对应 log-prob，梯度沿模型输出回传。并不需要对argmax 或随机采样操作求导。这个单步说明还未包含多步状态分布、奖励折扣和样本复用；后面几题分别展开这些条件。","followup":"若面试官继续问 baseline，强调 baseline 只要不依赖当前 action，就不会改变梯度期望；它主要改变方差。"},{"id":2,"code":"Q002","question":"为什么减去 baseline 不会引入偏差？","doc_title":"为什么减去 baseline 不会引入偏差？","chapter":"策略梯度/PPO","domain":"policy","level":"基础","course_day":4,"topic":"policy-gradient","brief":"对任意只依赖 state 的 b(s)，E\\_{a~π}\\[∇logπ(a\\|s)b(s)\\] = b(s)∇Σ_aπ(a\\|s)=0。因此 G-b(s) 与 G 具有相同的梯度期望。baseline 如果依赖当前 action，抵消关系一般不再成立，除非额外做修正。工程上 value model 近似的是条件期望回报，用它构造 advantage，可以显著降低不同 prompt 难度造成的方差。","deep":"baseline 是比较奖励高低的参照值。例如某道简单题通常能拿 0.9 分，得到 0.8 分未必值得加强；某道难题通常只有 0.1 分，得到 0.8 分则是明显进步。用实际回报减去参照值，模型学的是“比当前预期好多少”。只要参照值在给定状态后不依赖本次随机选择的动作，并在策略损失中停止梯度，减去它就不改变理想策略梯度的期望。原因是所有动作的概率相加恒为 1，它们的梯度之和为 0；因此“所有动作共同减去的那部分”在期望里抵消。这不表示任意 baseline 都能降低方差。参照值离实际回报过远，估计仍可能更不稳定。critic 是专门预测这个参照值的模型；GRPO 则用同一道题的多个回答估计参照值。\n\n把当前样本也放入样本均值，会产生有限样本的缩放效应；要讨论严格无偏，还需检查样本之间的独立性和均值计算方式。","followup":"不要回答成“baseline 是常数”。它可以依赖 state、prompt 或时间步，只是不应以未修正的方式依赖当前 action。"},{"id":3,"code":"Q003","question":"PPO clipping 真正限制了什么？它能保证 KL 很小吗？","doc_title":"PPO clipping 真正限制了什么？它能保证 KL 很小吗？","chapter":"策略梯度/PPO","domain":"policy","level":"基础","course_day":4,"topic":"policy-gradient","brief":"PPO-Clip限制的是 surrogate objective 中 importance ratio 对目标函数的继续增益，而不是直接投影参数，也不是严格约束 KL。当 advantage 为正时，ratio 超过 1+ε 后不再获得额外收益；advantage 为负时，ratio 低于 1-ε 后不再获得额外收益。由于不同 token、state 的变化可以相互抵消，且神经网络参数共享，clip fraction 小不等于全局 KL 小，反之亦然。","deep":"PPO clipping 限制的是某个样本继续推动更新的收益，不是直接限制模型参数，也不保证全局 KL 一定小。KL 是两个概率分布的差异量，后面第 8 题会具体计算。设旧模型选择一个 token 的概率为 0.20，新模型为 0.30，概率比 ρ 就是 1.5。如果这个 token 的advantage 为 +2，表示它比参照表现好；不裁剪时，该样本的目标贡献为 1.5×2=3。取 ε=0.2 后，PPO 比较原值与裁剪值并取较小者，贡献成为 min(3,1.2×2)=2.4。继续增加这个概率，不再从这项获得额外收益。负 advantage 的方向相反。若 A=−2、ρ=0.5，目标成为 min(−1,0.8×−2)=−1.6；把坏动作概率继续降低，局部收益同样进入平台。\n\n但若坏动作概率反而升高，PPO 仍会给纠正方向的梯度。因此“ratio 超界就没有梯度”不准确，还要看 advantage 的正负。其他样本、KL 项以及共享参数的更新仍会改变这个 token 的概率，所以裁剪范围不是概率变化的硬边界。训练中通常另外监测 KL 和过大更新；它们是独立的保护措施。公式依据见文末 PPO 原论文。相关原始资料：PPO。","followup":"成熟回答应补一句：PPO 常同时监控 approximate KL，并在超过阈值时 early stop；这属于工程保护，不是 clipping 的数学保证。"},{"id":4,"code":"Q004","question":"old policy、behavior policy 和 reference policy 有什么区别？","doc_title":"old policy、behavior policy 和 reference policy 有什么区别？","chapter":"策略梯度/PPO","domain":"policy","level":"基础","course_day":4,"topic":"policy-gradient","brief":"behavior policy 是实际生成 rollout 的分布；old policy 是构造 PPO ratio 时冻结的更新前策略；reference policy 通常是 SFT checkpoint，用来限制能力和语言分布漂移。同步训练中 behavior 与 old 往往相同，所以容易被混为一谈；异步、量化 rollout 或多版本混采时它们可能不同。importance correction 应相对 behavior policy，KL regularization 通常相对 reference policy，两者不能互相替代。","deep":"这三个名称描述的是模型在训练中的角色，不一定对应三套不同参数。behavior policy 是实际采样回答的策略；old policy 是本轮近端更新所使用的固定比较基准；reference policy 是限制长期行为偏移的参考模型，常为 SFT 后的模型。例如 rollout 用版本 10 生成数据，训练开始时 actor 已是版本 11，而长期参考模型仍是最初版本 0。版本 10 决定数据为何以这样的频率出现，版本 11 可以作为这一轮近端更新的起点，版本 0 决定训练是否偏离初始模型过多。这是三个不同问题。标准同步 PPO 中，采样模型与 old model 通常相同，概率比分母同时承担两种角色。\n\n异步实现可以把“从 behavior 到训练分布的校正”和“相对 old model 的裁剪”拆成两项，此时不能强制所有分母都用behavior。读代码时应分别定位采样概率、近端基准概率和参考模型概率，而不是只看变量是否叫old_log_probs。","followup":"面试中最好画出三条边：behavior→data，old→proximal update，reference→regularization。"},{"id":5,"code":"Q005","question":"为什么一批 rollout 可以做多个 PPO epoch？","doc_title":"为什么一批 rollout 可以做多个 PPO epoch？","chapter":"策略梯度/PPO","domain":"policy","level":"基础","course_day":4,"topic":"policy-gradient","brief":"PPO通过 importance ratio 把 old-policy 数据重用于当前 policy，并用 clipping 抑制过大的分布漂移，从而提高 sample efficiency。但每做一次参数更新，当前 policy 与 behavior policy 的距离都会增加；后续 epoch 的 ratio 方差、clip fraction 和近似误差也随之上升。多 epoch 不是免费收益，通常需要联合观察 KL、clip fraction、entropy 和验证 reward。","deep":"一个 PPO epoch 表示把同一批 rollout 数据完整训练一遍。生成回答需要逐 token 执行模型，往往比对已有回答做并行前向更贵；让同一批数据参与多次更新，可以减少重新生成的次数。复用并不是把这些回答当作永远正确的监督标签。训练端每次重新计算当前模型对固定回答的概率，与采样时保存的旧概率相除，判断模型已经改变多少。越接近裁剪平台，继续使用该样本所提供的更新信号越受限制。但 PPO 的 token 比只校正在固定历史下选择当前 token 的差异，并没有完整恢复新策略访问历史的概率。epoch 越多，这种近似越可能变差。因此应观察同一批数据第 1、2、3 遍的 KL、有效梯度和独立验证质量，判断额外一遍训练是否仍有价值，而非认为有概率比就能无限复用。","followup":"如果 rollout 本身已经 stale，再叠加多个 PPO epoch，会同时放大系统异步偏差与优化复用偏差。"},{"id":6,"code":"Q006","question":"token-level policy gradient 为什么能优化 sequence-level reward？","doc_title":"token-level policy gradient 为什么能优化 sequence-level reward？","chapter":"策略梯度/PPO","domain":"policy","level":"基础","course_day":4,"topic":"policy-gradient","brief":"自回归序列概率满足 logπ(y\\|x)=Σ_t logπ(y_t\\|x,y\\_\\\u003ct)。若整条 response 只得到一个 outcome reward，则 sequence-level REINFORCE 梯度会自然分解到每个生成 token，因此同一个 trajectory advantage 可以广播给所有 action token。数学上可行不代表 credit assignment 精确：长轨迹中，早期有效行为与后期错误会获得相同符号的权重，方差随时域增加。","deep":"完整回答的概率，是依次生成每个 token 的条件概率之积。取对数后，乘积变成各 token 对数概率之和。于是完整回答的奖励可以乘在这整个和上，梯度再自然分解到每个生成位置。例如回答只有三个 token，三处 log-prob 依次为 −0.2、−0.4、−0.1，完整回答的 log-prob 是 −0.7。假设该回答的 advantage 为 +1，最小化负的加权 log-prob 会推动这条回答的生成概率上升。三个位置共享同一个系数，但模型对各位置的梯度不同，并不是每个 token 增加同样的概率。这给出了合法的学习信号，却没有回答“哪一步真正导致成功”。credit assignment 指的正是把最终结果归因到各步动作。\n\n若前两步正确、第三步犯错，整条失败回答的统一系数无法直接区分这两类步骤。有更多状态价值或过程反馈时，可以进一步改善这种归因。","followup":"这正是 reasoning RL 尚可使用 outcome reward，而长时域 Agentic RL 更需要 turn-level credit 的原因。"},{"id":7,"code":"Q007","question":"reward、return 和 advantage 分别是什么？","doc_title":"reward、return 和 advantage 分别是什么？","chapter":"策略梯度/PPO","domain":"policy","level":"基础","course_day":4,"topic":"policy-gradient","brief":"reward 是环境在某个时间步提供的局部反馈；return 是从当前时间步开始累积的折扣 reward；advantage 衡量当前 action 相对该 state 下平均行为好多少。PPO优化的是 advantage 加权的 log-prob，而不是直接对 reward 求导。LLM reasoning RL 常只有终局 reward，且把同一 response 内的 advantage 广播到 token；有 critic 时则可用 return-value 或 GAE 得到逐时间步 advantage。","deep":"reward 是某一步收到的分数，return 是从这一步往后累计的分数，advantage 是累计分数减去当前状态的预期表现。三者分别回答“这步得多少”“后面总共得多少”“比预期好多少”。设一个 Agent 连续执行三步，奖励分别为 0、0、1，暂时不折扣未来奖励。那么第一步的 return 也是1，而不是 0；第一步可能是最终成功的必要准备。如果 critic 预测第一步之前平均能得 0.4，实际这次得 1，则用整段回报估计的 advantage 为 0.6。critic 是输出预期累计奖励的模型，不负责生成回答，也不是给最终答案打分的 Reward Model。前者在动作发生前预测未来，后者通常在结果出现后评价结果。\n\nGRPO 不训练 critic，而是用同题多个回答的分数作比较，得到序列级 advantage。","followup":"回答时要先说明算法的数据模型；GRPO 的 group-relative advantage 与 PPO 的 GAE 不是同一个估计器。"},{"id":8,"code":"Q008","question":"为什么 KL estimator 可能为负，而真实 KL 不会？","doc_title":"为什么 KL estimator 可能为负，而真实 KL 不会？","chapter":"策略梯度/PPO","domain":"policy","level":"基础","course_day":4,"topic":"policy-gradient","brief":"真实 KL 是对分布的期望，KL(p\\|\\|q)=E_p\\[log p-log q\\]≥0；单个采样 token 的 log-ratio 却可以为负。训练日志若记录 sampled log-ratio 的均值，在有限样本、mask 或采样分布不匹配时可能出现负值。更低方差的非负近似可由 ratio 构造，但不同 estimator 的偏差与方差不同，不能只凭一个负数判断实现错误。","deep":"KL 对所有可能 token 按概率求加权平均，单个 token 的 log-ratio 只是其中一个贡献，完全可以为负。把单个样本贡献和完整分布的 KL 混在一起，就会误判日志。例如 p=[0.8,0.2]、q=[0.5,0.5]，KL(p‖q)=0.8 log(0.8/0.5)+0.2 log(0.2/0.5)，约为 0.193，确实非负。若恰好采到第二个 token，它的 log-ratio 为 log(0.2/0.5)，约为 −0.916。有限批次恰好多采到这类 token，样本均值便可能为负。还常见一个逐样本非负的表达式：令 u=q/p，在 a 从 p 采样且支持集满足条件时，u−1−log u 的期望也是KL(p‖q)。\n\n但一旦换了采样分布、截断支持集或对 u 做裁剪，就需要重新分析期望。日志至少应说明 p、q 分别是谁，以及 token 由谁采样。单看指标名 approx_kl 不足以确定含义。","followup":"排查时先核对 expectation 是在谁的分布下、mask 是否正确、统计的是 token mean 还是 sequence mean。"},{"id":9,"code":"Q009","question":"经典 RLHF 训练链路由哪些阶段组成？","doc_title":"经典 RLHF 训练链路由哪些阶段组成？","chapter":"RLHF/Reward","domain":"reward","level":"基础","course_day":5,"topic":"policy-gradient","brief":"经典链路通常包含 SFT、Reward Model 训练和在线 RL 三段。SFT先得到能遵循指令的初始策略；Reward Model用同一 prompt 下的偏好排序学习标量评分；RL阶段由当前policy在线采样，用RM分数与KL约束更新actor。三段的训练分布并不相同：SFT来自示范，RM来自候选比较，RL来自当前policy，因此任一阶段覆盖不足都会在后续被放大。","deep":"经典 RLHF 分三类学习任务。SFT 用人工或模型示范回答训练语言模型，让它先能遵循指令；RewardModel 用同一问题下两份回答的偏好标签学习评分；在线 RL 让当前模型自己回答，再根据评分调整生成概率。例如问题是“解释某段代码”。SFT 提供一份完整正确讲解；偏好数据告诉 RM，回答 A 比回答 B 更清楚；RL 阶段不再强制复现 A，而是让模型产生 C、D 等新回答并评分。actor 是此时真正被更新的回答模型。三个阶段的数据不同，所以前一阶段准确不代表后一阶段可靠。RM 可能从没见过模型在线生成的冗长套话，却给它高分。常见 KL 约束用于限制 actor 相对参考模型的偏移，但不能替代对奖励错误的检查。\n\n相关原始资料：RLHF。","followup":"不要只背“SFT→RM→PPO”。需要说明每一阶段的数据来源、优化目标以及distribution shift。"},{"id":10,"code":"Q010","question":"Bradley-Terry Reward Model 的 loss 在学什么？","doc_title":"Bradley-Terry Reward Model 的 loss 在学什么？","chapter":"RLHF/Reward","domain":"reward","level":"基础","course_day":5,"topic":"policy-gradient","brief":"对偏好对(y_w,y_l)，常见loss为−log σ(rθ(x,y_w)−rθ(x,y_l))。它只约束chosen与rejected的相对分差，不标定绝对reward尺度；给所有输出同时加一个常数不会改变loss。RM输出经过不同训练轮次、数据配比或模型初始化后，数值尺度可能变化，所以RL中的reward normalization、clip和KL系数不能脱离RM版本复用。","deep":"Bradley–Terry 模型把“两份回答谁更好”转换成概率。对同一问题，RM 给回答 A、B 各一个分数，预测 A 胜过 B 的概率为 sigmoid(rA−rB)。sigmoid 把任意实数映射到 0 到 1 之间。若 rA=2、rB=1，预测偏好 A 的概率约为 0.731；若两分数都加 100，差仍为 1，预测不变。因此绝对分数没有固定零点，5 分不能直接解释成五成正确率。训练用负对数概率惩罚预测错误。标注选择 A，模型却给它低概率，损失就大。需要区分两件事：共同加常数不影响排序概率，但共同乘系数会改变分差和预测置信度。把 RM 接入 RL 后，分数大小还会影响任务奖励与 KL 惩罚的相对权重，不能只检查排序。","followup":"若问“reward=5代表什么”，正确回答是它没有跨模型可比的绝对语义，主要由相对排序决定。"},{"id":11,"code":"Q011","question":"Outcome Reward Model 与 Process Reward Model 有什么差别？","doc_title":"Outcome Reward Model 与 Process Reward Model 有什么差别？","chapter":"RLHF/Reward","domain":"reward","level":"基础","course_day":5,"topic":"policy-gradient","brief":"ORM只对完整response或episode给分，标注便宜、与最终目标直接，但长轨迹credit粗；PRM对中间推理步骤或state-action转移评分，反馈密集，却需要步骤边界、过程标签或可靠的自动判定。PRM若只学表面格式，可能把冗长、自信或模板化过程当成正确推理。实际系统可以用ORM保证最终目标，用PRM做辅助shaping，但必须验证组合后没有改变任务偏好。","deep":"ORM 评价整份结果，PRM 评价过程中的步骤。数学题中，ORM 可以只检查最终答案；PRM 则检查移项、代入或推导是否正确。Agent 中，ORM 可以检查最终测试是否通过，PRM 可以评价一次修改是否修复了某类错误。PRM 使模型较早收到反馈，减少“做了几十步才知道失败”的情况，但前提是过程评分可靠。例如增加一句“我需要仔细检查”并未改变代码，若仍能获得过程奖励，模型就可能学会重复这句话。使用两类奖励时，应分别保存终局分数和各步分数。辅助过程分数相加可能改变目标：原本奖励成功，现在却可能奖励做更多步骤。只有明确设计累计关系并验证最终任务质量，才能判断额外反馈是否有帮助。","followup":"不要默认PRM一定优于ORM；它把稀疏reward问题换成了过程标签正确性问题。"},{"id":12,"code":"Q012","question":"Reward Model 为什么容易出现 length bias？","doc_title":"Reward Model 为什么容易出现 length bias？","chapter":"RLHF/Reward","domain":"reward","level":"基础","course_day":5,"topic":"policy-gradient","brief":"偏好数据中较长回答可能更完整，也可能更容易被标注者偏好，RM于是把长度当成质量shortcut。在线RL会主动搜索RM漏洞，将微弱相关性放大为持续变长、重复解释或格式膨胀。判断length bias不能只看reward与length相关系数，还要在控制正确性、任务类别和信息量后比较，并检查同一答案的长度扰动是否改变评分。","deep":"length bias 是评分偏向长度，而不是偏向回答中真实增加的信息。若训练偏好数据里详细答案大多更好，RM 可能学到“越长越好”的简单规律，无法区分必要解释和重复内容。一个直接实验是固定同一正确答案，准备简洁版、增加必要推导版、纯重复扩写版。若前两者的评分变化合理，但重复版也持续加分，才更有证据说明长度被错误利用。仅观察高分答案普遍较长，还不能排除它们确实更完整。在线优化会反复寻找得分高的输出，使原先轻微的偏好被放大。记录正确和错误回答各自的长度分布、去掉重复句后的评分变化，比只看平均长度更容易定位问题。","followup":"最小实验是对语义等价答案做截短、扩写和重复段落扰动，绘制RM分数变化。"},{"id":13,"code":"Q013","question":"Reward hacking 与真正能力提升如何区分？","doc_title":"Reward hacking 与真正能力提升如何区分？","chapter":"RLHF/Reward","domain":"reward","level":"基础","course_day":5,"topic":"policy-gradient","brief":"训练reward上升只证明policy更会优化当前verifier。若外部benchmark、人工偏好、不同judge或答案正确率不升反降，通常说明发生了reward overoptimization。还应检查格式、长度、拒答、重复token和特定关键词是否异常变化。可靠判断依赖hold-out verifier与训练RM解耦，并用不可见任务验证迁移。","deep":"reward hacking 指模型提高了评分，却没有完成我们真正想要的任务。例如评分器奖励引用数量，模型生成更多不存在的引用；分数上升，但事实准确率下降。判断时需要一个不依赖同一评分漏洞的测量方法。可以使用隐藏测试、人工复核或另一套错误来源不同的验证器。held-out 表示未参与训练的数据，但若仍使用同一个有缺陷的 RM 打分，换数据并不等于换了判断标准。保存分数跃升前后的原始输出，检查究竟多了什么行为。若增长来自真实成功率，同时格式、成本和安全要求也满足，才支持能力改善。单看训练奖励不能区分这两种情况。","followup":"不要用同一个RM既训练又证明没有reward hacking；这属于循环论证。"},{"id":14,"code":"Q014","question":"Rule-based verifier 是否就没有 reward hacking？","doc_title":"Rule-based verifier 是否就没有 reward hacking？","chapter":"RLHF/Reward","domain":"reward","level":"基础","course_day":5,"topic":"policy-gradient","brief":"规则reward通常比主观RM更可验证，但仍可能被解析器、答案抽取和环境漏洞攻击。例如模型可输出多个候选答案、注入特殊标记、利用浮点容差或让代码grader超时。规则只在其判定边界内可靠，必须保存原始输出、解析结果和verifier路径，并对异常高分样本做对抗审计。","deep":"规则验证器把答案转成可检查结果，例如提取数学最终值、执行程序测试、检查环境目标是否达成。它比主观打分更明确，但其解析和执行规则仍可能有漏洞。例如要求回答唯一数字，验证器却只检查输出是否包含标准数字。模型列出许多数值也能通过，这奖励的是命中字符串，而非解题。又如代码只对公开测试做特判，测试通过不能说明程序能泛化。因此应同时保存模型原文、解析后的答案和每条规则的判断结果。对异常高分样本扩大隐藏测试、检查多答案和异常结束情况。规则可靠的范围是它真正验证过的性质，不能扩展成“推理过程也正确”。","followup":"数学答案可验证不等于推理过程正确；final-answer reward仍无法提供精细credit。"},{"id":15,"code":"Q015","question":"为什么 Reward Model 的泛化能力通常弱于语言模型？","doc_title":"为什么离线排序准确的 Reward Model 仍会在在线 RL 中失效？","chapter":"RLHF/Reward","domain":"reward","level":"基础","course_day":5,"topic":"policy-gradient","brief":"RM把高维文本压缩成一个标量，而偏好标签稀疏、标准多维且常含噪声。训练分布之外，RM容易依赖长度、文风、格式和领域词等shortcut；在线policy又会生成RM训练时未覆盖的极端样本。提高RM规模有帮助，但更关键的是候选覆盖、hard negative、标注一致性、校准和持续的on-policy数据回收。","deep":"不能一般性地断言 RM 的泛化能力弱于语言模型，两者学习目标和评价方式不同。更准确的问题是：为什么一个离线排序准确率不错的 RM，仍会在在线 RL 中失效？RM 通常只在有限候选回答上学习偏好，在线 actor 却会持续寻找更高分的新写法。这些输出可能包含训练集没有的长度、措辞或结构。RM 在已见分布上学到的规律，在这些新区域未必成立；这称为分布外失效。改进应针对失效区域。把当前 actor 的高分可疑回答收集回来，重新标注并加入难负样本，比仅增加一批同类型普通回答更有针对性。难负样本是表面看起来很好、实际不满足要求的回答。更新 RM 后，还需重新验证它被 actor 优化时的行为。","followup":"RM不是“更聪明的裁判”；它是一个会被policy主动分布外攻击的代理模型。"},{"id":16,"code":"Q016","question":"怎样建立 Reward 数据与 RM 的质量验收？","doc_title":"怎样建立 Reward 数据与 RM 的质量验收？","chapter":"RLHF/Reward","domain":"reward","level":"基础","course_day":5,"topic":"policy-gradient","brief":"数据侧应检查标注一致率、类别与长度分布、chosen/rejected难度、同源泄漏和模板偏差；模型侧应报告pairwise accuracy、按domain/length切片结果、校准与对抗扰动；RL前还要做best-of-N和小规模online优化，观察是否出现非预期模式。单一held-out accuracy不能覆盖在线policy search带来的分布迁移。","deep":"验收分成“对已有回答判断正确”和“被模型反复优化后仍然可靠”两部分。第一部分可以直接比较RM 预测与人工偏好是否一致；第二部分必须让它面对模型主动搜索出的高分回答。例如先从验证集挑出数学、代码、对话三类问题，分别统计偏好排序准确率；再对同一问题生成 16 个回答，选出 RM 最高分者，检查它是否真的优于随机选一个。这个固定模型生成多份再选最好的过程叫best-of-N。若 N 增大后 RM 分数继续提高，独立准确率却下降，就说明候选搜索已经在利用评分漏洞。最后再用小规模在线训练检查更强的分布变化。三类测试中的样本、RM 版本和原始输出都需要可追踪。","followup":"验收门槛应包括“RM排序正确”与“优化RM后行为仍正确”两层。"},{"id":17,"code":"Q017","question":"GAE 中 γ 和 λ 分别控制什么？","doc_title":"GAE 中 γ 和 λ 分别控制什么？","chapter":"Advantage/估计器","domain":"policy","level":"基础","course_day":5,"topic":"policy-gradient","brief":"TD residual为δ_t=r_t+γV(s\\_{t+1})−V(s_t)，GAE将未来residual按(γλ)^l加权。γ定义任务对未来reward的折扣；λ在一步TD的低方差高偏差与Monte Carlo的低偏差高方差之间插值。LLM单轮终局reward常取γ≈1，但长时域Agent是否折扣取决于任务是否真的偏好更早完成，而不能只是照搬默认值。","deep":"γ 决定未来奖励相对眼前奖励值多少，λ 决定 advantage 估计多依赖实际走过的后续步骤。两者不是同一种折扣。γ 改变任务累计回报的定义，λ 调整估计方式。先看 TD 误差 。V 是 critic 对未来累计奖励的预测。该式比较“这一步实际奖励加上下一状态的预测”与“走这一步之前的预测”，差值表示局部结果比预期好多少。GAE 把当前和后续 TD 误差按 1、γλ、(γλ)² 等系数相加。例如 γ=1，两步 TD 误差为 0.2 和 0.4：λ=0 时只用 0.2，λ=1 时用 0.6，λ=0.5 时用 0.4。λ 小时更依赖 critic，通常波动较小但更容易继承其预测偏差；λ大时使用更多实际后续反馈，也更容易受采样偶然性影响。\n\n到真正终止状态时，未来 value 取 0；到人为截断处，是否保留 bootstrap 要根据任务是否还能继续决定。bootstrap 指用尚未实际观察到的未来价值预测补足回报。相关原始资料：GAE。","followup":"λ不是学习率；它改变advantage estimator的bias-variance，而不是直接改变reward。"},{"id":18,"code":"Q018","question":"RLOO 为什么使用其他样本的均值作 baseline？","doc_title":"RLOO 为什么使用其他样本的均值作 baseline？","chapter":"Advantage/估计器","domain":"policy","level":"基础","course_day":5,"topic":"policy-gradient","brief":"对同一prompt采样k条response时，第i条的baseline取其余k−1条reward均值。leave-one-out避免把当前样本reward同时放入目标和baseline，保留更清晰的无偏控制变量性质；相比GRPO，它通常不再除组内std。代价是仍需多采样，并且k小时baseline方差较高。","deep":"RLOO 的 leave-one-out 是计算参照值时排除自己。对同一题生成四份回答，奖励为 [1,0,0,0]，第一份的参照是另外三份的平均值 0；第二份的参照是 [1,0,0] 的平均值 1/3。因此 advantage 为[1,−1/3,−1/3,−1/3]。若使用包含自己的组均值 1/4，差值则为 [3/4,−1/4,−1/4,−1/4]，恰好是前者的 3/4。对于固定组大小，这显示了有限样本的缩放；若再除组内标准差，作用就不再只是这个固定系数。在给定 prompt 后独立采样、参照值停止梯度等条件下，排除自己有助于保持 baseline 与本次动作独立。组内如果通过共享随机过程、筛选或去重造成依赖，需要重新检查这些条件，而不能仅凭 RLOO 名称宣称无偏。\n\n相关原始资料：RLOO。","followup":"RLOO与GRPO不是“一个有归一化、一个没归一化”这么简单，还要比较loss reduction与KL处理。"},{"id":19,"code":"Q019","question":"ReMax 为什么额外生成一条 greedy response？","doc_title":"ReMax 为什么额外生成一条 greedy response？","chapter":"Advantage/估计器","domain":"policy","level":"基础","course_day":5,"topic":"policy-gradient","brief":"ReMax用当前policy的greedy decoding结果作为该prompt的baseline，再用采样response相对它的reward差更新actor。greedy baseline与采样action本身分离，直观地表示“是否优于当前确定性策略”；但额外response只用于baseline，不产生直接训练样本，增加生成成本。greedy结果对解码配置敏感，也未必代表state value。","deep":"greedy decoding 是每一步都选择当前概率最大的 token，不做随机抽样。ReMax 额外生成一条这样的回答，评价它的奖励，作为“模型按当前最确定方式回答时能做到什么”的参照。假设 greedy 回答得 0 分，随机采样回答得 1 分，差值为 +1，可以强化采样到的成功路径。如果两者都得 1 分，差值为 0，这个样本不提供奖励差异信号。greedy 回答主要用于算参照值，不必作为另一条actor 训练样本。它省掉了专门预测价值的 critic，但多生成了一份回答。若回答极长，额外生成可能比训练小型 critic 更贵；应分别计算额外生成时间与省下的 critic 时间，不能只比较模型数量。\n\n相关原始资料：ReMax。","followup":"如果rollout已是主要瓶颈，ReMax的额外生成可能比省掉critic更昂贵。"},{"id":20,"code":"Q020","question":"REINFORCE++ 与 GRPO 的 baseline 思路有什么区别？","doc_title":"REINFORCE++ 与 GRPO 的 baseline 思路有什么区别？","chapter":"Advantage/估计器","domain":"policy","level":"基础","course_day":5,"topic":"policy-gradient","brief":"GRPO在每个prompt组内做相对归一化；REINFORCE++强调跨global batch的reward/return归一化，并可为每个prompt只采一条response，从而增加prompt多样性。它同样去掉critic，但方差结构由全局batch组成决定，对不同任务reward尺度更敏感。论文报告的是特定RM与CoT设置下的经验结果，不能推导出全局baseline总是更好。","deep":"GRPO 比较同一道题内部的多个回答。REINFORCE++ 的相关方案利用整个训练批次的统计量来规范回报或优势值，可以减少每题必须多次采样的要求。global batch 指一次优化更新覆盖的全部样本，包含多个 GPU 和梯度累积批次，而不只是某张卡眼前的小批。假设简单题通常得 1 分，难题通常得 0 分。同题比较主要去除题目难度差异；全批比较可能让难题长期低于均值。因此更丰富的题目覆盖和更准确的题内比较之间存在实际取舍。实现时要确定归一化的对象到底是 reward、return 还是 advantage，并明确 KL 是否已经加入其中。不同版本会有不同 baseline 处理。\n\n比较结果时还要看每小时覆盖了多少不同问题，以及未训练过的任务是否改善。相关原始资料：REINFORCE++。","followup":"选择前应比较每GPU-hour的unique prompts、reward scale和OOD验证，而不是只比较训练reward。"},{"id":21,"code":"Q021","question":"Dr.GRPO 认为原始 GRPO 存在哪些优化偏差？","doc_title":"Dr.GRPO 认为原始 GRPO 存在哪些优化偏差？","chapter":"Advantage/估计器","domain":"policy","level":"基础","course_day":5,"topic":"policy-gradient","brief":"Dr.GRPO分析指出，按每条response长度做归一化会改变token贡献，可能使长度与正确性发生非预期耦合；再除group reward std会让不同难度group获得不同缩放。其修正移除长度与std归一化，并用固定生成budget等方式保持更接近无偏的policy-gradient加权。该结论依赖具体loss实现，不能看到名字叫GRPO就断定一定存在同样偏差。","deep":"Dr.GRPO 讨论的偏差来自原始目标中两个除法：每条回答内部除以该回答长度，以及 advantage 除以同组奖励标准差。前者改变不同长度 token 的权重，后者改变不同难度问题的权重。例如长度 10 和 100 的两个回答，如果先各自平均再相加，短回答每个 token 的权重是长回答的 10 倍。移除这个长度因子、改用固定常数归一化后，每个有效 token 的基础权重才相同。组标准差的影响类似：相同原始奖励差，在较小标准差的组里会被赋予更大的系数。这不是说所有长度规范化都有错误，而是它们对应不同优化目标。验证时应把真实代码里的分母写出来，特别区分固定最大长度、当前批次有效 token 数和每条回答长度。\n\n它们不能互相替代。该判断依据是原论文对具体目标的分析，不是某个名字为 GRPO 的所有实现都必然如此。相关原始资料：Dr.GRPO。","followup":"面试中必须区分算法论文公式、框架中的masked_mean实现和实际loss denominator。"},{"id":22,"code":"Q022","question":"CISPO 与 PPO clipping 的关键差别是什么？","doc_title":"CISPO 与 PPO clipping 的关键差别是什么？","chapter":"Advantage/估计器","domain":"policy","level":"基础","course_day":5,"topic":"policy-gradient","brief":"PPO surrogate在越过边界且更新方向继续改善目标时把对应token梯度截为零；CISPO将clipped importance weight做stop-gradient后乘在log-prob梯度上，因此极端token仍保留有界梯度贡献。它以偏差换取较低方差和长response中的token覆盖。MiniMax-M1中的有效性是该训练设置下的论文证据，不代表它在所有模型上支配DAPO或GSPO。","deep":"PPO 会让某些已经沿正确方向变化过多的样本进入零梯度平台。CISPO 则把概率比裁剪成一个固定权重，再用这个权重乘以所选 token 的对数概率梯度。例如概率比为 2，裁剪上限为 1.2，advantage 为正。PPO 对该项已经不再奖励继续增加概率；CISPO 仍用 1.2 倍的有界权重推动更新。它降低大概率比的影响，但没有完全舍弃这些 token。stop-gradient 表示这个 1.2 只当作已经算好的数参与乘法，不再通过“它怎样由当前模型概率计算出来”这条路径反传。PyTorch 中通常用 detach 表示。没有这一步，会得到另一套梯度。CISPO 是有意改变梯度估计，不能因为保留了 token 就认为恢复了严格无偏性。\n\n相关原始资料：CISPO。","followup":"一句话区分：PPO更像丢弃越界方向的继续更新，CISPO保留token但裁剪其IS权重。"},{"id":23,"code":"Q023","question":"DPO 为什么不需要在线 rollout 和显式 Reward Model？","doc_title":"DPO 为什么不需要在线 rollout 和显式 Reward Model？","chapter":"Advantage/估计器","domain":"policy","level":"基础","course_day":5,"topic":"policy-gradient","brief":"DPO从KL-regularized RL的最优policy关系出发，把隐式reward写成policy与reference的log-ratio，并直接对chosen/rejected做二分类loss。训练时只需静态偏好对和reference log-prob，不需要在线采样、critic或独立RM。代价是受离线偏好数据覆盖限制，无法像在线RL那样主动探索policy当前分布中的新失败。","deep":"DPO 用已有偏好对直接训练生成模型。例如同一个问题有回答 A 和 B，标注认为 A 更好；训练不需要先生成新回答，而是计算模型对这两份现成文本的概率。它比较的不是单纯“模型是否更喜欢 A”，而是相对于固定参考模型，A 的概率提高了多少、B 的概率提高了多少。把两者的 log-ratio 差乘以 β 后送入二分类损失，就能利用偏好标签更新模型。原理上，带 KL 约束的奖励最大化存在一个最优策略表达式，可以反过来把奖励写成策略与参考策略的概率比。将它代入偏好模型后，独立的奖励模型被消掉。这是 DPO 不需要显式 RM 的原因，并不意味着训练没有偏好目标。离线数据没有覆盖的失败方式，不会凭空产生新的反馈。\n\n若需要学习当前模型才会生成的工具错误，仍要收集新偏好数据，或者引入在线环境奖励。相关原始资料：DPO。","followup":"DPO不是“没有reward”；reward被隐式参数化在policy-reference log-ratio里。"},{"id":24,"code":"Q024","question":"什么时候优先 DPO，什么时候优先在线 RL？","doc_title":"什么时候优先 DPO，什么时候优先在线 RL？","chapter":"Advantage/估计器","domain":"policy","level":"基础","course_day":5,"topic":"policy-gradient","brief":"偏好数据质量高、任务以风格和通用对齐为主、计算资源有限时，DPO通常是更简单的默认路径。任务具有可验证reward、需要超越离线数据、强调长推理或环境交互时，在线RL更能利用探索。常见组合是SFT/DPO建立初始行为，再用online RL优化可验证目标；验证门槛是同等GPU-hours下的OOD质量与稳定性。","deep":"先判断任务反馈是否已被离线数据覆盖。如果已有大量可靠的回答偏好，目标主要是表达、风格和指令遵循，DPO 能用较短的训练链路完成优化。如果反馈只有执行代码或调用环境后才知道，在线 RL 更容易覆盖模型当前会犯的新错误。例如客服措辞可以由已有偏好对学习；代码修复是否成功，需要运行测试。对于后者，固定偏好库可能没有当前模型生成的新补丁，而在线生成加测试能持续提供新反馈。这不是固定的算法排名。可以先用 SFT 或 DPO 建立可用行为，再用在线 RL 优化可执行验证的目标。两阶段是否都需要，应通过相同总计算预算下的隐藏任务成功率决定，而不只看训练损失。","followup":"不能只用训练复杂度决策；核心是反馈能否离线覆盖部署状态。"},{"id":25,"code":"Q025","question":"GRPO 为什么可以去掉 critic？","doc_title":"GRPO 为什么可以去掉 critic？","chapter":"GRPO/DAPO/GSPO","domain":"grpo","level":"基础","course_day":7,"topic":"ppo-grpo","brief":"GRPO对同一 prompt 采样一组 responses，用组内 reward 的相对位置构造 advantage，以组统计量替代 learned value baseline。它省去了 critic 参数、显存和训练复杂度，适合可验证 reward 的 reasoning 任务。代价是每个 prompt 必须有足够多的采样，组内 reward 若全相同则几乎没有学习信号，而且 baseline 只能消除 prompt 级难度，不能细分序列内部的 credit。","deep":"critic 需要预测“在这个状态继续生成，平均会获得多少回报”。GRPO 用同一道题的多个实际回答相互比较，替代这个单独训练的预测器，因此不必再维护一个价值模型。四个回答得分 [1,1,0,0]，组均值为 0.5。以总体标准差 0.5 做规范化后，两个成功回答的 advantage 为+1，两个失败回答为 −1。这些数作为对应回答各 token 的权重，生成模型仍然通过 log-prob 反向传播更新。省掉 critic 不等于计算免费。每题要采多条回答，而且如果四条全部同分，就没有题内优劣可比较。终局奖励版本还只能比较整份回答，不能指出成功或失败发生在哪一步。是否合适取决于多采样成本和奖励是否能在组内产生差异。\n\n相关原始资料：GRPO。","followup":"“没有 critic”不等于“没有 baseline”；group mean/std 本身就在承担 baseline 与归一化作用。"},{"id":26,"code":"Q026","question":"GRPO 组内 reward 全相同时为什么没有梯度？","doc_title":"GRPO 组内奖励全相同时，哪些梯度会消失？","chapter":"GRPO/DAPO/GSPO","domain":"grpo","level":"基础","course_day":7,"topic":"ppo-grpo","brief":"若 advantage 定义为 (r_i-mean(r))/std(r)，所有 reward 相同意味着分子为零；加上数值 epsilon 后仍得到全零 advantage。全对组和全错组都不会更新 actor，却消耗 rollout 资源。DAPO 的 dynamic sampling 会过滤零方差 group 并补充新 prompt，以提高有效样本比例。","deep":"组内奖励全相同时，减去组均值后，每个回答的差值都为 0。只要 advantage 按这个差值构造，奖励对应的策略梯度项就为 0；给分母加一个很小的 epsilon 只防止除零，不会创造优劣信号。例如 [1,1,1,1] 和 [0,0,0,0] 都没有题内差异。DAPO 的动态采样可以过滤这样的组，再生成其他问题的回答，以凑够有信号的组。但“整个 actor 完全不会更新”过于绝对。如果目标还包含 KL 惩罚或熵奖励，这些项仍可能有梯度；优化器已有动量也可能造成参数变化。测试时应分别检查奖励项梯度、其他损失项梯度和最终参数变化。","followup":"过滤会改变训练时看到的 prompt 分布，因此系统效率提升与优化目标偏移需要同时评估。"},{"id":27,"code":"Q027","question":"group size 越大越好吗？","doc_title":"group size 越大越好吗？","chapter":"GRPO/DAPO/GSPO","domain":"grpo","level":"基础","course_day":7,"topic":"ppo-grpo","brief":"增大 group size 能更稳定地估计同一 prompt 下的相对 reward，也提高发现正负样本的概率；但成本按 rollout 数近似线性增长，并加重长尾 barrier。大 group 还可能降低 prompt 多样性：固定 token budget 下，同一 prompt 的重复采样越多，不同 prompt 越少。最优值取决于 reward 稀疏度、pass rate、生成长度分布和可用并发，而不是一个固定常数。","deep":"group size 是同一个问题生成的回答数。增大它能提高观察到不同结果的机会，但同一总生成预算下，能够覆盖的不同问题会减少。假设每个回答独立成功的概率为 p，组大小为 G，那么既有成功又有失败的概率是 。p=0.5、G=4 时为0.875；p 很接近 0 或 1 时，即使多采几条，也可能仍全错或全对。因此先检查组内不同得分的比例，再决定是否加大 G。还应记录每道题的总生成 token 和最长回答耗时。回答之间高度重复或采样不独立时，上述公式只是理想化参照，不能直接当实际有效样本量。","followup":"面试中可提出用有效组比例、组内方差、unique prompt/s 和 time-to-quality 联合选型。"},{"id":28,"code":"Q028","question":"DAPO 的 decoupled clipping 解决什么问题？","doc_title":"DAPO 的 decoupled clipping 解决什么问题？","chapter":"GRPO/DAPO/GSPO","domain":"grpo","level":"基础","course_day":7,"topic":"ppo-grpo","brief":"传统对称 clip 用同一个 ε 控制 ratio 上下界。DAPO允许正向与负向更新使用不同边界，尤其放宽上界，使低概率但高 reward 的 token 有更大的概率提升空间，减轻策略过早失去探索性的风险。它并不保证不会 entropy collapse；真正效果还依赖采样温度、reward 分布、学习率和数据过滤。","deep":"DAPO 允许概率比裁剪的上、下界分别配置。上界控制好样本被增强到多大以后不再获得局部收益，下界控制坏样本被减弱到多小以后不再获得局部收益。例如好 token 的概率原来为 0.01，上界为 1.2 时，局部目标在概率约到 0.012 后进入平台；若上界改为1.3，则约到 0.013 才进入平台。数字是解释裁剪函数的例子，不是建议配置。放宽上界可以让低概率但有效的选择获得更多增强机会。它并不保证一定提高探索，也不限制其他样本通过共享参数继续改变该概率。应同时观察模型选择的多样性和外部正确率，检查是否发生少数模式占据大部分概率。相关原始资料：DAPO。","followup":"要能解释 clip-higher 的符号：advantage 为正时，ratio 的上界决定该 action 最多被增强多少。"},{"id":29,"code":"Q029","question":"DAPO 的 token-level loss 与 sequence-level loss 有什么差别？","doc_title":"DAPO 的 token-level loss 与 sequence-level loss 有什么差别？","chapter":"GRPO/DAPO/GSPO","domain":"grpo","level":"基础","course_day":7,"topic":"ppo-grpo","brief":"token-level reduction把所有有效 response token 放在一起求平均，长序列贡献更多 token；sequence-level reduction先在每条 response 内平均，再在样本间平均，使每条序列权重更接近相等。二者优化的是不同加权目标。长推理任务中，错误的 reduction 可能隐式偏爱长答案，或让短答案在 batch 中获得过高权重。","deep":"token 平均让每个有效 token 使用相同基础权重；sequence 平均先在各回答内部求平均，再对回答求平均，因此让每条回答具有相同总基础权重。用两个回答计算：A 有 2 个 token，每个 token 的损失都是 1；B 有 8 个 token，每个损失都是 3。先按回答平均，结果是 (1+3)/2=2；把全部 token 一起平均，结果是 (2×1+8×3)/10=2.6。二者不同并不是数值误差，而是 B 在第二种方式里占了更大权重。实际 RL 中，损失还乘以正负 advantage，所以长度影响可能更复杂。源码中的 masked_mean 是只统计mask 为 1 的位置；必须看它在哪个维度求平均，以及分布式训练是否按全局有效 token 数归一化。","followup":"回答时最好明确 denominator：有效 token 总数、sequence 数，还是每个 prompt group 的样本数。"},{"id":30,"code":"Q030","question":"GSPO 为什么把 importance ratio 提升到 sequence level？","doc_title":"GSPO 为什么把 importance ratio 提升到 sequence level？","chapter":"GRPO/DAPO/GSPO","domain":"grpo","level":"基础","course_day":7,"topic":"ppo-grpo","brief":"GSPO用序列 log-likelihood 的归一化聚合构造 sequence ratio，并在序列级 clipping，使一次 response 的更新权重更一致。其出发点是 token-level ratio 容易被少数 token 的极端值主导，并在 MoE 等数值敏感场景产生不稳定。序列级方法改善了整体一致性，但也可能平均掉局部关键 token 的异常漂移，因此仍需监控 token-level KL 和极端 ratio。","deep":"GSPO 把一条回答内的 token 概率变化合成一个序列级权重，再决定这条回答是否进入裁剪平台。其长度规范化权重为 exp(mean(log πcurrent−log πold))，即 token 概率比的几何平均。例如两个 token 的概率比分别为 2 和 0.5。严格的完整序列概率比为 2×0.5=1，GSPO 的规范化比为√1=1。若两个比均为 1.1，完整序列比为 1.21，规范化比为 1.1。长度规范化改变了权重定义，不只是用对数避免下溢的实现技巧。同一回答共享权重后，少数 token 的局部大幅变化不再各自触发独立裁剪。这可能提高稳定性，也可能隐藏局部异常，仍需检查 token 分布。\n\n论文报告的收益来自其模型和实验设置，不能推导成对所有任务都优于 GRPO。相关原始资料：GSPO。","followup":"不要把 sequence ratio 写成概率直接连乘；实现通常在 log-space 聚合并做长度归一化以避免数值下溢和长度偏置。"},{"id":31,"code":"Q031","question":"dynamic sampling 提升了效率，是否仍在优化原始数据分布？","doc_title":"dynamic sampling 提升了效率，是否仍在优化原始数据分布？","chapter":"GRPO/DAPO/GSPO","domain":"grpo","level":"基础","course_day":7,"topic":"ppo-grpo","brief":"不严格等价。过滤全对、全错或低信息 prompt 后，实际更新条件在“当前策略对该 prompt 有组内差异”上，训练分布会随策略变化。它提高每个 optimizer step 的有效梯度密度，却可能降低容易题和极难题的覆盖。工程上应同时保留原始分布验证集，并记录每类 prompt 的 accept rate，避免把训练 reward 上升误判为总体能力提升。","deep":"动态采样提高的是每批进入优化器的数据中，有奖励差异的样本比例。它会同时改变训练实际看到的问题分布。假设训练池里简单题全部答对，难题全部答错，中等题有对有错。过滤零差异组后，更新主要来自中等题。日志中的训练平均奖励和梯度效率可能变好，但对简单题的保持能力、对难题的探索机会也可能改变。应保存过滤前后的类别数量，并在不做同样过滤的固定验证集上评估。重新加权有时能纠正选择偏差，但需要知道保留概率；若某类数据保留概率为零，仅靠权重不能恢复已经丢失的反馈。","followup":"如果需要保持原目标，可考虑重加权；但重加权又会增加方差，必须用实验决定。"},{"id":32,"code":"Q032","question":"GRPO、DAPO、GSPO 应该怎样选？","doc_title":"GRPO、DAPO、GSPO 应该怎样选？","chapter":"GRPO/DAPO/GSPO","domain":"grpo","level":"基础","course_day":7,"topic":"ppo-grpo","brief":"默认从实现最成熟且可复现的 GRPO/DAPO 开始：可验证 reward、组采样充足、训练稳定时，复杂算法未必带来额外收益。遇到 entropy 快速下降、长短样本权重失衡，可引入 DAPO 的 clipping、dynamic sampling 和 loss normalization；遇到 MoE 或 token ratio 明显不稳定，再验证 GSPO。选型指标应是 time-to-quality、稳定性和系统复杂度，而不是单步 reward。","deep":"先使用已有可靠实现作为基线，再按具体问题替换机制。组内反馈可靠、数值稳定时，没有必要只为换算法名称而改训练链路。若主要问题是大量全同分组，单独测试动态采样；若长短回答权重不合理，先查第 29 题的分母；若极少数 token 概率比异常，才进一步比较不同裁剪方式和 GSPO。每次替换一种因素，才知道收益来自哪里。比较应至少固定模型初始权重、问题集合和总资源预算。time-to-quality 是达到指定验证质量需要的实际时间，比如达到 60% 成功率需要几小时。它比单步奖励更适合作为最终判断，因为吞吐更快却需要更多训练步，未必更省时间。","followup":"面试中给出验证门槛：相同模型、数据、token budget 和 wall time 下进行消融。"},{"id":33,"code":"Q033","question":"KL penalty 加在 reward 中和加在 loss 中等价吗？","doc_title":"KL penalty 加在 reward 中和加在 loss 中等价吗？","chapter":"训练诊断/KL","domain":"debug","level":"基础","course_day":73,"topic":"rl-throughput","brief":"若采用相同方向、相同采样分布、正确stop-gradient，并精确计算return，二者可以建立联系；实际实现常不等价。reward-side KL会进入return/advantage并影响前序token，loss-side KL是当前位置的直接可微正则；归一化、clipping和mask又会进一步改变梯度。分析时应画出KL数值经过哪些变换，而不是看到同一β就认为作用相同。","deep":"把 KL 加入 reward，会改变后续 return 和 advantage；直接加入 loss，则在当前训练位置增加一个可微的分布约束。这两条计算路径通常不能通过复制同一个 β 就互换。例如两 token 回答，第二个 token 因偏离参考模型受到 −0.2 的惩罚。若把它放进 reward 并向前累计，第一个 token 的回报也会减少，因为它引出了后面的偏移。若只在第二个固定上下文上计算可微 KL，约束直接作用于该位置的条件分布，不自动包含第一个动作对未来状态访问概率的影响。在严格定义同一序列目标、采样分布和求导路径的条件下，可以建立两种表达之间的关系；实际 PPO又加入 baseline、裁剪和多次复用，等价条件往往已被改变。\n\n验证时对一条短回答分别计算两种实现的参数梯度，比较方向和大小，而不只比较损失数值。","followup":"最小检查是对单条短序列分别计算两种实现的一次梯度，比较方向和每token权重。"},{"id":34,"code":"Q034","question":"KL 系数 β 应该如何选择或自适应？","doc_title":"KL 系数 β 应该如何选择或自适应？","chapter":"训练诊断/KL","domain":"debug","level":"基础","course_day":73,"topic":"rl-throughput","brief":"β控制任务reward与reference约束的相对尺度，因此与RM数值、response长度和loss reduction绑定。固定β简单，但训练早晚阶段的合适强度可能不同；adaptive KL controller按target KL调整β，可缓解漂移，却可能在噪声较大时振荡。应记录β、observed KL和reward三条曲线，并限制单次调整幅度。","deep":"β 是任务奖励与偏离参考模型的代价之间的换算系数。β 太大，模型几乎不愿改变原来的回答习惯；β太小，模型更容易离开参考模型熟悉的区域，但也可能放大奖励漏洞。假设一个新回答比旧回答多得 0.1 奖励，却多出 0.2 的 KL 代价。β=1 时净收益是 −0.1，β=0.1 时净收益是 +0.08。这个例子说明 β 的含义依赖奖励和 KL 的数值尺度。自适应控制器是依据观测 KL 调整 β 的规则：偏离目标太多时加大惩罚，偏离过小时减小。若指标噪声大、调整过快，会反复加减导致振荡。配置时应同时明确 KL 是每 token 均值还是整段累计值。","followup":"target KL是工程超参，不是普适常数；模型规模、tokenizer和任务都影响其含义。"},{"id":35,"code":"Q035","question":"Entropy 快速下降意味着什么？","doc_title":"Entropy 快速下降意味着什么？","chapter":"训练诊断/KL","domain":"debug","level":"基础","course_day":73,"topic":"rl-throughput","brief":"它表示policy分布变尖，但不自动等于collapse。若reward和外部准确率上升、错误率下降，entropy下降可能只是任务收敛；若同时出现多样性骤降、长度异常、KL/clip fraction升高和OOD退化，则更像过早收敛或reward hacking。应按token位置、任务类别和正确/错误样本切片，而不是只看全局平均。","deep":"熵衡量模型有多少不确定性。两个候选各占 0.5 时不确定性较大；一个占 0.99、另一个占 0.01 时，模型几乎只选择前者，熵较低。因此熵下降只说明分布更集中。若集中在正确做法上，并且未训练过的问题也变好，这是合理学习；若所有问题都套同一句话，奖励却继续上涨，才可能是过早失去多样性或利用评分漏洞。要把熵按位置和任务拆开。工具名 token 本来就只有少数合法选项，低熵未必有问题；开放式解释段的骤降可能更值得检查。用于统计的分布也要固定，原始 softmax 熵和提高采样温度后的熵不是同一个量。","followup":"生成温度影响采样entropy，但训练日志中的model entropy应基于原始policy分布。"},{"id":36,"code":"Q036","question":"Clip fraction 很高说明什么？","doc_title":"Clip fraction 很高说明什么？","chapter":"训练诊断/KL","domain":"debug","level":"基础","course_day":73,"topic":"rl-throughput","brief":"它说明大量token ratio进入clipping区域，通常意味着更新幅度大、PPO epoch过多、学习率高或样本stale。高clip fraction不直接证明训练失败，因为被clip token的advantage符号和ratio方向也重要。若KL、梯度范数和reward同时异常，应优先降低更新强度或检查behavior log-prob；若只有少数位置集中越界，则需要按token位置分析。","deep":"clip fraction 是进入某种裁剪条件的 token 或序列比例，但不同实现的定义可能不同。有的只统计概率比是否越过区间，有的统计 PPO 最小值目标是否真的选择了裁剪分支。例如 A 为正、ratio 为 0.5，虽然低于 0.8，但 PPO 仍保留增加好动作概率的梯度。若指标把所有区间外token 都计为 clipped，便不能把这个比例直接解释为“无梯度 token 比例”。数值高时，先看正负 advantage、上下界和训练 epoch 的分布。若第一轮就很高，检查采样概率是否记录正确、数据是否过旧；若随同一批数据多次更新逐渐升高，则更像更新幅度累计过大。","followup":"平均clip fraction会隐藏长尾，至少查看按sequence的p50/p95和正负advantage分解。"},{"id":37,"code":"Q037","question":"Reward 上升但真实准确率下降，排查顺序是什么？","doc_title":"Reward 上升但真实准确率下降，排查顺序是什么？","chapter":"训练诊断/KL","domain":"debug","level":"基础","course_day":73,"topic":"rl-throughput","brief":"先确认reward pipeline：解析器、verifier版本、数据泄漏和重复样本；再切片检查长度、格式、拒答和特殊token；随后用独立judge、规则或人工抽样复评；最后才调整算法超参。若训练reward和held-out同源reward都涨，但外部准确率跌，优先怀疑共同的verifier偏差，而不是optimizer。","deep":"先检查“分数变高”的测量过程，再检查模型更新。reward pipeline 指从原始回答开始，经过答案解析、规则执行或 RM 推理，最终得到标量分数的整条流程。把跃升前后的模型回答各取一批，用完全相同的评分器重新打分。如果差异消失，原日志可能混用了评分器版本；如果差异仍在，但人工或隐藏测试认为新回答更差，就检查新回答是否利用了评分规则。还应比较问题难度。训练过滤掉大量难题后，平均分自然会上升，并不意味着模型更强。只有数据和测量条件稳定，才有理由继续检查学习率、KL 等训练因素。","followup":"排查应保存原始trajectory，只有聚合曲线无法重建reward被利用的具体方式。"},{"id":38,"code":"Q038","question":"Response length 持续增长一定是 reasoning 涌现吗？","doc_title":"Response length 持续增长一定是 reasoning 涌现吗？","chapter":"训练诊断/KL","domain":"debug","level":"基础","course_day":73,"topic":"rl-throughput","brief":"不是。长度增长可能来自更充分推理，也可能来自loss normalization偏差、RM length bias、overlong shaping或模型学会重复自检。需要比较正确与错误样本长度：若错误答案增长更快、单位token收益下降、删去重复段落不影响答案，通常不是有效reasoning。Dr.GRPO等工作也提醒，优化器实现本身可能诱导长度变化。","deep":"生成更长只能证明计算和文本增加了，不能单独证明推理能力提高。有效推理应该使原本错误的题变正确，或在必要验证中降低错误率。例如旧模型用 200 token 答错，新模型用 500 token 答对，额外步骤可能有价值；若新模型用 1000 token仍答错，只是重复检查同一算式，就没有相应收益。可以删去重复步骤再评价答案，检查结果是否受影响。accuracy-length Pareto 指在“更高准确率”和“更短回答”两个目标上，找出无法被另一配置同时超过的方案。它有助于看清多花的 token 换来了多少质量，而不强求所有任务都越短越好。","followup":"应同时报告accuracy-length Pareto、错误样本长度和每生成token的增益。"},{"id":39,"code":"Q039","question":"为什么 advantage normalization 既能稳定训练又可能改变目标？","doc_title":"为什么 advantage normalization 既能稳定训练又可能改变目标？","chapter":"训练诊断/KL","domain":"debug","level":"基础","course_day":73,"topic":"rl-throughput","brief":"减均值可作为控制变量降低方差；除标准差会对不同batch或group做数据依赖缩放，使低方差组与高方差组的相对权重变化。global normalization、per-prompt normalization和per-token normalization对应不同加权目标。分布式实现还必须确保统计量跨DP rank一致，否则每个rank优化的尺度不同。","deep":"减去参照值与除以标准差承担不同作用。前者改变判断好坏的零点；后者改变一个单位差异对梯度有多大影响。标准差描述同一组数围绕均值的分散程度。两组原始奖励差都为 0.1，一组标准差为 0.1，另一组为 1；规范化后系数分别为 1 和 0.1，前组权重变成后组的 10 倍。这可能改善数值尺度，也可能放大某类问题的重要性。使用同批样本计算均值和标准差时，它们本身依赖被采到的动作，严格无偏不自动成立。global、per￾group、per-token 分别是在整批、每题组内或 token 位置上统计；必须在代码中明确维度，不能只写一句 normalize。","followup":"回答时说明在哪个轴上求mean/std：group、batch、token还是sequence。"},{"id":40,"code":"Q040","question":"怎样设计 RL 训练的最小稳定性仪表盘？","doc_title":"怎样设计 RL 训练的最小稳定性仪表盘？","chapter":"训练诊断/KL","domain":"debug","level":"基础","course_day":73,"topic":"rl-throughput","brief":"第一层看质量：train/held-out reward、外部accuracy、pass rate；第二层看分布：KL、entropy、length、group variance、有效样本率；第三层看优化：ratio、clip fraction、grad norm、loss scale；第四层看系统：policy version、staleness、drop rate和各阶段wall time。每个异常必须能下钻到prompt、trajectory和token。","deep":"最小仪表盘需要把一次异常定位回原始样本。例如 reward 上涨时，能同时看到隐藏任务成功率、长度变化和评分器版本，而不是只增加更多曲线名称。可以给每个训练批次一个 batch_id，给每条回答一个 trajectory_id。曲线点关联该批次的任务类别、奖励分量、生成权重版本和样本文件。查看 ratio 的高分位数时，还能直接找到贡献最大值的 token。p95 表示 95% 的观测不超过该值，用来揭示平均值遮住的长尾。系统阶段时间则用于区分等待环境、生成、训练和权重同步。四类数据通过同一标识关联，才真正具备排障价值。","followup":"只有均值没有分位数和原始样本，仪表盘无法诊断长尾或局部collapse。"},{"id":41,"code":"Q041","question":"OPD 与离线 knowledge distillation 的本质差别是什么？","doc_title":"OPD 与离线 knowledge distillation 的本质差别是什么？","chapter":"OPD 基础","domain":"opd","level":"基础","course_day":75,"topic":"opd-kl","brief":"离线蒸馏主要在 teacher 或固定数据产生的状态上训练 student；OPD先由当前 student 生成 trajectory，再让 teacher 在这些 student-visited states 上提供监督。它直接覆盖学生实际会犯错和偏离的区域，缓解 teacher-forcing 与部署生成之间的 exposure bias。代价是数据分布随 student 更新，训练链路需要持续 rollout、teacher inference 和版本管理。","deep":"OPD 是 on-policy distillation，指在学生模型自己生成的上下文上做蒸馏。蒸馏的目标是让学生从教师模型的输出分布或反馈中学习，而不一定要求教师再次生成完整回答。假设教师的标准解法是“先求面积，再算体积”，学生却先写了一个错误公式。离线蒸馏反复训练教师的正确前缀，学生未必学会在自己的错误前缀后如何处理；OPD 把学生已经写出的内容交给教师，让教师评价这个位置合理的下一步。训练实现通常先用学生生成 token，再冻结这些离散 token 作为输入，让教师和学生对同一前缀分别计算下一 token 分布。之后计算两分布的差异，并只更新学生。教师可能建议修正，但并不能保证任何错误前缀都可恢复。\n\nteacher forcing 指训练时把给定的历史（通常来自示范数据）喂给模型，而非使用模型自己的历史。exposure bias 是这两类历史不一致带来的问题。OPD 针对的是状态覆盖；它可以使用不同方向的 KL 或其他损失，并非某一个 KL 公式的别名。相关原始资料：OPD / GKD。","followup":"一句定位：teacher 不是只示范自己的答案，而是在学生走到的状态上给方向。"},{"id":42,"code":"Q042","question":"OPD 与 KL-regularized RL 有什么关系？","doc_title":"OPD 与 KL-regularized RL 有什么关系？","chapter":"OPD 基础","domain":"opd","level":"基础","course_day":75,"topic":"opd-kl","brief":"若在 student trajectory 上使用 teacher 与 student 的 log-prob 差构造 token reward，OPD可写成带分布约束或 teacher-shaped reward 的 policy optimization。直接最小化 KL 与把 log-ratio 放进 reward 再做 policy gradient，在梯度路径、采样估计和 credit assignment 上不完全等价：前者是可微监督目标，后者还经过 return/advantage 估计，并通常对 reward 停梯度。","deep":"OPD 可以采用固定学生轨迹上的可微分布匹配，也可以把教师反馈转成奖励后做策略优化。这两种路径都使用教师，但需要的梯度不同。第一种路径在固定前缀上计算教师与学生的完整词表 KL，梯度直接穿过学生概率。第二种路径在已采到的 token 上算“教师 log-prob 减学生 log-prob”，把它当作分数，再乘到策略梯度上。后者要决定该分数是否累计影响前面的动作。固定采样轨迹后只更新条件分布，通常不对“学生为何访问这个前缀”求完整梯度；严格的序列期望则还涉及访问这些状态的概率。两者不能仅因为都写了 KL 就宣称等价。代码检查应明确哪些 tensor 调用 detach，以及奖励如何进入 return。","followup":"面试官关注的不是“都用了 KL”，而是 expectation 在谁的分布下、梯度穿过哪些变量。"},{"id":43,"code":"Q043","question":"forward KL 与 reverse KL 在蒸馏中分别有什么倾向？","doc_title":"forward KL 与 reverse KL 在蒸馏中分别有什么倾向？","chapter":"OPD 基础","domain":"opd","level":"基础","course_day":75,"topic":"opd-kl","brief":"KL(teacher\\|\\|student)要求 student 覆盖 teacher 赋予概率的各类模式，偏向 mode covering；KL(student\\|\\|teacher)在 student 自己访问的区域惩罚 teacher 低概率行为，偏向 mode seeking。Full-vocab forward KL通常需要从 teacher 分布的整个词表求期望；on-policy student trajectory天然更容易估计 reverse-direction 信号。具体命名必须写清 p、q，不能只说“正向/反向”。","deep":"先固定方向：本文的 forward KL 是 KL(teacher‖student)，reverse KL 是 KL(student‖teacher)。KL 左侧的分布决定各候选 token 在求和中占多大权重。设教师认为 A、B 两条解法都合理，各给 0.5；学生几乎只给 A 概率。forward KL 会对学生遗漏 B 给予明显惩罚，因为 B 在教师分布中有较大权重。所谓 mode covering，就是希望学生覆盖教师支持的多种高概率行为。reverse KL 用学生自己的概率加权，学生几乎不访问 B 时，B 的直接贡献较小；它对“学生投入了概率、教师却认为很差”的选项尤其敏感。\n\n这被称为 mode seeking，即在能力有限时更倾向集中到部分可行行为。但若学生能够无约束表示教师分布，两种 KL 的最优解都可为两分布相等，不应把这种倾向理解成绝对定律。还要区分两个轴：前缀由谁生成，以及固定前缀下对哪个词表分布求期望。前缀来自学生，并不妨碍在该前缀上精确计算 forward KL。","followup":"一个安全回答格式是先写公式，再谈 mode covering/mode seeking，避免方向写反。"},{"id":44,"code":"Q044","question":"Full-vocab OPD 比 sampled-token OPD 多了什么信息？","doc_title":"Full-vocab OPD 比 sampled-token OPD 多了什么信息？","chapter":"OPD 基础","domain":"opd","level":"基础","course_day":75,"topic":"opd-kl","brief":"sampled-token 只观察实际生成 token 的 teacher/student log-prob；full-vocab 在每个位置比较整个 vocabulary 分布，能利用未被采样但 teacher 认为合理的候选 token，梯度更密集、方差更低。成本是 logits 张量近似为 B×T×V，十万级词表和长上下文下显存与通信非常高，因此常需要 chunk、vocab parallel、teacher offload 或在线消费。","deep":"完整词表蒸馏在每个位置比较所有候选 token，采样 token 蒸馏只读取实际出现的那个 token 的信息。这里的词表是模型可输出 token 的全集，不是这条回答包含的词。设教师对 [A,B,C] 的概率为 [0.6,0.3,0.1]，学生为 [0.3,0.6,0.1]。若本次采到了 C，只看 C 的 log-prob 会发现二者完全一致，却看不到 A、B 的概率交换。完整词表比较能够看到这个差异。因此在同一固定前缀上，完整求和消除了“只抽一个候选”的估计噪声，但并未消除学生前缀本身的采样噪声。单 token 的正确估计也可能在多次抽样后无偏，不应简单称其一定有偏。代价是中间输出的大小约为 B×T×V×字节数。\n\nB 是批内序列数，T 是计算的位置数，V 是词表大小。可以逐块计算词表或时间位置，累积 KL 后释放中间值；是否还保留反向传播需要的激活，要另行统计。","followup":"估算必须给公式：logits_bytes=B×T×V×dtype_bytes；不要把 top-k 近似说成严格等价。"},{"id":45,"code":"Q045","question":"teacher offload 真正省下和付出的是什么？","doc_title":"teacher offload 真正省下和付出的是什么？","chapter":"OPD 基础","domain":"opd","level":"基础","course_day":75,"topic":"opd-kl","brief":"offload把冻结 teacher 的权重或部分状态移出稀缺 GPU，使 actor 能使用更多显存；代价是 CPU 内存、PCIe/NVLink 传输、加载同步和调度复杂度。若每个 step 都完整搬运 teacher 权重，传输可能抵消节省；更常见的方向是分阶段驻留、与 actor 计算 overlap、按层流式加载或分配独立 teacher 资源。是否有效必须从 timeline 看传输是否被隐藏。","deep":"teacher offload 是把暂时不用的教师权重或中间状态移出 GPU，常移到 CPU 内存。它腾出的显存可以给学生训练，但以后使用教师时必须再搬回来，或按层逐步搬入。假设冻结教师有 70 亿参数，每参数 2 字节，仅权重约 14 GB。若实际有效传输带宽为 25 GB/s，单方向搬运的理想下界约 0.56 秒，实际还包括同步和加载开销。这里是容量估算，不是某台机器的测量结果。冻结仅表示不更新参数，并不等于权重不占显存。是否划算要看节省的显存是否允许更大的有效批次，以及传输能否与其他独立计算重叠。普通 GPU 到 CPU 路径通常经过 PCIe；不能默认所有 offload 都享有GPU 间 NVLink 的带宽。","followup":"teacher 无 optimizer state，但参数量仍可能与 actor 同级；offload 的对象和粒度必须说清。"},{"id":46,"code":"Q046","question":"teacher 与 student tokenizer 不一致还能做 token-level OPD 吗？","doc_title":"teacher 与 student tokenizer 不一致还能做 token-level OPD 吗？","chapter":"OPD 基础","domain":"opd","level":"基础","course_day":75,"topic":"opd-kl","brief":"不能直接逐位置比较 logits，因为两个词表的 token 不构成一一对应事件，序列边界也会错位。可以退化为 sequence-level 黑盒蒸馏、使用 teacher 文本作为偏好/奖励，或设计字符/字节级对齐与词表映射，但这些都改变了目标并引入近似。只有 tokenizer、chat template 和输入序列严格对齐时，full-vocab token KL 才有直接语义。","deep":"两个 tokenizer 不同，通常意味着它们用不同片段表示相同文本。例如一个把“北京”当作一个 token，另一个切成“北”“京”。同一位置的 logit 向量不再描述相同候选事件，不能逐坐标计算 KL。可选办法是改成整份答案层面的监督：让教师生成或评价文本，再按学生 tokenizer 编码。也可以研究字节或字符对齐，但必须重新定义候选事件，不能仅截取两边词表共同长度。相同 tokenizer 也仍需检查上下文语义。system、工具定义和历史结果缺失，会让两边概率条件不同。严格字节完全相同是常见安全实现方式；若教师使用特权信息或不同提示模板，则属于另一种有意设计的蒸馏，应明确这种区别。","followup":"即使词表相同，BOS/EOS、tool template、padding side 和 truncated positions 不同也会造成静默错位。"},{"id":47,"code":"Q047","question":"如何验证 OPD 实现没有把 KL 方向或 mask 写错？","doc_title":"如何验证 OPD 实现没有把 KL 方向或 mask 写错？","chapter":"OPD 基础","domain":"opd","level":"基础","course_day":75,"topic":"opd-kl","brief":"先构造二分类 toy vocabulary：手工指定 teacher=\\[0.9,0.1\\]、student=\\[0.5,0.5\\]，检查一次梯度更新后 student 的第一维概率是否上升。再用一条短序列验证 prompt/tool/padding token 的 loss 均为零，只有 assistant action token 有梯度。最后比较实现输出与单机 FP64 参考公式，覆盖 packed sequence、remove padding 和 vocab parallel。","deep":"只检查“一步更新后学生更接近教师”不能证明 KL 方向正确，因为 forward 和 reverse KL 都可能朝这个方向变化。方向检查要同时比损失数值和梯度。例如教师 [0.9,0.1]、学生 [0.5,0.5]，forward KL 约为 0.368，reverse KL 约为 0.511。先手算这两个不同答案，再用独立高精度实现分别计算对学生 logits 的梯度，最后比较待测代码。如果只看第一维概率上升，两种实现都可能通过。mask 测试另做：构造含 prompt、assistant、tool 和 padding 的短序列，把 masked token 的损失改成很大，最终 actor 损失仍应不变。\n\n这个测试检查损失位置，而非声称被 mask 的上下文在计算图中完全没有梯度影响；上下文仍会影响后续动作。","followup":"这类最小实验比直接看大模型 reward 更能区分方向错误、归一化错误和 token 对齐错误。"},{"id":48,"code":"Q048","question":"黑盒 teacher 没有 logits 时还能做 OPD 吗？","doc_title":"黑盒 teacher 没有 logits 时还能做 OPD 吗？","chapter":"OPD 基础","domain":"opd","level":"基础","course_day":75,"topic":"opd-kl","brief":"可以，但目标不再是精确的 full-vocab KL。常见路线包括让 teacher 对 student trajectory 打分、生成修订答案、构造 pairwise preference，或训练 discriminator/reward model 区分 teacher 与 student 输出，再用在线 RL 更新 student。监督更稀疏且可能受到 judge bias；优势是可使用闭源 teacher。","deep":"黑盒教师通常只返回文本，不能查询任意候选 token 的概率，因此不能直接计算完整词表 KL。但可以在学生轨迹上请求评分、纠错或偏好判断，再把这些反馈转为训练数据。例如学生写出一段有 bug 的补丁，让教师指出失败位置并给出修改版。可以用修改版做监督学习，也可以形成“修改版优于原版”的偏好对。若只获得 0 到 1 的评分，则可以作为奖励，但要检查评分是否真与测试结果一致。这些方法的误差和成本不同，不是从低到高的一条统一等级链。on-policy 只说明轨迹由当前学生产生；black-box 只说明教师接口的可见范围。二者是独立属性。","followup":"回答时明确区分 on-policy data collection 与白盒 logit access，它们是两个独立维度。"},{"id":49,"code":"Q049","question":"One-step off-policy 到底 off 在哪里？","doc_title":"One-step off-policy 到底 off 在哪里？","chapter":"Async/Partial","domain":"async","level":"基础","course_day":54,"topic":"async-rollout","brief":"rollout由版本 θ_v 生成，但训练消费它时 actor 已更新为 θ\\_{v+1}，数据分布不再等于当前策略，因此属于 off-policy。这里的 one-step 通常是权重同步或 learner update 的版本差，不是 token 时间步。偏差大小不能只看版本号：一次大梯度更新可能比三次小更新产生更大的 KL。","deep":"one-step off-policy 描述的是采样模型与训练模型相差一个更新版本，而非 Agent 多走了一步。假设版本样本频率反映的是版本 10 的选择习惯，当前模型却已经是 11。某个动作原来概率 0.1、现在 0.3，旧数据里它出现的次数就少于当前模型重新采样时的预期次数。版本差是便宜的记录方式，但不直接表示分布差多大。同一次更新可能很小，也可能因异常梯度变化很大。实际还应保存采样时的 log-prob，并在消费时计算同一动作的当前概率。","followup":"定义必须落到 policy_version、生成时间和消费时间三个字段，否则“one-step”只是口号。"},{"id":50,"code":"Q050","question":"Full-Async 中 staleness 应怎样度量？","doc_title":"Full-Async 中 staleness 应怎样度量？","chapter":"Async/Partial","domain":"async","level":"基础","course_day":54,"topic":"async-rollout","brief":"version gap最便宜，适合队列准入和快速丢弃；behavior/current KL或importance ratio更贴近分布偏差，但需要额外 log-prob 计算；样本年龄只反映 wall time。工程上常用 version threshold 做硬门槛，再对训练 batch 监控 ratio、KL 和 clip fraction。只靠平均 staleness 不够，还要看 p95/p99，因为极旧样本可能主导梯度。","deep":"staleness 表示样本相对训练时模型有多旧。可用版本差、实际经过的时间，或模型对同一动作的概率变化来度量，它们分别反映不同问题。版本 10 的样本被版本 15 使用，版本差为 5；生成后等待 30 秒，年龄为 30 秒。如果这五次更新很小，概率变化仍可能小于另一个只差一版但更新很剧烈的样本。队列可先按版本差过滤明显过旧的数据，再在训练时检查概率比的分布。查看高分位数而非只有均值，是为了发现少量非常旧的长轨迹。若一条轨迹中途换过权重，还要按片段记录，不能只给整条一个平均版本。","followup":"阈值必须与参数同步频率、学习率和每版本更新量共同标定。"},{"id":51,"code":"Q051","question":"异步样本一定要做 importance correction 吗？","doc_title":"异步样本一定要做 importance correction 吗？","chapter":"Async/Partial","domain":"async","level":"基础","course_day":54,"topic":"async-rollout","brief":"理论上从 behavior policy 到 current policy 的无偏修正需要 importance ratio；但长序列 ratio 容易高方差甚至退化，实际系统常采用 clipping、限制 staleness、降低每次更新幅度或直接接受小偏差。是否修正是 bias-variance tradeoff。不能因为“版本只差一轮”就默认无偏，也不能因为 ratio 可计算就认为 correction 一定更好。","deep":"重要性采样通过重新分配样本权重，把一个分布下收集的数据用于估计另一个分布的期望。设旧策略 μ对动作 A、B 的概率为 [0.8,0.2]，目标策略 π 为 [0.4,0.6]，两动作奖励为 [1,3]。旧数据直接平均奖励，期望是 1.4；目标策略真正的期望是 2.2。用概率比 π/μ，即 [0.5,3] 加权后，旧数据的期望成为 0.8×0.5×1+0.2×3×3=2.2。旧策略少采到的 B 被赋予更大权重，这就是修正的来源。成立条件之一是目标策略可能选择的事件，在采样策略下不能完全没有概率。若旧采样器截断掉 B，再大的权重也无法从数据里恢复它。长轨迹的严格概率比还包含多步选择，可能极端不稳定。\n\n因此异步系统可能采用裁剪权重、丢弃过旧数据或允许一定偏差。应明确这是减少估计波动与减少分布偏差之间的取舍。单个 token 的比值一般只修正固定历史下的动作分布，不能自动完成整个轨迹的无偏校正。","followup":"应以稳定性和 time-to-quality 做消融，并记录 ratio 分布而非只记录均值。"},{"id":52,"code":"Q052","question":"为什么长序列 importance ratio 特别困难？","doc_title":"为什么长序列 importance ratio 特别困难？","chapter":"Async/Partial","domain":"async","level":"基础","course_day":54,"topic":"async-rollout","brief":"序列概率比是逐 token ratio 的乘积，log-space 中是 log-ratio 之和。即使每个 token 只有轻微偏差，几千到几万 token 累积后也会产生极端值；直接乘积还会数值上溢或下溢。token-level clipping降低局部方差但改变目标，sequence-level归一化可减轻长度效应却可能掩盖关键 token。","deep":"完整序列概率比是各个 token 条件概率比的乘积。即使每个位置只增加 1%，连续 1000 个位置的乘积也约为 ，即约 2.1 万；实际各位置可能增减不同，但长乘积更容易产生很不均衡的权重。用 log-space 计算，意思是先把比值取对数相加，再取指数，避免中途连乘发生上溢或下溢。这只处理数值表示，不会让最终 2.1 万的统计权重变得温和。裁剪把极端值限制到范围内，代价是改变期望；取几何平均则改变长度权重。选择方案时，应分别说明解决的是数值溢出还是少数样本主导更新，不能把它们归为同一个精度问题。","followup":"面试中要指出：这是统计问题与数值问题的叠加，不只是实现精度问题。"},{"id":53,"code":"Q053","question":"Partial Rollout 跨 policy version 后，整条轨迹属于谁？","doc_title":"Partial Rollout 跨 policy version 后，整条轨迹属于谁？","chapter":"Async/Partial","domain":"async","level":"基础","course_day":54,"topic":"async-rollout","brief":"它属于分段 behavior policy：前缀由 θ_v 生成，续推部分可能由 θ\\_{v+k} 生成。正确的数据结构应为每个 segment 或 token 保留 policy_version 和 behavior log-prob，而不能只给整条 trajectory 一个版本。若算法只支持单 behavior policy，可以冻结旧 engine 续推、丢弃前缀 loss，或接受有界近似；三者的成本和偏差不同。","deep":"跨版本续推的回答由多个行为策略共同生成。例如前 100 个 token 来自版本 10，后 80 个来自版本 12。其采样概率必须按各位置真实使用的模型计算，不能统一声称来自版本 12。最稳妥的数据表达是为每个片段保存起止位置、权重版本和实际采样 log-prob，训练时拼成逐 token 的记录。若继续生成时换了权重，应先根据保存的 token 重新计算前缀缓存，否则连“来自版本 12”的后半段也可能使用旧模型留下的中间状态。只把前缀的 loss mask 设为 0，并不能让后半段变成严格的纯版本 12 数据，因为这些后半段依赖的历史仍由旧策略产生。可以接受并限定这种近似，也可以固定旧模型完成整条回答。\n\n两者的成本和统计含义不同。","followup":"先定义 partial 的算法语义，再谈系统恢复；仅保存 token 并不能解决多策略轨迹问题。"},{"id":54,"code":"Q054","question":"权重更新后为什么不能直接复用旧 KV Cache？","doc_title":"权重更新后为什么不能直接复用旧 KV Cache？","chapter":"Async/Partial","domain":"async","level":"基础","course_day":54,"topic":"async-rollout","brief":"KV Cache是各层历史 token 经旧权重投影得到的 key/value。权重变化后，当前模型对相同前缀应产生不同 K/V；把旧 cache 与新权重的后续计算拼接，相当于运行一个混合模型，不再对应任何单一 policy 的精确前向。若更新很小，可以把它作为近似并实测误差；严格正确的做法是重新 prefill，或用未更新的旧模型续推。","deep":"KV Cache 保存的是历史 token 在每层注意力中计算出的 key 和 value，用来避免每生成一个新 token 都重新计算整个前缀。它不仅由 token 决定，也依赖生成它的模型权重和数值路径。如果前缀用旧权重算出的 key/value 留在缓存里，后续却使用新权重计算 query，就把两个模型的中间量混在一起。这样的结果通常既不等于旧模型，也不等于新模型对完整前缀的前向。严格切换有两种常见方式：保留旧模型把请求做完；或保存 token，在新模型下重新 prefill。prefill 就是一次性处理已有前缀并建立缓存。只有能够证明改动不影响已缓存的量时，才可保留对应缓存，而不是所有参数更新都必须无差别处理。","followup":"保存 KV 解决的是计算状态，保存 token 解决的是可重算状态，二者要区分。"},{"id":55,"code":"Q055","question":"异步队列如何做 backpressure 和 freshness control？","doc_title":"异步队列如何做 backpressure 和 freshness control？","chapter":"Async/Partial","domain":"async","level":"基础","course_day":54,"topic":"async-rollout","brief":"Rollouter生产过快会积压旧样本，Trainer过快则会饿死。队列应同时受容量、policy version、每类 prompt 配额和 learner 需求控制：高水位时降低生成并发或暂停旧版本生产；消费前再次检查 staleness；参数同步后决定未完成请求是 sleep/resume、重算还是丢弃。只做长度上限会让最新样本被旧样本堵在队尾。","deep":"backpressure 是消费者来不及处理时，向生产者施加限制。这里生产者是 rollout，消费者是 trainer。若每秒生成 120 条，训练每秒只消费 80 条，队列每秒多出 40 条；持续运行后内存和样本年龄都会增加。限制应同时看条数、总 token 和最旧版本。十条超长轨迹可能比一千条短回答更占内存，只限制条数不够。队列到高水位后，可以减少新请求准入；消费前再检查样本是否已经过旧。取消正在运行的 Agent 还可能留下环境状态，需定义清理或恢复操作。频繁丢弃长轨迹也会改变任务分布，因此要记录哪些类型被取消，以及有效完成率，而不只看队列是否降下来了。","followup":"关键指标是 queue age/version 分布、drop rate、producer/consumer idle time 和有效训练 token/s。"},{"id":56,"code":"Q056","question":"怎样评价异步系统的真实收益？","doc_title":"怎样评价异步系统的真实收益？","chapter":"Async/Partial","domain":"async","level":"基础","course_day":54,"topic":"async-rollout","brief":"不能只看 rollout throughput。异步可能让单个训练阶段和生成阶段都变慢，但通过 overlap 降低端到端 wall time；同时 stale data 可能降低 sample efficiency。最终指标应是固定 GPU-hours 或 wall time 达到目标 benchmark 的 time-to-quality，并辅以 effective tokens/s、资源利用率、staleness 和最终质量。","deep":"异步收益来自生成与训练重叠，但重叠本身不保证最终更省资源。假设同步一轮先生成 10 秒，再训练5 秒，总计 15 秒；资源完全分离且可充分重叠时，稳态每批的理想间隔接近 10 秒，而不是 5 秒。如果为此额外占用一倍 GPU，墙钟时间减少却不一定减少 GPU-hours。GPU-hours 是 GPU 数量乘使用小时数。若异步旧数据使达到同一质量所需批次数增加，还要把这部分训练成本加回来。应同时报告达到固定质量的时间和资源消耗。若同步从未达到目标，而异步达到，也需明确可比的评估区间；不能只拿最快一个 step 推断整次训练收益。","followup":"若只报告单 step 加速而不报告训练曲线，无法证明优化对 RL 任务真正有效。"},{"id":57,"code":"Q057","question":"Agentic RL 与单轮 reasoning RL 的本质差别是什么？","doc_title":"Agentic RL 与单轮 reasoning RL 的本质差别是什么？","chapter":"Agentic RL","domain":"agent","level":"基础","course_day":41,"topic":"agent-action","brief":"单轮 reasoning 通常在固定 prompt 上生成一段 response，环境只在结尾评分；Agentic RL 在生成过程中反复执行 tool action、接收 observation，并改变外部状态。数据对象因此不再只是 prompt-response，而是 state-action-observation 的长轨迹，系统还必须处理环境并发、超时、恢复、污染和可复现性。","deep":"Agentic RL 训练的是模型在外部反馈中连续完成任务的能力。单轮推理通常在给定输入后一次生成答案，而 Agent 会在生成过程中调用工具、读取结果，再决定下一步。两者都可以优化最终成功率，但后者需要保存更完整的交互过程。以修代码为例：模型先读取文件，工具返回源代码；模型提出修改，环境中的文件随之变化；随后运行测试，测试结果再决定下一次修改。一次 rollout 是把这整个交互过程实际运行一遍，trajectory 则是保存下来的动作和结果记录。环境并不要求每次动作都改变物理状态。读取文件虽然不修改文件，却获得了此前未知的信息，同样属于有效交互。因此识别 Agentic 任务应看模型是否依据外部反馈继续决策，不能只看有没有写操作。","followup":"多轮 chat 不自动等于 Agentic RL；关键是 action 是否真正作用于环境并改变后续状态。"},{"id":58,"code":"Q058","question":"一次 action 应该定义为 token、assistant turn 还是 tool call？","doc_title":"一次 action 应该定义为 token、assistant turn 还是 tool call？","chapter":"Agentic RL","domain":"agent","level":"基础","course_day":41,"topic":"agent-action","brief":"这取决于优化与环境的时间尺度。模型概率在 token 级分解，因此 actor loss最终落到 token；环境只在完整 tool call 后转移状态，因此MDP或semi-MDP通常以tool-call boundary作为 action step；一个assistant turn还可能包含思考、多个tool call或最终回答。工程上应同时保留token级概率和turn/tool级边界。","deep":"动作粒度取决于要描述哪一层。模型逐 token 选择，执行器按完整命令执行，任务评估可能按轮次打分。可以同时保留三种粒度，不必强行把它们定义成同一个时间步。例如一次 assistant 输出“先检查日志”，随后生成一个读取日志的工具调用。生成模型每选择一个token 都有概率；环境只有在拿到完整调用后才执行读取。前者适合记录 log-prob，后者适合记录状态变化和耗时。若一个 turn 内包含两个并行工具调用，还要分别记录两次调用的 ID 和返回结果。turn 只是对话分段，不一定等同于一次环境动作。把它们保存成不同粒度，是为了让奖励和训练位置能准确对应。","followup":"不要强行只选一个粒度；正确建模是多尺度表示，credit和调度各用合适粒度。"},{"id":59,"code":"Q059","question":"tool response 为什么通常不参与 actor loss？","doc_title":"tool response 为什么通常不参与 actor loss？","chapter":"Agentic RL","domain":"agent","level":"基础","course_day":41,"topic":"agent-action","brief":"tool response由环境产生，不是 policy 采样的 action。对这些 token 计算actor loss，会让模型学习提高环境 observation 的“概率”，但模型并不能控制其内容，还可能产生错误梯度。tool response应进入上下文，影响后续 action 的条件分布；其 attention mask 通常有效，而 loss mask 为零。","deep":"工具返回是环境提供给模型的输入，并不是模型在该位置作出的选择。策略损失通常只用于模型实际生成的 token，否则会把外部观察误当作模型自己应提高概率的动作。一条短轨迹可以是 user 提问、assistant 调用工具、tool 返回数值、assistant 作答。相应 loss mask 可按片段写成 [0,1,0,1]，其中 1 表示该片段的生成选择参与策略损失，0 表示只提供条件。attention mask 回答“当前 token 能读取哪些历史”，loss mask 回答“哪些输出位置进入训练目标”。两者完全不同。loss 为零的工具文本仍会影响后续回答，也可能通过后续计算影响共享参数的梯度，不能把它理解成从计算图中彻底删除。","followup":"system/user token同理：可被模型读取，但不是当前trajectory中由actor选择的action。"},{"id":60,"code":"Q060","question":"malformed tool call 应如何处理？","doc_title":"malformed tool call 应如何处理？","chapter":"Agentic RL","domain":"agent","level":"基础","course_day":41,"topic":"agent-action","brief":"训练数据必须保留模型原始输出，因为那才是 policy action。解析器可返回结构化错误 observation，让模型学习格式失败的后果；如果系统自动修复后执行，应同时记录 original action、repaired action 和 repair flag，避免把环境实际执行的修复结果错误归因给模型。基础设施解析异常则应与模型格式错误分开，不应统一打负 reward。","deep":"格式错误也属于模型真实产生的结果。应让解析器明确返回失败，并根据任务规则选择允许修正、结束任务或给出惩罚。无论如何处理，都要保存原始输出，才能让奖励与被更新的动作对应。malformed 指工具调用格式不符合接口，例如本应是 JSON 对象却少了右括号。把“JSON 解析失败”作为下一条工具结果返回，模型才有机会修正。若服务器偷偷补齐括号，至少同时保存原始 token、实际执行参数和修复标志。训练 log-prob 必须对应原始 token；否则更新的是模型从未采样出的文本。工具参数错误和服务器自身异常也应有不同错误码，便于分别计分和重试。","followup":"最危险的做法是静默修复后只保存修复文本，它会造成 action、log-prob 与环境转移不一致。"},{"id":61,"code":"Q061","question":"为什么 outcome reward 在长轨迹中会失效？","doc_title":"为什么长轨迹中的终局奖励常常学习效率很低？","chapter":"Agentic RL","domain":"agent","level":"基础","course_day":41,"topic":"agent-action","brief":"终局 reward 仍可产生无偏的 sequence policy gradient，但方差很高、credit很粗。失败轨迹可能包含多个正确搜索和工具调用，却因最后一步错误全部获得负 advantage；成功轨迹也可能包含大量无效循环而被整体奖励。轨迹越长、tool call越多，这种错误归因越严重。","deep":"终局奖励仍能形成策略梯度，但任务越长，成功越稀少，越难从结果判断每一步的贡献。同一个最终分数可能覆盖大量正确和错误动作，造成更新信号粗糙、重复采样后波动很大。假设 Agent 做对了 9 步，最后误删了文件，最终失败。只用终局奖励训练时，这 10 步共享失败结果，无法直接指明误删才是问题。这里“失效”通常指信号效率很低，并不表示数学上完全不能学习。critic 可以预测每一步后成功的预期分数，比较误删前后价值变化；过程验证器也可以在文件被误删时明确扣分。前者依赖预测准确，后者依赖规则正确。增加任何一个模块，都需说明它比终局分数额外提供了什么信息。","followup":"解决方向包括 value critic、process reward、turn-level TD、potential-based shaping 和反事实 credit。"},{"id":62,"code":"Q062","question":"turn-level reward 怎样避免改变原任务目标？","doc_title":"turn-level reward 怎样避免改变原任务目标？","chapter":"Agentic RL","domain":"agent","level":"基础","course_day":41,"topic":"agent-action","brief":"一种原则是使用 telescoping shaping：令 shaped reward包含 Φ(s\\_{t+1})-Φ(s_t)，中间项相消，累计变化主要由首尾 potential 决定。在满足相应条件时，它能提供更密集反馈而不改变最优策略集合。实际 LLM Agent 中 potential 由模型估计会有误差，因此仍需检查累计 shaped reward 与 outcome reward 的关系，并在原始 benchmark 上验证。","deep":"potential 是给状态指定的进展分数 Φ，例如离目标还有多远。要在折扣回报中加入势函数奖励，常用形式为 ，γ 必须与原任务的折扣一致。有限轨迹累积这些额外奖励后，中间项抵消，剩下 。若终止状态势函数统一为 0、起点固定，额外总回报便与动作路径无关，不改变路径之间的原始偏好。γ=1、势值依次为 0、0.4、0.7、0 时，额外奖励为 0.4、0.3、−0.7，总和为 0，前期进展仍获得了更早的反馈。保证来自奖励形式和边界条件，不要求 Φ 必须精确等于真实价值。反之，截断时漏掉终止处理、训练过程中更换 Φ，或只加正进展不扣回退，都会破坏这项保证。不能笼统说过程奖励相加仍保留原任务目标。\n\n相关原始资料：奖励塑形。","followup":"TRACE一类方法在tool boundary估计状态价值变化，价值在于把失败轨迹中的局部进展分离出来。"},{"id":63,"code":"Q063","question":"环境超时、sandbox 崩溃和模型失败应怎样区分？","doc_title":"环境超时、sandbox 崩溃和模型失败应怎样区分？","chapter":"Agentic RL","domain":"agent","level":"基础","course_day":41,"topic":"agent-action","brief":"它们对应不同责任域。模型发出非法 action、陷入循环或主动 STOP 属于policy outcome；tool或sandbox内部错误属于environment failure；调度器取消、网络中断和worker崩溃属于infrastructure failure。只有第一类天然适合进入reward学习，后两类通常应retry、标记无效或按明确鲁棒性目标单独训练。","deep":"先看失败由谁可以控制。错误工具名、无效参数通常来自模型选择；服务掉线、容器崩溃通常来自执行环境。两者可以影响同一次任务，但训练标签与系统可靠性报表需要保留这个区别。例如读取不存在的文件，是模型传入错误路径；读取正确路径却遇到存储服务掉线，是外部服务失败。这两种情况都可能表现为工具返回 error，但前者通常可让模型学习纠正路径，后者未必该归为策略错误。分类也与部署目标有关。如果真实应用要求遇到暂时断网时重试，可以专门设计这类训练环境。关键是显式定义，而不是把所有随机基础设施故障直接混入普通正确率奖励。","followup":"统一赋零分会让模型学习基础设施噪声，并污染reward与稳定性判断。"},{"id":64,"code":"Q064","question":"如何保证 Agentic 环境可复现？","doc_title":"如何保证 Agentic 环境可复现？","chapter":"Agentic RL","domain":"agent","level":"基础","course_day":41,"topic":"agent-action","brief":"至少要版本化任务输入、tool schema、容器镜像、文件系统快照、依赖、随机种子和外部数据快照，并记录每次 action/observation。对真实网页等非确定环境，只能做到可审计而非完全 replay，应区分 live evaluation 与 closed-world evaluation。恢复还要考虑环境副作用：仅重放消息历史未必能恢复文件、进程和远程服务状态。","deep":"可复现需要恢复模型看到的信息和环境可执行的状态。仅保存模型权重与随机种子，无法恢复变化过的网页、文件和工具服务。应说明要复现的是固定历史上的计算，还是完整的重新交互。环境快照需要回答“重新开始时文件、进程和服务处于什么状态”。保存 random seed 只固定随机数来源，不会把今天网页内容恢复成昨天的版本。离线重放可直接读取先前记录的工具结果，用于检查同一历史上的 log-prob；真正交互重放则要恢复文件和环境，再执行动作，看是否得到相同结果。这两类测试验证的对象不同，报告应分别标记。","followup":"可复现的最小验收是：同一轨迹重放得到等价 observation 和相同 verifier 结果。"},{"id":65,"code":"Q065","question":"Agentic RL 更适合建模为 MDP、POMDP 还是 Semi-MDP？","doc_title":"Agentic RL 更适合建模为 MDP、POMDP 还是 Semi-MDP？","chapter":"长时域 Agent","domain":"agent","level":"基础","course_day":45,"topic":"agent-action","brief":"若模型能观察完整环境状态，可近似MDP；真实工具与网页通常只有局部observation，更接近POMDP；一次tool call持续多个token和不等wall time，又天然带有Semi-MDP的宏动作特征。工程上常在tool boundary定义state transition，同时让LLM上下文充当belief state。选哪种名字不是重点，重点是Markov信息是否被trajectory完整保存。","deep":"MDP 假设当前状态已包含预测未来所需的信息；POMDP 表示模型只能看到部分环境信息；Semi-MDP则允许一次决策持续多个底层时间步。它们描述不同维度，部分可观测和动作持续时间不等可以同时存在。例如代码 Agent 只看到被读取的文件内容，不知道未读文件，因此具有部分可观测性。一次运行测试耗时 30 秒，另一次读文件仅 0.1 秒，则动作时间不等。上下文历史可以帮助模型推断未见状态，但不自动成为严格充分的 belief state；后者指对隐藏状态的概率判断，而不仅是长对话。","followup":"聊天历史很长不代表状态充分；外部文件、进程和网页状态可能不在文本里。"},{"id":66,"code":"Q066","question":"多时间尺度 credit assignment 是什么？","doc_title":"多时间尺度 credit assignment 是什么？","chapter":"长时域 Agent","domain":"agent","level":"基础","course_day":45,"topic":"agent-action","brief":"Agent轨迹同时存在token、assistant turn、tool action、subtask和episode尺度。token级loss负责概率更新，tool/turn级reward负责局部归因，episode reward保证最终目标，subtask value连接长时域进展。只在一个尺度分配reward，要么过于稀疏，要么容易优化局部代理目标。合理设计应使各尺度信号在累计意义上与最终任务一致。","deep":"同一任务可以从多个时间尺度观察：一个 token、一次工具调用、一个子任务以及整个任务。细尺度便于更新模型，粗尺度便于评价是否完成目标。难点在于让不同尺度的奖励对应到正确的动作位置。例如修复任务的最终成功分数是 1，一次修改让通过测试从 3 个增加到 5 个，一条工具调用包含 20 个生成 token。最终成功属于任务尺度，测试变化属于步骤尺度，20 个 token 则属于模型更新尺度。设计 credit 时，要说明步骤反馈如何影响这 20 个 token，以及前面的计划步骤是否也获得累计收益。仅把三个不同来源的分数相加，无法解决奖励落在哪些动作上的问题。","followup":"不要把“多种reward相加”当成多尺度credit；关键是每个信号对应哪个状态转移。"},{"id":67,"code":"Q067","question":"如何给搜索、浏览或代码 Agent 构造过程奖励？","doc_title":"如何给搜索、浏览或代码 Agent 构造过程奖励？","chapter":"长时域 Agent","domain":"agent","level":"基础","course_day":45,"topic":"agent-action","brief":"可以使用可验证状态变化，例如测试通过数、目标文件修改、检索到的证据覆盖、约束满足度或gold-answer log-prob提升。过程reward应尽量基于环境变化，而不是judge对“看起来像好步骤”的主观评分。任何shaping都要检查循环利用：模型是否能重复触发同一进展、回滚后重复领奖或堆积无效证据。","deep":"过程奖励应指出中间步骤带来了什么可核验的进展，例如新增测试通过、找到了必要证据或满足了任务约束。仅奖励“看起来很认真”的解释，可能强化冗长表达而没有改善实际任务。测试通过数量看起来很客观，但也能被利用。例如模型修改测试文件让断言总为真，通过数上升却没有修复程序。因此环境要区分允许修改的业务文件和受保护的验证逻辑。对重复进展也要去重：同一条测试从失败到通过可以奖励，但模型先破坏再修复是否能再次拿分，需要有明确规则。优先记录状态变化本身，再决定累计方式，不能只统计“出现了几次成功日志”。","followup":"首选可去重、可单调验证的state delta；无法验证时再使用learned process model。"},{"id":68,"code":"Q068","question":"多轮用户交互中的用户 response 属于环境还是策略？","doc_title":"多轮用户交互中的用户 response 属于环境还是策略？","chapter":"长时域 Agent","domain":"agent","level":"基础","course_day":45,"topic":"agent-action","brief":"训练主Agent时，用户模拟器的输出是environment observation；若同时训练user simulator，则系统成为多策略或博弈问题。用户意图可能随交互变化，固定脚本易让Agent过拟合模拟器特征。数据中应记录user policy/version，并在真实用户或不同模拟器上做交叉验证。","deep":"从主助手的训练角度看，用户的下一句话是外部反馈，即使它由另一个模型模拟生成，也不是主助手自己的动作。如果同时更新用户模拟器，需要额外处理对手或伙伴行为不断变化的问题。如果训练订票助手，模拟用户说“改到周五”，这句话虽然由另一个语言模型生成，对主助手仍是外部输入。主助手需要学习的是之后如何询问和下单，而非提高自己生成这句用户话的概率。模拟器版本也会影响难度。一个总会主动补齐信息的模拟用户，可能让助手在真实用户面前缺少追问能力。验证时换用另一套用户模拟策略，可以检查这种依赖。","followup":"不要对用户token计算主Agent的actor loss，即使它们也由另一个LLM生成。"},{"id":69,"code":"Q069","question":"多 Agent 协作或对抗时，credit 怎样分配？","doc_title":"多 Agent 协作或对抗时，credit 怎样分配？","chapter":"长时域 Agent","domain":"agent","level":"基础","course_day":45,"topic":"agent-action","brief":"团队共享reward最简单，但产生free-rider和错误归因；独立reward容易让局部目标冲突。可使用角色级reward、difference reward、centralized critic或反事实baseline，评估某个Agent的边际贡献。系统还要记录每个Agent的policy version、可见信息和消息因果顺序，否则无法重放或归因。","deep":"共享总奖励实现简单，但无法自动区分每个成员的贡献；各自奖励更细，却可能让成员追求相互冲突的目标。分配方案取决于能观察到哪些中间结果，以及是否有条件比较不同成员行为的后果。共享团队奖励会让所有 Agent 都因为最终成功获奖，即使其中一个没有做任何贡献。difference reward的思路是比较“团队带有这个成员时的结果”和“把它替换成某个默认行为时的结果”，两者之差近似衡量贡献。例如检索 Agent 提供错误网页，编程 Agent 偶然修好问题，团队成功不能证明检索有效。反事实比较需要可控制的重放环境，成本可能很高。centralized critic 是训练时可以看多成员信息的价值预测器，也不能自动获得真实反事实答案。","followup":"共享同一个base model不代表所有Agent是同一个policy；prompt、tool权限和状态不同会改变行为分布。"},{"id":70,"code":"Q070","question":"长上下文 Agent 为什么不仅是显存问题？","doc_title":"长上下文 Agent 为什么不仅是显存问题？","chapter":"长时域 Agent","domain":"agent","level":"基础","course_day":45,"topic":"agent-action","brief":"上下文增长会增加prefill、KV容量和传输成本，也降低有效信息密度，放大位置偏差、历史错误和tool observation噪声。训练侧若把所有历史action都重复计算loss，还会造成旧token多次加权。需要区分可见上下文、可训练action、可压缩memory与外部environment state。","deep":"更长历史除了占用显存，也增加前缀计算、无关信息和旧错误的影响。训练若反复把同一历史动作计入损失，还会改变动作的权重。因此上下文长度同时影响系统成本、信息利用和训练目标。若把每一轮完整历史都作为独立训练行，第一轮 assistant 的 token 会出现在后面所有行中。假设共 10轮，第一轮动作可能被算 10 次损失，最后一轮只算 1 次，从而系统性改变权重。解决方式之一是每行保留完整可读历史，但只让本轮新增动作的 loss mask 为 1。压缩历史还要保存原始生成 token 和实际训练上下文；如果训练使用压缩版、生成使用完整版，就引入了另一种条件分布差异。","followup":"截断历史前先确认被删内容能否从环境或结构化memory恢复，否则会破坏POMDP的belief state。"},{"id":71,"code":"Q071","question":"Agent trajectory 如何做 replay 而不污染环境？","doc_title":"Agent trajectory 如何做 replay 而不污染环境？","chapter":"长时域 Agent","domain":"agent","level":"基础","course_day":45,"topic":"agent-action","brief":"纯离线replay只复用已记录observation，不重新执行tool，适合重算log-prob但无法验证新action；交互replay从snapshot恢复后重新执行，需要隔离文件系统、网络副作用和外部服务版本。对于有写操作的任务，应使用copy-on-write snapshot或一次性sandbox，并为每次tool call分配幂等ID。","deep":"离线重放只读取已有工具结果，不重新执行动作；交互重放则恢复环境后真的再执行一次。前者适合重算概率与损失，后者才能检查新动作会产生什么结果。两种方式的隔离要求不同。copy-on-write 是多个环境先共享只读基础文件，只有发生修改的部分才单独保存。它降低创建隔离副本的成本，同时防止一次重放改变另一条轨迹的数据。幂等 ID 用于识别同一次操作的重复提交。例如网络断开后不确定文件写入是否完成，带同一个操作 ID重试可让服务端返回已有结果。仅在客户端生成 ID 没有作用，执行端必须实现去重语义。","followup":"重放消息文本不等于重放环境；二者应在接口和指标中分开命名。"},{"id":72,"code":"Q072","question":"Agentic RL 的评测为什么比训练 reward 更难设计？","doc_title":"Agentic RL 的评测为什么比训练 reward 更难设计？","chapter":"长时域 Agent","domain":"agent","level":"基础","course_day":45,"topic":"agent-action","brief":"成功率之外，还需要判断结果正确性、路径成本、工具安全、恢复能力和跨环境泛化。只测最终success会鼓励高成本暴力搜索；只测步数又可能惩罚必要验证。应报告success-cost Pareto、环境failure分解、不同seed/环境版本的置信区间，并用隐藏任务防止针对grader过拟合。","deep":"训练奖励通常只是任务价值的部分代理，评测需要检查模型是否可靠完成真实目标。工具任务还涉及成本、耗时和恢复能力，只报最终成功率容易掩盖大量无效操作或脆弱执行路径。假设两个模型都成功 70%，A 平均调用 5 次工具，B 调用 50 次；对有调用费用的服务，二者不是同样好。但若 A 避免验证、偶发严重错误，也不能只凭步数少选 A。报告应把成功率、调用数、失败类型和成本一起列出，并注明时间、费用是在成功样本上还是全部样本上统计。置信区间说明有限评测样本带来的不确定范围；分数接近时，需要更多任务或多次重复才能作出可靠判断。","followup":"评测环境与训练环境共享实现时，要审计reward leakage和任务模板泄漏。"},{"id":73,"code":"Q073","question":"actor 与 rollout engine 权重相同，log-prob 为什么仍会不一致？","doc_title":"actor 与 rollout engine 权重相同，log-prob 为什么仍会不一致？","chapter":"训推一致性","domain":"inference","level":"基础","course_day":72,"topic":"logprob-contract","brief":"差异可能来自 tokenizer/chat template、precision、RoPE配置、attention backend、MoE routing、logits processor、top-k/top-p重归一化、padding/remove-padding和并行 reduction。自回归生成还会放大微小数值差异：一个边界 token 改变后，后续上下文全部分叉。排查必须从输入 token 一致开始，再逐层比较 hidden/logits，而不是只比较最终文本。","deep":"相同权重只是数值一致性的一个条件。两端还需要使用相同的输入 token、位置编号、注意力规则和概率定义；不同精度或计算顺序也可能产生差异。应先固定同一条输入，再比较分数。logits 是 softmax 之前每个候选 token 的分数，log-prob 是归一化概率取对数。前者整体加常数不改变后者，所以仅比较 logits 的绝对偏差可能误导；选中 token 的 log-prob 更接近训练所用的量。定位时给两个实现同一份 token ID 和同一段固定后缀，比较每个位置预测下一 token 的结果。若先自由生成，一旦第 20 个 token 不同，第 21 个开始连输入历史都不同，后续差异无法定位数值来源。","followup":"“相同checkpoint”只是必要条件，不是数值和采样语义一致的充分条件。"},{"id":74,"code":"Q074","question":"BF16 Training + FP8 Rollout 还是 on-policy 吗？","doc_title":"BF16 Training + FP8 Rollout 还是 on-policy 吗？","chapter":"训推一致性","domain":"inference","level":"基础","course_day":72,"topic":"logprob-contract","brief":"严格说，behavior policy是量化后的FP8推理分布，而训练actor通常表示BF16分布；二者不完全相同，因此存在量化引入的policy mismatch。若差异足够小，工程上可以近似视为on-policy，但必须用token KL、log-prob差、top-k overlap和最终质量验证。用BF16 actor重算log-prob不能改变样本实际来自FP8 policy这一事实。","deep":"on-policy 表示数据来自所讨论的目标策略。训练端与推理端虽然共用同一份名义权重，但低精度执行可能给出不同的实际概率，因此需要测量这种差异。它通常是近似是否足够好的问题，不能只看参数版本相同就下结论。例如同一 token 在 FP8 生成端的概率为 0.10，在 BF16 训练端为 0.12。即使两边权重来源相同，样本仍按 0.10 的频率出现。若用 0.12 冒充采样概率，会把实际存在的差异隐藏掉。可以保存 FP8 实际分布的概率用于行为记录，也可以使用明确的近似和校正方案。是否可接受，要看逐 token 概率差如何影响梯度和最终任务结果，而不是要求任意浮点差异都必须为零。","followup":"回答的关键是区分参数来源相同与条件分布完全相同。"},{"id":75,"code":"Q075","question":"rollout log-prob 应使用原始分布还是采样后分布？","doc_title":"rollout log-prob 应使用原始分布还是采样后分布？","chapter":"训推一致性","domain":"inference","level":"基础","course_day":72,"topic":"logprob-contract","brief":"importance correction需要与实际behavior sampling distribution一致。如果temperature、top-k或top-p改变了采样概率，严格的behavior log-prob应反映这些变换与重归一化；而KL到reference通常关注原始模型分布。很多推理服务返回的是原始log-softmax，若采样器使用截断分布，两者不可直接混用。","deep":"如果分母要代表真实采样概率，就应反映实际温度、候选截断和重新归一化。若算法有意使用原始模型概率，则应明确这种约定以及它与采样分布的区别，而不是让记录字段含义模糊。例如原始模型概率为 [0.6,0.3,0.1]，top-k 只保留前两个候选，采样概率就变成 [2/3,1/3,0]。采到第一项时，原始 log-prob 是 log(0.6)，实际行为 log-prob 是 log(2/3)，两者不同。更严重的是第三项被完全排除。若目标训练分布仍给它非零概率，仅靠保留下来的样本无法无偏恢复该项贡献。因此接口必须说明返回的是哪种概率，同时明确训练目标是否也采用相同采样限制。","followup":"必须在接口中标明 raw_logprob 与 sampling_logprob，不能只用一个含糊的 logprobs 字段。"},{"id":76,"code":"Q076","question":"为什么 continuous batching 会影响确定性？","doc_title":"为什么 continuous batching 会影响确定性？","chapter":"训推一致性","domain":"inference","level":"基础","course_day":72,"topic":"logprob-contract","brief":"动态插入和退出请求会改变batch形状、kernel选择、reduction顺序、MoE token分桶及执行时序。浮点运算不满足结合律，微小差异在采样边界上可能改变token；并发调度还可能改变RNG消费顺序。固定seed只有在随机流分配、输入和执行路径都稳定时才足以复现。","deep":"连续批处理会让请求不断加入和退出，改变一起执行的张量形状与运算顺序。这些改变可能影响数值舍入和随机数分配，所以同一请求不一定逐 token 重现。分布正确与逐次结果完全一致是两种要求。continuous batching 是请求结束后立即移出批次、新请求随即加入，而不是等整批请求全部完成。它改善推理设备利用，但批次形状和随机数消耗顺序会随请求到达而变化。可让同一个请求分别独占运行、与短请求并发、与长请求并发，比较固定 token 上的概率。如果数值相同但生成不同，再检查每个请求是否有独立随机数流。固定全局 seed 并不能保证不同调度顺序消耗相同随机数。","followup":"确定性应分级：同配置token一致、logits容差一致、跨并行配置统计一致，三者成本不同。"},{"id":77,"code":"Q077","question":"FP8 Training 中哪些东西通常仍不是 FP8？","doc_title":"FP8 Training 中哪些东西通常仍不是 FP8？","chapter":"训推一致性","domain":"inference","level":"基础","course_day":72,"topic":"logprob-contract","brief":"FP8主要加速适合Tensor Core的GEMM输入与计算路径；模型通常保留高精度master weights，LayerNorm、softmax、部分reduction、optimizer state和累积常使用BF16/FP32。不同TransformerEngine recipe对weight/activation scaling、amax历史和block granularity不同。因此“端到端FP8”应理解为训练主干GEMM广泛使用FP8，而不是所有tensor都变成8bit。","deep":"FP8 训练通常表示部分矩阵乘法使用 8 位浮点输入，而不是每个数都只有 8 位。参数更新、累加、归一化和优化器历史经常需要更高精度；具体保留哪些部分取决于算子和训练方案。master weight 是优化器维护的较高精度参数副本；算子使用 FP8 时，可由它生成低精度权重参与矩阵乘法，更新则仍保留较细的数值变化。否则很小的参数步长可能直接被 8 位格式舍入掉。W、A、G 常分别表示权重、激活和梯度。讨论 FP8 应说清是哪类张量、存储还是算子输入采用 FP8，以及累加采用什么精度。“模型文件是 BF16”并不能推导训练过程中没有使用 FP8 算子。","followup":"面试回答要落到W/A/G与master weight，避免把storage dtype和compute dtype混在一起。"},{"id":78,"code":"Q078","question":"FP4 QAT 与 PTQ 的核心区别是什么？","doc_title":"FP4 QAT 与 PTQ 的核心区别是什么？","chapter":"训推一致性","domain":"inference","level":"基础","course_day":72,"topic":"logprob-contract","brief":"PTQ在训练完成后估计scale并量化，依赖原模型天然适应量化误差；QAT在训练中插入fake quant或低精度算子，让参数通过梯度适应量化噪声。FP4动态范围和精度更低，对block scaling、outlier和校准更敏感，因此QAT更可能保持质量，但训练成本和Recipe复杂度更高。QAT并不自动意味着训练本身获得FP4速度。","deep":"训练后量化 PTQ 在模型训练完成后压缩数值；量化感知训练 QAT 则让模型在训练时接触部署中的量化误差。后者有机会适应误差，但需要额外训练，并不保证所有模型都能保持原质量。PTQ 是训练后量化，把已训练好的数值映射到低精度可表示的数；QAT 是在训练阶段让模型就面对这种映射误差，以便参数适应部署时的数值限制。fake quant 可以先做缩放、舍入和反缩放，再用高精度算子计算。数值接近量化模型，但底层仍可能没有低精度加速。舍入几乎处处梯度为零，QAT 常使用直通估计近似传递梯度；这是训练近似，不是舍入操作的真实导数。","followup":"要区分目标：为部署准备量化权重，还是实际用低精度kernel加速训练。"},{"id":79,"code":"Q079","question":"如何建立训推一致性的最小排查链路？","doc_title":"如何建立训推一致性的最小排查链路？","chapter":"训推一致性","domain":"inference","level":"基础","course_day":72,"topic":"logprob-contract","brief":"固定单条tokenized input、关闭采样和动态batch，从embedding后逐层比较BF16 actor与rollout engine输出；先验证权重key/shape和token完全一致，再比较首token logits、逐tokenlog-prob，最后恢复TP/DP、量化和scheduler。每次只增加一个变量，并保存首个出现误差放大的layer或token。","deep":"先让两端计算同一输入下的同一量，再逐层缩小差异。输入模板、权重分片和精度同时变化时，整段输出不同并不能指出原因。每次只恢复一个配置，才能把差异与具体实现连接起来。一个实用比较顺序是先核对输入 token 和权重映射，再比较第一层、第二层等固定输入下的输出。首个明显放大误差的层是候选位置，但还需区分前一层已有小误差的传播与该层本身的实现问题。可以在候选层注入完全相同的输入 tensor，单独比较输出。如果差异仍在，就更接近该层算子、权重布局或精度问题。这比直接比较整段生成文本更容易形成可复现证据。","followup":"最终文本一致只能证明这次argmax没跨界，不能证明分布一致；应保留数值容差指标。"},{"id":80,"code":"Q080","question":"低精度方案应该怎样评价端到端收益？","doc_title":"低精度方案应该怎样评价端到端收益？","chapter":"训推一致性","domain":"inference","level":"基础","course_day":72,"topic":"logprob-contract","brief":"至少同时报告actor update、log-prob/ref、weight sync、rollout各阶段耗时，以及GPU-hours到目标质量。若rollout或环境占主导，GEMM加速不会按理论FLOPS线性转化；量化还可能增加转换、scale管理和同步成本。质量侧应比较reward、KL、entropy、长度分布和外部benchmark，并固定token budget与sampling配置。","deep":"端到端收益取决于被加速部分原来占了多少时间。低精度还可能增加转换和数据传输成本，因此应同时计入生成、评分、训练及权重发布，并检查达到同一任务质量需要多少总资源。假设一次训练 80% 时间在 rollout、20% 在 actor 更新，即使 actor 计算瞬间完成，总时间也最多减少20%。如果只让 actor 快一倍，总时间从 100 降到 90，加速约 1.11 倍。这类估算说明先找占主导的阶段为什么重要。还应计入量化格式转换和 scale 传输。若 FP8 改变采样分布，使达到同一质量要多跑 20%，局部算子加速就可能没有转化成完整训练收益。","followup":"吞吐提升与time-to-quality必须同时成立，才是RL系统中的有效优化。"},{"id":81,"code":"Q081","question":"RL 训练中的 DP、TP、PP、EP、CP 分别解决什么瓶颈？","doc_title":"RL 训练中的 DP、TP、PP、EP、CP 分别解决什么瓶颈？","chapter":"MoE/分布式","domain":"distributed","level":"基础","course_day":26,"topic":"moe-router","brief":"DP复制模型扩大batch；TP切分层内矩阵降低单卡参数与算子规模；PP按层切分模型但引入pipeline bubble；EP切分MoE experts并产生all-to-all；CP切分长序列上下文以降低attention激活。RL链路还包含rollout和weight sync，因此训练侧最优并行配置未必是端到端最优配置。","deep":"数据并行 DP 让多个模型副本处理不同样本；张量并行 TP 把同一层的计算切开；流水线并行 PP 把不同层放到不同设备；专家并行 EP 分散 MoE 专家；上下文并行 CP 切分长序列的注意力计算。它们分别减少不同部分的单卡压力。DP 让各卡处理不同样本，再汇合梯度；TP 把同一层的大矩阵拆给多卡；PP 把不同层放到不同卡；EP把不同专家网络放到不同卡；CP 把一条长序列分段处理。rank 是参与分布式计算的进程编号，通常一个 GPU 对应一个 rank。TP 和 EP 降低单卡持有的部分参数，CP 主要处理长序列激活，DP 主要扩大并行样本量。优化器分片会进一步改变参数状态占用，不能仅凭 DP 这个名字推断每卡一定完整复制所有训练状态。","followup":"回答应落到参数、激活、通信和调度四类成本，而不是只解释缩写。"},{"id":82,"code":"Q082","question":"为什么 MoE RL 比 dense RL 更容易不稳定？","doc_title":"为什么 MoE RL 比 dense RL 更容易不稳定？","chapter":"MoE/分布式","domain":"distributed","level":"基础","course_day":26,"topic":"moe-router","brief":"MoE的router在top-k边界对微小logit变化敏感，不同batch或精度可能改变expert选择；RL又会快速改变token分布，导致expert load和梯度分布非平稳。EP all-to-all的长尾、capacity与dropped token还会把系统噪声反馈到训练。需要联合观察router entropy、expert load、overflow、token KL和训推routing一致性。","deep":"MoE 是混合专家模型，一个 token 只交给部分专家处理。RL 改变输出内容后，路由分布也可能变化，带来负载不均；路由选择对数值扰动敏感时，训推差异还可能被放大。这是额外风险，并不代表所有MoE 训练都比稠密模型不稳定。router 是根据 token 的隐藏表示选择专家的小网络。若前两名专家分数非常接近，低精度舍入就可能改变最终选择，导致后续执行完全不同的专家参数。capacity 是某个实现允许专家接收的 token 容量，dropped token 是超过容量后未按原路计算的 token。并非所有 MoE 实现都会丢 token，需先确认采用限容量还是不丢弃的实现。\n\n检查路由编号与专家负载，比只观察总体 loss 更直接。","followup":"只看总reward无法发现少数expert塌缩或某类token被系统性路由错误。"},{"id":83,"code":"Q083","question":"DP rank 上的 advantage normalization 为什么必须一致？","doc_title":"DP rank 上的 advantage normalization 为什么必须一致？","chapter":"MoE/分布式","domain":"distributed","level":"基础","course_day":26,"topic":"moe-router","brief":"若每个DP rank只按本地microbatch计算mean/std，相同reward在不同rank会得到不同advantage尺度，相当于改变全局样本权重。严格global normalization需要跨rank聚合sum、sum-square和count，并正确处理变长mask。通信成本通常很小，但错误实现会静默影响收敛。","deep":"多个数据并行进程应共同实现预先定义的同一个统计目标。若优势需要按完整候选组计算，或按整个更新批次归一化，就不能在每张卡上各自使用不同的局部均值与标准差。两张卡分别持有 [0,0] 和 [2,2]。按本卡减均值，两边全变成 0；按全局均值 1 处理，结果应是[−1,−1,1,1]。局部计算直接消除了全批真实存在的差异。同步统计量时，应汇总有效数量、数值总和和平方总和，再计算全局均值与方差。若数值幅度很大、方差很小，平方差公式可能有精度损失，应使用更高精度或稳定的合并方差算法。","followup":"验证方法是固定同一global batch，改变DP切分后比较每token advantage与一次update。"},{"id":84,"code":"Q084","question":"变长序列如何影响 Megatron micro-batch 与负载均衡？","doc_title":"变长序列如何影响 Megatron micro-batch 与负载均衡？","chapter":"MoE/分布式","domain":"distributed","level":"基础","course_day":26,"topic":"moe-router","brief":"按样本数相等不代表token数相等，长序列rank会拖慢attention、激活通信和pipeline stage，形成straggler。remove padding减少无效计算，但也让每个microbatch形状更动态。常见策略是按token budget分桶、sequence packing、动态micro-batch和跨rank token balance，同时保持prompt group与loss reduction语义。","deep":"等数量样本未必有等数量计算。某个微批次都是长回答，另一个都是短回答，前者可能决定所有设备的等待时间。分配样本时应考虑有效 token 数和算子实际负载，而不只平均样本条数。每卡各有两个样本，一张长度 [100,100]，另一张 [1000,1000]，样本数虽然相等，后者的注意力和激活开销明显更大。所有卡同步更新时，前者要等待后者完成。token budget batching 是以有效 token 总数限制小批次大小，而非固定样本数。分桶则把相近长度放在一起，减少 padding。移动样本时要保留 group ID，并确保组统计已经正确计算，避免把调度分组误当成奖励比较分组。","followup":"性能优化不能静默拆散GRPO group或改变每条sequence权重。"},{"id":85,"code":"Q085","question":"Weight Sync 从 Megatron 到推理引擎为什么复杂？","doc_title":"Weight Sync 从 Megatron 到推理引擎为什么复杂？","chapter":"MoE/分布式","domain":"distributed","level":"基础","course_day":26,"topic":"moe-router","brief":"训练权重可能按TP/PP/EP分片并带有内部fused布局，推理引擎则使用另一套并行度、参数命名和量化格式。同步包含gather/reshard、格式转换、传输、加载和版本切换，任何一步都可能成为峰值内存或通信瓶颈。高性能方案要让转换流式化、复用buffer，并用policy version保证原子切换。","deep":"训练与推理可能以不同方式切分同一份参数。发布权重需要恢复各参数的逻辑含义，再转换到推理端布局。张量大小匹配只说明能装载，不说明专家顺序、矩阵拼接和分片轴都正确。例如训练端把一个矩阵按列切成两片，推理端需要按行切成四片。把原来的两个 buffer 直接发送过去，并不会自动变成四个正确的行分片；必须重排和重新切分，这个过程叫 reshard。fused 布局表示多个逻辑矩阵被合并存储，如 Q、K、V 权重。转换不仅要检查总形状，还要检查排列顺序。最小验证可给每个逻辑分块填不同编号，验证同步后每个位置是否落到预期块，再用真实权重检查输出。","followup":"“通过NCCL传过去”只描述传输，不包含布局转换与生命周期。"},{"id":86,"code":"Q086","question":"为什么 rollout TP 越大不一定吞吐越高？","doc_title":"为什么 rollout TP 越大不一定吞吐越高？","chapter":"MoE/分布式","domain":"distributed","level":"基础","course_day":26,"topic":"moe-router","brief":"TP增加单请求可用显存并降低单卡矩阵规模，但每层引入collective，decode阶段小batch时通信占比可能上升。更多TP还减少可复制的engine数量，降低请求级并发与长尾隔离能力。应在目标context、batch和生成长度下比较tokens/s、p99 episode latency和可用并发。","deep":"更多张量并行设备可以分担一次模型计算，但也增加跨设备交换结果的成本。对于大量并发采样，把设备分成多个较小副本有时能获得更高总吞吐，因此不能只看单个请求的速度。假设总共 8 张卡，TP=8 只能运行一个模型副本，TP=4 可以运行两个副本。若模型本身能装入 4 卡，两个副本可能同时服务更多请求；但单请求速度和可支持上下文长度也会改变。decode 是逐个生成新 token 的阶段，经常涉及相对小的矩阵乘法。TP 增大后，每卡计算变少，跨卡通信却仍存在，所以总吞吐不一定增加。基准必须使用目标长度和并发量，不能只测一个短请求。","followup":"RL rollout追求总样本生产与尾部效率，不等同于单请求最低latency。"},{"id":87,"code":"Q087","question":"NCCL timeout 在 RL 任务中为什么常是结果而不是根因？","doc_title":"NCCL timeout 在 RL 任务中为什么常是结果而不是根因？","chapter":"MoE/分布式","domain":"distributed","level":"基础","course_day":26,"topic":"moe-router","brief":"某个rank可能先因OOM、Python异常、data loader卡死或kernel hang退出collective，其他rank随后等待并报NCCL timeout。排查应找到最早时间戳和首个异常rank，检查GPU Xid、OOM、进程退出与collective序号。只提高timeout会延迟失败暴露，不能修复上游失步。","deep":"通信超时表示某些参与者未能按时完成协作，不代表网络一定是首因。某个进程在通信之前退出或卡住，其他进程最后也会报通信错误。排查应从最早异常开始，而不是只看最后一条报错。collective 是多 rank 共同参与的通信，如把梯度相加。若 rank 3 在进入这次通信前已 OOM，其余 rank会一直等待，最后都报超时。提高 timeout 不会补回已经退出的 rank。先按统一时钟合并日志，寻找比超时更早的进程退出、CUDA 错误或数据等待。若所有 rank 均存活，再核对它们是否调用了相同编号、相同形状的 collective。网络故障也可能是真因，不能因常见上游问题就排除它。","followup":"多rank日志必须按统一时间线合并；最后报错的rank通常不是最先出问题的rank。"},{"id":88,"code":"Q088","question":"如何评价训练与 rollout 资源切分？","doc_title":"如何评价训练与 rollout 资源切分？","chapter":"MoE/分布式","domain":"distributed","level":"基础","course_day":26,"topic":"moe-router","brief":"静态切分易管理，但最优比例随policy变强、response变长和环境负载变化；colocate提高资源复用，却增加权重切换、显存竞争和阶段barrier；disaggregated支持overlap，但承担传输与staleness。默认应以各阶段service rate匹配为目标，并用time-to-quality而不是单阶段利用率选型。","deep":"训练与采样需要匹配单位时间处理能力。生成过快会堆积旧样本，训练过快则会等待数据。最合适的设备比例会随回答长度、评分成本和模型更新速度变化，需要随实际工作负载测量。colocate 是训练和生成共享一组 GPU，通常分阶段使用；分离部署给两者不同 GPU，使它们有机会同时运行。前者要处理显存和权重切换，后者要处理传输及旧数据。假设生成每分钟生产 100 条而训练消费 200 条，继续增加训练卡只会让训练端等待。应先估计双方对相同长度分布的服务速率，再配置资源。随着回答变长，原来平衡的比例可能失效，需要重新观察。","followup":"资源都满载不代表系统最优，可能只是队列积压和stale data增加。"},{"id":89,"code":"Q089","question":"一套统一 RL 框架最重要的抽象是什么？","doc_title":"一套统一 RL 框架最重要的抽象是什么？","chapter":"RL 系统架构","domain":"infra","level":"基础","course_day":70,"topic":"rl-throughput","brief":"不是把所有算法塞进同一个Trainer，而是稳定表达policy version、trajectory、segment、reward/advantage、loss mask和数据所有权。算法只应决定如何从轨迹计算信号与loss；rollout engine、training backend、transport和environment通过明确接口替换。若DataProto只表达单轮定长文本，Agentic、多模态和异步版本信息最终都会以特殊字段泄漏到各层。","deep":"统一框架首先要统一事实记录：哪个版本生成了哪些动作、环境返回什么、奖励怎样附着在轨迹上。算法模块据此计算优势和损失，执行模块负责采样、传输和更新。模块可以替换，但不能改变字段的含义。抽象是否有用，可以看换一种算法后哪些信息仍必须存在。PPO 需要价值估计，GRPO 需要同题组标识，OPD 需要教师反馈；但它们都要知道哪些 token 是模型选择的，以及这些选择在哪个模型版本下发生。因此基础轨迹只保存共同事实，算法再添加自己的计算字段。不要让传输层偷偷重算 advantage，也不要让推理引擎决定奖励归一化。这样替换一个模块时，才能明确验证它是否改变了训练含义。","followup":"好的抽象让同步GRPO、OPD和Agentic RL共享数据主干，但不抹平它们不同的算法语义。"},{"id":90,"code":"Q090","question":"trajectory 数据结构至少需要哪些字段？","doc_title":"trajectory 数据结构至少需要哪些字段？","chapter":"RL 系统架构","domain":"infra","level":"基础","course_day":70,"topic":"rl-throughput","brief":"最低集合包括trajectory_id、prompt/group_id、policy_version、segments、token_ids、action/loss mask、behavior log-prob、reward及finish reason。Agentic场景还需要turn/tool边界、observation、environment snapshot/version、错误责任域；Partial场景需要segment级版本和resume state；多模态需要媒体引用与生命周期，而不是无边界复制大tensor。","deep":"轨迹字段至少覆盖任务身份、输入和输出 token、模型版本、模型动作位置、行为概率、奖励与结束原因。多轮工具任务还要保留工具调用边界、返回信息及环境状态；跨版本续写则需要每个片段自己的版本记录。token_ids 表示真实采样出的 token，loss_mask 指定训练位置，behavior_log_probs 保存生成时的概率。三者需要位置一一对应；若 T 是输出位置数，三者通常都能映射到长度 T 的序列。媒体引用保存图像或音频的位置和版本，而不是在每个 turn 重复复制整份大 tensor。释放媒体数据前，还需确认异步 teacher 和 trainer 都已消费完毕。\n\n字段定义必须同时说明谁写入、谁读取以及多久有效。","followup":"字段是否存在还不够，要定义创建者、消费者、序列化格式和释放时机。"},{"id":91,"code":"Q091","question":"如何设计 Weight Sync 的正确性协议？","doc_title":"如何设计 Weight Sync 的正确性协议？","chapter":"RL 系统架构","domain":"infra","level":"基础","course_day":70,"topic":"rl-throughput","brief":"同步协议应包含单调policy_version、参数元数据、传输完成屏障和engine激活确认。Trainer发布版本v后，Rollouter只有在全部shard加载完成并切换成功后才能标记behavior_version=v；正在执行的请求要么继续旧版本，要么在明确边界暂停。keep-warm只能复用进程和内存，不能跳过必要的新版本加载。","deep":"权重同步应把“数据传输完成”与“新版本开始对外服务”分开。只有所有参数分片加载成功后，执行器才能声明新版本可用。请求必须能查到实际使用的版本，以便训练消费正确的行为概率。原子切换意味着一个请求不会读取到“前半层是版本 10、后半层是版本 11”的模型。可以先把新版本加载到暂存区，检查全部分片就绪，再一起激活；旧请求继续旧版本或在受控边界重算。版本号是声明，校验和与固定输入输出检查是验证。若某个 rank 加载失败，应取消这一轮激活，而不是仍向外宣布新版本可用。版本切换还要同步失效旧的前缀缓存。","followup":"可增加checksum或抽样参数校验，但policy_version仍是运行时主协议。"},{"id":92,"code":"Q092","question":"为什么性能 profiling 要从端到端 timeline 开始？","doc_title":"为什么性能 profiling 要从端到端 timeline 开始？","chapter":"RL 系统架构","domain":"infra","level":"基础","course_day":70,"topic":"rl-throughput","brief":"局部kernel快不代表step快。RL链路包含生成、环境、序列化、weight sync、log-prob、actor update和barrier，优化一个阶段可能把瓶颈转移到另一个阶段。端到端timeline先确定critical path、overlap和空洞，再用Nsight Compute或算子profile深入热点，能避免对非关键路径做无效微优化。","deep":"先测完整训练循环，可以确定哪个阶段真正限制任务完成速度。只优化最容易测的算子，可能忽略队列等待、工具服务或权重加载。确定主要耗时后，再进入该阶段的细粒度算子分析。critical path 是从任务开始到完成必须依次经历、决定总耗时的那条路径。例如奖励计算在 CPU 上花 4秒，而 GPU 同时还能生成 6 秒数据，减少奖励到 2 秒未必缩短最终等待。timeline 把 CPU、GPU、通信和等待画到同一时间轴，才能判断两件事是否真的重叠。确认最慢的必要路径后，再检查具体算子的占用率、带宽或矩阵形状，避免优化一段已被其他工作完全遮住的计算。","followup":"报告中应同时给wall time分解、GPU活跃区间、CPU同步点和跨rank等待。"},{"id":93,"code":"Q093","question":"指标上报为什么会拖慢训练？","doc_title":"指标上报为什么会拖慢训练？","chapter":"RL 系统架构","domain":"infra","level":"基础","course_day":70,"topic":"rl-throughput","brief":"GPU tensor调用.item()、转CPU或做全局聚合可能触发CUDA同步；专家分布、激活统计等大张量还会增加reduction、D2H copy和通信。高频上报会把本可异步的计算链路串行化。优化方法包括设备侧聚合、降低采样频率、异步pinned buffer、只在部分rank采集，并明确指标允许的延迟和丢失语义。","deep":"GPU 工作常是异步提交的。某些指标读取会迫使 CPU 等待 GPU 完成，打断原本可重叠的计算；逐token 写日志还可能产生大量传输和存储开销。因此指标需要明确采样频率和汇总位置。CUDA 计算通常由 CPU 提交后异步执行。调用 GPU tensor.item() 要把一个具体数值交给 CPU，往往必须等相关 GPU 工作完成，因此可能打断原本的异步运行。另一个问题是日志列表保存了 GPU tensor 引用，连同其数据甚至计算图一起留住，导致逐步累积显存。应先在设备端聚合到少量统计量，按允许的频率转移；若使用异步缓冲，缓冲区复用前必须确认拷贝已经完成。","followup":"“异步logger”不等于没有同步，关键要检查数据进入logger之前是否已触发device同步。"},{"id":94,"code":"Q094","question":"异步 checkpoint 为什么比普通 checkpoint 难？","doc_title":"异步 checkpoint 为什么比普通 checkpoint 难？","chapter":"RL 系统架构","domain":"infra","level":"基础","course_day":70,"topic":"rl-throughput","brief":"模型、optimizer、scheduler之外，还有消息队列、policy version、未完成trajectory、environment state和参数同步状态。若各组件在不同逻辑时间保存，恢复后可能重复训练、漏样本或用错权重续推。需要定义一致性点：暂停生产消费形成全局快照，或使用带版本和幂等ID的chandy-lamport式/日志式恢复。","deep":"异步写文件与异步训练恢复是两个问题。前者先截取一致的模型和优化器状态，再让后台写盘；后者还要决定队列中的哪些样本已训练、哪些正在生成，以及环境处于哪个步骤。假设模型保存到 step 100，但数据游标保存到 101，恢复后会跳过一批未反映在模型里的训练数据。反过来则可能重复训练。保存动作必须先定义统一的逻辑时刻，并记录已提交批次的 ID。一种较简单的恢复约定是保存已完成更新的状态，恢复后丢弃尚未提交的生成与队列数据，再从记录的任务游标重新开始。若要求连未完成 episode 也原样继续，则还要保存环境与采样随机状态，复杂度明显更高。","followup":"先确定恢复语义是exact resume还是允许丢弃in-flight工作，再决定实现复杂度。"},{"id":95,"code":"Q095","question":"如何证明一个性能优化没有破坏训练正确性？","doc_title":"如何证明一个性能优化没有破坏训练正确性？","chapter":"RL 系统架构","domain":"infra","level":"基础","course_day":70,"topic":"rl-throughput","brief":"建立三层验证：单元层验证tensor、mask、版本和公式；链路层在小模型固定seed下比较log-prob、reward与一次update；任务层在相同GPU-hours或token budget下比较学习曲线和外部benchmark。性能实验与质量实验使用相同workload，记录不可控差异。仅“loss能下降”不能排除分布偏移、样本重复或reward泄漏。","deep":"性能优化应保留原来要计算的目标。最直接的证据是固定数据下的逐位置输出、最终损失和梯度是否一致，再检查完整训练是否保持质量。仅比较吞吐或一条奖励曲线不能证明实现正确。例如优化目标是把 padding 去掉。先在两条短序列上比较每个有效位置的 log-prob、最终 loss 和参数梯度；再在小模型上检查同一批次的一次更新；最后比较长任务的完整质量曲线。这三层回答的是不同问题：局部算式是否一致、链路是否漏字段、长期统计效果是否可接受。随机采样可能让逐步参数不再完全相同，因此应预先定义数值容差和重复实验范围，而非事后只挑接近的曲线展示。","followup":"正确性门槛应在上线前写成可执行验收，而不是出现回归后临时解释。"},{"id":96,"code":"Q096","question":"RL 系统最应该监控哪些指标？","doc_title":"RL 系统最应该监控哪些指标？","chapter":"RL 系统架构","domain":"infra","level":"基础","course_day":70,"topic":"rl-throughput","brief":"算法侧至少包括reward分布、组内方差、KL、entropy、clip fraction、importance ratio、response length和有效样本率；系统侧包括各阶段wall time、tokens/s、队列年龄、staleness、weight-sync耗时、cache命中、GPU活跃率和错误责任域；Agentic侧再加turn数、tool latency、environment failure和成功路径长度。指标应能回答质量、效率与数据正确性三个问题。","deep":"指标应覆盖任务质量、样本来源、更新行为和系统执行四个方面。每个指标都应有明确公式、计数单位和时间范围；否则同名指标在不同组件中可能指完全不同的量。指标应能够对应一个判断。例如 ratio 表示同一动作当前相对旧模型的概率变化，队列年龄表示样本在消费前等了多久，有效组率表示同题样本是否有可比较的奖励差。把这些与最终成功率放在一起，才能区分“算法没有信号”和“系统没有及时提供数据”。高成本的全词表或专家细粒度统计可以抽样采集，但错误版本、无效 mask 和异常终止等事件需要可追踪记录。","followup":"不要把所有指标等频采集；高成本指标按阶段或采样采集，关键健康指标持续采集。"},{"id":97,"code":"Q097","question":"设计一套支持 PPO、GRPO、OPD 和 Agentic RL 的统一框架，先讲什么？","doc_title":"设计一套支持 PPO、GRPO、OPD 和 Agentic RL 的统一框架，先讲什么？","chapter":"故障与系统设计","domain":"debug","level":"基础","course_day":87,"topic":"rl-throughput","brief":"先定义不变量而不是画组件：trajectory必须记录action mask、behavior log-prob、policy version、reward与环境边界；算法层只消费规范化轨迹计算advantage/loss；engine和backend可替换。随后再讲Rollouter、Trainer、Teacher/RM、Environment、Queue与Parameter Synchronizer，以及各自所有权和失败语义。","deep":"先明确共享的数据记录，再定义组件接口。PPO、GRPO、OPD 和多轮 Agent 都需要知道模型真正生成了什么，但奖励来源、比较组和教师信号并不相同。统一框架要容纳这些差异，而不是把所有算法压成同一段损失代码。可以先用一条轨迹演示接口：生成端返回 token、行为概率和版本；环境补充工具结果；评分器补充分数；训练器依据算法计算权重并更新参数；同步器发布新版本。每个接口都只接受明确定义的数据。同题多样本的 GRPO 统计不能强塞进只有单轨迹的函数；OPD 的教师输出也不该伪装成普通终局分数，除非算法有意这样定义。统一框架应共享事实表达，保留算法所需的差异。","followup":"优秀回答会明确哪些能力共享、哪些不能强行统一，例如group baseline与turn-level credit。"},{"id":98,"code":"Q098","question":"训练 reward 突然跃升，应如何在 30 分钟内定位？","doc_title":"训练 reward 突然跃升，应如何在 30 分钟内定位？","chapter":"故障与系统设计","domain":"debug","level":"基础","course_day":87,"topic":"rl-throughput","brief":"先冻结训练并保存最近原始trajectory，核对数据、verifier和policy version变更；抽样比较跃升前后输出，观察长度、格式和特殊模式；复算reward并用独立judge验证；最后检查optimizer、KL与weight sync。优先寻找离散变更点，因为真正能力通常不会在无配置变化时瞬间大幅跳升。","deep":"先保存跳变附近的权重、样本和评分配置，避免现场丢失。随后把模型变化、数据变化与评分规则变化分开验证。奖励突然变好既可能是真实进步，也可能是测量变化，不能仅凭曲线形状判断。一评分器重打分，再固定同一问题比较两个模型版本。前一实验隔离测量变化，后一实验隔离模型变化。若奖励跳变恰好伴随数据筛选规则变化，还需比较问题难度分布。离散能力变化并非不可能，因此“模型不可能突然变强”不能当作排除模型因素的证据。","followup":"不要第一时间调低学习率；先证明跃升来自model而不是measurement。"},{"id":99,"code":"Q099","question":"Rollout 变慢但 GPU utilization 很高，可能是什么原因？","doc_title":"Rollout 变慢但 GPU utilization 很高，可能是什么原因？","chapter":"故障与系统设计","domain":"debug","level":"基础","course_day":87,"topic":"rl-throughput","brief":"高utilization可能来自重复prefill、cache thrashing、过大的chunked prefill、MoE通信或低效小kernel，并不证明有效token吞吐高。应比较prefill/decode token、cache hit、batch occupancy、kernel timeline和request length分布。若环境或调度导致请求工作集频繁切换，GPU会忙于重算而不是推进episode。","deep":"先区分设备忙碌与任务推进。GPU 可能忙于重复计算前缀、搬运专家 token 或执行低效小算子，而真正新增的回答 token 很少。端到端耗时与有效生成量应一起看。cache thrashing 指缓存反复被挤出又重新计算，设备一直忙，却多次做相同前缀工作。比如长请求占满KV 后挤出另一个请求，后者恢复时又要重新 prefill。应统计真正新增的生成 token、重复计算的前缀 token，以及每次请求被暂停和恢复的次数。如果 GPU利用率上升主要来自重复计算，就不能把它解释成有效吞吐提高。","followup":"把utilization与effective generated tokens/s、saved prefix tokens和p99完成时间一起看。"},{"id":100,"code":"Q100","question":"训练侧 log-prob 与 rollout log-prob 不一致，最小二分路径是什么？","doc_title":"训练侧 log-prob 与 rollout log-prob 不一致，最小二分路径是什么？","chapter":"故障与系统设计","domain":"debug","level":"基础","course_day":87,"topic":"rl-throughput","brief":"固定token ids并关闭sampling，从单batch、单卡、BF16、相同checkpoint开始比较首tokenlogits；一致后逐项恢复tokenizer/template、TP/DP、attention backend、quantization、scheduler与logits processor。首个出现偏差的配置就是候选边界，再做逐层hidden比较。","deep":"把两端都变成“评价固定 token 序列”，暂时移除随机生成的影响。从单卡、高精度、相同权重和相同输入开始，逐个恢复并行、量化和调度配置，寻找首次产生差异的边界。固定后缀对比时，下一 token 的标签要错开一位：位置 t 的 logits 用来评价真实位置 t+1 的 token，而不是当前位置。off-by-one 错误会让输入和形状看似相同，概率却完全不对应。定位到某个精度或并行开关后，再验证该开关影响的是所有位置还是少数边界位置。能保存首个分叉位置、上下文和两边 logits，才有足够信息交给算子或模型实现维护者复现。","followup":"不要直接比较自由生成文本；token一旦分叉，后续差异不再能定位根因。"},{"id":101,"code":"Q101","question":"Full-Async 吞吐提升但最终质量下降，怎样判断是否值得？","doc_title":"Full-Async 吞吐提升但最终质量下降，怎样判断是否值得？","chapter":"故障与系统设计","domain":"debug","level":"基础","course_day":87,"topic":"rl-throughput","brief":"先画quality-vs-wall-time和quality-vs-GPU-hours，而不是只看最终step。分解staleness、drop/重采样导致的数据分布变化、importance ratio和参数同步频率，并设置η=0同步oracle。若异步更早达到目标质量，即使最终上限略低也可能有价值；若time-to-quality也变差，吞吐提升没有业务意义。","deep":"设同步达到 60% 成功率要 10 小时，异步要 7 小时；即使异步最终分数略低，对只要求达到 60% 的任务仍可能有价值。若目标是 70%，异步始终达不到，就不能用前一个目标的速度替它辩护。因此比较前必须明确最低质量、最高成本和最长训练时间。使用不允许旧版本样本的同步配置作基线即可，同步方式应以实际调度规则定义。还要检查增加的 GPU 数是否抵消了时间收益。判断质量下降的原因，可以先限制队列长度和可接受的版本差，保留其他配置不变。如果质量恢复，说明样本陈旧可能是关键因素；如果仍未恢复，再比较异步调度是否更频繁地舍弃长任务。两个实验分别检查概率分布变化与任务选择变化，不能只统一调低学习率后就认为问题解决。","followup":"决策必须写明目标质量阈值和最大允许回归，而不是笼统追求“无损”。"},{"id":102,"code":"Q102","question":"Agent 成功率下降但单步 tool accuracy 上升，意味着什么？","doc_title":"Agent 成功率下降但单步 tool accuracy 上升，意味着什么？","chapter":"故障与系统设计","domain"

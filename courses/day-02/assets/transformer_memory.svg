<svg xmlns="http://www.w3.org/2000/svg" width="920" height="900" viewBox="0 0 920 900" role="img" aria-labelledby="title desc">
<title id="title">Transformer 前向、反向与显存</title><desc id="desc">Sketch-style teaching diagram showing forward activations, backward gradients, checkpoint recomputation and memory components.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1 L10 5 L1 9" fill="none" stroke="#252a30" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="1" seed="5"/><feDisplacementMap in="SourceGraphic" in2="SourceGraphic" scale=".5"/></filter></defs>
<rect width="920" height="900" rx="20" fill="#fffdf7"/>
<g font-family="Comic Sans MS, Chalkboard, Trebuchet MS, cursive" fill="#22272d"><text x="45" y="55" font-size="30" font-weight="bold" transform="rotate(-.5 45 55)">Transformer 训练时，显存都存了什么？</text><text x="47" y="86" font-family="Comic Sans MS, Segoe Print, Kaiti SC, cursive" font-size="17" fill="#59636b">前向留下中间状态，反向再用它们算梯度；省显存通常要付出额外计算。</text></g>
<g stroke="#252a30" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<path d="M55 135 Q60 128 72 132 L385 131 Q397 133 396 145 L395 258 Q392 269 380 267 L70 268 Q57 265 58 253 Z" fill="#dff1d9" stroke="#6ea66b"/>
<path d="M520 135 Q526 129 537 132 L849 132 Q862 134 860 146 L859 258 Q856 269 844 267 L535 268 Q522 265 523 253 Z" fill="#e2efff" stroke="#7299d4"/>
<path d="M55 330 Q60 324 72 327 L385 327 Q397 329 396 341 L395 451 Q392 463 380 461 L70 461 Q57 458 58 446 Z" fill="#fff0c8" stroke="#d5a04d"/>
<path d="M520 330 Q526 324 537 327 L849 327 Q862 329 860 341 L859 451 Q856 463 844 461 L535 461 Q522 458 523 446 Z" fill="#ffe1df" stroke="#d77d7e"/>
</g>
<g font-family="Comic Sans MS, Chalkboard, Trebuchet MS, cursive" fill="#252a30">
<text x="82" y="174" font-size="24" font-weight="bold">1. Forward</text><text x="82" y="210" font-size="18">输入 Hidden States</text><text x="82" y="238" font-size="17">产生 Activation</text>
<text x="548" y="174" font-size="24" font-weight="bold">2. Loss</text><text x="548" y="210" font-size="18">把预测和目标比较</text><text x="548" y="238" font-size="17">得到一个标量目标</text>
<text x="82" y="370" font-size="24" font-weight="bold">3. Backward</text><text x="82" y="406" font-size="18">用保存的状态计算梯度</text><text x="82" y="434" font-size="17">dL/dX、dL/dW</text>
<text x="548" y="370" font-size="24" font-weight="bold">4. Checkpointing</text><text x="548" y="406" font-size="18">少保存部分 Activation</text><text x="548" y="434" font-size="17">需要时重新计算 Forward</text>
</g>
<g stroke="#252a30" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"><path d="M402 200 C445 198 470 198 510 200"/><path d="M686 274 C684 297 684 307 684 320"/><path d="M513 395 C470 393 445 393 402 395"/></g>
<path d="M555 490 Q561 483 572 485 L837 486 Q850 489 849 501 L848 559 Q846 570 834 568 L571 568 Q558 566 559 554 Z" fill="#eee5ff" stroke="#9a84d1" stroke-width="2.3"/>
<text x="586" y="520" font-family="Comic Sans MS, Chalkboard, cursive" font-size="22" font-weight="bold" fill="#3f355e">显存换时间</text><text x="586" y="546" font-family="Comic Sans MS, Segoe Print, Kaiti SC, cursive" font-size="16" fill="#3f355e">减少存储，增加重计算</text>
<path d="M682 462 C682 474 682 478 682 481" stroke="#252a30" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<rect x="52" y="620" width="815" height="205" rx="17" fill="#f5f8fb" stroke="#9eb7ce" stroke-width="2" stroke-dasharray="8 6"/>
<text x="78" y="660" font-family="Comic Sans MS, Chalkboard, cursive" font-size="24" font-weight="bold" fill="#263b50">显存账本：四项先分清</text>
<g stroke-width="2" stroke-linejoin="round" stroke-linecap="round" font-family="Comic Sans MS, Chalkboard, cursive" font-size="20" text-anchor="middle" fill="#263746">
<path d="M78 696 Q81 690 89 692 L247 692 Q256 694 255 703 L254 760 Q252 768 243 766 L88 766 Q79 764 80 755 Z" fill="#dff1d9" stroke="#6ea66b"/><text x="167" y="735">Parameters</text>
<path d="M278 696 Q281 690 289 692 L447 692 Q456 694 455 703 L454 760 Q452 768 443 766 L288 766 Q279 764 280 755 Z" fill="#fff0c8" stroke="#d5a04d"/><text x="367" y="735">Gradients</text>
<path d="M478 696 Q481 690 489 692 L647 692 Q656 694 655 703 L654 760 Q652 768 643 766 L488 766 Q479 764 480 755 Z" fill="#ffe1df" stroke="#d77d7e"/><text x="567" y="735">Adam States</text>
<path d="M678 696 Q681 690 689 692 L843 692 Q852 694 851 703 L850 760 Q848 768 839 766 L688 766 Q679 764 680 755 Z" fill="#e2efff" stroke="#7299d4"/><text x="765" y="735">Activations</text>
</g>
<text x="78" y="797" font-family="Comic Sans MS, Segoe Print, Kaiti SC, cursive" font-size="16" fill="#59636b">长序列常放大 Activation 成本；Checkpointing 不会自动减少 Adam 的 Moment。</text>
</svg>